<style>
/* Layout: passport pages — sticky visa strip on top (progress by points + timer), one question card at a time, stamp-like point badges */
:root{
  --bg:#ECEFEC; --paper:#FBFCFA; --ink:#16203A; --muted:#5A6377; --line:#D3D9D6;
  --accent:#1B55A0; --accent-soft:#E1E9F5; --ok:#2B7749; --ok-soft:#E2F0E6; --bad:#B03A2E; --bad-soft:#F7E4E1;
  --pending:#C9D0CD; --part:#B7791F; --part-soft:#FBF0DC; --fig:#F1F4F2;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141E; --paper:#172031; --ink:#E6EBF3; --muted:#9AA4B8; --line:#2A3449;
  --accent:#78A9EA; --accent-soft:#1C2A45; --ok:#6CC08E; --ok-soft:#173022; --bad:#EE8577; --bad-soft:#3A201D;
  --pending:#334057; --part:#E3B05C; --part-soft:#33291A; --fig:#DCE2DF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F141E; --paper:#172031; --ink:#E6EBF3; --muted:#9AA4B8; --line:#2A3449;
  --accent:#78A9EA; --accent-soft:#1C2A45; --ok:#6CC08E; --ok-soft:#173022; --bad:#EE8577; --bad-soft:#3A201D;
  --pending:#334057; --part:#E3B05C; --part-soft:#33291A; --fig:#DCE2DF; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 14px;display:grid;gap:10px}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.stats .score b{color:var(--ok);font-size:17px}
.stats .time b{font-size:15px}
.strip{display:flex;gap:2px;height:10px}.strip:empty{display:none}
.seg{background:var(--pending);border-radius:2px;min-width:2px;transition:background .25s}
.seg.ok{background:var(--ok)} .seg.bad{background:var(--bad)} .seg.part{background:var(--part)}
.seg.cur{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

main .wrap{padding-block:28px 64px}
.unit{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 24px 24px;display:grid;gap:18px}
.qhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.qnum{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ask{margin:4px 0 0;font-size:16px;color:var(--muted)}
.stamp{flex:none;font-family:var(--f-display);font-weight:800;text-align:center;line-height:1;border:2px dashed currentColor;border-radius:8px;padding:7px 10px 6px;transform:rotate(-4deg);color:var(--accent)}
.stamp .n{font-size:24px;display:block}
.stamp .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.stamp.hard{color:var(--bad)}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.6vw,30px);line-height:1.25;margin:0;text-wrap:balance}
.prompt small{font-family:var(--f-body);font-weight:400;font-size:.6em;color:var(--muted)}
.prompt .blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center}
.prompt .small{font-family:var(--f-body);font-weight:400;font-size:18px;line-height:1.6;background:var(--accent-soft);border-radius:10px;padding:14px 16px}
.diff{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--pending)}
.dots i.on{background:var(--accent)}
.figure{background:var(--fig);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;justify-content:center}
.figure svg{display:block;width:100%;max-width:300px;height:auto;max-height:190px}

.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:18px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:focus-visible,.btn:focus-visible,.key:focus-visible,input:focus-visible,.brand:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;font-family:var(--f-mono);font-size:12px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.opt .t{min-width:0}
.opt .t b{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt.dim{opacity:.55}
.opt.multi .k{border-radius:4px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt .tag{margin-left:auto;flex:none;font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.multi-note{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

.textans{display:grid;gap:10px}
.textans input{font:inherit;font-size:20px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
.textans input.right{border-color:var(--ok);background:var(--ok-soft)}
.textans input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font:inherit;font-size:17px;min-width:40px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.key:hover{border-color:var(--accent)}
.keys .lbl{font-size:12px;color:var(--muted);align-self:center;margin-right:4px}

.fb{border-radius:10px;padding:16px 18px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.part{background:var(--part-soft);border:1px solid var(--part)}
.fb h3{margin:0;font-family:var(--f-display);font-size:18px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)} .fb.part h3{color:var(--part)}
.fb p{margin:0;max-width:65ch}
.fb .ans{font-weight:700}

.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--f-display);font-weight:700;font-size:16px;border-radius:10px;padding:12px 22px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{font-size:14px;padding:8px 14px}
.hint{font-size:13px;color:var(--muted)}

/* home */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{flex:1 1 0;min-width:0;font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.2;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 8px 9px;cursor:pointer;display:grid;gap:2px;text-align:left}
@media (max-width:480px){.tab>span:not(.tabn){display:none}.tab{padding:10px 4px 9px;font-size:14px!important}}
.dwrap{margin-bottom:6px}.dwrap summary{cursor:pointer;padding:8px 0;color:var(--muted);font-size:15px}.dwrap summary b{color:var(--ink)}.dwrap[open] summary{margin-bottom:8px}
.tab span{font-family:var(--f-body);font-weight:400;font-size:12px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.intro{display:grid;gap:10px;margin-bottom:22px}
.intro h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0;text-wrap:balance}
.intro p{margin:0;max-width:62ch;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.vcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;align-content:start}
.vcard .vt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vcard h2 .vsub{display:block;font-size:14px;color:var(--part);letter-spacing:.04em}
.vcard h2{font-family:var(--f-display);font-size:22px;margin:0}
.vcard .no{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.1em;border:2px dashed var(--accent);color:var(--accent);border-radius:6px;padding:3px 7px;transform:rotate(-4deg)}
.vcard .meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.vcard .meta b{color:var(--ink)}
.vcard .row{display:flex;gap:8px;flex-wrap:wrap}
.state{font-size:13px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.state.prog{color:var(--accent)} .state.best{color:var(--ok)}

/* palavras */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.deck{display:grid;gap:4px;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.deck .dn{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.2}
.deck .ds{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.deck .db{height:4px;background:var(--pending);border-radius:2px;overflow:hidden}.deck .db i{display:block;height:100%;background:var(--ok)}
.deck.on{border-color:var(--accent);background:var(--accent-soft)}
.deckbar{display:flex;justify-content:space-between;align-items:center;margin:10px 0 18px;gap:10px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.mode{display:grid;gap:2px;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.mode b{font-family:var(--f-display);font-size:16px}.mode span{font-size:12px;color:var(--muted)}
.mode.on{border-color:var(--accent);background:var(--accent);color:var(--paper)}.mode.on span{color:var(--paper);opacity:.85}
@media (max-width:560px){.modes{grid-template-columns:repeat(2,1fr)}}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.okc{color:var(--ok)}.badc{color:var(--bad)}.center{text-align:center}
.stage{position:relative;perspective:1200px;height:300px;display:grid;place-items:center}
.flash{position:relative;width:min(100%,420px);height:270px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);cursor:grab;touch-action:pan-y;user-select:none;z-index:2}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--paper);display:grid;place-content:center;justify-items:center;gap:10px;padding:20px;text-align:center;box-shadow:0 10px 30px -18px rgba(20,30,60,.45)}
.flash .face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.flash.flipped{transform:rotateY(180deg)}
.flash .big{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,7vw,36px);line-height:1.15;text-wrap:balance}
.flash .big.en,.gcard .big.en{font-weight:700;color:var(--accent)}
.tl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tap{position:absolute;bottom:12px;left:0;right:0;font-size:12px;color:var(--muted)}
.ex{font-style:italic;color:var(--ink);margin:0}.note{font-size:14px;color:var(--muted);margin:0}
.swipe-l,.swipe-r{position:absolute;top:14px;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;border:3px solid currentColor;border-radius:8px;padding:4px 10px;opacity:0;z-index:3;pointer-events:none}
.swipe-l{left:6px;color:var(--bad);transform:rotate(-8deg)}.swipe-r{right:6px;color:var(--ok);transform:rotate(8deg)}
.cardbtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.spk{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--accent);cursor:pointer;vertical-align:middle}
.spk:hover{border-color:var(--accent)}
.gcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px;text-align:center;justify-items:center}
.gcard.done h2{font-size:24px}
.typec input{font:inherit;font-size:22px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%;max-width:420px;text-align:center}
.typec .keys{justify-content:center}.typec .actions{width:100%;max-width:420px}
.reveal{font-family:var(--f-mono);font-size:20px;letter-spacing:.18em;color:var(--muted);word-break:break-word}
.gcard.ok{animation:glow .6s}.gcard.no{animation:shake .45s}
.okt{color:var(--ok);margin:0}.badt{color:var(--bad);margin:0}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.slots,.chips2{display:grid;gap:8px}
.slot{border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px;display:grid;gap:4px;min-height:64px;transition:border-color .15s,background .15s}
.slot .sp{font-family:var(--f-display);font-weight:700;font-size:17px}
.slot .drop{font-size:13px;color:var(--muted);border:1.5px dashed var(--line);border-radius:6px;padding:3px 8px}
.slot.over{border-color:var(--accent);background:var(--accent-soft)}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}.slot.ok .drop{border-style:solid;border-color:var(--ok);color:var(--ink)}
.slot.pop{animation:pop .35s}.slot.bad{animation:shake .4s}
.mchip{background:var(--accent);color:var(--paper);border-radius:10px;padding:12px;font-weight:700;cursor:grab;touch-action:none;user-select:none;text-align:center;position:relative;z-index:1}
.mchip.drag{z-index:20;cursor:grabbing;box-shadow:0 12px 24px -10px rgba(0,0,0,.45)}
.mchip.sel{outline:3px solid var(--part);outline-offset:2px}
.mchip.shake{animation:shake .4s;background:var(--bad)}
.cloudmenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cmode{display:grid;gap:6px;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:18px;cursor:pointer}
.cmode b{font-family:var(--f-display);font-size:19px}.cmode:hover{border-color:var(--accent)}
.cloudhud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-variant-numeric:tabular-nums}
.lives{color:var(--bad);font-size:20px;letter-spacing:2px}
.ctarget{font-size:17px}.ctarget b{color:var(--accent);font-family:var(--f-display)}
.cscore{font-family:var(--f-mono);font-size:14px}
.cloud{position:relative;height:min(62vh,440px);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 20% 15%,var(--accent-soft),transparent 55%),radial-gradient(circle at 85% 80%,var(--ok-soft),transparent 50%),var(--paper)}
.cloud.hurt{animation:shake .35s}
.bub{position:absolute;left:0;top:0;font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--accent);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;will-change:transform;box-shadow:0 6px 16px -10px rgba(20,30,60,.5)}
.bub:hover{background:var(--accent-soft)}
.bub.popped{animation:burst .28s forwards;border-color:var(--ok);background:var(--ok-soft)}
.bub.wrongb{border-color:var(--bad);background:var(--bad-soft);animation:wob .4s}
.bub .plus{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);color:var(--ok);font-size:14px}
@keyframes burst{to{opacity:0;scale:1.5}}
@keyframes wob{0%,100%{rotate:0deg}25%{rotate:-8deg}75%{rotate:8deg}}
.cover{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;background:color-mix(in srgb,var(--paper) 88%,transparent);padding:20px}
.cover h2{font-size:26px}.bigscore{font-family:var(--f-display);font-weight:800;font-size:44px;margin:0}
.cover .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* verbos */
.tabs .tab{font-size:15px}
.vgroup{display:grid;gap:6px;margin-bottom:10px}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{display:grid;gap:3px;justify-items:center;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer}
.vchip b{font-family:var(--f-display);font-size:15px}.vchip.on{border-color:var(--accent);background:var(--accent-soft)}
.vdots{display:flex;gap:2px}.vdots i{width:6px;height:6px;border-radius:50%;background:var(--pending)}.vdots i.on{background:var(--ok)}
.deckbar .row{display:flex;gap:6px;flex-wrap:wrap}
.modes.m5{grid-template-columns:repeat(5,1fr)}
@media (max-width:560px){.modes.m5{grid-template-columns:repeat(3,1fr)}}
.modes.m6{grid-template-columns:repeat(3,1fr)}.modes.m8{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.modes.m6,.modes.m8{grid-template-columns:repeat(2,1fr)}}
.brand{display:inline-flex;align-items:center;gap:8px;letter-spacing:.04em}
.blogo img{width:28px;height:28px;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero{display:grid;justify-items:center;text-align:center;gap:10px;padding-block:8px 28px}
.hlogo img{width:min(260px,64vw);height:auto;display:block;filter:drop-shadow(0 14px 24px rgba(20,30,60,.22));animation:float 5s ease-in-out infinite}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,9vw,60px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.hero h1 span{color:var(--bad)}
.hero p{margin:0;font-size:clamp(17px,4vw,20px);color:var(--muted);max-width:40ch}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.lgrid{grid-template-columns:1fr}}
.lcard{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i n" "i d" "i s" "i g";column-gap:14px;row-gap:4px;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;animation:lift .45s both}
.lcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 14px 28px -18px rgba(20,30,60,.5)}
.lcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lic{grid-area:i;width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}.lic svg{width:26px;height:26px}
.ln{grid-area:n;font-family:var(--f-display);font-weight:800;font-size:21px}
.ld{grid-area:d;color:var(--muted);font-size:15px;line-height:1.45}
.ls{grid-area:s;font-family:var(--f-mono);font-size:12px;color:var(--ok);margin-top:4px}
.lgo{grid-area:g;font-family:var(--f-display);font-weight:700;color:var(--accent);margin-top:4px}
.lfoot{margin-top:22px}
@keyframes lift{from{transform:translateY(10px)}to{transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.numbig{font-family:var(--f-mono);font-size:clamp(40px,12vw,64px);font-weight:700;color:var(--accent)}
.numw{font-family:var(--f-display);font-size:clamp(22px,6vw,30px);font-weight:700;color:var(--accent)}
.en{color:var(--accent)}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.built{min-height:56px;width:100%;max-width:520px;border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.built .bw{background:var(--accent);color:var(--paper);border-radius:8px;padding:4px 10px;font-weight:700;animation:pop .25s}
.tile.tw{font-size:17px}.tile.used{opacity:.3;pointer-events:none}
.vh{font-family:var(--f-body);font-size:.6em;color:var(--muted);font-weight:400}
.textc{text-align:left;justify-items:stretch}
.ptext{font-size:19px;line-height:2.1;margin:0}
.gap{display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap}
.gap small{color:var(--muted);font-size:13px}
.gin{font:inherit;font-size:18px;line-height:1.2;height:1.7em;padding:0 6px;border:0;border-bottom:2.5px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:6px 6px 0 0;min-width:4ch;max-width:14ch}
.gin.right{border-color:var(--ok);background:var(--ok-soft)}.gin.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:700}
.gap.gok{animation:pop .35s}.gap.gno{animation:shake .4s}
.bwrap{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.bfield{position:relative;height:min(52vh,400px);overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 57px,var(--line) 57px 58px),var(--bg)}
.brow{position:absolute;left:0;right:0;top:0;height:58px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:5px 8px;will-change:transform;transition:opacity .35s, filter .2s}
.bcell{font:inherit;font-weight:700;font-size:clamp(14px,3.8vw,18px);border-radius:10px;border:2px solid var(--accent);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--accent);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.bcell.empty{border:2px dashed var(--line);background:transparent;box-shadow:none}
.brow.wait .bcell:not(.empty){border-color:var(--line);box-shadow:0 3px 0 var(--line);color:var(--muted);cursor:default}
.bcell.bok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.bcell.bbad{background:var(--bad);border-color:var(--bad);color:var(--paper);animation:shake .35s}
.brow.bgone{opacity:0;filter:blur(2px)}
.bflash{position:absolute;inset:0;background:var(--bad);opacity:0;pointer-events:none;z-index:5}
.bflash.on{animation:flash .45s}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
.bwrap.shake2{animation:shake .45s}
.bsent{border-top:3px solid var(--bad);padding:12px 16px 16px;text-align:center;display:grid;gap:6px}
.bsent .sent{font-size:clamp(19px,5vw,24px)}
.bsent .blank.filled{color:var(--ok);border-color:var(--ok);animation:pop .35s}
.vnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.vtitle{display:grid;justify-items:center;gap:2px;margin-bottom:6px}.vtitle b{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--accent)}.vtitle span{color:var(--muted);font-size:14px}
.vtable{display:grid;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px}
.vrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;animation:rowin .35s both}
.vrow:nth-child(odd){background:var(--bg)}
.vp{color:var(--muted);font-size:15px}
.vf{font-family:var(--f-display);font-size:22px;font-weight:500}.vf b{color:var(--accent);font-weight:800}.vf b.irr{color:var(--part)}
.vin{font:inherit;font-size:19px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%;min-width:0}
.vres{min-width:24px;font-weight:700;color:var(--bad)}
.vrow.ok{background:var(--ok-soft);animation:pop .35s}.vrow.ok .vres{color:var(--ok)}
.vrow.no{background:var(--bad-soft);animation:shake .4s}
.vnote{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:12px 0 0;font-size:15px}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sentc{gap:14px}
.sent{font-family:var(--f-display);font-size:clamp(22px,5.5vw,28px);font-weight:700;margin:0;line-height:1.35;text-wrap:balance}
.sent .blank{display:inline-block;min-width:3em;border-bottom:3px solid var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;width:100%}
.tile{font:inherit;font-size:19px;font-weight:700;padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.tile:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.tile.right{border-color:var(--ok);background:var(--ok-soft);animation:pop .35s}.tile.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.sin{font:inherit;font-size:22px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%;max-width:360px;text-align:center}
.sentc .keys{justify-content:center}.sentc .actions,.sentc #sfb{width:100%}

/* blocos v2: brick wall */
.bgame{display:grid;gap:12px}
.bgtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bgt{font-family:"Permanent Marker","Marker Felt",var(--f-display);font-weight:400;font-size:clamp(28px,7vw,40px);margin:0;color:var(--bad);transform:rotate(-2deg)}
.bstats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:560px){.bstats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bstat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 6px;display:grid;justify-items:center;gap:2px}
.bstat b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}.bstat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.blvl{grid-column:1/-1;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.blvl i{height:6px;background:var(--pending);border-radius:3px;overflow:hidden;display:block}.blvl em{display:block;height:100%;background:var(--part);transition:width .3s}
.bintro{text-align:left;justify-items:start}.brules{margin:0;padding-left:20px;display:grid;gap:4px}
.bwrap{border-radius:14px;overflow:hidden;border:2px solid #2A211D;background:#1A1F2B}
.bfield{position:relative;height:min(56vh,430px);overflow:hidden;background:
  radial-gradient(ellipse at 50% 120%,rgba(255,170,90,.18),transparent 60%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 54px),#1A1F2B}
.brow{display:flex;gap:4px;padding:3px 4px;height:54px;grid-template-columns:none}
.brow .brick{flex:2 1 0}.brow .brick.half{flex:1 1 0}
.brick{position:relative;min-width:0;border:0;border-radius:3px;padding:0 4px;cursor:default;font:inherit;
  background:
   radial-gradient(circle at 20% 30%,rgba(255,255,255,.10) 0 2px,transparent 3px),
   radial-gradient(circle at 70% 65%,rgba(0,0,0,.18) 0 2px,transparent 3px),
   radial-gradient(circle at 45% 80%,rgba(0,0,0,.12) 0 1.5px,transparent 2.5px),
   linear-gradient(180deg,#C8693F,#A44C2A);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.28),0 0 0 2px #3B2E29;
  transition:filter .2s,transform .2s}
.brick.w{cursor:pointer;display:grid;place-items:center}
.brick.w span{font-family:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;font-size:clamp(15px,4.2vw,21px);color:#FFF6D8;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  transform:rotate(var(--r,0deg));text-shadow:2px 2px 0 #1B4E9A,-1px -1px 0 #E2457A,0 0 8px rgba(0,0,0,.35)}
.brow.wait .brick{filter:brightness(.62) saturate(.7)}
.brow.wait .brick.w{cursor:default}
.brow.active .brick.w{animation:glowb 1.6s ease-in-out infinite}
.brow.active .brick.w:hover{transform:translateY(-2px)}
@keyframes glowb{0%,100%{box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.28),0 0 0 2px #3B2E29}50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.28),0 0 0 2px #F2C230}}
.brick.bok{background:linear-gradient(180deg,#43A86A,#2B7749)!important;animation:none!important}
.brick.bbad{background:linear-gradient(180deg,#E0574A,#A8261C)!important;animation:shake .35s!important}
.brow.crumble .brick{animation:crumble .5s ease-in forwards!important}
@keyframes crumble{to{transform:translate(var(--dx,0),70px) rotate(var(--rot,15deg));opacity:0}}
.bbanner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-4deg);font-family:"Permanent Marker","Marker Felt",cursive;font-size:clamp(22px,6vw,34px);color:#F2C230;text-shadow:3px 3px 0 #A8261C;white-space:nowrap;opacity:0;pointer-events:none;z-index:6}
.bbanner.on{animation:bann 1.6s ease-out}
@keyframes bann{0%{opacity:0;transform:translate(-50%,-30%) rotate(-4deg) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) rotate(-4deg) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) rotate(-4deg)}}
.bsent{background:#232A3A;color:#F3F1EA;border-top:4px solid #A8261C}
.bsent .tl{color:#B9C1D3}.bsent .sent{color:#F3F1EA}.bsent .blank{border-color:#F2C230}.bsent .blank.filled{color:#7FD39B;border-color:#7FD39B}
.bfield .cover{background:rgba(20,24,34,.88);color:#F3F1EA}.bfield .cover .hint{color:#C9CFDC}
.tverbs{display:grid;gap:6px;background:var(--part-soft);border:1px dashed var(--part);border-radius:10px;padding:10px 12px}
.tvl{display:flex;flex-wrap:wrap;gap:6px}.tvc{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700}.tvc b{color:var(--part)}

/* unit 5 badges */
:root{--u5:#5B3FD9;--u5b:#7C5CFF;--u5-soft:#EEE9FF;--newc:#F2C230}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--u5:#A08BFF;--u5b:#6F55F0;--u5-soft:#2A2350}}
:root[data-theme="dark"]{--u5:#A08BFF;--u5b:#6F55F0;--u5-soft:#2A2350}
.u5b{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:800;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--u5b),#3D7BFF);border-radius:999px;padding:3px 8px;line-height:1.2;box-shadow:0 4px 10px -4px rgba(91,63,217,.6);white-space:nowrap}
.u5b::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9}
.u5b.inl{vertical-align:middle;margin-left:6px}
.newb{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#3A2A00;background:var(--newc);border-radius:6px;padding:2px 6px;vertical-align:middle;animation:newp 2.4s ease-in-out infinite}
@keyframes newp{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.newb{animation:none}}
.deck,.vchip,.lcard,.vcard{position:relative}
.deck.isu5,.vchip.isu5{border-color:var(--u5)}
.deck.isu5 .u5b{position:absolute;top:-9px;right:8px}
.vchip.isu5{padding-top:12px}.vchip.isu5 .u5b{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9px;padding:2px 6px}
.vchip.isu5.on{background:var(--u5-soft)}
.vgroup .vchips{padding-top:8px}
.lcard.isu5 .u5b.lb{position:absolute;top:12px;right:12px}
.vcard.isu5{border:1.5px solid var(--u5);background:linear-gradient(180deg,var(--u5-soft),var(--paper) 55%)}
.vcard .u5b.vb{position:absolute;top:-10px;left:16px}
.chip.u5chip{display:inline-flex;gap:6px;align-items:center;border-color:var(--u5)}
.btn.u5btn{background:linear-gradient(135deg,var(--u5b),#3D7BFF);border-color:transparent;color:#fff}

.tab .tabn{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap;font-family:inherit;font-weight:inherit;font-size:inherit}
.tabu5{font-style:normal;font-family:var(--f-display);font-weight:800;font-size:9.5px;letter-spacing:.06em;color:#fff;background:linear-gradient(135deg,var(--u5b),#3D7BFF);border-radius:999px;padding:2px 6px;line-height:1.3;box-shadow:0 3px 8px -3px rgba(91,63,217,.6)}
@media (max-width:480px){.tab .tabn{flex-direction:column;align-items:flex-start;gap:3px}.tabu5{font-size:8.5px;padding:1px 5px}}
.intro.slim{margin-bottom:14px;gap:8px}
.upd{display:flex;gap:10px;align-items:flex-start;background:var(--u5-soft);border:1px solid var(--u5);border-radius:12px;padding:10px 14px;color:var(--ink)!important;font-size:15px;max-width:none!important}
.upd .u5b{margin-top:2px;flex:none}
.vgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.vcard{padding:13px 14px;gap:7px;border-radius:12px}
.vcard h2{font-size:18px}.vcard h2 .vsub{font-size:12px}
.vcard .no{font-size:11px;padding:2px 6px}
.vcard .meta{font-size:13px}
.vcard .state{font-size:12px}
.vcard .row .btn{padding:7px 14px;font-size:14px}
.u5b.nb{background:linear-gradient(135deg,#F2C230,#F59E0B);color:#3A2A00;box-shadow:0 4px 10px -4px rgba(245,158,11,.6)}
.u5b.nb::before{background:#3A2A00;opacity:.6}
.tabu5.nb{background:linear-gradient(135deg,#F2C230,#F59E0B);color:#3A2A00}
.lcard.isu5 .ln{padding-right:100px}
.vchips{row-gap:14px}
/* results */
.result{display:grid;gap:22px}
.visa{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.visa .big{font-family:var(--f-display);font-weight:800;font-size:clamp(48px,12vw,76px);line-height:1;font-variant-numeric:tabular-nums}
.visa .big small{font-size:.4em;color:var(--muted)}
.visa .stampbig{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.1em;text-transform:uppercase;border:3px double currentColor;border-radius:10px;padding:10px 16px;transform:rotate(-6deg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-family:var(--f-mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--pending);border-radius:3px;overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;background:var(--ok)}
.mist{display:grid;gap:10px}
.mist div{border-left:3px solid var(--bad);padding:4px 0 4px 12px}
.mist div.p{border-left-color:var(--part)}
.mist .q{font-weight:700}
.mist .a{color:var(--muted);font-size:15px}
h2{font-family:var(--f-display);font-size:20px;margin:0}
.scroll{overflow-x:auto}
@media (max-width:520px){.card{padding:20px 16px}.stats{gap:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
/* Layout: passport pages — sticky visa strip on top (progress by points + timer), one question card at a time, stamp-like point badges */
:root{
  --bg:#ECEFEC; --paper:#FBFCFA; --ink:#16203A; --muted:#5A6377; --line:#D3D9D6;
  --accent:#1B55A0; --accent-soft:#E1E9F5; --ok:#2B7749; --ok-soft:#E2F0E6; --bad:#B03A2E; --bad-soft:#F7E4E1;
  --pending:#C9D0CD; --part:#B7791F; --part-soft:#FBF0DC; --fig:#F1F4F2;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141E; --paper:#172031; --ink:#E6EBF3; --muted:#9AA4B8; --line:#2A3449;
  --accent:#78A9EA; --accent-soft:#1C2A45; --ok:#6CC08E; --ok-soft:#173022; --bad:#EE8577; --bad-soft:#3A201D;
  --pending:#334057; --part:#E3B05C; --part-soft:#33291A; --fig:#DCE2DF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F141E; --paper:#172031; --ink:#E6EBF3; --muted:#9AA4B8; --line:#2A3449;
  --accent:#78A9EA; --accent-soft:#1C2A45; --ok:#6CC08E; --ok-soft:#173022; --bad:#EE8577; --bad-soft:#3A201D;
  --pending:#334057; --part:#E3B05C; --part-soft:#33291A; --fig:#DCE2DF; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 14px;display:grid;gap:10px}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.stats .score b{color:var(--ok);font-size:17px}
.stats .time b{font-size:15px}
.strip{display:flex;gap:2px;height:10px}.strip:empty{display:none}
.seg{background:var(--pending);border-radius:2px;min-width:2px;transition:background .25s}
.seg.ok{background:var(--ok)} .seg.bad{background:var(--bad)} .seg.part{background:var(--part)}
.seg.cur{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

main .wrap{padding-block:28px 64px}

.fb{border-radius:10px;padding:16px 18px;display:grid;gap:6px}

<script>
const BOOKS={"livro":[[{"type":"multi","nRight":3,"ask":"Select ALL the expressions you can use to say goodbye.","prompt":"Despedidas","options":["Adeus!","Até logo!","Até amanhã!","Muito prazer!","Tudo bem?","Olá!"],"explain":"<b>Adeus!</b>, <b>Até logo!</b> and <b>Até amanhã!</b> are farewells. <i>Muito prazer!</i> is said when you meet someone; <i>Olá!</i> and <i>Tudo bem?</i> are greetings.","topic":"U1","pts":3},{"type":"mc","ask":"Look at the clock. How do you greet someone at this time?","prompt":"___","options":["Boa tarde!","Bom dia!","Boa noite!","Até logo!"],"explain":"17:00 is late afternoon, before dark, so the greeting is <b>Boa tarde!</b>. <i>Bom dia</i> = morning, <i>Boa tarde</i> = afternoon, <i>Boa noite</i> = evening and night (also used to say goodbye at night).","img":"<svg viewBox=\"0 0 225 120\" role=\"img\" aria-label=\"Digital clock showing 17:00\"><rect x=\"10\" y=\"22\" width=\"150\" height=\"76\" rx=\"10\" fill=\"#1E2430\"/><rect x=\"18\" y=\"30\" width=\"134\" height=\"60\" rx=\"5\" fill=\"#0D1118\"/><text x=\"85\" y=\"76\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"38\" font-weight=\"700\" fill=\"#F5B83D\">17:00</text><g transform=\"translate(190 64)\"><circle r=\"16\" fill=\"#F5B83D\"/><g stroke=\"#F5B83D\" stroke-width=\"4\" stroke-linecap=\"round\"><line y1=\"-24\" y2=\"-31\"/><line y1=\"24\" y2=\"31\"/><line x1=\"-24\" x2=\"-31\"/><line x1=\"24\" x2=\"31\"/><line x1=\"17\" y1=\"-17\" x2=\"22\" y2=\"-22\"/><line x1=\"-17\" y1=\"-17\" x2=\"-22\" y2=\"-22\"/><line x1=\"17\" y1=\"17\" x2=\"22\" y2=\"22\"/><line x1=\"-17\" y1=\"17\" x2=\"-22\" y2=\"22\"/></g></g></svg>","topic":"U1","pts":2},{"type":"mc","ask":"Complete the formal question.","prompt":"Como ___ chama o senhor?","options":["se","te","me","-se"],"explain":"<i>O senhor</i> takes the 3rd person, so the pronoun is <b>se</b>, and after <i>como</i> it goes before the verb: <b>Como se chama o senhor?</b>","topic":"U1","pts":4},{"type":"mc","ask":"Complete with the verb chamar-se.","prompt":"Eu ___ Pedro.","options":["chamo-me","me chamo","chama-se","chamas-te"],"explain":"With <i>eu</i> the form is <b>chamo-me</b>. In an ordinary affirmative sentence European Portuguese puts the pronoun after the verb. <i>Me chamo</i> at the start of a sentence is Brazilian usage.","topic":"U1","pts":2},{"type":"mc","ask":"Which country does this flag belong to?","prompt":"___","options":["Irlanda","Itália","França","México"],"explain":"Green, white and <b>orange</b>: this is <b>a Irlanda</b>. Italy's flag looks similar but the third stripe is red.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"10\" height=\"20\" fill=\"#169B62\"/><rect x=\"10\" width=\"10\" height=\"20\" fill=\"#F7F7F2\"/><rect x=\"20\" width=\"10\" height=\"20\" fill=\"#FF883E\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U2","pts":3},{"type":"mc","ask":"Which country does this flag belong to?","prompt":"___","options":["Japão","China","Polónia","Suécia"],"explain":"A red circle on white: <b>o Japão</b> → japonês/japonesa.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"20\" fill=\"#F7F7F2\"/><circle cx=\"15\" cy=\"10\" r=\"6\" fill=\"#BC002D\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U2","pts":1},{"type":"text","ask":"Type em / no / na / nos / nas.","prompt":"Nova Iorque é ___ Estados Unidos.","accept":["nos"],"explain":"<i>Em</i> shows location. The country is <i>os Estados Unidos</i>, so the preposition merges with the article: em + os = <b>nos</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","pts":4},{"type":"mc","ask":"Complete with de, do, da, dos or das.","prompt":"A Luena é ___ Angola.","options":["de","do","da","dos"],"explain":"<i>De</i> shows origin. <b>Angola</b> takes no article, so the preposition stays as it is: <b>de Angola</b>.","topic":"U2","pts":3},{"type":"text","ask":"Do the sum and write the result in words.","prompt":"125 + 250 = ___","accept":["trezentos e setenta e cinco"],"explain":"125 + 250 = 375 → <b>trezentos e setenta e cinco</b>. Each part is joined with <b>e</b>: hundreds <i>e</i> tens <i>e</i> units.","topic":"NUM","pts":9},{"type":"mc","ask":"How is this number written?","prompt":"777 = ___","options":["setecentos e setenta e sete","setecentos e sessenta e sete","seiscentos e setenta e sete","setecentos setenta e sete"],"explain":"777 = <b>setecentos e setenta e sete</b>. Watch <i>setenta</i> (70) vs <i>sessenta</i> (60), and don't forget both <i>e</i>'s.","topic":"NUM","pts":6},{"type":"mc","ask":"Which number is this?","prompt":"quatrocentos e dezanove = ___","options":["419","490","409","914"],"explain":"<i>quatrocentos e dezanove</i> = <b>419</b>. Read it part by part, separated by <i>e</i>.","topic":"NUM","pts":4},{"type":"text","ask":"Correct the error: “Eles são alemãs.”","prompt":"Eles são ___.","accept":["alemães"],"explain":"<i>Eles</i> is masculine plural, so: <b>alemães</b>. <i>Alemãs</i> is feminine plural (<i>Elas são alemãs</i>). Singular: alemão / alemã.","topic":"NAT","pts":7},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"O Ivan e a Oksana são da Ucrânia. Eles são ___.","options":["ucranianos","ucraniano","ucraniana","ucranianas"],"explain":"Ucrânia → ucraniano / ucraniana / ucranianos / ucranianas (m. / f. / m. pl. / f. pl.). Here it's a group of men or a mixed group → masculine plural: <b>ucranianos</b>.","topic":"NAT","pts":4},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"A Wei é da China. Ela é ___.","options":["chinesa","chinês","chineses","chinesas"],"explain":"China → chinês / chinesa / chineses / chinesas (m. / f. / m. pl. / f. pl.). Here it's one woman → feminine singular: <b>chinesa</b>.","topic":"NAT","pts":3},{"type":"mc","ask":"Look at the picture and complete with the colour.","prompt":"Os livros são ___.","options":["azuis","azul","azules","pretos"],"explain":"The colour is blue. <i>azul</i> has the same form for masculine and feminine; only the number changes (azul → azuis). So: <b>Os livros são azuis.</b>","img":"<svg viewBox=\"0 0 200 130\" role=\"img\" aria-label=\"blue livros\"><g transform=\"translate(22 22) rotate(-6)\"><rect x=\"0\" y=\"0\" width=\"70\" height=\"92\" rx=\"4\" fill=\"#2C5FB0\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"8\" y=\"0\" width=\"5\" height=\"92\" fill=\"#2A2A2A\" opacity=\".25\"/><rect x=\"22\" y=\"22\" width=\"36\" height=\"12\" rx=\"2\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"1.5\"/></g><g transform=\"translate(105 16) rotate(5)\"><rect x=\"0\" y=\"0\" width=\"70\" height=\"92\" rx=\"4\" fill=\"#2C5FB0\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"8\" y=\"0\" width=\"5\" height=\"92\" fill=\"#2A2A2A\" opacity=\".25\"/><rect x=\"22\" y=\"22\" width=\"36\" height=\"12\" rx=\"2\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"1.5\"/></g></svg>","topic":"U4","pts":6},{"type":"mc","ask":"Look at the picture and complete with the colour.","prompt":"A porta é ___.","options":["preta","preto","pretos","pretas"],"explain":"The colour is black. Colours ending in <i>-o</i> agree in gender and number: preto, preta, pretos, pretas. So: <b>A porta é preta.</b>","img":"<svg viewBox=\"0 0 120 160\" role=\"img\" aria-label=\"black porta\"><rect x=\"14\" y=\"6\" width=\"92\" height=\"150\" fill=\"#C9CFCC\"/><rect x=\"22\" y=\"14\" width=\"76\" height=\"142\" fill=\"#1B1B1B\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"31\" y=\"25\" width=\"58\" height=\"48\" fill=\"none\" stroke=\"#2A2A2A\" stroke-opacity=\".4\" stroke-width=\"3\"/><rect x=\"31\" y=\"86\" width=\"58\" height=\"56\" fill=\"none\" stroke=\"#2A2A2A\" stroke-opacity=\".4\" stroke-width=\"3\"/><circle cx=\"86\" cy=\"82\" r=\"4.5\" fill=\"#C9A55A\" stroke=\"#2A2A2A\"/></svg>","topic":"U4","pts":3},{"type":"mc","ask":"What is this?","prompt":"O que é isto? ___","options":["É uma porta.","É um porta.","É um livro.","É um relógio."],"explain":"It's a door: <b>uma porta</b>. It is feminine, so it takes <i>uma</i>.","img":"<svg viewBox=\"0 0 120 160\" role=\"img\" aria-label=\"door\"><rect x=\"14\" y=\"6\" width=\"92\" height=\"150\" fill=\"#C9CFCC\"/><rect x=\"22\" y=\"14\" width=\"76\" height=\"142\" fill=\"#2E8B57\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"31\" y=\"25\" width=\"58\" height=\"48\" fill=\"none\" stroke=\"#2A2A2A\" stroke-opacity=\".4\" stroke-width=\"3\"/><rect x=\"31\" y=\"86\" width=\"58\" height=\"56\" fill=\"none\" stroke=\"#2A2A2A\" stroke-opacity=\".4\" stroke-width=\"3\"/><circle cx=\"86\" cy=\"82\" r=\"4.5\" fill=\"#C9A55A\" stroke=\"#2A2A2A\"/></svg>","topic":"U4","pts":2},{"type":"mc","ask":"What is this?","prompt":"O que é isto? ___","options":["É um relógio.","É uma relógio.","É uma cadeira.","É uma porta."],"explain":"It's a clock: <b>um relógio</b>. It is masculine, so it takes <i>um</i>.","img":"<svg viewBox=\"0 0 130 130\" role=\"img\" aria-label=\"clock\"><circle cx=\"65\" cy=\"65\" r=\"56\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"6\"/><line x1=\"65\" y1=\"21\" x2=\"65\" y2=\"15\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"87\" y1=\"26.894882233484694\" x2=\"90\" y2=\"21.69872981077806\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"103.10511776651529\" y1=\"43\" x2=\"108.30127018922192\" y2=\"39.99999999999999\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"109\" y1=\"65\" x2=\"115\" y2=\"65\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"103.1051177665153\" y1=\"86.99999999999999\" x2=\"108.30127018922194\" y2=\"89.99999999999999\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"87\" y1=\"103.1051177665153\" x2=\"90\" y2=\"108.30127018922194\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"65\" y1=\"109\" x2=\"65\" y2=\"115\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"43.000000000000014\" y1=\"103.1051177665153\" x2=\"40.000000000000014\" y2=\"108.30127018922194\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"26.894882233484708\" y1=\"87.00000000000003\" x2=\"21.698729810778076\" y2=\"90.00000000000003\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"21\" y1=\"65.00000000000001\" x2=\"15\" y2=\"65.00000000000001\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"26.8948822334847\" y1=\"43\" x2=\"21.69872981077807\" y2=\"39.99999999999999\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"42.99999999999998\" y1=\"26.894882233484708\" x2=\"39.99999999999998\" y2=\"21.698729810778083\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"65\" y1=\"65\" x2=\"65\" y2=\"30\" stroke=\"#2A2A2A\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"65\" y1=\"65\" x2=\"92\" y2=\"72\" stroke=\"#2A2A2A\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"65\" cy=\"65\" r=\"4\" fill=\"#2A2A2A\"/></svg>","topic":"U4","pts":1},{"type":"mc","ask":"In which word is the underlined s pronounced [s] (not [ʃ] “sh”)?","prompt":"The letter <span class='blank' style='min-width:1.4em'>s</span>","options":["<b>s</b>ábado","sei<b>s</b>","de<b>s</b>culpe","trê<b>s</b>"],"explain":"In European Portuguese, <i>s</i> at the end of a word or before a voiceless consonant sounds like [ʃ]: <i>seis, três, desculpe</i>. At the start of a word it's [s]: <b>sábado</b>.","topic":"PRON","pts":4},{"type":"mc","ask":"How do you turn “Ela é portuguesa.” into a yes/no question when speaking?","prompt":"Ela é portuguesa?","options":["Same words, rising intonation at the end","Put the verb first: É ela portuguesa?","Add “do” at the start","Add “não” at the end"],"explain":"Portuguese yes/no questions usually keep the same word order; only the <b>intonation</b> changes: it rises at the end.","topic":"PRON","pts":3},{"type":"text","ask":"Type the correct form of ser or estar.","prompt":"A porta ___ fechada.","accept":["está"],"explain":"Use <b>estar</b>: it's the current condition of something (open/closed, hot/cold). With <i>ele/ela/você</i> → <b>está</b>. (<i>é</i> would describe a permanent characteristic.)","topic":"SE","pts":6},{"type":"text","ask":"Type the correct form of ser or estar.","prompt":"O Pedro ___ alto.","accept":["é"],"explain":"Use <b>ser</b>: it's a lasting characteristic (colour, size, personality). With <i>ele/ela/você</i> → <b>é</b>. (<i>está</i> would describe a temporary state or location.)","topic":"SE","pts":3},{"type":"mc","ask":"Ser or estar?","prompt":"Tu ___ muito simpático.","options":["és","estás","sou","estamos"],"explain":"Use <b>ser</b>: it's a lasting characteristic (colour, size, personality). With <i>tu</i> → <b>és</b>. (<i>estás</i> would describe a temporary state or location.)","topic":"SE","pts":4},{"type":"mc","ask":"Ser or estar?","prompt":"Nós ___ cansados hoje.","options":["estamos","somos","estás","são"],"explain":"Use <b>estar</b>: it's a temporary state or feeling that can change soon. With <i>nós</i> → <b>estamos</b>. (<i>somos</i> would describe a permanent characteristic.)","topic":"SE","pts":3},{"type":"mc","ask":"Ser or estar?","prompt":"Tu ___ em casa?","options":["estás","és","estamos","sou"],"explain":"Use <b>estar</b>: it's where a person is <b>right now</b> (temporary location). With <i>tu</i> → <b>estás</b>. (<i>és</i> would describe a permanent characteristic.)","topic":"SE","pts":3},{"type":"multi","nRight":3,"ask":"Select ALL the sentences where ficar means “to stay”.","prompt":"Ficar = to stay?","options":["Fico em casa hoje.","Ficamos no hotel três noites.","O Rui fica em Lisboa até sexta-feira.","Onde fica Lisboa?","O Porto fica no norte.","A escola fica em Belém."],"explain":"When the subject is a <b>person</b>, <i>ficar</i> + place usually means <b>to stay</b>. When the subject is a <b>place</b> (Lisboa, o Porto, a escola), it means <i>to be located</i>.","topic":"FIC","pts":7},{"type":"text","ask":"Type the correct form of ficar (to stay).","prompt":"Vocês ___ para o jantar?","accept":["ficam"],"explain":"Here <i>ficar</i> means <b>to stay</b>. It's a regular -ar verb: fico, ficas, fica, ficamos, ficam. With <i>eles/elas/vocês</i> → <b>ficam</b>.","topic":"FIC","pts":6},{"type":"mc","ask":"Complete with ficar (to stay).","prompt":"Nós ___ no Hotel Central.","options":["ficamos","ficam","fico","ficemos"],"explain":"Here <i>ficar</i> means <b>to stay</b>. It's a regular -ar verb: fico, ficas, fica, ficamos, ficam. With <i>nós</i> → <b>ficamos</b>.","topic":"FIC","pts":3},{"type":"multi","nRight":3,"ask":"Select ALL the correct phrases.","prompt":"Artigo + nome","options":["os lápis","uma mão","uns mapas","as mapas","um cidade","umas dias"],"explain":"Correct: <b>os lápis</b> (masculine, same form in plural), <b>uma mão</b> (feminine), <b>uns mapas</b> (masculine). The rest mix up the gender.","topic":"ART","pts":6},{"type":"text","ask":"Type the indefinite (um/uma/uns/umas) article.","prompt":"___ países","accept":["uns"],"explain":"<i>país</i> is masculine, and here it's plural. Indefinite articles: um / uma / uns / umas. → <b>uns países</b>.","topic":"ART","pts":4},{"type":"mc","ask":"Make it plural.","prompt":"o cão → ___","options":["os cães","os cãos","os cões","as cães"],"explain":"<i>Cão</i> → <b>cães</b> (one of the three -ão plural patterns: mãos, cães, aviões). Masculine: <b>os cães</b>.","topic":"ART","pts":6},{"type":"mc","ask":"Complete with the definite article (o, a, os, as).","prompt":"___ mapas","options":["os","o","a","as"],"explain":"<i>mapa</i> is masculine even though it ends in -a, and here it's plural. Definite articles: o / a / os / as. → <b>os mapas</b>.","topic":"ART","pts":4},{"type":"text","ask":"Type the present tense of aprender.","prompt":"Nós ___ português. <small>(aprender)</small>","accept":["aprendemos"],"explain":"<b>aprender</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. nós → <b>aprendemos</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":9},{"type":"text","ask":"Type the present tense of comprar.","prompt":"Tu ___ o jornal. <small>(comprar)</small>","accept":["compras"],"explain":"<b>comprar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. tu → <b>compras</b>.","topic":"VERB","pts":6},{"type":"text","ask":"Type the present tense of comer.","prompt":"Eu ___ peixe ao jantar. <small>(comer)</small>","accept":["como"],"explain":"<b>comer</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. eu → <b>como</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":3},{"type":"mc","ask":"Complete with the present tense of abrir.","prompt":"Nós ___ a janela. <small>(abrir)</small>","options":["abrimos","abramos","abremos","abro"],"explain":"<b>abrir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. nós → <b>abrimos</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":6},{"type":"mc","ask":"Complete with the present tense of comprar.","prompt":"Vocês ___ o jornal. <small>(comprar)</small>","options":["compram","comprem","compro","compras"],"explain":"<b>comprar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. eles/elas/vocês → <b>compram</b>.","topic":"VERB","pts":3},{"type":"text","ask":"Type dele, dela, deles or delas.","prompt":"A casa ___ é grande. <small>(elas)</small>","accept":["delas"],"explain":"For <i>ele, ela, eles, elas</i> we use <b>de + pronoun</b> after the noun: dele, dela, deles, delas. → <b>A casa delas</b>. It agrees with the owner, not with the thing.","topic":"X5","pts":6},{"type":"text","ask":"Complete with the article and the possessive.","prompt":"___ mala é castanha. <small>(você)</small>","accept":["a sua"],"explain":"<i>você</i> → seu / sua / seus / suas. <i>mala</i> is feminine singular, so: <b>A sua mala</b>. In European Portuguese the article comes before the possessive.","topic":"X5","pts":4},{"type":"text","ask":"Type the demonstrative (este / esse / aquele in the right form).","prompt":"___ cadeira é tua. <small>(near me (isto))</small>","accept":["Esta"],"explain":"near me (isto) → este / esta / estes / estas. <i>cadeira</i> is feminine singular → <b>Esta</b>.","topic":"X5","pts":4},{"type":"text","ask":"Type the correct form of ter.","prompt":"Eles ___ a carta de condução?","accept":["têm"],"explain":"<i>Ter</i>: tenho, tens, tem, temos, <b>têm</b>. Eles → <b>têm</b>.","topic":"X5","pts":3},{"type":"text","ask":"Answer with a possessive (José).","prompt":"De quem é o carro? — É ___ José.","accept":["do"],"explain":"de + o José = <b>do</b>: É do José.","topic":"X5","pts":3},{"type":"mc","ask":"Choose the possessive.","prompt":"O ___ computador é um Mac. <small>(vocês)</small>","options":["vosso","vossa","vossos","vossas"],"explain":"<i>vocês</i> → vosso / vossa / vossos / vossas. <i>computador</i> is masculine singular, so: <b>O vosso computador</b>. In European Portuguese the article comes before the possessive.","topic":"X5","pts":3},{"type":"mc","ask":"What is this object?","prompt":"Onde estão os meus ___ de sol?","options":["óculos","chaves","malas","moedas"],"explain":"<b>Os óculos de sol</b> = sunglasses (always plural).","topic":"X5","pts":2},{"type":"text","ask":"Complete with the ordinal (feminine).","prompt":"a ___ vez <small>(10.ª)</small>","accept":["décima"],"explain":"Ordinals agree in gender: décimo → <b>décima</b> (10.ª).","topic":"X6","pts":4},{"type":"text","ask":"Write the feminine form.","prompt":"o informático → a ___","accept":["informática"],"explain":"-o → -a: informático → <b>informática</b>.","topic":"X6","pts":3},{"type":"text","ask":"Write the profession in Portuguese.","prompt":"O Pedro é ___. <small>(pupil)</small>","accept":["aluno"],"explain":"Profession after <i>ser</i> has <b>no article</b>: <i>O Pedro é aluno</i>. -o → -a: aluno → <b>aluna</b>.","topic":"X6","pts":3},{"type":"text","ask":"Complete with the ordinal.","prompt":"Moro no ___ andar. <small>(1.º)</small>","accept":["primeiro"],"explain":"<i>O andar</i> is masculine: 1.º = <b>primeiro</b>. Ordinals go before the noun.","topic":"X6","pts":3},{"type":"text","ask":"Type quanto, quanta, quantos or quantas.","prompt":"___ filhos tem a Rita? — Três.","accept":["Quantos"],"explain":"<i>Quanto</i> agrees with the noun: <i>filhos</i> is masculine plural → <b>Quantos</b>.","topic":"X6","pts":3},{"type":"mc","ask":"Which questions ask for the same information?","prompt":"Onde é que mora?","options":["Qual é a sua morada?","Qual é o seu estado civil?","Como se chama?","Que idade tem?"],"explain":"<b>Onde (é que) mora?</b> ≈ <b>Qual é a sua morada?</b>","topic":"X6","pts":3}],[{"type":"mc","ask":"Look at the clock. How do you greet someone at this time?","prompt":"___","options":["Bom dia!","Boa tarde!","Boa noite!","Até logo!"],"explain":"08:00 is morning (until about midday), so the greeting is <b>Bom dia!</b>. <i>Bom dia</i> = morning, <i>Boa tarde</i> = afternoon, <i>Boa noite</i> = evening and night (also used to say goodbye at night).","img":"<svg viewBox=\"0 0 225 120\" role=\"img\" aria-label=\"Digital clock showing 08:00\"><rect x=\"10\" y=\"22\" width=\"150\" height=\"76\" rx=\"10\" fill=\"#1E2430\"/><rect x=\"18\" y=\"30\" width=\"134\" height=\"60\" rx=\"5\" fill=\"#0D1118\"/><text x=\"85\" y=\"76\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"38\" font-weight=\"700\" fill=\"#F5B83D\">08:00</text><g transform=\"translate(190 64)\"><circle r=\"16\" fill=\"#F5B83D\"/><g stroke=\"#F5B83D\" stroke-width=\"4\" stroke-linecap=\"round\"><line y1=\"-24\" y2=\"-31\"/><line y1=\"24\" y2=\"31\"/><line x1=\"-24\" x2=\"-31\"/><line x1=\"24\" x2=\"31\"/><line x1=\"17\" y1=\"-17\" x2=\"22\" y2=\"-22\"/><line x1=\"-17\" y1=\"-17\" x2=\"-22\" y2=\"-22\"/><line x1=\"17\" y1=\"17\" x2=\"22\" y2=\"22\"/><line x1=\"-17\" y1=\"17\" x2=\"-22\" y2=\"22\"/></g></g></svg>","topic":"U1","pts":2},{"type":"mc","ask":"Look at the clock. How do you greet someone at this time?","prompt":"___","options":["Boa noite!","Bom dia!","Boa tarde!","Até logo!"],"explain":"21:30 is evening/night, so the greeting is <b>Boa noite!</b>. <i>Bom dia</i> = morning, <i>Boa tarde</i> = afternoon, <i>Boa noite</i> = evening and night (also used to say goodbye at night).","img":"<svg viewBox=\"0 0 225 120\" role=\"img\" aria-label=\"Digital clock showing 21:30\"><rect x=\"10\" y=\"22\" width=\"150\" height=\"76\" rx=\"10\" fill=\"#1E2430\"/><rect x=\"18\" y=\"30\" width=\"134\" height=\"60\" rx=\"5\" fill=\"#0D1118\"/><text x=\"85\" y=\"76\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"38\" font-weight=\"700\" fill=\"#F5B83D\">21:30</text><g transform=\"translate(190 64)\"><path d=\"M6-22A22 22 0 1 0 6 22 17 17 0 1 1 6-22Z\" fill=\"#E8E2C4\"/><circle cx=\"-20\" cy=\"-26\" r=\"2\" fill=\"#E8E2C4\"/><circle cx=\"18\" cy=\"26\" r=\"1.6\" fill=\"#E8E2C4\"/></g></svg>","topic":"U1","pts":2},{"type":"mc","ask":"Complete the negative sentence.","prompt":"A Ana não ___ Maria.","options":["se chama","chama-se","chama-te","se chamo"],"explain":"<b>Não</b> pulls the pronoun in front of the verb, just like question words do: <b>A Ana não se chama Maria.</b> In the affirmative it would be <i>A Ana chama-se Ana</i>.","topic":"U1","pts":7},{"type":"mc","ask":"You welcome Maria at the airport.","prompt":"Bem-___ a Lisboa, Maria!","options":["vinda","vindo","vindos","vindas"],"explain":"<i>Bem-vindo</i> agrees with the person being welcomed. Maria is one woman: <b>Bem-vinda!</b> (a man: <i>bem-vindo</i>; a group: <i>bem-vindos</i>).","topic":"U1","pts":3},{"type":"mc","ask":"Which country does this flag belong to?","prompt":"___","options":["Suécia","Finlândia","Ucrânia","Grécia"],"explain":"Blue with a yellow cross: <b>a Suécia</b> (Sweden). Finland has the same cross shape but white with a blue cross.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"20\" fill=\"#006AA7\"/><rect x=\"8.5\" width=\"4\" height=\"20\" fill=\"#FECC00\"/><rect y=\"8\" width=\"30\" height=\"4\" fill=\"#FECC00\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U2","pts":1},{"type":"text","ask":"Type de / do / da / dos / das.","prompt":"A Samantha é ___ Filipinas.","accept":["das"],"explain":"<i>De</i> shows origin. The country is <i>as Filipinas</i>, so the preposition merges with the article: de + as = <b>das</b>.","topic":"U2","pts":6},{"type":"mc","ask":"Complete with em, no, na, nos or nas.","prompt":"Manila é ___ Filipinas.","options":["nas","em","no","na"],"explain":"<i>Em</i> shows location. The country is <i>as Filipinas</i>, so the preposition merges with the article: em + as = <b>nas</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","pts":6},{"type":"mc","ask":"Complete with em, no, na, nos or nas.","prompt":"Coimbra é ___ Portugal.","options":["em","no","na","nos"],"explain":"<i>Em</i> shows location. <b>Portugal</b> takes no article, so the preposition stays as it is: <b>em Portugal</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","pts":3},{"type":"text","ask":"Do the sum and write the result in words.","prompt":"31 + 67 = ___","accept":["noventa e oito"],"explain":"31 + 67 = 98 → <b>noventa e oito</b>. Each part is joined with <b>e</b>: hundreds <i>e</i> tens <i>e</i> units.","topic":"NUM","pts":6},{"type":"mc","ask":"Which number is this?","prompt":"seiscentos e dezasseis = ___","options":["616","660","606","166"],"explain":"<i>seiscentos e dezasseis</i> = <b>616</b>. Read it part by part, separated by <i>e</i>.","topic":"NUM","pts":4},{"type":"mc","ask":"How is this number written?","prompt":"100 = ___","options":["cem","cento","um cem","cento e zero"],"explain":"Exactly 100 is <b>cem</b>. <i>Cento</i> is used only when more follows: <i>cento e um</i>.","topic":"NUM","pts":3},{"type":"text","ask":"Type the nationality in the correct form.","prompt":"O Lars e a Ingrid são da Suécia. Eles são ___.","accept":["suecos"],"explain":"Suécia → sueco / sueca / suecos / suecas (m. / f. / m. pl. / f. pl.). Here it's a group of men or a mixed group → masculine plural: <b>suecos</b>.","topic":"NAT","pts":6},{"type":"text","ask":"Type the nationality in the correct form.","prompt":"A Sofia é da Grécia. Ela é ___.","accept":["grega"],"explain":"Grécia → grego / grega / gregos / gregas (m. / f. / m. pl. / f. pl.). Here it's one woman → feminine singular: <b>grega</b>.","topic":"NAT","pts":3},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"A Ana e a Rita são do Brasil. Elas são ___.","options":["brasileiras","brasileiro","brasileira","brasileiros"],"explain":"Brasil → brasileiro / brasileira / brasileiros / brasileiras (m. / f. / m. pl. / f. pl.). Here it's only women → feminine plural: <b>brasileiras</b>.","topic":"NAT","pts":3},{"type":"multi","nRight":3,"ask":"Select ALL the colours you see on this flag.","prompt":"A bandeira da Itália é…","options":["verde","branco","vermelho","azul","amarelo","preto"],"explain":"The Italian flag is <b>verde, branco e vermelho</b>. In a sentence the colours agree with <i>a bandeira</i>: <i>verde, branca e vermelha</i>.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"Flag of Italy\"><rect width=\"10\" height=\"20\" fill=\"#009246\"/><rect x=\"10\" width=\"10\" height=\"20\" fill=\"#F7F7F2\"/><rect x=\"20\" width=\"10\" height=\"20\" fill=\"#CE2B37\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U4","pts":3},{"type":"mc","ask":"Answer the question about this flag.","prompt":"De que cor é a bandeira da Alemanha? ___","options":["É preta, vermelha e amarela.","É preto, vermelho e amarelo.","É pretas, vermelhas e amarelas.","É preta, vermelha e branca."],"explain":"Black, red and gold/yellow. <i>A bandeira</i> is feminine, so every colour takes the feminine form: <b>preta, vermelha e amarela</b>.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"Flag of Germany\"><rect width=\"30\" height=\"7\" fill=\"#111\"/><rect y=\"6.67\" width=\"30\" height=\"6.67\" fill=\"#DD0000\"/><rect y=\"13.33\" width=\"30\" height=\"6.67\" fill=\"#FFCE00\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U4","pts":6},{"type":"mc","ask":"Answer the question about this flag.","prompt":"De que cor é a bandeira da Ucrânia? ___","options":["É azul e amarela.","É azul e amarelo.","É azuis e amarelas.","É verde e amarela."],"explain":"<i>A bandeira</i> is feminine singular, so <i>amarelo</i> → <b>amarela</b>; <i>azul</i> has one form for both genders. <b>É azul e amarela.</b>","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"Flag of Ukraine\"><rect width=\"30\" height=\"10\" fill=\"#0057B7\"/><rect y=\"10\" width=\"30\" height=\"10\" fill=\"#FFD700\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U4","pts":3},{"type":"mc","ask":"What is this?","prompt":"O que é isto? ___","options":["É uma janela.","É um janela.","É um relógio.","É uma mesa."],"explain":"It's a window: <b>uma janela</b>. It is feminine, so it takes <i>uma</i>.","img":"<svg viewBox=\"0 0 140 140\" role=\"img\" aria-label=\"window\"><rect x=\"14\" y=\"14\" width=\"112\" height=\"112\" fill=\"#BFE0F5\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><circle cx=\"96\" cy=\"44\" r=\"12\" fill=\"#F5D36B\"/><path d=\"M14 104c30-22 60-22 112 0v22H14Z\" fill=\"#8CC08A\"/><rect x=\"14\" y=\"14\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#F2EFE6\" stroke-width=\"10\"/><rect x=\"65\" y=\"14\" width=\"10\" height=\"112\" fill=\"#F2EFE6\"/><rect x=\"14\" y=\"65\" width=\"112\" height=\"10\" fill=\"#F2EFE6\"/><rect x=\"9\" y=\"9\" width=\"122\" height=\"122\" fill=\"none\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/></svg>","topic":"U4","pts":2},{"type":"mc","ask":"Where is the stress?","prompt":"amanhã","options":["a-ma-<b>NHÃ</b>","<b>A</b>-ma-nhã","a-<b>MA</b>-nhã","all syllables equal"],"explain":"The tilde marks a nasal vowel and, at the end of a word, attracts the stress: a-ma-<b>NHÃ</b> (like <i>alemã, irmã</i>).","topic":"PRON","pts":3},{"type":"mc","ask":"Where is the stress?","prompt":"Marrocos","options":["ma-<b>RRO</b>-cos","<b>MA</b>-rro-cos","ma-rro-<b>COS</b>","all syllables equal"],"explain":"Words ending in a vowel + <i>-s</i> are normally stressed on the second-to-last syllable: ma-<b>RRO</b>-cos (like <i>Atenas</i>).","topic":"PRON","pts":3},{"type":"multi","nRight":3,"ask":"Select ALL the sentences where SER is the right verb.","prompt":"___","options":["___ do Japão. → Sou","Hoje ___ sexta-feira. → É","O Porto ___ no norte de Portugal. → É","___ em casa agora. → Estou","Como ___? → Estás","A porta ___ aberta. → Está"],"explain":"<b>Ser</b>: origin (<i>Sou do Japão</i>), days (<i>Hoje é sexta-feira</i>), geographic location (<i>O Porto é no norte</i>). <b>Estar</b>: where you are now, how you are, the current condition of an object.","topic":"SE","pts":6},{"type":"text","ask":"Type the correct form of ser or estar.","prompt":"O livro ___ azul.","accept":["é"],"explain":"Use <b>ser</b>: it's a lasting characteristic (colour, size, personality). With <i>ele/ela/você</i> → <b>é</b>. (<i>está</i> would describe a temporary state or location.)","topic":"SE","pts":3},{"type":"mc","ask":"Ser or estar?","prompt":"A janela ___ aberta.","options":["está","é","estás","são"],"explain":"Use <b>estar</b>: it's the current condition of something (open/closed, hot/cold). With <i>ele/ela/você</i> → <b>está</b>. (<i>é</i> would describe a permanent characteristic.)","topic":"SE","pts":4},{"type":"mc","ask":"What is the difference?","prompt":"Sou de Londres. / Estou em Londres.","options":["I'm from London. / I'm in London (now).","I'm in London. / I'm from London.","Both mean “I live in London.”","Both mean “I'm from London.”"],"explain":"<b>Ser de</b> = origin (permanent). <b>Estar em</b> = where you are at the moment (temporary).","topic":"SE","pts":4},{"type":"mc","ask":"Ser or estar?","prompt":"Hoje ___ segunda-feira.","options":["é","está","sou","estamos"],"explain":"Use <b>ser</b>: days and dates use ser. With <i>ele/ela/você</i> → <b>é</b>. (<i>está</i> would describe a temporary state or location.)","topic":"SE","pts":3},{"type":"text","ask":"Type the correct form of ficar (to stay).","prompt":"Nós ___ aqui mais um dia.","accept":["ficamos"],"explain":"Here <i>ficar</i> means <b>to stay</b>. It's a regular -ar verb: fico, ficas, fica, ficamos, ficam. With <i>nós</i> → <b>ficamos</b>.","topic":"FIC","pts":7},{"type":"mc","ask":"You want to say: “I'm staying in Lisbon until Friday.”","prompt":"___","options":["Fico em Lisboa até sexta-feira.","Sou em Lisboa até sexta-feira.","Fica em Lisboa até sexta-feira.","Estou de Lisboa até sexta-feira."],"explain":"To stay = <b>ficar</b>, and with <i>eu</i> → <b>fico</b>. <i>Fica</i> is the 3rd person; <i>ser</i> can't express staying somewhere.","topic":"FIC","pts":4},{"type":"mc","ask":"Complete with ficar (to stay).","prompt":"Elas ___ em Coimbra uma semana.","options":["ficam","ficas","fica","ficão"],"explain":"Here <i>ficar</i> means <b>to stay</b>. It's a regular -ar verb: fico, ficas, fica, ficamos, ficam. With <i>eles/elas/vocês</i> → <b>ficam</b>.","topic":"FIC","pts":3},{"type":"multi","nRight":3,"ask":"Select ALL the nouns that take the article “o”.","prompt":"o ___","options":["mapa","dia","problema","mão","parede","viagem"],"explain":"<b>O mapa, o dia, o problema</b> end in -a but are masculine. <i>A mão</i> ends in -ão but is feminine; <i>a parede</i> and <i>a viagem</i> are feminine too.","topic":"ART","pts":7},{"type":"text","ask":"Type the indefinite (um/uma/uns/umas) article.","prompt":"___ relógio","accept":["um"],"explain":"<i>relógio</i> is masculine. Indefinite articles: um / uma / uns / umas. → <b>um relógio</b>.","topic":"ART","pts":2},{"type":"mc","ask":"Complete the dialogue.","prompt":"Aquilo é ___ caneta? — Sim, é ___ caneta da Rita.","options":["uma / a","a / uma","uma / uma","a / a"],"explain":"Asking what something is → <b>uma</b> caneta. Then a specific pen (Rita's) → <b>a</b> caneta da Rita.","topic":"ART","pts":6},{"type":"mc","ask":"Complete with the definite article (o, a, os, as).","prompt":"___ mão","options":["a","o","os","as"],"explain":"<i>mão</i> is feminine even though it ends in -ão. Definite articles: o / a / os / as. → <b>a mão</b>.","topic":"ART","pts":4},{"type":"multi","nRight":3,"ask":"Select ALL the -ER verbs.","prompt":"-er","options":["comer","beber","viver","abrir","falar","partir"],"explain":"-er verbs: <b>comer, beber, viver</b>. <i>Abrir</i> and <i>partir</i> are -ir; <i>falar</i> is -ar.","topic":"VERB","pts":2},{"type":"text","ask":"Type the present tense of morar.","prompt":"Nós ___ em Lisboa. <small>(morar)</small>","accept":["moramos"],"explain":"<b>morar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. nós → <b>moramos</b>.","topic":"VERB","pts":7},{"type":"text","ask":"Type the present tense of viver.","prompt":"A Ana e o Rui ___ no Porto. <small>(viver)</small>","accept":["vivem"],"explain":"<b>viver</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. eles/elas/vocês → <b>vivem</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":6},{"type":"text","ask":"Type the present tense of decidir.","prompt":"Eu ___ hoje. <small>(decidir)</small>","accept":["decido"],"explain":"<b>decidir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. eu → <b>decido</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":3},{"type":"mc","ask":"Complete with the present tense of estudar.","prompt":"Nós ___ português todos os dias. <small>(estudar)</small>","options":["estudamos","estudemos","estudimos","estudo"],"explain":"<b>estudar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. nós → <b>estudamos</b>.","topic":"VERB","pts":4},{"type":"text","ask":"Type dele, dela, deles or delas.","prompt":"As chaves ___ estão aqui. <small>(eles)</small>","accept":["deles"],"explain":"For <i>ele, ela, eles, elas</i> we use <b>de + pronoun</b> after the noun: dele, dela, deles, delas. → <b>As chaves deles</b>. It agrees with the owner, not with the thing.","topic":"X5","pts":6},{"type":"text","ask":"Complete with the article and the possessive.","prompt":"___ apelido é Costa. <small>(tu)</small>","accept":["o teu"],"explain":"<i>tu</i> → teu / tua / teus / tuas. <i>apelido</i> is masculine singular, so: <b>O teu apelido</b>. In European Portuguese the article comes before the possessive.","topic":"X5","pts":4},{"type":"text","ask":"Type the demonstrative (este / esse / aquele in the right form).","prompt":"___ chaves são do meu pai. <small>(near you (isso))</small>","accept":["Essas"],"explain":"near you (isso) → esse / essa / esses / essas. <i>chaves</i> is feminine plural → <b>Essas</b>.","topic":"X5","pts":4},{"type":"text","ask":"Type no, na or em.","prompt":"Não estou ___ casa, estou na rua.","accept":["em"],"explain":"<b>em casa</b> has no article; <i>na rua</i> (em + a).","topic":"X5","pts":4},{"type":"text","ask":"Type the correct form of ter.","prompt":"Tu ___ a carta de condução?","accept":["tens"],"explain":"<i>Ter</i>: tenho, tens, tem, temos, <b>têm</b>. Tu → <b>tens</b>.","topic":"X5","pts":3},{"type":"mc","ask":"Choose the possessive.","prompt":"O ___ carro é preto. <small>(a senhora)</small>","options":["seu","sua","seus","suas"],"explain":"<i>a senhora</i> → seu / sua / seus / suas. <i>carro</i> is masculine singular, so: <b>O seu carro</b>. In European Portuguese the article comes before the possessive.","topic":"X5","pts":3},{"type":"mc","ask":"The pen is next to the person you are talking to.","prompt":"A tua caneta está ___.","options":["aí","aqui","ali","lá"],"explain":"Near the listener → <b>aí</b>. Near me → aqui; far from both → ali.","topic":"X5","pts":3},{"type":"text","ask":"Write a question with these words.","prompt":"teu / primeiro / se / como / nome / escreve / o","accept":["Como se escreve o teu primeiro nome"],"explain":"<b>Como se escreve o teu primeiro nome?</b>","topic":"X6","pts":7},{"type":"text","ask":"Write the profession in Portuguese.","prompt":"A Joana é ___. <small>(teacher)</small>","accept":["professora"],"explain":"Profession after <i>ser</i> has <b>no article</b>: <i>A Joana é professora</i>. -or → -ora: professor → <b>professora</b>.","topic":"X6","pts":3},{"type":"text","ask":"Write the feminine form.","prompt":"o advogado → a ___","accept":["advogada"],"explain":"-o → -a: advogado → <b>advogada</b>.","topic":"X6","pts":3},{"type":"text","ask":"Write the ordinal number (masculine).","prompt":"dez → ___ <small>(10.º)</small>","accept":["décimo"],"explain":"10.º = <b>décimo</b> (feminine décima, 10.ª).","topic":"X6","pts":3},{"type":"text","ask":"Type quanto, quanta, quantos or quantas.","prompt":"___ dinheiro tens? — Vinte euros.","accept":["Quanto"],"explain":"<i>Quanto</i> agrees with the noun: <i>dinheiro</i> is masculine singular → <b>Quanto</b>.","topic":"X6","pts":3},{"type":"mc","ask":"In which word is the highlighted letter pronounced differently?","prompt":"<b>s</b>olteiro · profi<b>ss</b>ão · ca<b>s</b>ado · <b>s</b>étimo","options":["ca<b>s</b>ado","<b>s</b>olteiro","profi<b>ss</b>ão","<b>s</b>étimo"],"explain":"<i>casado</i>: s between vowels = [z]. The others are [s].","topic":"X6","pts":4}],[{"type":"mc","ask":"Look at the clock. How do you greet someone at this time?","prompt":"___","options":["Bom dia!","Boa tarde!","Boa noite!","Até logo!"],"exp
