<style>
/* Layout: passport pages — sticky visa strip on top (progress by points + timer), one question card at a time, stamp-like point badges */
:root{
  --bg:#ECEFEC; --paper:#FBFCFA; --ink:#16203A; --muted:#5A6377; --line:#D3D9D6;
  --accent:#1B55A0; --accent-soft:#E1E9F5; --ok:#2B7749; --ok-soft:#E2F0E6; --bad:#B03A2E; --bad-soft:#F7E4E1;
  --pending:#C9D0CD; --part:#B7791F; --part-soft:#FBF0DC; --fig:#F1F4F2;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141E; --paper:#172031; --ink:#E6EBF3; --muted:#9AA4B8; --line:#2A3449;
  --accent:#78A9EA; --accent-soft:#1C2A45; --ok:#6CC08E; --ok-soft:#173022; --bad:#EE8577; --bad-soft:#3A201D;
  --pending:#334057; --part:#E3B05C; --part-soft:#33291A; --fig:#DCE2DF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F141E; --paper:#172031; --ink:#E6EBF3; --muted:#9AA4B8; --line:#2A3449;
  --accent:#78A9EA; --accent-soft:#1C2A45; --ok:#6CC08E; --ok-soft:#173022; --bad:#EE8577; --bad-soft:#3A201D;
  --pending:#334057; --part:#E3B05C; --part-soft:#33291A; --fig:#DCE2DF; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 14px;display:grid;gap:10px}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.stats .score b{color:var(--ok);font-size:17px}
.stats .time b{font-size:15px}
.strip{display:flex;gap:2px;height:10px}.strip:empty{display:none}
.seg{background:var(--pending);border-radius:2px;min-width:2px;transition:background .25s}
.seg.ok{background:var(--ok)} .seg.bad{background:var(--bad)} .seg.part{background:var(--part)}
.seg.cur{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

main .wrap{padding-block:28px 64px}
.unit{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 24px 24px;display:grid;gap:18px}
.qhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.qnum{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ask{margin:4px 0 0;font-size:16px;color:var(--muted)}
.stamp{flex:none;font-family:var(--f-display);font-weight:800;text-align:center;line-height:1;border:2px dashed currentColor;border-radius:8px;padding:7px 10px 6px;transform:rotate(-4deg);color:var(--accent)}
.stamp .n{font-size:24px;display:block}
.stamp .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.stamp.hard{color:var(--bad)}
.prompt{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,4.6vw,30px);line-height:1.25;margin:0;text-wrap:balance}
.prompt small{font-family:var(--f-body);font-weight:400;font-size:.6em;color:var(--muted)}
.prompt .blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center}
.prompt .small{font-family:var(--f-body);font-weight:400;font-size:18px;line-height:1.6;background:var(--accent-soft);border-radius:10px;padding:14px 16px}
.diff{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--pending)}
.dots i.on{background:var(--accent)}
.figure{background:var(--fig);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;justify-content:center}
.figure svg{display:block;width:100%;max-width:300px;height:auto;max-height:190px}

.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:18px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:focus-visible,.btn:focus-visible,.key:focus-visible,input:focus-visible,.brand:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .k{flex:none;font-family:var(--f-mono);font-size:12px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.opt .t{min-width:0}
.opt .t b{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt.dim{opacity:.55}
.opt.multi .k{border-radius:4px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt .tag{margin-left:auto;flex:none;font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.multi-note{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

.textans{display:grid;gap:10px}
.textans input{font:inherit;font-size:20px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
.textans input.right{border-color:var(--ok);background:var(--ok-soft)}
.textans input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{font:inherit;font-size:17px;min-width:40px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.key:hover{border-color:var(--accent)}
.keys .lbl{font-size:12px;color:var(--muted);align-self:center;margin-right:4px}

.fb{border-radius:10px;padding:16px 18px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.part{background:var(--part-soft);border:1px solid var(--part)}
.fb h3{margin:0;font-family:var(--f-display);font-size:18px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)} .fb.part h3{color:var(--part)}
.fb p{margin:0;max-width:65ch}
.fb .ans{font-weight:700}

.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--f-display);font-weight:700;font-size:16px;border-radius:10px;padding:12px 22px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{font-size:14px;padding:8px 14px}
.hint{font-size:13px;color:var(--muted)}

/* home */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{flex:1 1 0;min-width:0;font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.2;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 8px 9px;cursor:pointer;display:grid;gap:2px;text-align:left}
@media (max-width:480px){.tab span{display:none}.tab{padding:10px 4px 9px;font-size:14px!important}}
.dwrap{margin-bottom:6px}.dwrap summary{cursor:pointer;padding:8px 0;color:var(--muted);font-size:15px}.dwrap summary b{color:var(--ink)}.dwrap[open] summary{margin-bottom:8px}
.tab span{font-family:var(--f-body);font-weight:400;font-size:12px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.intro{display:grid;gap:10px;margin-bottom:22px}
.intro h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0;text-wrap:balance}
.intro p{margin:0;max-width:62ch;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.vcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;align-content:start}
.vcard .vt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vcard h2 .vsub{display:block;font-size:14px;color:var(--part);letter-spacing:.04em}
.vcard h2{font-family:var(--f-display);font-size:22px;margin:0}
.vcard .no{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.1em;border:2px dashed var(--accent);color:var(--accent);border-radius:6px;padding:3px 7px;transform:rotate(-4deg)}
.vcard .meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.vcard .meta b{color:var(--ink)}
.vcard .row{display:flex;gap:8px;flex-wrap:wrap}
.state{font-size:13px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.state.prog{color:var(--accent)} .state.best{color:var(--ok)}

/* palavras */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.deck{display:grid;gap:4px;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.deck .dn{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.2}
.deck .ds{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.deck .db{height:4px;background:var(--pending);border-radius:2px;overflow:hidden}.deck .db i{display:block;height:100%;background:var(--ok)}
.deck.on{border-color:var(--accent);background:var(--accent-soft)}
.deckbar{display:flex;justify-content:space-between;align-items:center;margin:10px 0 18px;gap:10px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.mode{display:grid;gap:2px;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.mode b{font-family:var(--f-display);font-size:16px}.mode span{font-size:12px;color:var(--muted)}
.mode.on{border-color:var(--accent);background:var(--accent);color:var(--paper)}.mode.on span{color:var(--paper);opacity:.85}
@media (max-width:560px){.modes{grid-template-columns:repeat(2,1fr)}}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.okc{color:var(--ok)}.badc{color:var(--bad)}.center{text-align:center}
.stage{position:relative;perspective:1200px;height:300px;display:grid;place-items:center}
.flash{position:relative;width:min(100%,420px);height:270px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);cursor:grab;touch-action:pan-y;user-select:none;z-index:2}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--paper);display:grid;place-content:center;justify-items:center;gap:10px;padding:20px;text-align:center;box-shadow:0 10px 30px -18px rgba(20,30,60,.45)}
.flash .face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.flash.flipped{transform:rotateY(180deg)}
.flash .big{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,7vw,36px);line-height:1.15;text-wrap:balance}
.flash .big.en,.gcard .big.en{font-weight:700;color:var(--accent)}
.tl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tap{position:absolute;bottom:12px;left:0;right:0;font-size:12px;color:var(--muted)}
.ex{font-style:italic;color:var(--ink);margin:0}.note{font-size:14px;color:var(--muted);margin:0}
.swipe-l,.swipe-r{position:absolute;top:14px;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.08em;border:3px solid currentColor;border-radius:8px;padding:4px 10px;opacity:0;z-index:3;pointer-events:none}
.swipe-l{left:6px;color:var(--bad);transform:rotate(-8deg)}.swipe-r{right:6px;color:var(--ok);transform:rotate(8deg)}
.cardbtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.spk{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--accent);cursor:pointer;vertical-align:middle}
.spk:hover{border-color:var(--accent)}
.gcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px;text-align:center;justify-items:center}
.gcard.done h2{font-size:24px}
.typec input{font:inherit;font-size:22px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%;max-width:420px;text-align:center}
.typec .keys{justify-content:center}.typec .actions{width:100%;max-width:420px}
.reveal{font-family:var(--f-mono);font-size:20px;letter-spacing:.18em;color:var(--muted);word-break:break-word}
.gcard.ok{animation:glow .6s}.gcard.no{animation:shake .45s}
.okt{color:var(--ok);margin:0}.badt{color:var(--bad);margin:0}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.slots,.chips2{display:grid;gap:8px}
.slot{border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px;display:grid;gap:4px;min-height:64px;transition:border-color .15s,background .15s}
.slot .sp{font-family:var(--f-display);font-weight:700;font-size:17px}
.slot .drop{font-size:13px;color:var(--muted);border:1.5px dashed var(--line);border-radius:6px;padding:3px 8px}
.slot.over{border-color:var(--accent);background:var(--accent-soft)}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}.slot.ok .drop{border-style:solid;border-color:var(--ok);color:var(--ink)}
.slot.pop{animation:pop .35s}.slot.bad{animation:shake .4s}
.mchip{background:var(--accent);color:var(--paper);border-radius:10px;padding:12px;font-weight:700;cursor:grab;touch-action:none;user-select:none;text-align:center;position:relative;z-index:1}
.mchip.drag{z-index:20;cursor:grabbing;box-shadow:0 12px 24px -10px rgba(0,0,0,.45)}
.mchip.sel{outline:3px solid var(--part);outline-offset:2px}
.mchip.shake{animation:shake .4s;background:var(--bad)}
.cloudmenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cmode{display:grid;gap:6px;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:18px;cursor:pointer}
.cmode b{font-family:var(--f-display);font-size:19px}.cmode:hover{border-color:var(--accent)}
.cloudhud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-variant-numeric:tabular-nums}
.lives{color:var(--bad);font-size:20px;letter-spacing:2px}
.ctarget{font-size:17px}.ctarget b{color:var(--accent);font-family:var(--f-display)}
.cscore{font-family:var(--f-mono);font-size:14px}
.cloud{position:relative;height:min(62vh,440px);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 20% 15%,var(--accent-soft),transparent 55%),radial-gradient(circle at 85% 80%,var(--ok-soft),transparent 50%),var(--paper)}
.cloud.hurt{animation:shake .35s}
.bub{position:absolute;left:0;top:0;font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--accent);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;will-change:transform;box-shadow:0 6px 16px -10px rgba(20,30,60,.5)}
.bub:hover{background:var(--accent-soft)}
.bub.popped{animation:burst .28s forwards;border-color:var(--ok);background:var(--ok-soft)}
.bub.wrongb{border-color:var(--bad);background:var(--bad-soft);animation:wob .4s}
.bub .plus{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);color:var(--ok);font-size:14px}
@keyframes burst{to{opacity:0;scale:1.5}}
@keyframes wob{0%,100%{rotate:0deg}25%{rotate:-8deg}75%{rotate:8deg}}
.cover{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;background:color-mix(in srgb,var(--paper) 88%,transparent);padding:20px}
.cover h2{font-size:26px}.bigscore{font-family:var(--f-display);font-weight:800;font-size:44px;margin:0}
.cover .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* verbos */
.tabs .tab{font-size:15px}
.vgroup{display:grid;gap:6px;margin-bottom:10px}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{display:grid;gap:3px;justify-items:center;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer}
.vchip b{font-family:var(--f-display);font-size:15px}.vchip.on{border-color:var(--accent);background:var(--accent-soft)}
.vdots{display:flex;gap:2px}.vdots i{width:6px;height:6px;border-radius:50%;background:var(--pending)}.vdots i.on{background:var(--ok)}
.deckbar .row{display:flex;gap:6px;flex-wrap:wrap}
.modes.m5{grid-template-columns:repeat(5,1fr)}
@media (max-width:560px){.modes.m5{grid-template-columns:repeat(3,1fr)}}
.modes.m6{grid-template-columns:repeat(3,1fr)}.modes.m8{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.modes.m6,.modes.m8{grid-template-columns:repeat(2,1fr)}}
.brand{display:inline-flex;align-items:center;gap:8px;letter-spacing:.04em}
.blogo img{width:28px;height:28px;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero{display:grid;justify-items:center;text-align:center;gap:10px;padding-block:8px 28px}
.hlogo img{width:min(190px,48vw);height:auto;display:block;filter:drop-shadow(0 14px 24px rgba(20,30,60,.22));animation:float 5s ease-in-out infinite}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,9vw,60px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.hero h1 span{color:var(--bad)}
.hero p{margin:0;font-size:clamp(17px,4vw,20px);color:var(--muted);max-width:40ch}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.lgrid{grid-template-columns:1fr}}
.lcard{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i n" "i d" "i s" "i g";column-gap:14px;row-gap:4px;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;animation:lift .45s both}
.lcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 14px 28px -18px rgba(20,30,60,.5)}
.lcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lic{grid-area:i;width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}.lic svg{width:26px;height:26px}
.ln{grid-area:n;font-family:var(--f-display);font-weight:800;font-size:21px}
.ld{grid-area:d;color:var(--muted);font-size:15px;line-height:1.45}
.ls{grid-area:s;font-family:var(--f-mono);font-size:12px;color:var(--ok);margin-top:4px}
.lgo{grid-area:g;font-family:var(--f-display);font-weight:700;color:var(--accent);margin-top:4px}
.lfoot{margin-top:22px}
@keyframes lift{from{transform:translateY(10px)}to{transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.numbig{font-family:var(--f-mono);font-size:clamp(40px,12vw,64px);font-weight:700;color:var(--accent)}
.numw{font-family:var(--f-display);font-size:clamp(22px,6vw,30px);font-weight:700;color:var(--accent)}
.en{color:var(--accent)}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.built{min-height:56px;width:100%;max-width:520px;border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.built .bw{background:var(--accent);color:var(--paper);border-radius:8px;padding:4px 10px;font-weight:700;animation:pop .25s}
.tile.tw{font-size:17px}.tile.used{opacity:.3;pointer-events:none}
.vh{font-family:var(--f-body);font-size:.6em;color:var(--muted);font-weight:400}
.textc{text-align:left;justify-items:stretch}
.ptext{font-size:19px;line-height:2.1;margin:0}
.gap{display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap}
.gap small{color:var(--muted);font-size:13px}
.gin{font:inherit;font-size:18px;line-height:1.2;height:1.7em;padding:0 6px;border:0;border-bottom:2.5px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:6px 6px 0 0;min-width:4ch;max-width:14ch}
.gin.right{border-color:var(--ok);background:var(--ok-soft)}.gin.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:700}
.gap.gok{animation:pop .35s}.gap.gno{animation:shake .4s}
.bwrap{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.bfield{position:relative;height:min(52vh,400px);overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 57px,var(--line) 57px 58px),var(--bg)}
.brow{position:absolute;left:0;right:0;top:0;height:58px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:5px 8px;will-change:transform;transition:opacity .35s, filter .2s}
.bcell{font:inherit;font-weight:700;font-size:clamp(14px,3.8vw,18px);border-radius:10px;border:2px solid var(--accent);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--accent);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.bcell.empty{border:2px dashed var(--line);background:transparent;box-shadow:none}
.brow.wait .bcell:not(.empty){border-color:var(--line);box-shadow:0 3px 0 var(--line);color:var(--muted);cursor:default}
.bcell.bok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.bcell.bbad{background:var(--bad);border-color:var(--bad);color:var(--paper);animation:shake .35s}
.brow.bgone{opacity:0;filter:blur(2px)}
.bflash{position:absolute;inset:0;background:var(--bad);opacity:0;pointer-events:none;z-index:5}
.bflash.on{animation:flash .45s}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
.bwrap.shake2{animation:shake .45s}
.bsent{border-top:3px solid var(--bad);padding:12px 16px 16px;text-align:center;display:grid;gap:6px}
.bsent .sent{font-size:clamp(19px,5vw,24px)}
.bsent .blank.filled{color:var(--ok);border-color:var(--ok);animation:pop .35s}
.vnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.vtitle{display:grid;justify-items:center;gap:2px;margin-bottom:6px}.vtitle b{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--accent)}.vtitle span{color:var(--muted);font-size:14px}
.vtable{display:grid;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px}
.vrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;animation:rowin .35s both}
.vrow:nth-child(odd){background:var(--bg)}
.vp{color:var(--muted);font-size:15px}
.vf{font-family:var(--f-display);font-size:22px;font-weight:500}.vf b{color:var(--accent);font-weight:800}.vf b.irr{color:var(--part)}
.vin{font:inherit;font-size:19px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%;min-width:0}
.vres{min-width:24px;font-weight:700;color:var(--bad)}
.vrow.ok{background:var(--ok-soft);animation:pop .35s}.vrow.ok .vres{color:var(--ok)}
.vrow.no{background:var(--bad-soft);animation:shake .4s}
.vnote{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:12px 0 0;font-size:15px}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sentc{gap:14px}
.sent{font-family:var(--f-display);font-size:clamp(22px,5.5vw,28px);font-weight:700;margin:0;line-height:1.35;text-wrap:balance}
.sent .blank{display:inline-block;min-width:3em;border-bottom:3px solid var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;width:100%}
.tile{font:inherit;font-size:19px;font-weight:700;padding:12px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.tile:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.tile.right{border-color:var(--ok);background:var(--ok-soft);animation:pop .35s}.tile.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.sin{font:inherit;font-size:22px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%;max-width:360px;text-align:center}
.sentc .keys{justify-content:center}.sentc .actions,.sentc #sfb{width:100%}

/* blocos v2: brick wall */
.bgame{display:grid;gap:12px}
.bgtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bgt{font-family:"Permanent Marker","Marker Felt",var(--f-display);font-weight:400;font-size:clamp(28px,7vw,40px);margin:0;color:var(--bad);transform:rotate(-2deg)}
.bstats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:560px){.bstats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bstat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 6px;display:grid;justify-items:center;gap:2px}
.bstat b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}.bstat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.blvl{grid-column:1/-1;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.blvl i{height:6px;background:var(--pending);border-radius:3px;overflow:hidden;display:block}.blvl em{display:block;height:100%;background:var(--part);transition:width .3s}
.bintro{text-align:left;justify-items:start}.brules{margin:0;padding-left:20px;display:grid;gap:4px}
.bwrap{border-radius:14px;overflow:hidden;border:2px solid #2A211D;background:#1A1F2B}
.bfield{position:relative;height:min(56vh,430px);overflow:hidden;background:
  radial-gradient(ellipse at 50% 120%,rgba(255,170,90,.18),transparent 60%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 54px),#1A1F2B}
.brow{display:flex;gap:4px;padding:3px 4px;height:54px;grid-template-columns:none}
.brow .brick{flex:2 1 0}.brow .brick.half{flex:1 1 0}
.brick{position:relative;min-width:0;border:0;border-radius:3px;padding:0 4px;cursor:default;font:inherit;
  background:
   radial-gradient(circle at 20% 30%,rgba(255,255,255,.10) 0 2px,transparent 3px),
   radial-gradient(circle at 70% 65%,rgba(0,0,0,.18) 0 2px,transparent 3px),
   radial-gradient(circle at 45% 80%,rgba(0,0,0,.12) 0 1.5px,transparent 2.5px),
   linear-gradient(180deg,#C8693F,#A44C2A);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.28),0 0 0 2px #3B2E29;
  transition:filter .2s,transform .2s}
.brick.w{cursor:pointer;display:grid;place-items:center}
.brick.w span{font-family:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;font-size:clamp(15px,4.2vw,21px);color:#FFF6D8;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  transform:rotate(var(--r,0deg));text-shadow:2px 2px 0 #1B4E9A,-1px -1px 0 #E2457A,0 0 8px rgba(0,0,0,.35)}
.brow.wait .brick{filter:brightness(.62) saturate(.7)}
.brow.wait .brick.w{cursor:default}
.brow.active .brick.w{animation:glowb 1.6s ease-in-out infinite}
.brow.active .brick.w:hover{transform:translateY(-2px)}
@keyframes glowb{0%,100%{box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.28),0 0 0 2px #3B2E29}50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.28),0 0 0 2px #F2C230}}
.brick.bok{background:linear-gradient(180deg,#43A86A,#2B7749)!important;animation:none!important}
.brick.bbad{background:linear-gradient(180deg,#E0574A,#A8261C)!important;animation:shake .35s!important}
.brow.crumble .brick{animation:crumble .5s ease-in forwards!important}
@keyframes crumble{to{transform:translate(var(--dx,0),70px) rotate(var(--rot,15deg));opacity:0}}
.bbanner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-4deg);font-family:"Permanent Marker","Marker Felt",cursive;font-size:clamp(22px,6vw,34px);color:#F2C230;text-shadow:3px 3px 0 #A8261C;white-space:nowrap;opacity:0;pointer-events:none;z-index:6}
.bbanner.on{animation:bann 1.6s ease-out}
@keyframes bann{0%{opacity:0;transform:translate(-50%,-30%) rotate(-4deg) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) rotate(-4deg) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) rotate(-4deg)}}
.bsent{background:#232A3A;color:#F3F1EA;border-top:4px solid #A8261C}
.bsent .tl{color:#B9C1D3}.bsent .sent{color:#F3F1EA}.bsent .blank{border-color:#F2C230}.bsent .blank.filled{color:#7FD39B;border-color:#7FD39B}
.bfield .cover{background:rgba(20,24,34,.88);color:#F3F1EA}.bfield .cover .hint{color:#C9CFDC}
.tverbs{display:grid;gap:6px;background:var(--part-soft);border:1px dashed var(--part);border-radius:10px;padding:10px 12px}
.tvl{display:flex;flex-wrap:wrap;gap:6px}.tvc{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700}.tvc b{color:var(--part)}

/* results */
.result{display:grid;gap:22px}
.visa{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.visa .big{font-family:var(--f-display);font-weight:800;font-size:clamp(48px,12vw,76px);line-height:1;font-variant-numeric:tabular-nums}
.visa .big small{font-size:.4em;color:var(--muted)}
.visa .stampbig{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.1em;text-transform:uppercase;border:3px double currentColor;border-radius:10px;padding:10px 16px;transform:rotate(-6deg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-family:var(--f-mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--pending);border-radius:3px;overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;background:var(--ok)}
.mist{display:grid;gap:10px}
.mist div{border-left:3px solid var(--bad);padding:4px 0 4px 12px}
.mist div.p{border-left-color:var(--part)}
.mist .q{font-weight:700}
.mist .a{color:var(--muted);font-size:15px}
h2{font-family:var(--f-display);font-size:20px;margin:0}
.scroll{overflow-x:auto}
@media (max-width:520px){.card{padding:20px 16px}.stats{gap:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const BOOKS={"livro":[[{"type":"multi","nRight":3,"ask":"Select ALL the expressions you can use to say goodbye.","prompt":"Despedidas","options":["Adeus!","Até logo!","Até amanhã!","Muito prazer!","Tudo bem?","Olá!"],"explain":"<b>Adeus!</b>, <b>Até logo!</b> and <b>Até amanhã!</b> are farewells. <i>Muito prazer!</i> is said when you meet someone; <i>Olá!</i> and <i>Tudo bem?</i> are greetings.","topic":"U1","pts":4},{"type":"mc","ask":"Look at the clock. How do you greet someone at this time?","prompt":"___","options":["Boa noite!","Bom dia!","Boa tarde!","Até logo!"],"explain":"21:30 is evening/night, so the greeting is <b>Boa noite!</b>. <i>Bom dia</i> = morning, <i>Boa tarde</i> = afternoon, <i>Boa noite</i> = evening and night (also used to say goodbye at night).","img":"<svg viewBox=\"0 0 225 120\" role=\"img\" aria-label=\"Digital clock showing 21:30\"><rect x=\"10\" y=\"22\" width=\"150\" height=\"76\" rx=\"10\" fill=\"#1E2430\"/><rect x=\"18\" y=\"30\" width=\"134\" height=\"60\" rx=\"5\" fill=\"#0D1118\"/><text x=\"85\" y=\"76\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"38\" font-weight=\"700\" fill=\"#F5B83D\">21:30</text><g transform=\"translate(190 64)\"><path d=\"M6-22A22 22 0 1 0 6 22 17 17 0 1 1 6-22Z\" fill=\"#E8E2C4\"/><circle cx=\"-20\" cy=\"-26\" r=\"2\" fill=\"#E8E2C4\"/><circle cx=\"18\" cy=\"26\" r=\"1.6\" fill=\"#E8E2C4\"/></g></svg>","topic":"U1","pts":1},{"type":"text","ask":"Type the verb chamar-se.","prompt":"Ele ___ Eduardo Sousa.","explain":"In European Portuguese affirmative sentences, the reflexive pronoun goes <b>after</b> the verb with a hyphen: <b>Ele chama-se</b>. It moves before the verb only after question words or negation (<i>Como se chama?</i>, <i>Não se chama</i>).","topic":"U1","accept":["chama-se"],"pts":5},{"type":"mc","ask":"Complete with the verb ser (formal you).","prompt":"Você ___ a Anabela?","options":["é","és","sou","são"],"explain":"<i>Você</i> (like <i>o senhor / a senhora</i>) takes the 3rd-person form: <b>é</b>. <i>És</i> belongs to <i>tu</i>.","topic":"U1","pts":2},{"type":"mc","ask":"Maria wants to say “thank you”. What does she say?","prompt":"Maria: “___”","options":["Obrigada!","Obrigado!","Obrigados!","Obrigadas!"],"explain":"<i>Obrigado/obrigada</i> agrees with the <b>speaker</b>: a woman says <b>obrigada</b>, a man says <b>obrigado</b>.","topic":"U1","pts":1},{"type":"mc","ask":"Choose the right answer.","prompt":"A: Quem é ela? &nbsp;B: ___","options":["É a Rita.","Sou a Rita.","Chamo-me Rita.","Bem, obrigada."],"explain":"The question is about a third person (<i>ela</i>), so the answer uses <i>é</i>: <b>É a Rita.</b> <i>Sou / Chamo-me</i> would be about yourself.","topic":"U1","pts":1},{"type":"text","ask":"Which country does this flag belong to? Type the answer.","prompt":"___","explain":"Green, white and <b>orange</b>: this is <b>a Irlanda</b>. Italy's flag looks similar but the third stripe is red.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"10\" height=\"20\" fill=\"#169B62\"/><rect x=\"10\" width=\"10\" height=\"20\" fill=\"#F7F7F2\"/><rect x=\"20\" width=\"10\" height=\"20\" fill=\"#FF883E\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U2","accept":["Irlanda"],"pts":5},{"type":"text","ask":"Type em / no / na / nos / nas.","prompt":"Nova Iorque é ___ Estados Unidos.","accept":["nos"],"explain":"<i>Em</i> shows location. The country is <i>os Estados Unidos</i>, so the preposition merges with the article: em + os = <b>nos</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","pts":5},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"O Paulo é ___ Portugal.","explain":"<i>De</i> shows origin. <b>Portugal</b> takes no article, so the preposition stays as it is: <b>de Portugal</b>.","topic":"U2","accept":["de"],"pts":5},{"type":"mc","ask":"Put the sentence in the plural.","prompt":"Ele é do México. → ___","options":["Eles são do México.","Eles é do México.","Eles somos do México.","Eles são dos México."],"explain":"<i>Ser</i> plural: nós <b>somos</b>, vocês/eles/elas <b>são</b>. The country does not change: <b>Eles são do México.</b>","topic":"U2","pts":4},{"type":"mc","ask":"Complete with em, no, na, nos or nas.","prompt":"Tóquio é ___ Japão.","options":["no","em","na","nos"],"explain":"<i>Em</i> shows location. The country is <i>o Japão</i>, so the preposition merges with the article: em + o = <b>no</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","pts":2},{"type":"mc","ask":"Complete with the verb ser.","prompt":"Nós ___ de Portugal.","options":["somos","são","estamos","sou"],"explain":"With <i>nós</i>, <i>ser</i> is <b>somos</b>. Origin always uses <i>ser de</i>.","topic":"U2","pts":2},{"type":"text","ask":"Do the sum and write the result in words.","prompt":"44 + 45 = ___","accept":["oitenta e nove"],"explain":"44 + 45 = 89 → <b>oitenta e nove</b>. Each part is joined with <b>e</b>: hundreds <i>e</i> tens <i>e</i> units.","topic":"NUM","pts":7},{"type":"mc","ask":"How is this number written?","prompt":"234 = ___","options":["duzentos e trinta e quatro","duzentos trinta e quatro","dois centos e trinta e quatro","duzentos e quarenta e três"],"explain":"<b>Duzentos e trinta e quatro</b>: put <i>e</i> between hundreds and tens and between tens and units. 200 has its own word, <i>duzentos</i>.","topic":"NUM","pts":5},{"type":"mc","ask":"Which number is this?","prompt":"quinhentos e quarenta e cinco = ___","options":["545","505","554","455"],"explain":"<i>quinhentos e quarenta e cinco</i> = <b>545</b>. Read it part by part, separated by <i>e</i>.","topic":"NUM","pts":4},{"type":"mc","ask":"How is this number written?","prompt":"14 = ___","options":["catorze","quarenta","quatro","quinze"],"explain":"14 = <b>catorze</b>. Numbers up to 19 have their own words (European spelling: dezasseis, dezassete, dezanove). Don't confuse <i>quarenta</i> (40) and <i>quatro</i> (4).","topic":"NUM","pts":1},{"type":"text","ask":"Type the nationality in the correct form.","prompt":"A Carmen e a Lucía são de Espanha. Elas são ___.","accept":["espanholas"],"explain":"Espanha → espanhol / espanhola / espanhóis / espanholas (m. / f. / m. pl. / f. pl.). Here it's only women → feminine plural: <b>espanholas</b>.","topic":"NAT","pts":7},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"A Ana e a Rita são do Brasil. Elas são ___.","options":["brasileiras","brasileiro","brasileira","brasileiros"],"explain":"Brasil → brasileiro / brasileira / brasileiros / brasileiras (m. / f. / m. pl. / f. pl.). Here it's only women → feminine plural: <b>brasileiras</b>.","topic":"NAT","pts":4},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"A Olga é da Rússia. Ela é ___.","options":["russa","russo","russos","russas"],"explain":"Rússia → russo / russa / russos / russas (m. / f. / m. pl. / f. pl.). Here it's one woman → feminine singular: <b>russa</b>.","topic":"NAT","pts":2},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"O Pierre é de França. Ele é ___.","options":["francês","francesa","franceses","francesas"],"explain":"França → francês / francesa / franceses / francesas (m. / f. / m. pl. / f. pl.). Here it's one man → masculine singular: <b>francês</b>.","topic":"NAT","pts":1},{"type":"text","ask":"Look at the picture and complete with the colour. Type the answer.","prompt":"Os livros são ___.","explain":"The colour is blue. <i>azul</i> has the same form for masculine and feminine; only the number changes (azul → azuis). So: <b>Os livros são azuis.</b>","img":"<svg viewBox=\"0 0 200 130\" role=\"img\" aria-label=\"blue livros\"><g transform=\"translate(22 22) rotate(-6)\"><rect x=\"0\" y=\"0\" width=\"70\" height=\"92\" rx=\"4\" fill=\"#2C5FB0\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"8\" y=\"0\" width=\"5\" height=\"92\" fill=\"#2A2A2A\" opacity=\".25\"/><rect x=\"22\" y=\"22\" width=\"36\" height=\"12\" rx=\"2\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"1.5\"/></g><g transform=\"translate(105 16) rotate(5)\"><rect x=\"0\" y=\"0\" width=\"70\" height=\"92\" rx=\"4\" fill=\"#2C5FB0\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"8\" y=\"0\" width=\"5\" height=\"92\" fill=\"#2A2A2A\" opacity=\".25\"/><rect x=\"22\" y=\"22\" width=\"36\" height=\"12\" rx=\"2\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"1.5\"/></g></svg>","topic":"U4","accept":["azuis"],"pts":8},{"type":"mc","ask":"Answer the question about this flag.","prompt":"De que cor é a bandeira da Ucrânia? ___","options":["É azul e amarela.","É azul e amarelo.","É azuis e amarelas.","É verde e amarela."],"explain":"<i>A bandeira</i> is feminine singular, so <i>amarelo</i> → <b>amarela</b>; <i>azul</i> has one form for both genders. <b>É azul e amarela.</b>","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"Flag of Ukraine\"><rect width=\"30\" height=\"10\" fill=\"#0057B7\"/><rect y=\"10\" width=\"30\" height=\"10\" fill=\"#FFD700\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U4","pts":4},{"type":"mc","ask":"Look at the picture and complete with the colour.","prompt":"A mesa é ___.","options":["vermelha","vermelho","vermelhos","vermelhas"],"explain":"The colour is red. Colours ending in <i>-o</i> agree in gender and number: vermelho, vermelha, vermelhos, vermelhas. So: <b>A mesa é vermelha.</b>","img":"<svg viewBox=\"0 0 160 125\" role=\"img\" aria-label=\"red mesa\"><g transform=\"translate(0 0) scale(1)\" fill=\"#D7322B\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"10\" y=\"34\" width=\"140\" height=\"16\" rx=\"3\"/><rect x=\"22\" y=\"50\" width=\"11\" height=\"70\"/><rect x=\"127\" y=\"50\" width=\"11\" height=\"70\"/></g></svg>","topic":"U4","pts":2},{"type":"mc","ask":"You point at a building far away from both of you. Which word?","prompt":"O que é ___?","options":["aquilo","isto","isso","este"],"explain":"<i>Isto</i> = near the speaker, <i>isso</i> = near the listener, <b>aquilo</b> = far from both.","topic":"U4","pts":4},{"type":"mc","ask":"What does the student mean?","prompt":"Não percebo.","options":["I don't understand.","I don't remember.","I can't hear.","I don't know the page."],"explain":"<b>Não percebo</b> = <i>Não compreendo</i> = I don't understand. “I don't remember” is <i>Não me lembro</i>.","topic":"U4","pts":1},{"type":"mc","ask":"In which word is the underlined s pronounced [s] (not [ʃ] “sh”)?","prompt":"The letter <span class='blank' style='min-width:1.4em'>s</span>","options":["<b>s</b>ábado","sei<b>s</b>","de<b>s</b>culpe","trê<b>s</b>"],"explain":"In European Portuguese, <i>s</i> at the end of a word or before a voiceless consonant sounds like [ʃ]: <i>seis, três, desculpe</i>. At the start of a word it's [s]: <b>sábado</b>.","topic":"PRON","pts":5},{"type":"mc","ask":"Which word has a nasal vowel?","prompt":"Nasal ou oral?","options":["irmã","mesa","porta","livro"],"explain":"The tilde (~) marks nasal vowels: <b>irmã</b>, alemã, são, irmão. <i>Mesa, porta, livro</i> only have oral vowels.","topic":"PRON","pts":2},{"type":"text","ask":"Type the correct form of ser or estar.","prompt":"A porta ___ fechada.","accept":["está"],"explain":"Use <b>estar</b>: it's the current condition of something (open/closed, hot/cold). With <i>ele/ela/você</i> → <b>está</b>. (<i>é</i> would describe a permanent characteristic.)","topic":"SE","pts":7},{"type":"text","ask":"Type the correct form of ser or estar.","prompt":"Elas ___ de Angola.","accept":["são"],"explain":"Use <b>ser</b>: where someone is <b>from</b> is permanent (ser de). With <i>eles/elas/vocês</i> → <b>são</b>. (<i>estão</i> would describe a temporary state or location.)","topic":"SE","pts":4},{"type":"text","ask":"Ser or estar? Type the answer.","prompt":"A janela ___ aberta.","explain":"Use <b>estar</b>: it's the current condition of something (open/closed, hot/cold). With <i>ele/ela/você</i> → <b>está</b>. (<i>é</i> would describe a permanent characteristic.)","topic":"SE","accept":["está"],"pts":7},{"type":"mc","ask":"Ser or estar?","prompt":"Nós ___ cansados hoje.","options":["estamos","somos","estás","são"],"explain":"Use <b>estar</b>: it's a temporary state or feeling that can change soon. With <i>nós</i> → <b>estamos</b>. (<i>somos</i> would describe a permanent characteristic.)","topic":"SE","pts":4},{"type":"mc","ask":"Ser or estar?","prompt":"Nós ___ alunos de português.","options":["somos","estamos","são","estás"],"explain":"Use <b>ser</b>: a profession or role says who someone is. With <i>nós</i> → <b>somos</b>. (<i>estamos</i> would describe a temporary state or location.)","topic":"SE","pts":4},{"type":"mc","ask":"Ser or estar?","prompt":"Vocês ___ ingleses?","options":["são","estão","somos","estás"],"explain":"Use <b>ser</b>: nationality is a permanent characteristic. With <i>eles/elas/vocês</i> → <b>são</b>. (<i>estão</i> would describe a temporary state or location.)","topic":"SE","pts":2},{"type":"multi","nRight":3,"ask":"Select ALL the sentences where ficar means “to stay”.","prompt":"Ficar = to stay?","options":["Fico em casa hoje.","Ficamos no hotel três noites.","O Rui fica em Lisboa até sexta-feira.","Onde fica Lisboa?","O Porto fica no norte.","A escola fica em Belém."],"explain":"When the subject is a <b>person</b>, <i>ficar</i> + place usually means <b>to stay</b>. When the subject is a <b>place</b> (Lisboa, o Porto, a escola), it means <i>to be located</i>.","topic":"FIC","pts":8},{"type":"mc","ask":"What does it mean?","prompt":"Onde ficas em Lisboa?","options":["Where are you staying in Lisbon?","Where is Lisbon?","Where do you work in Lisbon?","Are you from Lisbon?"],"explain":"<i>Ficas</i> is the <i>tu</i> form and refers to a person, so here <b>ficar = to stay</b>: Where are you staying in Lisbon? Compare <i>Onde fica Lisboa?</i> (where is Lisbon located).","topic":"FIC","pts":7},{"type":"mc","ask":"What does it mean?","prompt":"Onde fica a estação?","options":["Where is the station?","Where are you staying?","When does the train leave?","Is the station open?"],"explain":"With places, <b>ficar</b> means “to be located”: <i>Onde fica a estação?</i> = Where is the station (located)?","topic":"FIC","pts":4},{"type":"mc","ask":"Which question asks where a city is located?","prompt":"___","options":["Onde fica Coimbra?","Onde estás?","Onde moras?","De onde és?"],"explain":"<b>Onde fica…?</b> asks for the location of a place. <i>Onde estás?</i> = where are you now; <i>Onde moras?</i> = where do you live; <i>De onde és?</i> = where are you from.","topic":"FIC","pts":2},{"type":"text","ask":"Type the indefinite (um/uma/uns/umas) article.","prompt":"___ países","accept":["uns"],"explain":"<i>país</i> is masculine, and here it's plural. Indefinite articles: um / uma / uns / umas. → <b>uns países</b>.","topic":"ART","pts":5},{"type":"text","ask":"Make it plural. Type the answer.","prompt":"o cão → ___","explain":"<i>Cão</i> → <b>cães</b> (one of the three -ão plural patterns: mãos, cães, aviões). Masculine: <b>os cães</b>.","topic":"ART","accept":["os cães"],"pts":8},{"type":"text","ask":"Type the definite article (o, a, os, as).","prompt":"___ lápis","explain":"<i>lápis</i> is masculine, and the same in singular and plural, and here it's plural. Definite articles: o / a / os / as. → <b>os lápis</b>.","topic":"ART","accept":["os"],"pts":6},{"type":"mc","ask":"Complete with the definite article (o, a, os, as).","prompt":"___ dia","options":["o","a","os","as"],"explain":"<i>dia</i> is masculine even though it ends in -a. Definite articles: o / a / os / as. → <b>o dia</b>.","topic":"ART","pts":4},{"type":"mc","ask":"Complete with the indefinite article (um, uma, uns, umas).","prompt":"___ aviões","options":["uns","um","uma","umas"],"explain":"<i>avião</i> is masculine, and here it's plural. Indefinite articles: um / uma / uns / umas. → <b>uns aviões</b>.","topic":"ART","pts":4},{"type":"mc","ask":"Complete with the definite article (o, a, os, as).","prompt":"___ computador","options":["o","a","os","as"],"explain":"<i>computador</i> is masculine. Definite articles: o / a / os / as. → <b>o computador</b>.","topic":"ART","pts":1},{"type":"multi","nRight":3,"ask":"Select ALL the correctly conjugated forms.","prompt":"-ar / -er / -ir","options":["eu como","tu abres","nós partimos","nós comimos","tu abras","eles partam"],"explain":"Correct: <b>eu como</b> (-er), <b>tu abres</b> (-ir: -es), <b>nós partimos</b> (-ir: -imos). <i>Comimos</i> mixes -er with the -ir ending; <i>abras</i> and <i>partam</i> use the wrong vowel.","topic":"VERB","pts":8},{"type":"text","ask":"Type the present tense of comprar.","prompt":"Tu ___ o jornal. <small>(comprar)</small>","accept":["compras"],"explain":"<b>comprar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. tu → <b>compras</b>.","topic":"VERB","pts":6},{"type":"text","ask":"Type the present tense of decidir.","prompt":"Eu ___ hoje. <small>(decidir)</small>","accept":["decido"],"explain":"<b>decidir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. eu → <b>decido</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":4},{"type":"mc","ask":"Complete with the present tense of morar.","prompt":"Tu ___ em Lisboa. <small>(morar)</small>","options":["moras","mores","moro","mora"],"explain":"<b>morar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. tu → <b>moras</b>.","topic":"VERB","pts":4},{"type":"mc","ask":"Complete with the present tense of escrever.","prompt":"Tu ___ um email. <small>(escrever)</small>","options":["escreves","escrevas","escrevo","escreve"],"explain":"<b>escrever</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. tu → <b>escreves</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":4},{"type":"mc","ask":"Complete with the present tense of comer.","prompt":"A Rita ___ peixe ao jantar. <small>(comer)</small>","options":["come","coma","como","comes"],"explain":"<b>comer</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. ele/ela/você → <b>come</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":2},{"type":"mc","ask":"Complete with the present tense of discutir.","prompt":"Eu ___ o problema. <small>(discutir)</small>","options":["discuto","discutes","discute","discutimos"],"explain":"<b>discutir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. eu → <b>discuto</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":1}],[{"type":"mc","ask":"Look at the clock. How do you greet someone at this time?","prompt":"___","options":["Bom dia!","Boa tarde!","Boa noite!","Até logo!"],"explain":"08:00 is morning (until about midday), so the greeting is <b>Bom dia!</b>. <i>Bom dia</i> = morning, <i>Boa tarde</i> = afternoon, <i>Boa noite</i> = evening and night (also used to say goodbye at night).","img":"<svg viewBox=\"0 0 225 120\" role=\"img\" aria-label=\"Digital clock showing 08:00\"><rect x=\"10\" y=\"22\" width=\"150\" height=\"76\" rx=\"10\" fill=\"#1E2430\"/><rect x=\"18\" y=\"30\" width=\"134\" height=\"60\" rx=\"5\" fill=\"#0D1118\"/><text x=\"85\" y=\"76\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"38\" font-weight=\"700\" fill=\"#F5B83D\">08:00</text><g transform=\"translate(190 64)\"><circle r=\"16\" fill=\"#F5B83D\"/><g stroke=\"#F5B83D\" stroke-width=\"4\" stroke-linecap=\"round\"><line y1=\"-24\" y2=\"-31\"/><line y1=\"24\" y2=\"31\"/><line x1=\"-24\" x2=\"-31\"/><line x1=\"24\" x2=\"31\"/><line x1=\"17\" y1=\"-17\" x2=\"22\" y2=\"-22\"/><line x1=\"-17\" y1=\"-17\" x2=\"-22\" y2=\"-22\"/><line x1=\"17\" y1=\"17\" x2=\"22\" y2=\"22\"/><line x1=\"-17\" y1=\"17\" x2=\"-22\" y2=\"22\"/></g></g></svg>","topic":"U1","pts":2},{"type":"mc","ask":"Look at the clock. How do you greet someone at this time?","prompt":"___","options":["Boa noite!","Bom dia!","Boa tarde!","Até logo!"],"explain":"23:00 is night, so the greeting is <b>Boa noite!</b>. <i>Bom dia</i> = morning, <i>Boa tarde</i> = afternoon, <i>Boa noite</i> = evening and night (also used to say goodbye at night).","img":"<svg viewBox=\"0 0 225 120\" role=\"img\" aria-label=\"Digital clock showing 23:00\"><rect x=\"10\" y=\"22\" width=\"150\" height=\"76\" rx=\"10\" fill=\"#1E2430\"/><rect x=\"18\" y=\"30\" width=\"134\" height=\"60\" rx=\"5\" fill=\"#0D1118\"/><text x=\"85\" y=\"76\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"38\" font-weight=\"700\" fill=\"#F5B83D\">23:00</text><g transform=\"translate(190 64)\"><path d=\"M6-22A22 22 0 1 0 6 22 17 17 0 1 1 6-22Z\" fill=\"#E8E2C4\"/><circle cx=\"-20\" cy=\"-26\" r=\"2\" fill=\"#E8E2C4\"/><circle cx=\"18\" cy=\"26\" r=\"1.6\" fill=\"#E8E2C4\"/></g></svg>","topic":"U1","pts":1},{"type":"text","ask":"Complete the formal question. Type the answer.","prompt":"Como ___ chama o senhor?","explain":"<i>O senhor</i> takes the 3rd person, so the pronoun is <b>se</b>, and after <i>como</i> it goes before the verb: <b>Como se chama o senhor?</b>","topic":"U1","accept":["se"],"pts":6},{"type":"mc","ask":"Which farewell means you will see the person again the soonest?","prompt":"Até… ?","options":["Até já!","Até logo!","Até amanhã!","Até à próxima!"],"explain":"<b>Até já</b> = “see you in a moment”. <i>Até logo</i> = later (usually the same day), <i>Até amanhã</i> = tomorrow, <i>Até à próxima</i> = until next time.","topic":"U1","pts":4},{"type":"mc","ask":"Complete with the verb ser.","prompt":"Quem ___ ele?","options":["é","és","sou","está"],"explain":"<i>Ele</i> is 3rd person singular: <b>Quem é ele?</b> We use <i>ser</i> to identify people.","topic":"U1","pts":1},{"type":"mc","ask":"Complete with the definite article.","prompt":"___ João é de Lisboa.","options":["O","A","Um","Os"],"explain":"Before a man's first name, use the masculine article <b>o</b>: <b>O João</b> é de Lisboa.","topic":"U1","pts":1},{"type":"multi","nRight":3,"ask":"Select ALL the countries used WITHOUT an article.","prompt":"Sou de ___","options":["Portugal","Marrocos","Angola","Brasil","China","México"],"explain":"No article: <b>Portugal, Marrocos, Angola</b> (also Moçambique, Cuba, Israel). Others need one: <i>do Brasil, da China, do México</i>.","topic":"U2","pts":5},{"type":"text","ask":"Type em / no / na / nos / nas.","prompt":"Luanda é ___ Angola.","accept":["em"],"explain":"<i>Em</i> shows location. <b>Angola</b> takes no article, so the preposition stays as it is: <b>em Angola</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","pts":5},{"type":"mc","ask":"Complete with de, do, da, dos or das.","prompt":"O Karim é ___ Marrocos.","options":["de","do","da","dos"],"explain":"<i>De</i> shows origin. <b>Marrocos</b> takes no article, so the preposition stays as it is: <b>de Marrocos</b>.","topic":"U2","pts":4},{"type":"mc","ask":"Complete with de, do, da, dos or das.","prompt":"A Sofia é ___ Brasil.","options":["do","de","da","dos"],"explain":"<i>De</i> shows origin. The country is <i>o Brasil</i>, so the preposition merges with the article: de + o = <b>do</b>.","topic":"U2","pts":2},{"type":"mc","ask":"Complete with em, no, na, nos or nas.","prompt":"Berlim é ___ Alemanha.","options":["na","em","no","nos"],"explain":"<i>Em</i> shows location. The country is <i>a Alemanha</i>, so the preposition merges with the article: em + a = <b>na</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","pts":2},{"type":"mc","ask":"Answer the question.","prompt":"Onde fica Pequim? ___","options":["Na China.","No China.","Em China.","Da China."],"explain":"<i>A China</i> is feminine, so em + a = <b>na</b>: <b>Na China.</b> <i>Da China</i> would mean “from China”.","topic":"U2","pts":2},{"type":"text","ask":"Read the house number on the tile plate. Type the answer.","prompt":"Número ___","explain":"350 = <b>trezentos e cinquenta</b>. Don't confuse <i>cinquenta</i> (50) with <i>quinze</i> (15). Tile house numbers (<i>azulejos</i>) are typical in Portugal.","img":"<svg viewBox=\"0 0 200 130\" role=\"img\" aria-label=\"Blue-and-white tile house-number plate showing 350\"><rect x=\"8\" y=\"8\" width=\"184\" height=\"114\" rx=\"4\" fill=\"#F7F6F0\" stroke=\"#1F4E9C\" stroke-width=\"6\"/><rect x=\"20\" y=\"20\" width=\"160\" height=\"90\" fill=\"none\" stroke=\"#1F4E9C\" stroke-width=\"2\"/><g fill=\"#1F4E9C\"><path d=\"M20 20h18L20 38Z\"/><path d=\"M180 20h-18l18 18Z\"/><path d=\"M20 110h18L20 92Z\"/><path d=\"M180 110h-18l18-18Z\"/></g><text x=\"100\" y=\"86\" text-anchor=\"middle\" font-family=\"Georgia, serif\" font-size=\"54\" font-weight=\"700\" fill=\"#1F4E9C\">350</text></svg>","topic":"NUM","accept":["trezentos e cinquenta"],"pts":6},{"type":"text","ask":"Do the sum and write the result in words.","prompt":"17 + 54 = ___","accept":["setenta e um"],"explain":"17 + 54 = 71 → <b>setenta e um</b>. Each part is joined with <b>e</b>: hundreds <i>e</i> tens <i>e</i> units.","topic":"NUM","pts":6},{"type":"mc","ask":"Which number is this?","prompt":"seiscentos e dezasseis = ___","options":["616","660","606","166"],"explain":"<i>seiscentos e dezasseis</i> = <b>616</b>. Read it part by part, separated by <i>e</i>.","topic":"NUM","pts":5},{"type":"mc","ask":"How is this number written?","prompt":"16 = ___","options":["dezasseis","dezassete","sessenta","seis"],"explain":"16 = <b>dezasseis</b>. Numbers up to 19 have their own words (European spelling: dezasseis, dezassete, dezanove). Don't confuse <i>dezassete</i> (17) and <i>sessenta</i> (60).","topic":"NUM","pts":2},{"type":"text","ask":"Type the nationality in the correct form.","prompt":"A Misaki é do Japão. Ela é ___.","accept":["japonesa"],"explain":"Japão → japonês / japonesa / japoneses / japonesas (m. / f. / m. pl. / f. pl.). Here it's one woman → feminine singular: <b>japonesa</b>.","topic":"NAT","pts":5},{"type":"text","ask":"Type the nationality in the correct form.","prompt":"O Tom e a Kate são de Inglaterra. Eles são ___.","explain":"Inglaterra → inglês / inglesa / ingleses / inglesas (m. / f. / m. pl. / f. pl.). Here it's a group of men or a mixed group → masculine plural: <b>ingleses</b>.","topic":"NAT","accept":["ingleses"],"pts":6},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"A Wei é da China. Ela é ___.","options":["chinesa","chinês","chineses","chinesas"],"explain":"China → chinês / chinesa / chineses / chinesas (m. / f. / m. pl. / f. pl.). Here it's one woman → feminine singular: <b>chinesa</b>.","topic":"NAT","pts":4},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"O Marco é de Itália. Ele é ___.","options":["italiano","italiana","italianos","italianas"],"explain":"Itália → italiano / italiana / italianos / italianas (m. / f. / m. pl. / f. pl.). Here it's one man → masculine singular: <b>italiano</b>.","topic":"NAT","pts":1},{"type":"mc","ask":"Look at the picture and complete with the colour.","prompt":"As cadeiras são ___.","options":["verdes","verde","verdas","pretas"],"explain":"The colour is green. <i>verde</i> has the same form for masculine and feminine; only the number changes (verde → verdes). So: <b>As cadeiras são verdes.</b>","img":"<svg viewBox=\"0 0 230 140\" role=\"img\" aria-label=\"green cadeiras\"><g transform=\"translate(0 0) scale(1)\" fill=\"#2E8B57\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"30\" y=\"10\" width=\"60\" height=\"44\" rx=\"5\"/><rect x=\"30\" y=\"54\" width=\"8\" height=\"30\"/><rect x=\"82\" y=\"54\" width=\"8\" height=\"30\"/><path d=\"M22 84h76l-6 14H28Z\"/><rect x=\"28\" y=\"98\" width=\"8\" height=\"38\"/><rect x=\"84\" y=\"98\" width=\"8\" height=\"38\"/></g><g transform=\"translate(110 0) scale(1)\" fill=\"#2E8B57\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"30\" y=\"10\" width=\"60\" height=\"44\" rx=\"5\"/><rect x=\"30\" y=\"54\" width=\"8\" height=\"30\"/><rect x=\"82\" y=\"54\" width=\"8\" height=\"30\"/><path d=\"M22 84h76l-6 14H28Z\"/><rect x=\"28\" y=\"98\" width=\"8\" height=\"38\"/><rect x=\"84\" y=\"98\" width=\"8\" height=\"38\"/></g></svg>","topic":"U4","pts":4},{"type":"mc","ask":"What is this?","prompt":"O que é isto? ___","options":["É uma mesa.","É um mesa.","É uma porta.","É uma janela."],"explain":"It's a table: <b>uma mesa</b>. It is feminine, so it takes <i>uma</i>.","img":"<svg viewBox=\"0 0 160 125\" role=\"img\" aria-label=\"table\"><g transform=\"translate(0 0) scale(1)\" fill=\"#7B4A26\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"10\" y=\"34\" width=\"140\" height=\"16\" rx=\"3\"/><rect x=\"22\" y=\"50\" width=\"11\" height=\"70\"/><rect x=\"127\" y=\"50\" width=\"11\" height=\"70\"/></g></svg>","topic":"U4","pts":2},{"type":"mc","ask":"What is this?","prompt":"O que é isto? ___","options":["É um relógio.","É uma relógio.","É uma cadeira.","É uma porta."],"explain":"It's a clock: <b>um relógio</b>. It is masculine, so it takes <i>um</i>.","img":"<svg viewBox=\"0 0 130 130\" role=\"img\" aria-label=\"clock\"><circle cx=\"65\" cy=\"65\" r=\"56\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"6\"/><line x1=\"65\" y1=\"21\" x2=\"65\" y2=\"15\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"87\" y1=\"26.894882233484694\" x2=\"90\" y2=\"21.69872981077806\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"103.10511776651529\" y1=\"43\" x2=\"108.30127018922192\" y2=\"39.99999999999999\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"109\" y1=\"65\" x2=\"115\" y2=\"65\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"103.1051177665153\" y1=\"86.99999999999999\" x2=\"108.30127018922194\" y2=\"89.99999999999999\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"87\" y1=\"103.1051177665153\" x2=\"90\" y2=\"108.30127018922194\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"65\" y1=\"109\" x2=\"65\" y2=\"115\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"43.000000000000014\" y1=\"103.1051177665153\" x2=\"40.000000000000014\" y2=\"108.30127018922194\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"26.894882233484708\" y1=\"87.00000000000003\" x2=\"21.698729810778076\" y2=\"90.00000000000003\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"21\" y1=\"65.00000000000001\" x2=\"15\" y2=\"65.00000000000001\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"26.8948822334847\" y1=\"43\" x2=\"21.69872981077807\" y2=\"39.99999999999999\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"42.99999999999998\" y1=\"26.894882233484708\" x2=\"39.99999999999998\" y2=\"21.698729810778083\" stroke=\"#2A2A2A\" stroke-width=\"3\"/><line x1=\"65\" y1=\"65\" x2=\"65\" y2=\"30\" stroke=\"#2A2A2A\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"65\" y1=\"65\" x2=\"92\" y2=\"72\" stroke=\"#2A2A2A\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"65\" cy=\"65\" r=\"4\" fill=\"#2A2A2A\"/></svg>","topic":"U4","pts":1},{"type":"text","ask":"Your friend is holding a book. You ask about it. Type the answer.","prompt":"O que é ___?","explain":"The object is near the <b>listener</b>, so use <b>isso</b>. If you were holding it, you'd say <i>isto</i>.","topic":"U4","accept":["isso"],"pts":6},{"type":"mc","ask":"Complete the classroom question.","prompt":"Como se diz “window” ___ português?","options":["em","no","de","na"],"explain":"<b>Como se diz X em português?</b> Languages take <i>em</i> without an article. (Answer: <i>janela</i>.)","topic":"U4","pts":2},{"type":"mc","ask":"In which word is the underlined e NOT pronounced [ɨ]?","prompt":"The letter <span class='blank' style='min-width:1.4em'>e</span>","options":["m<b>e</b>sa","tard<b>e</b>","verd<b>e</b>","pared<b>e</b>"],"explain":"Unstressed <i>e</i> is reduced to [ɨ], almost silent: <i>tarde, verde, parede</i>. In <b>mesa</b> the e is stressed, so it's a full [e].","topic":"PRON","pts":6},{"type":"mc","ask":"Where is the stress?","prompt":"amanhã","options":["a-ma-<b>NHÃ</b>","<b>A</b>-ma-nhã","a-<b>MA</b>-nhã","all syllables equal"],"explain":"The tilde marks a nasal vowel and, at the end of a word, attracts the stress: a-ma-<b>NHÃ</b> (like <i>alemã, irmã</i>).","topic":"PRON","pts":4},{"type":"text","ask":"Type the correct form of ser or estar.","prompt":"A Ana ___ em Roma esta semana.","accept":["está"],"explain":"Use <b>estar</b>: it's where a person is <b>right now</b> (temporary location). With <i>ele/ela/você</i> → <b>está</b>. (<i>é</i> would describe a permanent characteristic.)","topic":"SE","pts":5},{"type":"mc","ask":"Choose the correct sentence.","prompt":"Who is sick today?","options":["O Rui está doente hoje.","O Rui é doente hoje.","O Rui estão doente hoje.","O Rui fica doente hoje."],"explain":"Being sick <i>today</i> is a temporary state → <b>estar</b>: <i>O Rui está doente hoje.</i>","topic":"SE","pts":6},{"type":"mc","ask":"Ser or estar?","prompt":"Nós ___ em Paris de férias.","options":["estamos","somos","estão","és"],"explain":"Use <b>estar</b>: it's where a person is <b>right now</b> (temporary location). With <i>nós</i> → <b>estamos</b>. (<i>somos</i> would describe a permanent characteristic.)","topic":"SE","pts":5},{"type":"mc","ask":"Ser or estar?","prompt":"Tu ___ em casa?","options":["estás","és","estamos","sou"],"explain":"Use <b>estar</b>: it's where a person is <b>right now</b> (temporary location). With <i>tu</i> → <b>estás</b>. (<i>és</i> would describe a permanent characteristic.)","topic":"SE","pts":4},{"type":"mc","ask":"Ser or estar?","prompt":"Eles ___ professores.","options":["são","estão","somos","estás"],"explain":"Use <b>ser</b>: a profession or role says who someone is. With <i>eles/elas/vocês</i> → <b>são</b>. (<i>estão</i> would describe a temporary state or location.)","topic":"SE","pts":2},{"type":"mc","ask":"Ser or estar?","prompt":"A Maria ___ portuguesa.","options":["é","está","sou","estamos"],"explain":"Use <b>ser</b>: nationality is a permanent characteristic. With <i>ele/ela/você</i> → <b>é</b>. (<i>está</i> would describe a temporary state or location.)","topic":"SE","pts":1},{"type":"multi","nRight":3,"ask":"Select ALL the correct forms of ficar.","prompt":"ficar","options":["eu fico","nós ficamos","eles ficam","tu fica","nós ficemos","eles ficão"],"explain":"Ficar is a regular -ar verb: eu <b>fico</b>, tu <b>ficas</b>, ele <b>fica</b>, nós <b>ficamos</b>, eles <b>ficam</b>.","topic":"FIC","pts":6},{"type":"text","ask":"Type the correct form of ficar.","prompt":"Onde ___ Sevilha?","accept":["fica"],"explain":"<i>Sevilha</i> is one city (3rd person singular): <b>Onde fica Sevilha?</b> (Em Espanha.)","topic":"FIC","pts":4},{"type":"mc","ask":"Complete with ficar (to stay).","prompt":"Nós ___ no Hotel Central.","options":["ficamos","ficam","fico","ficemos"],"explain":"Here <i>ficar</i> means <b>to stay</b>. It's a regular -ar verb: fico, ficas, fica, ficamos, ficam. With <i>nós</i> → <b>ficamos</b>.","topic":"FIC","pts":4},{"type":"mc","ask":"Complete with ficar (to stay).","prompt":"A Ana ___ com os amigos no fim de semana.","options":["fica","ficamos","ficam","ficão"],"explain":"Here <i>ficar</i> means <b>to stay</b>. It's a regular -ar verb: fico, ficas, fica, ficamos, ficam. With <i>ele/ela/você</i> → <b>fica</b>.","topic":"FIC","pts":2},{"type":"multi","nRight":3,"ask":"Select ALL the correct phrases.","prompt":"Artigo + nome","options":["os lápis","uma mão","uns mapas","as mapas","um cidade","umas dias"],"explain":"Correct: <b>os lápis</b> (masculine, same form in plural), <b>uma mão</b> (feminine), <b>uns mapas</b> (masculine). The rest mix up the gender.","topic":"ART","pts":6},{"type":"text","ask":"Type the indefinite (um/uma/uns/umas) article.","prompt":"___ relógio","accept":["um"],"explain":"<i>relógio</i> is masculine. Indefinite articles: um / uma / uns / umas. → <b>um relógio</b>.","topic":"ART","pts":2},{"type":"text","ask":"Make it plural. Type the answer.","prompt":"o país → ___","explain":"<i>País</i> → <b>países</b> (add -es; the accent stays on the i). Masculine plural article: <b>os</b>.","topic":"ART","accept":["os países"],"pts":8},{"type":"mc","ask":"Complete the dialogue.","prompt":"Aquilo é ___ caneta? — Sim, é ___ caneta da Rita.","options":["uma / a","a / uma","uma / uma","a / a"],"explain":"Asking what something is → <b>uma</b> caneta. Then a specific pen (Rita's) → <b>a</b> caneta da Rita.","topic":"ART","pts":6},{"type":"mc","ask":"Complete with the indefinite article (um, uma, uns, umas).","prompt":"___ mapa","options":["um","uma","uns","umas"],"explain":"<i>mapa</i> is masculine even though it ends in -a. Indefinite articles: um / uma / uns / umas. → <b>um mapa</b>.","topic":"ART","pts":5},{"type":"mc","ask":"Complete with the indefinite article (um, uma, uns, umas).","prompt":"___ cães","options":["uns","um","uma","umas"],"explain":"<i>cão</i> is masculine, and here it's plural. Indefinite articles: um / uma / uns / umas. → <b>uns cães</b>.","topic":"ART","pts":4},{"type":"text","ask":"Type the present tense of abrir.","prompt":"Tu ___ a janela. <small>(abrir)</small>","accept":["abres"],"explain":"<b>abrir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. tu → <b>abres</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":6},{"type":"text","ask":"Type the present tense of trabalhar.","prompt":"Você ___ em Coimbra. <small>(trabalhar)</small>","accept":["trabalha"],"explain":"<b>trabalhar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. ele/ela/você → <b>trabalha</b>.","topic":"VERB","pts":5},{"type":"text","ask":"Type the present tense of decidir.","prompt":"Nós ___ hoje. <small>(decidir)</small>","explain":"<b>decidir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. nós → <b>decidimos</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","accept":["decidimos"],"pts":8},{"type":"text","ask":"Type the present tense of abrir.","prompt":"Nós ___ a janela. <small>(abrir)</small>","explain":"<b>abrir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. nós → <b>abrimos</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","accept":["abrimos"],"pts":8},{"type":"mc","ask":"Complete with the present tense of beber.","prompt":"Tu ___ café de manhã. <small>(beber)</small>","options":["bebes","bebas","bebo","bebe"],"explain":"<b>beber</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. tu → <b>bebes</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":4},{"type":"mc","ask":"Complete with the present tense of viver.","prompt":"O João ___ no Porto. <small>(viver)</small>","options":["vive","viva","vivo","vives"],"explain":"<b>viver</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. ele/ela/você → <b>vive</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":2},{"type":"mc","ask":"What is the infinitive?","prompt":"Nós bebemos café. → ___","options":["beber","bebir","bebar","bebemos"],"explain":"<i>Bebemos</i> ends in <i>-emos</i>, the nós ending of <b>-er</b> verbs: the infinitive is <b>beber</b>.","topic":"VERB","pts":2}],[{"type":"mc","ask":"Look at the clock. How do you greet someone at this time?","prompt":"___","options":["Bom dia!","Boa tarde!","Boa noite!","Até logo!"],"explain":"10:30 is still morning, so the greeting is <b>Bom dia!</b>. <i>Bom dia</i> = morning, <i>Boa tarde</i> = afternoon, <i>Boa noite</i> = evening and night (also used to say goodbye at night).","img":"<svg viewBox=\"0 0 225 120\" role=\"img\" aria-label=\"Digital clock showing 10:30\"><rect x=\"10\" y=\"22\" width=\"150\" height=\"76\" rx=\"10\" fill=\"#1E2430\"/><rect x=\"18\" y=\"30\" width=\"134\" height=\"60\" rx=\"5\" fill=\"#0D1118\"/><text x=\"85\" y=\"76\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"38\" font-weight=\"700\" fill=\"#F5B83D\">10:30</text><g transform=\"translate(190 64)\"><circle r=\"16\" fill=\"#F5B83D\"/><g stroke=\"#F5B83D\" stroke-width=\"4\" stroke-linecap=\"round\"><line y1=\"-24\" y2=\"-31\"/><line y1=\"24\" y2=\"31\"/><line x1=\"-24\" x2=\"-31\"/><line x1=\"24\" x2=\"31\"/><line x1=\"17\" y1=\"-17\" x2=\"22\" y2=\"-22\"/><line x1=\"-17\" y1=\"-17\" x2=\"-22\" y2=\"-22\"/><line x1=\"17\" y1=\"17\" x2=\"22\" y2=\"22\"/><line x1=\"-17\" y1=\"17\" x2=\"-22\" y2=\"22\"/></g></g></svg>","topic":"U1","pts":2},{"type":"text","ask":"Type the correct form of ser (subject: tu).","prompt":"___ a Teresa? <small>(tu)</small>","accept":["És"],"explain":"Verb <i>ser</i>, singular: eu <b>sou</b>, tu <b>és</b>, você/ele/ela <b>é</b>. With <i>tu</i> the form is <b>És</b>, and the accent is required.","topic":"U1","pts":4},{"type":"text","ask":"Complete the yes/no question (tu). Type the answer.","prompt":"___ Rita?","explain":"A yes/no question has no question word, so the pronoun stays <b>after</b> the verb: <b>Chamas-te Rita?</b> Only words like <i>como</i>, <i>quem</i>, <i>onde</i> pull the pronoun in front.","topic":"U1","accept":["Chamas-te"],"pts":5},{"type":"mc","ask":"Someone says “Muito prazer!” to you. What is the natural reply?","prompt":"A: Muito prazer! &nbsp;B: ___","options":["Muito prazer!","De nada!","Até já!","Bom dia!"],"explain":"When you are introduced, both people say <b>Muito prazer!</b> (or <i>Muito gosto!</i>). <i>De nada</i> is the answer to <i>obrigado</i>.","topic":"U1","pts":2},{"type":"mc","ask":"Complete with the definite article.","prompt":"Sou ___ Inês.","options":["a","o","um","(nothing)"],"explain":"European Portuguese often uses the definite article before first names: <i>o Pedro</i>, <b>a Inês</b>. Inês is a woman's name, so the article is <b>a</b>.","topic":"U1","pts":1},{"type":"mc","ask":"Choose the natural reply.","prompt":"A: Olá, Joana! Tudo bem? &nbsp;B: ___","options":["Tudo bem, obrigada.","Muito prazer, senhor.","Boa noite, adeus.","Sou de Lisboa."],"explain":"<i>Tudo bem?</i> is answered with <b>Tudo bem, obrigada</b> (Joana is a woman, so <i>obrigada</i>).","topic":"U1","pts":1},{"type":"mc","ask":"Which country does this flag belong to?","prompt":"___","options":["Polónia","Rússia","Ucrânia","Alemanha"],"explain":"White over red: <b>a Polónia</b> (European Portuguese spelling; Brazil writes <i>Polônia</i>). Nationality: polaco.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"10\" fill=\"#F7F7F2\"/><rect y=\"10\" width=\"30\" height=\"10\" fill=\"#DC143C\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U2","pts":2},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"Manila é ___ Filipinas.","explain":"<i>Em</i> shows location. The country is <i>as Filipinas</i>, so the preposition merges with the article: em + as = <b>nas</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","accept":["nas"],"pts":8},{"type":"mc","ask":"Complete with em, no, na, nos or nas.","prompt":"Casablanca é ___ Marrocos.","options":["em","no","na","nos"],"explain":"<i>Em</i> shows location. <b>Marrocos</b> takes no article, so the preposition stays as it is: <b>em Marrocos</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","pts":4},{"type":"mc","ask":"Complete with de, do, da, dos or das.","prompt":"A Wei é ___ China.","options":["da","de","do","dos"],"explain":"<i>De</i> shows origin. The country is <i>a China</i>, so the preposition merges with the article: de + a = <b>da</b>.","topic":"U2","pts":2},{"type":"mc","ask":"True or false?","prompt":"Varsóvia é na Ucrânia.","options":["Falso","Verdadeiro"],"explain":"False. <b>Varsóvia</b> (Warsaw) is in Poland: <i>Varsóvia é na <b>Polónia</b></i>.","fixed":true,"topic":"U2","pts":2},{"type":"mc","ask":"True or false?","prompt":"Deli é no México.","options":["Falso","Verdadeiro"],"explain":"False. <b>Deli</b> (Delhi) is in India: <i>Deli é na Índia</i>. <i>A Índia</i> is feminine, so em + a = <b>na</b>.","fixed":true,"topic":"U2","pts":1},{"type":"mc","ask":"Read the house number on the tile plate.","prompt":"Número ___","options":["oitocentos e vinte e oito","oitocentos e oitenta e dois","duzentos e oitenta e oito","oito centos e vinte e oito"],"explain":"828 = <b>oitocentos e vinte e oito</b>. 800 is one word: <i>oitocentos</i>.","img":"<svg viewBox=\"0 0 200 130\" role=\"img\" aria-label=\"Blue-and-white tile house-number plate showing 828\"><rect x=\"8\" y=\"8\" width=\"184\" height=\"114\" rx=\"4\" fill=\"#F7F6F0\" stroke=\"#1F4E9C\" stroke-width=\"6\"/><rect x=\"20\" y=\"20\" width=\"160\" height=\"90\" fill=\"none\" stroke=\"#1F4E9C\" stroke-width=\"2\"/><g fill=\"#1F4E9C\"><path d=\"M20 20h18L20 38Z\"/><path d=\"M180 20h-18l18 18Z\"/><path d=\"M20 110h18L20 92Z\"/><path d=\"M180 110h-18l18-18Z\"/></g><text x=\"100\" y=\"86\" text-anchor=\"middle\" font-family=\"Georgia, serif\" font-size=\"54\" font-weight=\"700\" fill=\"#1F4E9C\">828</text></svg>","topic":"NUM","pts":7},{"type":"mc","ask":"Which number is this?","prompt":"quatrocentos e dezanove = ___","options":["419","490","409","914"],"explain":"<i>quatrocentos e dezanove</i> = <b>419</b>. Read it part by part, separated by <i>e</i>.","topic":"NUM","pts":5},{"type":"mc","ask":"How is this number written?","prompt":"60 = ___","options":["sessenta","setenta","dezasseis","seis"],"explain":"60 = <b>sessenta</b>. Each part is joined with <b>e</b>: hundreds <i>e</i> tens <i>e</i> units. Don't confuse <i>setenta</i> (70) and <i>dezasseis</i> (16).","topic":"NUM","pts":2},{"type":"mc","ask":"How is this numb
