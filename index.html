uns, umas).","prompt":"___ paredes","options":["umas","um","uma","uns"],"explain":"<i>parede</i> is feminine (nouns in -e can be either gender), and here it's plural. Indefinite articles: um / uma / uns / umas. → <b>umas paredes</b>.","topic":"ART","pts":4},{"type":"mc","ask":"Complete with the indefinite article (um, uma, uns, umas).","prompt":"___ dicionários","options":["uns","um","uma","umas"],"explain":"<i>dicionário</i> is masculine, and here it's plural. Indefinite articles: um / uma / uns / umas. → <b>uns dicionários</b>.","topic":"ART","pts":2},{"type":"text","ask":"Type the present tense of morar.","prompt":"Nós ___ em Lisboa. <small>(morar)</small>","accept":["moramos"],"explain":"<b>morar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. nós → <b>moramos</b>.","topic":"VERB","pts":8},{"type":"text","ask":"Type the present tense of vender.","prompt":"Você ___ livros. <small>(vender)</small>","accept":["vende"],"explain":"<b>vender</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. ele/ela/você → <b>vende</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":5},{"type":"mc","ask":"Complete with the present tense of beber.","prompt":"Nós ___ café de manhã. <small>(beber)</small>","options":["bebemos","bebamos","bebimos","bebo"],"explain":"<b>beber</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. nós → <b>bebemos</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":7},{"type":"mc","ask":"Complete with the present tense of comprar.","prompt":"Vocês ___ o jornal. <small>(comprar)</small>","options":["compram","comprem","compro","compras"],"explain":"<b>comprar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. eles/elas/vocês → <b>compram</b>.","topic":"VERB","pts":4},{"type":"mc","ask":"Complete with the present tense of partir.","prompt":"Vocês ___ para Paris amanhã. <small>(partir)</small>","options":["partem","partam","parto","partes"],"explain":"<b>partir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. eles/elas/vocês → <b>partem</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":4},{"type":"mc","ask":"Which ending does nós take for -ir verbs?","prompt":"partir → nós part___","options":["-imos","-emos","-amos","-em"],"explain":"-ar → <i>-amos</i> (falamos), -er → <i>-emos</i> (comemos), -ir → <b>-imos</b> (partimos).","topic":"VERB","pts":2},{"type":"mc","ask":"Complete with the present tense of estudar.","prompt":"Eu ___ português todos os dias. <small>(estudar)</small>","options":["estudo","estudas","estuda","estudamos"],"explain":"<b>estudar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. eu → <b>estudo</b>.","topic":"VERB","pts":1}],[{"type":"mc","ask":"Look at the clock. How do you greet someone at this time?","prompt":"___","options":["Boa tarde!","Bom dia!","Boa noite!","Até logo!"],"explain":"15:00 is afternoon, so the greeting is <b>Boa tarde!</b>. <i>Bom dia</i> = morning, <i>Boa tarde</i> = afternoon, <i>Boa noite</i> = evening and night (also used to say goodbye at night).","img":"<svg viewBox=\"0 0 225 120\" role=\"img\" aria-label=\"Digital clock showing 15:00\"><rect x=\"10\" y=\"22\" width=\"150\" height=\"76\" rx=\"10\" fill=\"#1E2430\"/><rect x=\"18\" y=\"30\" width=\"134\" height=\"60\" rx=\"5\" fill=\"#0D1118\"/><text x=\"85\" y=\"76\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"38\" font-weight=\"700\" fill=\"#F5B83D\">15:00</text><g transform=\"translate(190 64)\"><circle r=\"16\" fill=\"#F5B83D\"/><g stroke=\"#F5B83D\" stroke-width=\"4\" stroke-linecap=\"round\"><line y1=\"-24\" y2=\"-31\"/><line y1=\"24\" y2=\"31\"/><line x1=\"-24\" x2=\"-31\"/><line x1=\"24\" x2=\"31\"/><line x1=\"17\" y1=\"-17\" x2=\"22\" y2=\"-22\"/><line x1=\"-17\" y1=\"-17\" x2=\"-22\" y2=\"-22\"/><line x1=\"17\" y1=\"17\" x2=\"22\" y2=\"22\"/><line x1=\"-17\" y1=\"17\" x2=\"-22\" y2=\"22\"/></g></g></svg>","topic":"U1","pts":1},{"type":"mc","ask":"Complete the negative sentence.","prompt":"A Ana não ___ Maria.","options":["se chama","chama-se","chama-te","se chamo"],"explain":"<b>Não</b> pulls the pronoun in front of the verb, just like question words do: <b>A Ana não se chama Maria.</b> In the affirmative it would be <i>A Ana chama-se Ana</i>.","topic":"U1","pts":9},{"type":"mc","ask":"Complete with the verb chamar-se.","prompt":"Eu ___ Pedro.","options":["chamo-me","me chamo","chama-se","chamas-te"],"explain":"With <i>eu</i> the form is <b>chamo-me</b>. In an ordinary affirmative sentence European Portuguese puts the pronoun after the verb. <i>Me chamo</i> at the start of a sentence is Brazilian usage.","topic":"U1","pts":3},{"type":"mc","ask":"Which greeting is formal?","prompt":"Formal or informal?","options":["Bom dia! Como está?","Olá, Joana! Tudo bem?","Olá! Como te chamas?","Tudo bem?"],"explain":"<b>Como está?</b> uses the 3rd-person form (você / o senhor / a senhora), the polite way to address someone. <i>Tudo bem?</i> and the <i>tu</i> form are informal.","topic":"U1","pts":1},{"type":"mc","ask":"Which day comes before segunda-feira?","prompt":"Antes de segunda-feira é ___.","options":["domingo","sábado","terça-feira","sexta-feira"],"explain":"The week starts on <i>segunda-feira</i> (Monday), so the day before is <b>domingo</b> (Sunday).","topic":"U1","pts":1},{"type":"mc","ask":"Complete with the verb ser.","prompt":"Eu ___ o Pedro.","options":["sou","é","és","estou"],"explain":"With <i>eu</i>, <i>ser</i> is <b>sou</b>: <i>Sou o Pedro</i>. Identity always uses <i>ser</i>.","topic":"U1","pts":1},{"type":"mc","ask":"Which country does this flag belong to?","prompt":"___","options":["Suécia","Finlândia","Ucrânia","Grécia"],"explain":"Blue with a yellow cross: <b>a Suécia</b> (Sweden). Finland has the same cross shape but white with a blue cross.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"20\" fill=\"#006AA7\"/><rect x=\"8.5\" width=\"4\" height=\"20\" fill=\"#FECC00\"/><rect y=\"8\" width=\"30\" height=\"4\" fill=\"#FECC00\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U2","pts":1},{"type":"mc","ask":"Which country does this flag belong to?","prompt":"___","options":["Japão","China","Polónia","Suécia"],"explain":"A red circle on white: <b>o Japão</b> → japonês/japonesa.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"20\" fill=\"#F7F7F2\"/><circle cx=\"15\" cy=\"10\" r=\"6\" fill=\"#BC002D\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U2","pts":1},{"type":"text","ask":"Type de / do / da / dos / das.","prompt":"O Mark é ___ Estados Unidos.","accept":["dos"],"explain":"<i>De</i> shows origin. The country is <i>os Estados Unidos</i>, so the preposition merges with the article: de + os = <b>dos</b>.","topic":"U2","pts":5},{"type":"mc","ask":"Complete with de, do, da, dos or das.","prompt":"A Luena é ___ Angola.","options":["de","do","da","dos"],"explain":"<i>De</i> shows origin. <b>Angola</b> takes no article, so the preposition stays as it is: <b>de Angola</b>.","topic":"U2","pts":4},{"type":"mc","ask":"Complete with de, do, da, dos or das.","prompt":"A Wilma é ___ Suécia.","options":["da","de","do","dos"],"explain":"<i>De</i> shows origin. The country is <i>a Suécia</i>, so the preposition merges with the article: de + a = <b>da</b>.","topic":"U2","pts":3},{"type":"mc","ask":"Complete with em, no, na, nos or nas.","prompt":"O Rio de Janeiro é ___ Brasil.","options":["no","em","na","nos"],"explain":"<i>Em</i> shows location. The country is <i>o Brasil</i>, so the preposition merges with the article: em + o = <b>no</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","pts":3},{"type":"text","ask":"Do the sum and write the result in words.","prompt":"125 + 250 = ___","accept":["trezentos e setenta e cinco"],"explain":"125 + 250 = 375 → <b>trezentos e setenta e cinco</b>. Each part is joined with <b>e</b>: hundreds <i>e</i> tens <i>e</i> units.","topic":"NUM","pts":10},{"type":"mc","ask":"How is this number written?","prompt":"101 = ___","options":["cento e um","cem e um","um cento e um","cento e dez"],"explain":"<b>Cento e um</b>. Exactly 100 is <i>cem</i>, but as soon as something follows it becomes <i>cento</i>: 101 cento e um, 150 cento e cinquenta.","topic":"NUM","pts":5},{"type":"mc","ask":"How is this number written?","prompt":"500 = ___","options":["quinhentos","cinco centos","cincocentos","cinquenta"],"explain":"500 is irregular: <b>quinhentos</b>. Other irregular hundreds: duzentos, trezentos, seiscentos.","topic":"NUM","pts":4},{"type":"mc","ask":"Which number is this?","prompt":"oitenta e seis = ___","options":["86","68","96","76"],"explain":"<i>oitenta e seis</i> = <b>86</b>. Read it part by part, separated by <i>e</i>.","topic":"NUM","pts":3},{"type":"text","ask":"Type the nationality in the correct form.","prompt":"O Lars e a Ingrid são da Suécia. Eles são ___.","accept":["suecos"],"explain":"Suécia → sueco / sueca / suecos / suecas (m. / f. / m. pl. / f. pl.). Here it's a group of men or a mixed group → masculine plural: <b>suecos</b>.","topic":"NAT","pts":7},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"A Inês e a Joana são de Portugal. Elas são ___.","options":["portuguesas","português","portuguesa","portugueses"],"explain":"Portugal → português / portuguesa / portugueses / portuguesas (m. / f. / m. pl. / f. pl.). Here it's only women → feminine plural: <b>portuguesas</b>.","topic":"NAT","pts":5},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"A Amina é de Marrocos. Ela é ___.","options":["marroquina","marroquino","marroquinos","marroquinas"],"explain":"Marrocos → marroquino / marroquina / marroquinos / marroquinas (m. / f. / m. pl. / f. pl.). Here it's one woman → feminine singular: <b>marroquina</b>.","topic":"NAT","pts":4},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"O Raj é da Índia. Ele é ___.","options":["indiano","indiana","indianos","indianas"],"explain":"Índia → indiano / indiana / indianos / indianas (m. / f. / m. pl. / f. pl.). Here it's one man → masculine singular: <b>indiano</b>.","topic":"NAT","pts":1},{"type":"multi","nRight":3,"ask":"Select ALL the colours you see on this flag.","prompt":"A bandeira da Itália é…","options":["verde","branco","vermelho","azul","amarelo","preto"],"explain":"The Italian flag is <b>verde, branco e vermelho</b>. In a sentence the colours agree with <i>a bandeira</i>: <i>verde, branca e vermelha</i>.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"Flag of Italy\"><rect width=\"10\" height=\"20\" fill=\"#009246\"/><rect x=\"10\" width=\"10\" height=\"20\" fill=\"#F7F7F2\"/><rect x=\"20\" width=\"10\" height=\"20\" fill=\"#CE2B37\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U4","pts":4},{"type":"mc","ask":"Look at the picture and complete with the colour.","prompt":"A porta é ___.","options":["preta","preto","pretos","pretas"],"explain":"The colour is black. Colours ending in <i>-o</i> agree in gender and number: preto, preta, pretos, pretas. So: <b>A porta é preta.</b>","img":"<svg viewBox=\"0 0 120 160\" role=\"img\" aria-label=\"black porta\"><rect x=\"14\" y=\"6\" width=\"92\" height=\"150\" fill=\"#C9CFCC\"/><rect x=\"22\" y=\"14\" width=\"76\" height=\"142\" fill=\"#1B1B1B\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"31\" y=\"25\" width=\"58\" height=\"48\" fill=\"none\" stroke=\"#2A2A2A\" stroke-opacity=\".4\" stroke-width=\"3\"/><rect x=\"31\" y=\"86\" width=\"58\" height=\"56\" fill=\"none\" stroke=\"#2A2A2A\" stroke-opacity=\".4\" stroke-width=\"3\"/><circle cx=\"86\" cy=\"82\" r=\"4.5\" fill=\"#C9A55A\" stroke=\"#2A2A2A\"/></svg>","topic":"U4","pts":4},{"type":"mc","ask":"What is this?","prompt":"O que é isto? ___","options":["É uma janela.","É um janela.","É um relógio.","É uma mesa."],"explain":"It's a window: <b>uma janela</b>. It is feminine, so it takes <i>uma</i>.","img":"<svg viewBox=\"0 0 140 140\" role=\"img\" aria-label=\"window\"><rect x=\"14\" y=\"14\" width=\"112\" height=\"112\" fill=\"#BFE0F5\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><circle cx=\"96\" cy=\"44\" r=\"12\" fill=\"#F5D36B\"/><path d=\"M14 104c30-22 60-22 112 0v22H14Z\" fill=\"#8CC08A\"/><rect x=\"14\" y=\"14\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#F2EFE6\" stroke-width=\"10\"/><rect x=\"65\" y=\"14\" width=\"10\" height=\"112\" fill=\"#F2EFE6\"/><rect x=\"14\" y=\"65\" width=\"112\" height=\"10\" fill=\"#F2EFE6\"/><rect x=\"9\" y=\"9\" width=\"122\" height=\"122\" fill=\"none\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/></svg>","topic":"U4","pts":3},{"type":"mc","ask":"Choose the plural.","prompt":"um avião → dois ___","options":["aviões","aviãos","aviães","aviãs"],"explain":"<i>Avião</i> → <b>aviões</b>. Words in <i>-ão</i> have three plural types (<i>mãos, cães, aviões</i>) and must be learned one by one.","topic":"U4","pts":5},{"type":"mc","ask":"The teacher says: “Fechem os livros.” What do you do?","prompt":"Fechem os livros.","options":["Close the books","Open the books","Read the text","Work in pairs"],"explain":"<b>Fechar</b> = to close. Compare <i>Abram os livros</i> (open), <i>Leiam o texto</i> (read), <i>Trabalhem em pares</i> (work in pairs).","topic":"U4","pts":1},{"type":"mc","ask":"In which word is the underlined o NOT pronounced [u]?","prompt":"The letter <span class='blank' style='min-width:1.4em'>o</span>","options":["<b>o</b>ito","quatr<b>o</b>","sábad<b>o</b>","cinc<b>o</b>"],"explain":"Unstressed final <i>-o</i> is reduced to [u]: <i>quatro, sábado, cinco</i>. In <b>oito</b> the o is stressed and part of the diphthong <i>oi</i>, so it stays [o].","topic":"PRON","pts":5},{"type":"mc","ask":"Which word means “German woman”?","prompt":"alemão / alemã","options":["alemã","alemão","both","neither"],"explain":"<b>Alemã</b> [ɐlɨˈmɐ̃] ends in a single nasal vowel and is feminine. <i>Alemão</i> ends in the nasal diphthong [ɐ̃w] and is masculine.","topic":"PRON","pts":3},{"type":"multi","nRight":3,"ask":"Select ALL the sentences where SER is the right verb.","prompt":"___","options":["___ do Japão. → Sou","Hoje ___ sexta-feira. → É","O Porto ___ no norte de Portugal. → É","___ em casa agora. → Estou","Como ___? → Estás","A porta ___ aberta. → Está"],"explain":"<b>Ser</b>: origin (<i>Sou do Japão</i>), days (<i>Hoje é sexta-feira</i>), geographic location (<i>O Porto é no norte</i>). <b>Estar</b>: where you are now, how you are, the current condition of an object.","topic":"SE","pts":7},{"type":"text","ask":"Type the correct form of ser or estar.","prompt":"O Pedro ___ alto.","accept":["é"],"explain":"Use <b>ser</b>: it's a lasting characteristic (colour, size, personality). With <i>ele/ela/você</i> → <b>é</b>. (<i>está</i> would describe a temporary state or location.)","topic":"SE","pts":4},{"type":"mc","ask":"Ser or estar?","prompt":"O café ___ frio.","options":["está","é","estou","somos"],"explain":"Use <b>estar</b>: it's the current condition of something (open/closed, hot/cold). With <i>ele/ela/você</i> → <b>está</b>. (<i>é</i> would describe a permanent characteristic.)","topic":"SE","pts":5},{"type":"mc","ask":"What is the difference?","prompt":"Sou de Londres. / Estou em Londres.","options":["I'm from London. / I'm in London (now).","I'm in London. / I'm from London.","Both mean “I live in London.”","Both mean “I'm from London.”"],"explain":"<b>Ser de</b> = origin (permanent). <b>Estar em</b> = where you are at the moment (temporary).","topic":"SE","pts":5},{"type":"mc","ask":"Ser or estar?","prompt":"O João ___ no escritório agora.","options":["está","é","estás","são"],"explain":"Use <b>estar</b>: it's where a person is <b>right now</b> (temporary location). With <i>ele/ela/você</i> → <b>está</b>. (<i>é</i> would describe a permanent characteristic.)","topic":"SE","pts":4},{"type":"mc","ask":"Ser or estar?","prompt":"Eu ___ muito bem, obrigado.","options":["estou","sou","estás","somos"],"explain":"Use <b>estar</b>: it's a temporary state or feeling that can change soon. With <i>eu</i> → <b>estou</b>. (<i>sou</i> would describe a permanent characteristic.)","topic":"SE","pts":3},{"type":"text","ask":"Type the correct form of ficar (to stay).","prompt":"Nós ___ aqui mais um dia.","accept":["ficamos"],"explain":"Here <i>ficar</i> means <b>to stay</b>. It's a regular -ar verb: fico, ficas, fica, ficamos, ficam. With <i>nós</i> → <b>ficamos</b>.","topic":"FIC","pts":9},{"type":"mc","ask":"Complete with ficar.","prompt":"Lisboa e o Porto ___ em Portugal.","options":["ficam","fica","ficamos","estão"],"explain":"Two cities = plural subject → <b>ficam</b>. Location of places: <i>ficar</i> or <i>ser</i>, not <i>estar</i>.","topic":"FIC","pts":5},{"type":"mc","ask":"Complete with ficar (to stay).","prompt":"Elas ___ em Coimbra uma semana.","options":["ficam","ficas","fica","ficão"],"explain":"Here <i>ficar</i> means <b>to stay</b>. It's a regular -ar verb: fico, ficas, fica, ficamos, ficam. With <i>eles/elas/vocês</i> → <b>ficam</b>.","topic":"FIC","pts":4},{"type":"mc","ask":"What does it mean?","prompt":"Fico em casa hoje.","options":["I'm staying at home today.","I live at home.","I'm going home today.","My house is here."],"explain":"<b>Ficar</b> + place = to <b>stay</b> somewhere: <i>Fico em casa</i> = I'm staying at home. “I live” is <i>moro</i>.","topic":"FIC","pts":3},{"type":"text","ask":"Type the definite (o/a/os/as) article.","prompt":"___ mãos","accept":["as"],"explain":"<i>mão</i> is feminine even though it ends in -ão, and here it's plural. Definite articles: o / a / os / as. → <b>as mãos</b>.","topic":"ART","pts":5},{"type":"mc","ask":"Make it plural.","prompt":"uma viagem → ___","options":["umas viagens","umas viagems","uns viagens","umas viagem"],"explain":"Nouns in <i>-m</i> change to <b>-ns</b>: viagem → viagens. <i>Viagem</i> is feminine: <b>umas viagens</b>.","topic":"ART","pts":7},{"type":"mc","ask":"Complete with the definite article (o, a, os, as).","prompt":"___ mapas","options":["os","o","a","as"],"explain":"<i>mapa</i> is masculine even though it ends in -a, and here it's plural. Definite articles: o / a / os / as. → <b>os mapas</b>.","topic":"ART","pts":5},{"type":"mc","ask":"Complete the sentences.","prompt":"Lisboa é ___ cidade bonita. ___ cidade fica em Portugal.","options":["uma / A","a / Uma","um / O","uma / Uma"],"explain":"<i>Cidade</i> is feminine. Describing it as one of many → <b>uma</b> cidade bonita; then the specific city we're talking about → <b>A</b> cidade.","topic":"ART","pts":5},{"type":"mc","ask":"Complete with the definite article (o, a, os, as).","prompt":"___ cidades","options":["as","o","a","os"],"explain":"<i>cidade</i> is feminine (nouns in -dade are feminine), and here it's plural. Definite articles: o / a / os / as. → <b>as cidades</b>.","topic":"ART","pts":3},{"type":"mc","ask":"Complete with the indefinite article (um, uma, uns, umas).","prompt":"___ cidade","options":["uma","um","uns","umas"],"explain":"<i>cidade</i> is feminine (nouns in -dade are feminine). Indefinite articles: um / uma / uns / umas. → <b>uma cidade</b>.","topic":"ART","pts":2},{"type":"multi","nRight":3,"ask":"Select ALL the -ER verbs.","prompt":"-er","options":["comer","beber","viver","abrir","falar","partir"],"explain":"-er verbs: <b>comer, beber, viver</b>. <i>Abrir</i> and <i>partir</i> are -ir; <i>falar</i> is -ar.","topic":"VERB","pts":2},{"type":"text","ask":"Type the present tense of dividir.","prompt":"A Ana e o Rui ___ a pizza. <small>(dividir)</small>","accept":["dividem"],"explain":"<b>dividir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. eles/elas/vocês → <b>dividem</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":7},{"type":"text","ask":"Type the present tense of comer.","prompt":"Eu ___ peixe ao jantar. <small>(comer)</small>","accept":["como"],"explain":"<b>comer</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. eu → <b>como</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":4},{"type":"mc","ask":"Which sentence has a mistake?","prompt":"Find the error","options":["Nós vivimos em Lisboa.","Eles abrem a porta.","Tu escreves bem.","Eu falo inglês."],"explain":"<i>Viver</i> is an <b>-er</b> verb, so nós → <b>vivemos</b>, not <i>vivimos</i> (that ending belongs to -ir verbs like <i>partimos</i>).","topic":"VERB","pts":7},{"type":"mc","ask":"Complete with the present tense of escrever.","prompt":"Eles ___ um email. <small>(escrever)</small>","options":["escrevem","escrevam","escrevo","escreves"],"explain":"<b>escrever</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. eles/elas/vocês → <b>escrevem</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":4},{"type":"mc","ask":"Complete with the present tense of partir.","prompt":"A Rita ___ para Paris amanhã. <small>(partir)</small>","options":["parte","parta","parto","partes"],"explain":"<b>partir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. ele/ela/você → <b>parte</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":2},{"type":"mc","ask":"Complete with the present tense of falar.","prompt":"Eu ___ português e inglês. <small>(falar)</small>","options":["falo","falas","fala","falamos"],"explain":"<b>falar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. eu → <b>falo</b>.","topic":"VERB","pts":1}],[{"type":"mc","ask":"Look at the clock. How do you greet someone at this time?","prompt":"___","options":["Boa tarde!","Bom dia!","Boa noite!","Até logo!"],"explain":"17:00 is late afternoon, before dark, so the greeting is <b>Boa tarde!</b>. <i>Bom dia</i> = morning, <i>Boa tarde</i> = afternoon, <i>Boa noite</i> = evening and night (also used to say goodbye at night).","img":"<svg viewBox=\"0 0 225 120\" role=\"img\" aria-label=\"Digital clock showing 17:00\"><rect x=\"10\" y=\"22\" width=\"150\" height=\"76\" rx=\"10\" fill=\"#1E2430\"/><rect x=\"18\" y=\"30\" width=\"134\" height=\"60\" rx=\"5\" fill=\"#0D1118\"/><text x=\"85\" y=\"76\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"38\" font-weight=\"700\" fill=\"#F5B83D\">17:00</text><g transform=\"translate(190 64)\"><circle r=\"16\" fill=\"#F5B83D\"/><g stroke=\"#F5B83D\" stroke-width=\"4\" stroke-linecap=\"round\"><line y1=\"-24\" y2=\"-31\"/><line y1=\"24\" y2=\"31\"/><line x1=\"-24\" x2=\"-31\"/><line x1=\"24\" x2=\"31\"/><line x1=\"17\" y1=\"-17\" x2=\"22\" y2=\"-22\"/><line x1=\"-17\" y1=\"-17\" x2=\"-22\" y2=\"-22\"/><line x1=\"17\" y1=\"17\" x2=\"22\" y2=\"22\"/><line x1=\"-17\" y1=\"17\" x2=\"-22\" y2=\"22\"/></g></g></svg>","topic":"U1","pts":2},{"type":"mc","ask":"Choose the correct informal question (tu).","prompt":"“What's your name?”","options":["Como te chamas?","Como chamas-te?","Como se chamas?","Como chamas?"],"explain":"After a question word like <i>como</i>, the pronoun comes <b>before</b> the verb: <b>Como te chamas?</b> The pronoun matches the person: <i>tu</i> → <b>te</b> + <i>chamas</i>.","topic":"U1","pts":5},{"type":"mc","ask":"You welcome Maria at the airport.","prompt":"Bem-___ a Lisboa, Maria!","options":["vinda","vindo","vindos","vindas"],"explain":"<i>Bem-vindo</i> agrees with the person being welcomed. Maria is one woman: <b>Bem-vinda!</b> (a man: <i>bem-vindo</i>; a group: <i>bem-vindos</i>).","topic":"U1","pts":4},{"type":"mc","ask":"A man answers the formal question “Como está?”.","prompt":"A: Bom dia! Como está? &nbsp;B: ___","options":["Bem, obrigado. E a senhora?","Bem, obrigada. E tu?","Sou o Paulo.","Tudo bem, e tu?"],"explain":"A man says <b>obrigado</b>, and he keeps the formal register: <b>E a senhora?</b> (to a woman). <i>E tu?</i> would be informal.","topic":"U1","pts":3},{"type":"mc","ask":"What is quarta-feira in English?","prompt":"quarta-feira = ___","options":["Wednesday","Thursday","Tuesday","Friday"],"explain":"<b>Quarta-feira</b> = Wednesday (the 4th day counting from Sunday). Tuesday is <i>terça-feira</i> and Thursday is <i>quinta-feira</i>.","topic":"U1","pts":1},{"type":"mc","ask":"Which day comes after quinta-feira?","prompt":"Depois de quinta-feira é ___.","options":["sexta-feira","quarta-feira","sábado","terça-feira"],"explain":"Portuguese weekdays are numbered: segunda (2nd), terça (3rd), quarta (4th), <i>quinta</i> (5th), <b>sexta-feira</b> (6th). Then <i>sábado</i> and <i>domingo</i>.","topic":"U1","pts":2},{"type":"mc","ask":"Which country does this flag belong to?","prompt":"___","options":["França","Itália","Irlanda","Rússia"],"explain":"The French flag has vertical stripes: blue, white, red. <b>França</b> → francês/francesa.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"10\" height=\"20\" fill=\"#0055A4\"/><rect x=\"10\" width=\"10\" height=\"20\" fill=\"#F7F7F2\"/><rect x=\"20\" width=\"10\" height=\"20\" fill=\"#EF4135\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U2","pts":2},{"type":"mc","ask":"Which country does this flag belong to?","prompt":"___","options":["Alemanha","Rússia","Polónia","Ucrânia"],"explain":"Horizontal black, red and gold stripes: <b>a Alemanha</b> (Germany) → alemão/alemã.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"7\" fill=\"#111\"/><rect y=\"6.67\" width=\"30\" height=\"6.67\" fill=\"#DD0000\"/><rect y=\"13.33\" width=\"30\" height=\"6.67\" fill=\"#FFCE00\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U2","pts":2},{"type":"text","ask":"Type de / do / da / dos / das.","prompt":"A Samantha é ___ Filipinas.","accept":["das"],"explain":"<i>De</i> shows origin. The country is <i>as Filipinas</i>, so the preposition merges with the article: de + as = <b>das</b>.","topic":"U2","pts":7},{"type":"mc","ask":"Complete with em, no, na, nos or nas.","prompt":"Coimbra é ___ Portugal.","options":["em","no","na","nos"],"explain":"<i>Em</i> shows location. <b>Portugal</b> takes no article, so the preposition stays as it is: <b>em Portugal</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","pts":4},{"type":"mc","ask":"Complete with de, do, da, dos or das.","prompt":"O Hiroto é ___ Japão.","options":["do","de","da","dos"],"explain":"<i>De</i> shows origin. The country is <i>o Japão</i>, so the preposition merges with the article: de + o = <b>do</b>.","topic":"U2","pts":2},{"type":"mc","ask":"Complete with em, no, na, nos or nas.","prompt":"Pequim é ___ China.","options":["na","em","no","nos"],"explain":"<i>Em</i> shows location. The country is <i>a China</i>, so the preposition merges with the article: em + a = <b>na</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","pts":2},{"type":"text","ask":"Do the sum and write the result in words.","prompt":"31 + 67 = ___","accept":["noventa e oito"],"explain":"31 + 67 = 98 → <b>noventa e oito</b>. Each part is joined with <b>e</b>: hundreds <i>e</i> tens <i>e</i> units.","topic":"NUM","pts":7},{"type":"mc","ask":"How is this number written?","prompt":"777 = ___","options":["setecentos e setenta e sete","setecentos e sessenta e sete","seiscentos e setenta e sete","setecentos setenta e sete"],"explain":"777 = <b>setecentos e setenta e sete</b>. Watch <i>setenta</i> (70) vs <i>sessenta</i> (60), and don't forget both <i>e</i>'s.","topic":"NUM","pts":7},{"type":"mc","ask":"How is this number written?","prompt":"100 = ___","options":["cem","cento","um cem","cento e zero"],"explain":"Exactly 100 is <b>cem</b>. <i>Cento</i> is used only when more follows: <i>cento e um</i>.","topic":"NUM","pts":4},{"type":"mc","ask":"How is this number written?","prompt":"70 = ___","options":["setenta","sessenta","dezassete","sete"],"explain":"70 = <b>setenta</b>. Each part is joined with <b>e</b>: hundreds <i>e</i> tens <i>e</i> units. Don't confuse <i>sessenta</i> (60) and <i>dezassete</i> (17).","topic":"NUM","pts":2},{"type":"text","ask":"Correct the error: “Eles são alemãs.”","prompt":"Eles são ___.","accept":["alemães"],"explain":"<i>Eles</i> is masculine plural, so: <b>alemães</b>. <i>Alemãs</i> is feminine plural (<i>Elas são alemãs</i>). Singular: alemão / alemã.","topic":"NAT","pts":8},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"O Ivan e a Oksana são da Ucrânia. Eles são ___.","options":["ucranianos","ucraniano","ucraniana","ucranianas"],"explain":"Ucrânia → ucraniano / ucraniana / ucranianos / ucranianas (m. / f. / m. pl. / f. pl.). Here it's a group of men or a mixed group → masculine plural: <b>ucranianos</b>.","topic":"NAT","pts":5},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"O Diego e o Luis são do México. Eles são ___.","options":["mexicanos","mexicano","mexicana","mexicanas"],"explain":"México → mexicano / mexicana / mexicanos / mexicanas (m. / f. / m. pl. / f. pl.). Here it's a group of men or a mixed group → masculine plural: <b>mexicanos</b>.","topic":"NAT","pts":4},{"type":"mc","ask":"Answer the question.","prompt":"Que língua falam os brasileiros? ___","options":["Falam português.","Falam brasileiro.","Falam espanhol.","Falam inglês."],"explain":"Brazilians speak <b>português</b>. <i>Brasileiro</i> is the nationality, not the language. Likewise Mexicans speak <i>espanhol</i> and Americans <i>inglês</i>.","topic":"NAT","pts":1},{"type":"mc","ask":"Look at the picture and complete with the colour.","prompt":"As mesas são ___.","options":["brancas","branco","branca","brancos"],"explain":"The colour is white. Colours ending in <i>-o</i> agree in gender and number: branco, branca, brancos, brancas. So: <b>As mesas são brancas.</b>","img":"<svg viewBox=\"0 0 330 125\" role=\"img\" aria-label=\"white mesas\"><g transform=\"translate(0 0) scale(1)\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"10\" y=\"34\" width=\"140\" height=\"16\" rx=\"3\"/><rect x=\"22\" y=\"50\" width=\"11\" height=\"70\"/><rect x=\"127\" y=\"50\" width=\"11\" height=\"70\"/></g><g transform=\"translate(170 0) scale(1)\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"10\" y=\"34\" width=\"140\" height=\"16\" rx=\"3\"/><rect x=\"22\" y=\"50\" width=\"11\" height=\"70\"/><rect x=\"127\" y=\"50\" width=\"11\" height=\"70\"/></g></svg>","topic":"U4","pts":5},{"type":"mc","ask":"What is this?","prompt":"O que é isto? ___","options":["É uma cadeira.","É um cadeira.","É uma mesa.","É um livro."],"explain":"It's a chair: <b>uma cadeira</b>. It is feminine, so it takes <i>uma</i>.","img":"<svg viewBox=\"0 0 120 140\" role=\"img\" aria-label=\"chair\"><g transform=\"translate(0 0) scale(1)\" fill=\"#7B4A26\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"30\" y=\"10\" width=\"60\" height=\"44\" rx=\"5\"/><rect x=\"30\" y=\"54\" width=\"8\" height=\"30\"/><rect x=\"82\" y=\"54\" width=\"8\" height=\"30\"/><path d=\"M22 84h76l-6 14H28Z\"/><rect x=\"28\" y=\"98\" width=\"8\" height=\"38\"/><rect x=\"84\" y=\"98\" width=\"8\" height=\"38\"/></g></svg>","topic":"U4","pts":2},{"type":"mc","ask":"What is this?","prompt":"O que é isto? ___","options":["É um livro.","É uma livro.","É uma janela.","É uma cadeira."],"explain":"It's a book: <b>um livro</b>. It is masculine, so it takes <i>um</i>.","img":"<svg viewBox=\"0 0 120 120\" role=\"img\" aria-label=\"book\"><g transform=\"translate(25 14) rotate(0)\"><rect x=\"0\" y=\"0\" width=\"70\" height=\"92\" rx=\"4\" fill=\"#7B4A26\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"8\" y=\"0\" width=\"5\" height=\"92\" fill=\"#2A2A2A\" opacity=\".25\"/><rect x=\"22\" y=\"22\" width=\"36\" height=\"12\" rx=\"2\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"1.5\"/></g></svg>","topic":"U4","pts":1},{"type":"text","ask":"Type the plural.","prompt":"um jornal → dois ___","accept":["jornais"],"explain":"Nouns ending in <i>-al</i> change to <b>-ais</b>: jornal → <b>jornais</b>.","topic":"U4","pts":5},{"type":"mc","ask":"You are holding a dictionary in your hand.","prompt":"___ é um dicionário chinês-português.","options":["Isto","Isso","Aquilo","Esse"],"explain":"The object is in <b>your</b> hand (near the speaker), so use <b>isto</b>.","topic":"U4","pts":4},{"type":"mc","ask":"How is the first s pronounced?","prompt":"e<b>s</b>tados","options":["[ʃ]","[s]","[z]","silent"],"explain":"<i>s</i> before a voiceless consonant (here <i>t</i>) sounds [ʃ]: e<b>s</b>tados, e<b>s</b>tá, E<b>s</b>panha.","topic":"PRON","pts":7},{"type":"mc","ask":"How do you turn “Ela é portuguesa.” into a yes/no question when speaking?","prompt":"Ela é portuguesa?","options":["Same words, rising intonation at the end","Put the verb first: É ela portuguesa?","Add “do” at the start","Add “não” at the end"],"explain":"Portuguese yes/no questions usually keep the same word order; only the <b>intonation</b> changes: it rises at the end.","topic":"PRON","pts":4},{"type":"multi","nRight":3,"ask":"Select ALL the sentences that are correct.","prompt":"Ser ou estar?","options":["Eu estou bem.","A Ana está em Roma.","Hamburgo é na Alemanha.","Eles estão gregos.","Lisboa está em Portugal.","Eu sou cansado hoje."],"explain":"Correct: <b>Eu estou bem</b> (temporary state), <b>A Ana está em Roma</b> (where she is now), <b>Hamburgo é na Alemanha</b> (permanent location). Nationality takes <i>ser</i> (<i>Eles são gregos</i>), cities don't move (<i>Lisboa é/fica em Portugal</i>), and tiredness is temporary (<i>Estou cansado</i>).","topic":"SE","pts":8},{"type":"mc","ask":"Ser or estar?","prompt":"Lisboa ___ em Portugal.","options":["é","está","és","estão"],"explain":"Use <b>ser</b>: the location of a place (city, country, monument) never changes. With <i>ele/ela/você</i> → <b>é</b>. (<i>está</i> would describe a temporary state or location.)","topic":"SE","pts":5},{"type":"mc","ask":"Ser or estar?","prompt":"Eles ___ contentes com o teste.","options":["estão","são","estás","somos"],"explain":"Use <b>estar</b>: it's a temporary state or feeling that can change soon. With <i>eles/elas/vocês</i> → <b>estão</b>. (<i>são</i> would describe a permanent characteristic.)","topic":"SE","pts":5},{"type":"mc","ask":"Ser or estar?","prompt":"Hoje ___ segunda-feira.","options":["é","está","sou","estamos"],"explain":"Use <b>ser</b>: days and dates use ser. With <i>ele/ela/você</i> → <b>é</b>. (<i>está</i> would describe a temporary state or location.)","topic":"SE","pts":4},{"type":"mc","ask":"Ser or estar?","prompt":"Como ___? <small>(tu)</small>","options":["estás","és","estamos","sou"],"explain":"Use <b>estar</b>: it's a temporary state or feeling that can change soon. With <i>tu</i> → <b>estás</b>. (<i>és</i> would describe a permanent characteristic.)","topic":"SE","pts":2},{"type":"mc","ask":"Ser or estar?","prompt":"Isto ___ um dicionário.","options":["é","está","somos","estou"],"explain":"Use <b>ser</b>: you are saying what or who something is. With <i>ele/ela/você</i> → <b>é</b>. (<i>está</i> would describe a temporary state or location.)","topic":"SE","pts":1},{"type":"text","ask":"Type the correct form of ficar (to stay).","prompt":"Vocês ___ para o jantar?","accept":["ficam"],"explain":"Here <i>ficar</i> means <b>to stay</b>. It's a regular -ar verb: fico, ficas, fica, ficamos, ficam. With <i>eles/elas/vocês</i> → <b>ficam</b>.","topic":"FIC","pts":7},{"type":"mc","ask":"You want to say: “I'm staying in Lisbon until Friday.”","prompt":"___","options":["Fico em Lisboa até sexta-feira.","Sou em Lisboa até sexta-feira.","Fica em Lisboa até sexta-feira.","Estou de Lisboa até sexta-feira."],"explain":"To stay = <b>ficar</b>, and with <i>eu</i> → <b>fico</b>. <i>Fica</i> is the 3rd person; <i>ser</i> can't express staying somewhere.","topic":"FIC","pts":5},{"type":"mc","ask":"Complete with ficar (to stay).","prompt":"O Pedro ___ em Lisboa três dias.","options":["fica","ficamos","ficam","ficão"],"explain":"Here <i>ficar</i> means <b>to stay</b>. It's a regular -ar verb: fico, ficas, fica, ficamos, ficam. With <i>ele/ela/você</i> → <b>fica</b>.","topic":"FIC","pts":2},{"type":"mc","ask":"Rewrite the sentence with ficar.","prompt":"Moscovo é na Rússia. → ___","options":["Moscovo fica na Rússia.","Moscovo ficam na Rússia.","Moscovo está na Rússia.","Moscovo fica da Rússia."],"explain":"For the location of places, <b>ser</b> and <b>ficar</b> are interchangeable: <i>Moscovo é / fica na Rússia</i>. <i>Estar</i> is not used for permanent locations.","topic":"FIC","pts":2},{"type":"multi","nRight":3,"ask":"Select ALL the nouns that take “umas”.","prompt":"umas ___","options":["cidades","mãos","paredes","mapas","dias","lápis"],"explain":"<i>Umas</i> = feminine plural: <b>umas cidades, umas mãos, umas paredes</b>. <i>Mapas, dias, lápis</i> are masculine → <i>uns</i>.","topic":"ART","pts":8},{"type":"mc","ask":"Make it plural.","prompt":"um jornal → ___","options":["uns jornais","uns jornals","umas jornais","um jornais"],"explain":"<i>-al</i> → <i>-ais</i>: jornal → jornais. <i>Um</i> → <b>uns</b>: <b>uns jornais</b>.","topic":"ART","pts":7},{"type":"mc","ask":"Complete with the definite article (o, a, os, as).","prompt":"___ mão","options":["a","o","os","as"],"explain":"<i>mão</i> is feminine even though it ends in -ão. Definite articles: o / a / os / as. → <b>a mão</b>.","topic":"ART","pts":5},{"type":"mc","ask":"Complete with the definite article (o, a, os, as).","prompt":"___ viagens","options":["as","o","a","os"],"explain":"<i>viagem</i> is feminine (nouns in -agem are feminine), and here it's plural. Definite articles: o / a / os / as. → <b>as viagens</b>.","topic":"ART","pts":4},{"type":"mc","ask":"Complete with the definite article (o, a, os, as).","prompt":"___ jornais","options":["os","o","a","as"],"explain":"<i>jornal</i> is masculine, and here it's plural. Definite articles: o / a / os / as. → <b>os jornais</b>.","topic":"ART","pts":2},{"type":"mc","ask":"Complete with the indefinite article (um, uma, uns, umas).","prompt":"___ cadeira","options":["uma","um","uns","umas"],"explain":"<i>cadeira</i> is feminine. Indefinite articles: um / uma / uns / umas. → <b>uma cadeira</b>.","topic":"ART","pts":1},{"type":"text","ask":"Type the present tense of aprender.","prompt":"Nós ___ português. <small>(aprender)</small>","accept":["aprendemos"],"explain":"<b>aprender</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. nós → <b>aprendemos</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":10},{"type":"text","ask":"Type the present tense of viver.","prompt":"A Ana e o Rui ___ no Porto. <small>(viver)</small>","accept":["vivem"],"explain":"<b>viver</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. eles/elas/vocês → <b>vivem</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":7},{"type":"mc","ask":"Complete with the present tense of estudar.","prompt":"Nós ___ português todos os dias. <small>(estudar)</small>","options":["estudamos","estudemos","estudimos","estudo"],"explain":"<b>estudar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. nós → <b>estudamos</b>.","topic":"VERB","pts":5},{"type":"mc","ask":"Complete with the present tense of trabalhar.","prompt":"Eles ___ em Coimbra. <small>(trabalhar)</small>","options":["trabalham","trabalhem","trabalho","trabalhas"],"explain":"<b>trabalhar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. eles/elas/vocês → <b>trabalham</b>.","topic":"VERB","pts":4},{"type":"mc","ask":"Complete with the present tense of falar.","prompt":"O João ___ português e inglês. <small>(falar)</small>","options":["fala","fale","falo","falas"],"explain":"<b>falar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. ele/ela/você → <b>fala</b>.","topic":"VERB","pts":2},{"type":"mc","ask":"Complete with the present tense of vender.","prompt":"Eu ___ livros. <small>(vender)</small>","options":["vendo","vendes","vende","vendemos"],"explain":"<b>vender</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. eu → <b>vendo</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":1},{"type":"mc","ask":"Complete with the present tense of aprender.","prompt":"Eu ___ português. <small>(aprender)</small>","options":["aprendo","aprendes","aprende","aprendemos"],"explain":"<b>aprender</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. eu → <b>aprendo</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":1}]],"caderno":[[{"type":"multi","nRight":3,"ask":"Select ALL the greetings (not farewells).","prompt":"Cumprimentos","options":["Bom dia!","Olá!","Boa tarde!","Até amanhã!","Adeus!","Até logo!"],"explain":"Greetings: <b>Bom dia!, Olá!, Boa tarde!</b> Farewells: <i>Até amanhã!, Adeus!, Até logo!</i> (<i>Boa noite!</i> works for both.)","topic":"C1","pts":4},{"type":"text","ask":"Write a sentence with these words.","prompt":"sei / és / não / quem","accept":["Não sei quem és"],"explain":"Negation comes before the verb: <b>Não sei quem és.</b> = I don't know who you are.","topic":"C1","pts":6},{"type":"text","ask":"Type me, te or se.","prompt":"Como ___ chamas?","accept":["te"],"explain":"<i>Chamas</i> is the <i>tu</i> form → <b>te</b>. After <i>como</i> the pronoun goes before the verb: <i>Como te chamas?</i>","topic":"C1","pts":4},{"type":"text","ask":"Complete the dialogue.","prompt":"A: ___ o Jorge? B: Sim, sou.","accept":["És","É"],"explain":"Asking someone if they are Jorge: <b>És o Jorge?</b> (tu, informal) or <b>É o Jorge?</b> (formal). The answer <i>Sim, sou</i> uses <i>eu sou</i>.","topic":"C1","pts":4},{"type":"text","ask":"Write the expression with these words.","prompt":"próxima / até / à","accept":["Até à próxima"],"explain":"<b>Até à próxima!</b> = Until next time. In European Portuguese <i>à</i> (a + a) is used here.","topic":"C1","pts":4},{"type":"text","ask":"Type me, te or se.","prompt":"Chamas-___ António?","accept":["te"],"explain":"<i>Chamas</i> = tu → <b>te</b>: <i>Chamas-te António?</i>","topic":"C1","pts":2},{"type":"text","ask":"Type o or a.","prompt":"Ele é ___ Jorge Viegas.","accept":["o"],"explain":"Before a man's name European Portuguese often uses the article <b>o</b>: <i>Ele é o Jorge Viegas</i>.","topic":"C1","pts":2},{"type":"text","ask":"Type me, te or se.","prompt":"Chamo-___ Ricardo.","accept":["me"],"explain":"<i>Chamo</i> is the <i>eu</i> form, so the pronoun is <b>me</b>: <i>Chamo-me Ricardo</i>.","topic":"C1","pts":1},{"type":"mc","ask":"Complete with o or a only where necessary.","prompt":"Ela chama-se ___ Teresa Pereira.","options":["(no article)","a","o","uma"],"explain":"After <i>chamar-se</i> there is <b>no article</b>: <i>Chamo-me Sónia</i>, <i>Ela chama-se Teresa Pereira</i>. With <i>ser</i> you use one: <i>Sou a Ana</i>.","topic":"C1","pts":6},{"type":"text","ask":"Type the name of the country in Portuguese.","prompt":"Que país é este? ___","accept":["França"],"explain":"It's the flag of <b>França</b>.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"10\" height=\"20\" fill=\"#0055A4\"/><rect x=\"10\" width=\"10\" height=\"20\" fill=\"#F7F7F2\"/><rect x=\"20\" width=\"10\" height=\"20\" fill=\"#EF4135\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"C2","pts":2},{"type":"text","ask":"Write the missing number.","prompt":"trinta e três, ___, noventa e nove","accept":["sessenta e seis"],"explain":"33, 66, 99: each step adds 33 → <b>sessenta e seis</b>. Remember the <i>e</i> between tens and units.","topic":"C2","pts":6},{"type":"text","ask":"Write the sentence in the negative.","prompt":"Woody Allen é de Londres. → ___","accept":["Woody Allen não é de Londres"],"explain":"Put <b>não</b> before the verb: <i>Woody Allen <b>não é</b> de Londres.</i>","topic":"C2","pts":5},{"type":"text","ask":"Complete with de/da/do/dos or em/na/no/nos.","prompt":"A Vanessa é ___ Rio de Janeiro.","accept":["do"],"explain":"Rio de Janeiro is one of the cities with an article (<i>o Rio</i>): de + o = <b>do</b>.","topic":"C2","pts":5},{"type":"text","ask":"Answer the question.","prompt":"Onde é Hamburgo? ___","accept":["Na Alemanha","É na Alemanha","Fica na Alemanha"],"explain":"<i>A Alemanha</i> is feminine: em + a = <b>na</b>. <i>Na Alemanha.</i>","topic":"C2","pts":4},{"type":"text","ask":"Write the pronoun in the plural.","prompt":"tu → ___","accept":["vocês"],"explain":"European Portuguese uses <b>vocês</b> as the plural of both <i>tu</i> and <i>você</i> (<i>vós</i> is archaic).","topic":"C2","pts":4},{"type":"text","ask":"Which country is it? Write the whole word.","prompt":"_ _ D I A","accept":["Índia"],"explain":"<b>Índia</b>. Don't forget the accent: <i>Índia</i>.","topic":"C2","pts":2},{"type":"text","ask":"Complete with the missing word.","prompt":"A: ___ onde é ela? B: Da Rússia.","accept":["De"],"explain":"Asking about origin: <b>De onde</b> é ela?","topic":"C2","pts":2},{"type":"mc","ask":"Complete with the missing word.","prompt":"A: Eles ___ de Itália? B: Não sei.","options":["são","é","somos","estão"],"explain":"<i>Eles</i> → <b>são</b> (ser, plural).","topic":"C2","pts":1},{"type":"text","ask":"Write a question with these words.","prompt":"está / Jorge / onde / agora / o","accept":["Onde está o Jorge agora","Onde está agora o Jorge","O Jorge agora onde está"],"explain":"Question word first, then the verb: <b>Onde está o Jorge agora?</b> (where he is now → <i>estar</i>).","topic":"C3","pts":8},{"type":"text","ask":"Write a sentence with these words.","prompt":"russo / bem / falo / muito","accept":["Falo russo muito bem","Falo muito bem russo"],"explain":"Verb first (the subject <i>eu</i> is dropped), then the language, then how well: <b>Falo russo muito bem.</b>","topic":"C3","pts":6},{"type":"text","ask":"Rewrite the sentence using the pronoun and the nationality.","prompt":"A Khadija é de Marrocos. → ___","accept":["Ela é marroquina"],"explain":"one woman → feminine singular: <b>Ela é marroquina.</b>","topic":"C3","pts":5},{"type":"text","ask":"Complete with ser, estar or falar in the correct form.","prompt":"___ em França. <small>(nós)</small>","accept":["Estamos"],"explain":"where we are now → <i>estar</i>: <b>Estamos</b> em França.","topic":"C3","pts":5},{"type":"text","ask":"Write the number in words.","prompt":"700 = ___","accept":["setecentos"],"explain":"<b>Setecentos</b>. Careful: 600 seiscentos, 700 setecentos.","topic":"C3","pts":4},{"type":"text","ask":"Which language is this? (Type just the language.)","prompt":"“Ich lerne Portugiesisch.” → É ___.","accept":["alemão","é alemão"],"explain":"It's <b>alemão</b>. Language names are written in lower case and are the same as the masculine nationality.","topic":"C3","pts":2},{"type":"text","ask":"Write the correct form of morar.","prompt":"tu ___","accept":["moras"],"explain":"<i>Morar</i> is a regular -ar verb: moro, moras, mora, moramos, moram. tu → <b>moras</b>.","topic":"C3","pts":2},{"type":"text","ask":"Which language is this? (Type just the language.)","prompt":"“I'm learning Portuguese.” → É ___.","accept":["inglês","é inglês"],"explain":"It's <b>inglês</b>. Language names are written in lower case and are the same as the masculine nationality.","topic":"C3","pts":1},{"type":"mc","ask":"Which question fits the answer?","prompt":"___? — Não. Estamos no Porto.","options":["Estão em Lisboa?","São do Porto?","Onde moram?","De onde são?"],"explain":"<i>Estamos no Porto</i> is about where they are now, and it starts with <i>Não</i>, so it answers a yes/no question with <i>estar</i>: <b>Estão em Lisboa?</b>","topic":"C3","pts":5},{"type":"text","ask":"Look at the picture and type the colour.","prompt":"A cadeira é ___.","accept":["amarela"],"explain":"<i>Cadeira</i> is feminine: amarelo → <b>amarela</b>.","img":"<svg viewBox=\"0 0 120 140\" role=\"img\" aria-label=\"A yellow chair\"><g transform=\"translate(0 0) scale(1)\" fill=\"#F2C230\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"30\" y=\"10\" width=\"60\" height=\"44\" rx=\"5\"/><rect x=\"30\" y=\"54\" width=\"8\" height=\"30\"/><rect x=\"82\" y=\"54\" width=\"8\" height=\"30\"/><path d=\"M22 84h76l-6 14H28Z\"/><rect x=\"28\" y=\"98\" width=\"8\" height=\"38\"/><rect x=\"84\" y=\"98\" width=\"8\" height=\"38\"/></g></svg>","topic":"C4","pts":4},{"type":"text","ask":"Write the sentence in the plural.","prompt":"A parede é azul. → ___","accept":["As paredes são azuis","As paredes são azuis"],"explain":"azul → azuis: <b>As paredes são azuis.</b>","topic":"C4","pts":8},{"type":"text","ask":"The sentence has a mistake. Rewrite it correctly.","prompt":"De que cor são isto?","accept":["De que cor é isto"],"explain":"<i>Isto</i> is singular: <b>De que cor é isto?</b>","topic":"C4","pts":6},{"type":"text","ask":"Write the sentence in the plural.","prompt":"É uma secretária. → ___","accept":["São secretárias","São umas secretárias"],"explain":"<i>Uma</i> disappears in the plural: <b>São secretárias.</b>","topic":"C4","pts":5},{"type":"text","ask":"The sentence has a mistake. Rewrite it correctly.","prompt":"A secretária da Rita é castanho.","accept":["A secretária da Rita é castanha"],"explain":"<i>Secretária</i> is feminine: <b>castanha</b>.","topic":"C4","pts":5},{"type":"text","ask":"A woman is holding an umbrella in her own hand: Type isto, isso or aquilo.","prompt":"Como se diz ___ em inglês?","accept":["isto"],"explain":"The object is in the speaker's hand → <b>isto</b>.","topic":"C4","pts":4},{"type":"text","ask":"Complete with a word from the box: pode / não / abram / qual / o que / trabalhem.","prompt":"___ os livros!","accept":["Abram"],"explain":"Instruction to the class: <b>Abram</b> os livros! (open)","topic":"C4","pts":4},{"type":"text","ask":"Write the colour with the missing letters.","prompt":"_ E R M _ _ _ O","accept":["vermelho"],"explain":"<b>Vermelho</b> = red (feminine <i>vermelha</i>).","topic":"C4","pts":2},{"type":"text","ask":"Complete with a word from the box: pode / não / abram / qual / o que / trabalhem.","prompt":"___ repetir?","accept":["Pode"],"explain":"<b>Pode repetir?</b> = Can you repeat?","topic":"C4","pts":2},{"type":"mc","ask":"What is this?","prompt":"___","options":["o café","o chá","o sumo","a água"],"explain":"It's coffee: <b>o café</b>.","img":"<svg viewBox=\"0 0 160 130\" role=\"img\" aria-label=\"A cup of coffee\"><ellipse cx=\"80\" cy=\"108\" rx=\"60\" ry=\"12\" fill=\"#F2EFE6\" stroke=\"#2A2A2A\" stroke-width=\"2.5\"/><path d=\"M40 52h72l-8 50H48Z\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"2.5\"/><ellipse cx=\"76\" cy=\"52\" rx=\"36\" ry=\"8\" fill=\"#5A3416\" stroke=\"#2A2A2A\" stroke-width=\"2.5\"/><path d=\"M112 62c18 0 18 26-2 26\" fill=\"none\" stroke=\"#2A2A2A\" stroke-width=\"5\"/><path d=\"M64 36c-6-8 6-12 0-22M84 36c-6-8 6-12 0-22\" stroke=\"#9AA19D\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/></svg>","topic":"C5","pts":1},{"type":"text","ask":"Correct the mistake.","prompt":"E também uma café.","accept":["E também um café"],"explain":"<i>Café</i> is masculine: <b>um café</b>.","topic":"C5","pts":5},{"type":"text","ask":"Complete the word.","prompt":"C E _ _ _ _ A","accept":["cerveja"],"explain":"<b>Cerveja</b> = beer (feminine: <i>a cerveja</i>).","topic":"C5","pts":3},{"type":"text","ask":"Complete the dialogue.","prompt":"A: Café ___ chá?","accept":["ou"],"explain":"<b>ou</b> = or: <i>Café ou chá?</i>","topic":"C5","pts":2},{"type":"text","ask":"Rewrite using a possessive.","prompt":"Ele tem um livro azul. → ___ é azul.","accept":["O livro dele"],"explain":"For <i>ele/ela</i> Portuguese usually puts <i>dele/dela</i> after the noun: <b>O livro dele</b>.","topic":"C6","pts":10},{"type":"text","ask":"Answer (−).","prompt":"A: Ele tem passaporte francês? B: ___","accept":["Não, não tem","Não tem"],"explain":"Short negative answer repeats the verb: <b>Não, não tem.</b>","topic":"C6","pts":6},{"type":"text","ask":"Rewrite using a possessive.","prompt":"Temos uma casa no Porto. → ___ é no Porto.","accept":["A nossa casa"],"explain":"nós → <b>a nossa</b> casa.","topic":"C6","pts":6},{"type":"text","ask":"Write the definite article and the noun in the plural.","prompt":"lápis → ___","accept":["os lápis"],"explain":"<i>Lápis</i> is masculine and doesn't change in the plural: <b>os lápis</b>.","topic":"C6","pts":5},{"type":"text","ask":"Write the definite article and the noun in the plural.","prompt":"mala → ___","accept":["as malas"],"explain":"<i>Mala</i> (bag) is feminine: <b>as malas</b>.","topic":"C6","pts":3},{"type":"text","ask":"Write the correct form of ter.","prompt":"ele ___","accept":["tem"],"explain":"<i>Ter</i> is irregular: tenho, tens, tem, temos, <b>têm</b> (plural with a circumflex). ele → <b>tem</b>.","topic":"C6","pts":2},{"type":"mc","ask":"The keys are in your own hand.","prompt":"As chaves estão ___.","options":["aqui","aí","ali","isso"],"explain":"Near the speaker → <b>aqui</b>.","topic":"C6","pts":2},{"type":"multi","nRight":2,"ask":"Select ALL the words with TWO syllables.","prompt":"Sílabas","options":["muito","chamas","quem","sábado","desculpe","bem"],"explain":"<b>mui-to, cha-mas</b>. <i>Quem, bem</i> = 1 syllable; <i>sá-ba-do, des-cul-pe</i> = 3.","topic":"C7","pts":5},{"type":"mc","ask":"Where is the stress?","prompt":"brasileiro","options":["bra-si-<b>LEI</b>-ro","<b>BRA</b>-si-lei-ro","bra-<b>SI</b>-lei-ro","bra-si-lei-<b>RO</b>"],"explain":"Words ending in a vowel are normally stressed on the second-to-last syllable: bra-si-<b>LEI</b>-ro.","topic":"C7","pts":5},{"type":"mc","ask":"Which word does NOT have a nasal sound?","prompt":"sim · bem · um · sou · bom","options":["sou","sim","bem","bom"],"explain":"<i>-m</i> at the end of a syllable makes the vowel nasal: sim, bem, um, bom. <b>Sou</b> has an oral diphthong.","topic":"C7","pts":3}],[{"type":"text","ask":"Write a sentence with these words.","prompt":"Ricardo / chama / ele / se","accept":["Ele chama-se Ricardo"],"explain":"Affirmative statement: pronoun after the verb with a hyphen: <b>Ele chama-se Ricardo.</b>","topic":"C1","pts":8},{"type":"text","ask":"Complete the formal reply (speaking to a man).","prompt":"A: Olá, como está? B: Bem, obrigada. E ___?","accept":["o senhor"],"explain":"The question <i>Como está?</i> is formal, so the reply stays formal: <b>E o senhor?</b> (to a woman: <i>E a senhora?</i>).","topic":"C1","pts":5},{"type":"text","ask":"Type me, te or se.","prompt":"O senhor chama-___ Rui Guerra?","accept":["se"],"explain":"<i>O senhor</i> takes the 3rd person, so the pronoun is <b>se</b>. In a yes/no question it stays after the verb: <i>chama-se</i>.","topic":"C1","pts":4},{"type":"text","ask":"Complete the dialogue.","prompt":"A: Quem é ele? B: Ele? Não ___.","accept":["sei"],"explain":"<b>Não sei</b> = I don't know (verb <i>saber</i>, eu sei).","topic":"C1","pts":4},{"type":"text","ask":"Write the number in words.","prompt":"17 = ___","accept":["dezassete"],"explain":"<b>Dezassete</b> (European spelling). 16 dezasseis, 18 dezoito, 19 dezanove.","topic":"C1","pts":4},{"type":"text","ask":"Complete the dialogue.","prompt":"A: ___ é ele? B: Ele? Não sei.","accept":["Quem"],"explain":"Asking about a person's identity: <b>Quem é ele?</b> = Who is he?","topic":"C1","pts":2},{"type":"text","ask":"Write the missing letters (day of the week).","prompt":"Q _ _ N _ A - F E I R A","accept":["quinta-feira"],"explain":"<b>Quinta-feira</b> = Thursday (the “fifth” day counting from Sunday).","topic":"C1","pts":2},{"type":"mc","ask":"Choose the correct verb.","prompt":"Ela ___ Teresa.","options":["chama-se","se chama","te chamas","és"],"explain":"Affirmative sentence → pronoun after the verb: <b>Ela chama-se Teresa</b>. <i>Te chamas</i> and <i>és</i> belong to <i>tu</i>.","topic":"C1","pts":2},{"type":"mc","ask":"Complete the expression.","prompt":"Muito ___!","options":["prazer","bem","tarde","está"],"explain":"<b>Muito prazer!</b> = Nice to meet you. You can also say <i>Muito gosto!</i>","topic":"C1","pts":2},{"type":"text","ask":"Type the name of the country in Portuguese.","prompt":"Que país é este? ___","accept":["Polónia"],"explain":"It's the flag of <b>Polónia</b>. Note the European Portuguese spelling with ó.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"10\" fill=\"#F7F7F2\"/><rect y=\"10\" width=\"30\" height=\"10\" fill=\"#DC143C\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"C2","pts":4},{"type":"text","ask":"Type the name of the country in Portuguese.","prompt":"Que país é este? ___","accept":["Brasil"],"explain":"It's the flag of <b>Brasil</b>.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"20\" fill=\"#009C3B\"/><path d=\"M15 2.4 27.6 10 15 17.6 2.4 10Z\" fill=\"#FFDF00\"/><circle cx=\"15\" cy=\"10\" r=\"5\" fill=\"#002776\"/><path d=\"M10.2 9.1c3.1-.6 6.8-.2 9.7 1.7\" stroke=\"#fff\" stroke-width=\".8\" fill=\"none\"/></svg>","topic":"C2","pts":1},{"type":"text","ask":"Write a sentence with these words.","prompt":"em / fica / Lyon / França","accept":["Lyon fica em França","Lyon fica na França"],"explain":"<b>Lyon fica em França.</b> With <i>França</i> the article is optional, so <i>na França</i> is also accepted.","topic":"C2","pts":6},{"type":"text","ask":"Answer the question.","prompt":"Onde é Luanda? ___","accept":["Em Angola","É em Angola","Fica em Angola"],"explain":"<i>Angola</i> takes no article, so <b>em</b> doesn't contract: <i>Em Angola.</i>","topic":"C2","pts":5},{"type":"text","ask":"Complete with de/da/do/dos or em/na/no/nos.","prompt":"Miami é ___ Estados Unidos.","accept":["nos"],"explain":"Location → <i>em</i>; <i>os Estados Unidos</i> → em + os = <b>nos</b>.","topic":"C2","pts":5},{"type":"text","ask":"Answer the question.","prompt":"Onde é São Paulo? ___","accept":["No Brasil","É no Brasil","Fica no Brasil"],"explain":"<i>O Brasil</i> is masculine: em + o = <b>no</b>. <i>No Brasil.</i>","topic":"C2","pts":4},{"type":"text","ask":"Which country is it? Write the whole word.","prompt":"I _ _ L _ A","accept":["Itália"],"explain":"<b>Itália</b>. Don't forget the accent: <i>Itália</i>.","topic":"C2","pts":2},{"type":"text","ask":"Complete with the missing word.","prompt":"A: ___ fica Sevilha? B: Em Espanha.","accept":["Onde"],"explain":"Asking about location: <b>Onde</b> fica Sevilha?","topic":"C2","pts":2},{"type":"text","ask":"Write the pronoun in the plural.","prompt":"você → ___","accept":["vocês"],"explain":"<i>Você</i> → <b>vocês</b>.","topic":"C2","pts":2},{"type":"text","ask":"Rewrite the sentence using the pronoun and the nationality.","prompt":"O Johannes e a Anke são da Alemanha. → ___","accept":["Eles são alemães"],"explain":"a mixed group → masculine plural: <b>Eles são alemães.</b>","topic":"C3","pts":8},{"type":"text","ask":"Rewrite the sentence using the pronoun and the nationality.","prompt":"A Tomoko e o Takeshi são do Japão. → ___","accept":["Eles são japoneses"],"explain":"a mixed group → masculine plural: <b>Eles são japoneses.</b>","topic":"C3" .","accept":["A tua mala"],"explain":"tu → <b>a tua</b> mala.","topic":"C6","pts":6},{"type":"text","ask":"Write the correct form of ter.","prompt":"vocês ___","accept":["têm"],"explain":"<i>Ter</i> is irregular: tenho, tens, tem, temos, <b>têm</b> (plural with a circumflex). vocês → <b>têm</b>.","topic":"C6","pts":5},{"type":"text","ask":"Type no, na or em.","prompt":"Estamos ___ escritório.","accept":["no"],"explain":"<i>O escritório</i> → em + o = <b>no</b>.","topic":"C6","pts":4},{"type":"text","ask":"Write the correct form of ter.","prompt":"tu ___","accept":["tens"],"explain":"<i>Ter</i> is irregular: tenho, tens, tem, temos, <b>têm</b> (plural with a circumflex). tu → <b>tens</b>.","topic":"C6","pts":2},{"type":"mc","ask":"A painting hangs on the wall far from both of you.","prompt":"O quadro de Leonardo da Vinci está ___.","options":["ali","aqui","aí","isto"],"explain":"Far from speaker and listener → <b>ali</b>.","topic":"C6","pts":4},{"type":"multi","nRight":3,"ask":"Select ALL the words where a final o is pronounced [u].","prompt":"o → [u]?","options":["chamo","cinco","logo","nove","doze","bom"],"explain":"Unstressed final <i>-o</i> → [u]: <b>chamo, cinco, logo</b>. In <i>nove</i> and <i>doze</i> the o is stressed; in <i>bom</i> it's nasal.","topic":"C7","pts":6},{"type":"multi","nRight":2,"ask":"Select ALL the words with THREE syllables.","prompt":"Sílabas","options":["amanhã","próxima","prazer","senhor","bom","tarde"],"explain":"<b>a-ma-nhã, pró-xi-ma</b>. <i>pra-zer, se-nhor, tar-de</i> = 2; <i>bom</i> = 1.","topic":"C7","pts":5},{"type":"mc","ask":"Where is the stress?","prompt":"Brasil","options":["bra-<b>SIL</b>","<b>BRA</b>-sil","equal stress","no stress"],"explain":"Words ending in <i>-l</i> are stressed on the last syllable: bra-<b>SIL</b> (also <i>espanhol</i>, <i>azul</i>).","topic":"C7","pts":4}],[{"type":"text","ask":"Type the verb chamar-se with its pronoun (você).","prompt":"Como ___? <small>(você)</small>","accept":["se chama"],"explain":"<i>Você</i> uses the 3rd person: <i>chama</i> + <i>se</i>. After <i>como</i> the pronoun goes first: <b>Como se chama?</b>","topic":"C1","pts":6},{"type":"text","ask":"Write the missing day.","prompt":"sexta-feira, ___, terça-feira","accept":["domingo"],"explain":"The list skips one day each time: sexta → (sábado) → <b>domingo</b> → (segunda) → terça.","topic":"C1","pts":6},{"type":"text","ask":"Type me, te or se.","prompt":"Como ___ chama ela?","accept":["se"],"explain":"<i>Ela</i> → <b>se</b>, placed before the verb after <i>como</i>: <i>Como se chama ela?</i>","topic":"C1","pts":4},{"type":"text","ask":"Type the verb (ser).","prompt":"Não sei quem ele ___.","accept":["é"],"explain":"<i>Ele</i> → <b>é</b>: <i>Não sei quem ele é</i> = I don't know who he is.","topic":"C1","pts":4},{"type":"text","ask":"Type me, te or se.","prompt":"Ele chama-___ Rafael.","accept":["se"],"explain":"<i>Ele</i> (3rd person) → <b>se</b>: <i>Ele chama-se Rafael</i>.","topic":"C1","pts":2},{"type":"text","ask":"Complete the dialogue (welcoming Jorge).","prompt":"Bem-___ a Lisboa!","accept":["vindo"],"explain":"Jorge is a man, so: <b>Bem-vindo</b>. A woman → <i>bem-vinda</i>; a group → <i>bem-vindos</i>.","topic":"C1","pts":2},{"type":"text","ask":"Write the missing letters (day of the week).","prompt":"S _ B _ _ _","accept":["sábado"],"explain":"<b>Sábado</b> = Saturday (with an accent on the first a).","topic":"C1","pts":2},{"type":"text","ask":"Write the number in words.","prompt":"12 = ___","accept":["doze"],"explain":"<b>Doze</b>. Compare <i>dois</i> (2) and <i>duzentos</i> (200).","topic":"C1","pts":1},{"type":"mc","ask":"Complete the expression.","prompt":"Tudo ___?","options":["bem","prazer","dia","logo"],"explain":"<b>Tudo bem?</b> = How's it going? (informal). The other pairs: <i>Muito prazer, Bom dia, Até logo</i>.","topic":"C1","pts":2},{"type":"multi","nRight":3,"ask":"Select ALL the sentences where “é” can be replaced with “fica”.","prompt":"é → fica?","options":["Onde é Boston?","Berlim é na Alemanha.","Lisboa é em Portugal.","Quem é ele?","O Felipe é do Brasil.","Ela é portuguesa."],"explain":"<i>Ficar</i> replaces <i>ser</i> only for the <b>location of places</b>: <i>Onde fica Boston? Berlim fica na Alemanha. Lisboa fica em Portugal.</i> Identity, origin and nationality keep <i>ser</i>.","topic":"C2","pts":6},{"type":"text","ask":"Type the name of the country in Portuguese.","prompt":"Que país é este? ___","accept":["Alemanha"],"explain":"It's the flag of <b>Alemanha</b>.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"7\" fill=\"#111\"/><rect y=\"6.67\" width=\"30\" height=\"6.67\" fill=\"#DD0000\"/><rect y=\"13.33\" width=\"30\" height=\"6.67\" fill=\"#FFCE00\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"C2","pts":2},{"type":"text","ask":"Correct the sentence: Madonna is from the USA.","prompt":"Madonna não é de Itália. É ___ Estados Unidos.","accept":["dos"],"explain":"<i>Os Estados Unidos</i> is masculine plural: de + os = <b>dos</b>.","topic":"C2","pts":5},{"type":"text","ask":"Complete with the missing word.","prompt":"A: ___ de Lisboa? B: Não, somos do Porto.","accept":["São","Vocês são"],"explain":"The answer uses <i>somos</i> (nós), so the question is to <i>vocês</i>: <b>São de Lisboa?</b>","topic":"C2","pts":5},{"type":"text","ask":"Correct the sentence: Dulce Pontes is from Portugal.","prompt":"Dulce Pontes não é de Espanha. É ___ Portugal.","accept":["de"],"explain":"<i>Portugal</i> takes no article, so <b>de</b> stays as it is.","topic":"C2","pts":4},{"type":"text","ask":"Write the pronoun in the plural.","prompt":"o senhor → ___","accept":["os senhores"],"explain":"<i>O senhor</i> → <b>os senhores</b> (both words change).","topic":"C2","pts":4},{"type":"text","ask":"Which country is it? Write the whole word.","prompt":"_ _ X I C _","accept":["México"],"explain":"<b>México</b>. Don't forget the accent: <i>México</i>.","topic":"C2","pts":2},{"type":"text","ask":"Complete with the missing word.","prompt":"A: Ele é ___ Brasil? B: É, sim.","accept":["do"],"explain":"de + o (o Brasil) = <b>do</b>.","topic":"C2","pts":2},{"type":"text","ask":"Write the missing number.","prompt":"cinquenta, setenta, ___","accept":["noventa"],"explain":"The list goes up by 20: 50, 70, <b>90 = noventa</b>.","topic":"C2","pts":2},{"type":"text","ask":"Rewrite the sentence using the pronoun and the nationality.","prompt":"A Daniela e a María são de Espanha. → ___","accept":["Elas são espanholas"],"explain":"two women → feminine plural: <b>Elas são espanholas.</b>","topic":"C3","pts":6},{"type":"text","ask":"Write a sentence with these words.","prompt":"de / falamos / japonês / pouco / um","accept":["Falamos um pouco de japonês"],"explain":"<b>Falamos um pouco de japonês.</b> The expression is <i>um pouco de</i> + language.","topic":"C3","pts":6},{"type":"text","ask":"Write a sentence with these words.","prompt":"não / alemã / é / ela","accept":["Ela não é alemã"],"explain":"<b>Ela não é alemã.</b> <i>Não</i> always goes right before the verb.","topic":"C3","pts":5},{"type":"text","ask":"Rewrite the sentence using the pronoun and the nationality.","prompt":"O Josiah é dos Estados Unidos. → ___","accept":["Ele é americano"],"explain":"one man → masculine singular: <b>Ele é americano.</b>","topic":"C3","pts":4},{"type":"text","ask":"Complete with ser, estar or falar in the correct form.","prompt":"Onde ___ vocês?","accept":["estão"],"explain":"where you are → <i>estar</i>: <b>estão</b>. (<i>Onde moram vocês?</i> would ask where you live.)","topic":"C3","pts":4},{"type":"text","ask":"Write the correct form of morar.","prompt":"nós ___","accept":["moramos"],"explain":"<i>Morar</i> is a regular -ar verb: moro, moras, mora, moramos, moram. nós → <b>moramos</b>.","topic":"C3","pts":2},{"type":"text","ask":"Complete with ser, estar or falar in the correct form.","prompt":"Eles ___ espanhóis.","accept":["são"],"explain":"nationality → <i>ser</i>: <b>são</b>.","topic":"C3","pts":2},{"type":"text","ask":"Write the correct form of morar.","prompt":"eu ___","accept":["moro"],"explain":"<i>Morar</i> is a regular -ar verb: moro, moras, mora, moramos, moram. eu → <b>moro</b>.","topic":"C3","pts":1},{"type":"mc","ask":"Maxim: English 1, German 3, Russian 3 (3 = muito bem, 1 = um pouco). Choose the sentence.","prompt":"O Maxim…","options":["O Maxim fala alemão e russo muito bem e um pouco de inglês.","O Maxim fala inglês muito bem e um pouco de alemão e russo.","O Maxim fala alemão e russo um pouco e inglês muito bem.","O Maxim fala alemão, russo e inglês muito bem."],"explain":"3 = <i>muito bem</i> (German, Russian), 1 = <i>um pouco de</i> (English). Note: <i>um pouco <b>de</b></i> + language.","topic":"C3","pts":6},{"type":"text","ask":"Look at the picture and type the colour.","prompt":"Os livros são ___.","accept":["cinzentos"],"explain":"<i>Livros</i> is masculine plural: cinzento → <b>cinzentos</b>.","img":"<svg viewBox=\"0 0 200 130\" role=\"img\" aria-label=\"Two grey books\"><g transform=\"translate(22 22) rotate(-6)\"><rect x=\"0\" y=\"0\" width=\"70\" height=\"92\" rx=\"4\" fill=\"#8E9494\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"8\" y=\"0\" width=\"5\" height=\"92\" fill=\"#2A2A2A\" opacity=\".25\"/><rect x=\"22\" y=\"22\" width=\"36\" height=\"12\" rx=\"2\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"1.5\"/></g><g transform=\"translate(105 16) rotate(5)\"><rect x=\"0\" y=\"0\" width=\"70\" height=\"92\" rx=\"4\" fill=\"#8E9494\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"8\" y=\"0\" width=\"5\" height=\"92\" fill=\"#2A2A2A\" opacity=\".25\"/><rect x=\"22\" y=\"22\" width=\"36\" height=\"12\" rx=\"2\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"1.5\"/></g></svg>","topic":"C4","pts":6},{"type":"text","ask":"Write the sentence in the plural.","prompt":"A cadeira é verde. → ___","accept":["As cadeiras são verdes","As cadeiras são verdes"],"explain":"Article, noun, verb and colour all go to the plural: <b>As cadeiras são verdes.</b>","topic":"C4","pts":6},{"type":"text","ask":"Type o, a, um or uma.","prompt":"Isto é ___ Volvo.","accept":["um"],"explain":"A car brand refers to <i>um carro</i> (masculine) → <b>um</b> Volvo.","topic":"C4","pts":6},{"type":"text","ask":"Write the sentence in the plural.","prompt":"É um livro de Saramago. → ___","accept":["São livros de Saramago","São uns livros de Saramago"],"explain":"<b>São livros de Saramago.</b> (The indefinite plural <i>uns</i> is usually dropped here.)","topic":"C4","pts":5},{"type":"text","ask":"Complete with a word from the box: pode / não / abram / qual / o que / trabalhem.","prompt":"___ em pares.","accept":["Trabalhem"],"explain":"Instruction to the class: <b>Trabalhem</b> em pares (work in pairs).","topic":"C4","pts":5},{"type":"text","ask":"Two men look at a house on a distant hill: Type isto, isso or aquilo.","prompt":"___ é uma casa?","accept":["Aquilo"],"explain":"The house is far from both of them → <b>Aquilo</b>.","topic":"C4","pts":4},{"type":"text","ask":"Complete with a word from the box: pode / não / abram / qual / o que / trabalhem.","prompt":"___ significa “cadeira”?","accept":["O que"],"explain":"<b>O que</b> significa…? = What does … mean?","topic":"C4","pts":4},{"type":"text","ask":"Type o, a, um or uma.","prompt":"___ bandeira de Portugal é vermelha e verde.","accept":["A"],"explain":"A specific flag (Portugal's), feminine → <b>A</b> bandeira.","topic":"C4","pts":2},{"type":"text","ask":"Type o, a, um or uma.","prompt":"Isso é ___ mesa.","accept":["uma"],"explain":"Identifying an object, feminine → <b>uma</b> mesa.","topic":"C4","pts":1},{"type":"mc","ask":"What is this?","prompt":"___","options":["a água","o vinho","o sumo","a cerveja"],"explain":"A glass of water: <b>a água</b>. On a plane: <i>com gás</i> (sparkling) or <i>sem gás</i> (still).","img":"<svg viewBox=\"0 0 160 130\" role=\"img\" aria-label=\"A glass of water\"><path d=\"M52 18h56l-8 100H60Z\" fill=\"#DDEFFA\" stroke=\"#2A2A2A\" stroke-width=\"2.5\"/><path d=\"M55 48h50l-6 70H61Z\" fill=\"#9CCFF0\"/><path d=\"M68 60v40\" stroke=\"#fff\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\".7\"/></svg>","topic":"C5","pts":1},{"type":"text","ask":"Correct the mistake.","prompt":"Obrigada muito.","accept":["Muito obrigada"],"explain":"The intensifier comes first: <b>Muito obrigada!</b>","topic":"C5","pts":5},{"type":"text","ask":"Complete the dialogue.","prompt":"A: ___ alguma coisa? B: Não, obrigada.","accept":["Mais"],"explain":"<b>Mais alguma coisa?</b> = Anything else?","topic":"C5","pts":4},{"type":"text","ask":"Complete the dialogue.","prompt":"B: Um chá, ___ favor.","accept":["faz","por"],"explain":"<b>Faz favor</b> (very common in Portugal) or <b>por favor</b> = please.","topic":"C5","pts":2},{"type":"text","ask":"Write the definite article and the noun in the plural.","prompt":"telemóvel → ___","accept":["os telemóveis"],"explain":"-el → -eis: telemóvel → <b>os telemóveis</b>.","topic":"C6","pts":8},{"type":"text","ask":"Rewrite using a possessive.","prompt":"Tenho uma caneta preta. → ___ é preta.","accept":["A minha caneta"],"explain":"eu → <b>a minha</b> (feminine noun <i>caneta</i>).","topic":"C6","pts":6},{"type":"text","ask":"Answer with a possessive.","prompt":"De quem é a caneta verde? <small>(ela)</small>","accept":["É dela","Dela"],"explain":"de + ela = <b>dela</b>: <i>É dela</i> = It's hers.","topic":"C6","pts":6},{"type":"text","ask":"Answer (−).","prompt":"A: Tens água? B: ___","accept":["Não, não tenho","Não tenho"],"explain":"<i>Tens</i> (tu) → answer with <i>eu</i>: <b>Não, não tenho.</b>","topic":"C6","pts":5},{"type":"text","ask":"Type no, na or em.","prompt":"O telemóvel está ___ mala.","accept":["na"],"explain":"<i>A mala</i> → em + a = <b>na</b>.","topic":"C6","pts":4},{"type":"text","ask":"Write the correct form of ter.","prompt":"eu ___","accept":["tenho"],"explain":"<i>Ter</i> is irregular: tenho, tens, tem, temos, <b>têm</b> (plural with a circumflex). eu → <b>tenho</b>.","topic":"C6","pts":2},{"type":"mc","ask":"Your pen is on your colleague's desk, next to them.","prompt":"A minha caneta está ___ na tua secretária.","options":["aí","aqui","ali","lá"],"explain":"<i>Aqui</i> = near me, <b>aí</b> = near you, <i>ali</i> = far from both.","topic":"C6","pts":5},{"type":"multi","nRight":4,"ask":"Select ALL the words where the letter s is pronounced [ʃ].","prompt":"s → [ʃ]?","options":["nós","isto","Moscovo","Espanha","senhor","sete"],"explain":"<i>s</i> at the end of a word or before a consonant → [ʃ]: <b>nós, isto, Moscovo, Espanha</b>. At the start of a word it's [s]: <i>senhor, sete</i>.","topic":"C7","pts":6},{"type":"mc","ask":"In which word is the highlighted e pronounced differently?","prompt":"ond<b>e</b> · d<b>e</b>zoito · pr<b>e</b>to · árab<b>e</b>","options":["pr<b>e</b>to","ond<b>e</b>","d<b>e</b>zoito","árab<b>e</b>"],"explain":"Unstressed e → [ɨ] (onde, dezoito, árabe). In <b>preto</b> the e is stressed: a full [e].","topic":"C7","pts":6},{"type":"mc","ask":"Where is the stress?","prompt":"inglesa","options":["in-<b>GLE</b>-sa","<b>IN</b>-gle-sa","in-gle-<b>SA</b>","equal stress"],"explain":"Second-to-last syllable: in-<b>GLE</b>-sa. (Masculine <i>inglês</i> has a written accent on the last syllable.)","topic":"C7","pts":4}],[{"type":"multi","nRight":2,"ask":"Select ALL the correct options.","prompt":"O Pablo é ___ Espanha.","options":["de","da","do","das","em","na"],"explain":"With <i>Espanha, França, Itália, Inglaterra</i> the article is optional, so both <b>de Espanha</b> and <b>da Espanha</b> are correct. <i>Em/na</i> would mean location, not origin.","topic":"P1","pts":6},{"type":"mc","ask":"Look at the flag and complete.","prompt":"A Oksana é ___.","options":["da Ucrânia","de Ucrânia","na Ucrânia","do Ucrânia"],"explain":"<i>A Ucrânia</i> is feminine: de + a = <b>da</b> → <b>da Ucrânia</b>. <i>Na Ucrânia</i> = in Ukraine (location).","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"Flag of Ukraine\"><rect width=\"30\" height=\"10\" fill=\"#0057B7\"/><rect y=\"10\" width=\"30\" height=\"10\" fill=\"#FFD700\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"P1","pts":3},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"A Grace é ___ Filipinas.","accept":["das"],"explain":"<i>As Filipinas</i> is feminine plural: de + as = <b>das</b>.","topic":"P1","pts":6},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Vocês são ___ Estados Unidos?","accept":["dos"],"explain":"<i>Os Estados Unidos</i> is masculine plural: de + os = <b>dos</b>.","topic":"P1","pts":4},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Eles são ___ Porto.","accept":["do"],"explain":"City names usually have no article, but <i>o Porto</i> does: de + o = <b>do</b>. (Compare: <i>de Lisboa</i>.)","topic":"P1","pts":4},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Nós somos ___ Portugal.","accept":["de"],"explain":"<i>Portugal</i> never takes an article, so <i>de</i> doesn't contract: <b>de Portugal</b>. Same with Angola, Moçambique, Marrocos, Cuba.","topic":"P1","pts":3},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"O Kofi é ___ Angola.","accept":["de"],"explain":"<i>Angola</i> has no article: <b>de Angola</b>.","topic":"P1","pts":3},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"A Anna é ___ Suécia.","accept":["da"],"explain":"Origin → <i>de</i>. <i>A Suécia</i> is feminine: de + a = <b>da</b>.","topic":"P1","pts":2},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"O Takeshi é ___ Japão.","accept":["do"],"explain":"Origin → <i>de</i>. <i>O Japão</i> is masculine: de + o = <b>do</b>.","topic":"P1","pts":2},{"type":"text","ask":"Complete the question.","prompt":"___ onde é a Rita? — É do Brasil.","accept":["De"],"expla
