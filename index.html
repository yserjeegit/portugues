width=\"30\" height=\"6.67\" fill=\"#FFCE00\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"C2","pts":2},{"type":"text","ask":"Correct the sentence: Madonna is from the USA.","prompt":"Madonna não é de Itália. É ___ Estados Unidos.","accept":["dos"],"explain":"<i>Os Estados Unidos</i> is masculine plural: de + os = <b>dos</b>.","topic":"C2","pts":5},{"type":"text","ask":"Complete with the missing word.","prompt":"A: ___ de Lisboa? B: Não, somos do Porto.","accept":["São","Vocês são"],"explain":"The answer uses <i>somos</i> (nós), so the question is to <i>vocês</i>: <b>São de Lisboa?</b>","topic":"C2","pts":5},{"type":"text","ask":"Correct the sentence: Dulce Pontes is from Portugal.","prompt":"Dulce Pontes não é de Espanha. É ___ Portugal.","accept":["de"],"explain":"<i>Portugal</i> takes no article, so <b>de</b> stays as it is.","topic":"C2","pts":4},{"type":"text","ask":"Write the pronoun in the plural.","prompt":"o senhor → ___","accept":["os senhores"],"explain":"<i>O senhor</i> → <b>os senhores</b> (both words change).","topic":"C2","pts":4},{"type":"text","ask":"Which country is it? Write the whole word.","prompt":"_ _ X I C _","accept":["México"],"explain":"<b>México</b>. Don't forget the accent: <i>México</i>.","topic":"C2","pts":2},{"type":"text","ask":"Complete with the missing word.","prompt":"A: Ele é ___ Brasil? B: É, sim.","accept":["do"],"explain":"de + o (o Brasil) = <b>do</b>.","topic":"C2","pts":2},{"type":"text","ask":"Write the missing number.","prompt":"cinquenta, setenta, ___","accept":["noventa"],"explain":"The list goes up by 20: 50, 70, <b>90 = noventa</b>.","topic":"C2","pts":2},{"type":"text","ask":"Rewrite the sentence using the pronoun and the nationality.","prompt":"A Daniela e a María são de Espanha. → ___","accept":["Elas são espanholas"],"explain":"two women → feminine plural: <b>Elas são espanholas.</b>","topic":"C3","pts":6},{"type":"text","ask":"Write a sentence with these words.","prompt":"de / falamos / japonês / pouco / um","accept":["Falamos um pouco de japonês"],"explain":"<b>Falamos um pouco de japonês.</b> The expression is <i>um pouco de</i> + language.","topic":"C3","pts":6},{"type":"text","ask":"Write a sentence with these words.","prompt":"não / alemã / é / ela","accept":["Ela não é alemã"],"explain":"<b>Ela não é alemã.</b> <i>Não</i> always goes right before the verb.","topic":"C3","pts":5},{"type":"text","ask":"Rewrite the sentence using the pronoun and the nationality.","prompt":"O Josiah é dos Estados Unidos. → ___","accept":["Ele é americano"],"explain":"one man → masculine singular: <b>Ele é americano.</b>","topic":"C3","pts":4},{"type":"text","ask":"Complete with ser, estar or falar in the correct form.","prompt":"Onde ___ vocês?","accept":["estão"],"explain":"where you are → <i>estar</i>: <b>estão</b>. (<i>Onde moram vocês?</i> would ask where you live.)","topic":"C3","pts":4},{"type":"text","ask":"Write the correct form of morar.","prompt":"nós ___","accept":["moramos"],"explain":"<i>Morar</i> is a regular -ar verb: moro, moras, mora, moramos, moram. nós → <b>moramos</b>.","topic":"C3","pts":2},{"type":"text","ask":"Complete with ser, estar or falar in the correct form.","prompt":"Eles ___ espanhóis.","accept":["são"],"explain":"nationality → <i>ser</i>: <b>são</b>.","topic":"C3","pts":2},{"type":"text","ask":"Write the correct form of morar.","prompt":"eu ___","accept":["moro"],"explain":"<i>Morar</i> is a regular -ar verb: moro, moras, mora, moramos, moram. eu → <b>moro</b>.","topic":"C3","pts":1},{"type":"mc","ask":"Maxim: English 1, German 3, Russian 3 (3 = muito bem, 1 = um pouco). Choose the sentence.","prompt":"O Maxim…","options":["O Maxim fala alemão e russo muito bem e um pouco de inglês.","O Maxim fala inglês muito bem e um pouco de alemão e russo.","O Maxim fala alemão e russo um pouco e inglês muito bem.","O Maxim fala alemão, russo e inglês muito bem."],"explain":"3 = <i>muito bem</i> (German, Russian), 1 = <i>um pouco de</i> (English). Note: <i>um pouco <b>de</b></i> + language.","topic":"C3","pts":6},{"type":"text","ask":"Look at the picture and type the colour.","prompt":"Os livros são ___.","accept":["cinzentos"],"explain":"<i>Livros</i> is masculine plural: cinzento → <b>cinzentos</b>.","img":"<svg viewBox=\"0 0 200 130\" role=\"img\" aria-label=\"Two grey books\"><g transform=\"translate(22 22) rotate(-6)\"><rect x=\"0\" y=\"0\" width=\"70\" height=\"92\" rx=\"4\" fill=\"#8E9494\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"8\" y=\"0\" width=\"5\" height=\"92\" fill=\"#2A2A2A\" opacity=\".25\"/><rect x=\"22\" y=\"22\" width=\"36\" height=\"12\" rx=\"2\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"1.5\"/></g><g transform=\"translate(105 16) rotate(5)\"><rect x=\"0\" y=\"0\" width=\"70\" height=\"92\" rx=\"4\" fill=\"#8E9494\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"8\" y=\"0\" width=\"5\" height=\"92\" fill=\"#2A2A2A\" opacity=\".25\"/><rect x=\"22\" y=\"22\" width=\"36\" height=\"12\" rx=\"2\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"1.5\"/></g></svg>","topic":"C4","pts":6},{"type":"text","ask":"Write the sentence in the plural.","prompt":"A cadeira é verde. → ___","accept":["As cadeiras são verdes","As cadeiras são verdes"],"explain":"Article, noun, verb and colour all go to the plural: <b>As cadeiras são verdes.</b>","topic":"C4","pts":6},{"type":"text","ask":"Type o, a, um or uma.","prompt":"Isto é ___ Volvo.","accept":["um"],"explain":"A car brand refers to <i>um carro</i> (masculine) → <b>um</b> Volvo.","topic":"C4","pts":6},{"type":"text","ask":"Write the sentence in the plural.","prompt":"É um livro de Saramago. → ___","accept":["São livros de Saramago","São uns livros de Saramago"],"explain":"<b>São livros de Saramago.</b> (The indefinite plural <i>uns</i> is usually dropped here.)","topic":"C4","pts":5},{"type":"text","ask":"Complete with a word from the box: pode / não / abram / qual / o que / trabalhem.","prompt":"___ em pares.","accept":["Trabalhem"],"explain":"Instruction to the class: <b>Trabalhem</b> em pares (work in pairs).","topic":"C4","pts":5},{"type":"text","ask":"Two men look at a house on a distant hill: Type isto, isso or aquilo.","prompt":"___ é uma casa?","accept":["Aquilo"],"explain":"The house is far from both of them → <b>Aquilo</b>.","topic":"C4","pts":4},{"type":"text","ask":"Complete with a word from the box: pode / não / abram / qual / o que / trabalhem.","prompt":"___ significa “cadeira”?","accept":["O que"],"explain":"<b>O que</b> significa…? = What does … mean?","topic":"C4","pts":4},{"type":"text","ask":"Type o, a, um or uma.","prompt":"___ bandeira de Portugal é vermelha e verde.","accept":["A"],"explain":"A specific flag (Portugal's), feminine → <b>A</b> bandeira.","topic":"C4","pts":2},{"type":"text","ask":"Type o, a, um or uma.","prompt":"Isso é ___ mesa.","accept":["uma"],"explain":"Identifying an object, feminine → <b>uma</b> mesa.","topic":"C4","pts":1},{"type":"mc","ask":"What is this?","prompt":"___","options":["a água","o vinho","o sumo","a cerveja"],"explain":"A glass of water: <b>a água</b>. On a plane: <i>com gás</i> (sparkling) or <i>sem gás</i> (still).","img":"<svg viewBox=\"0 0 160 130\" role=\"img\" aria-label=\"A glass of water\"><path d=\"M52 18h56l-8 100H60Z\" fill=\"#DDEFFA\" stroke=\"#2A2A2A\" stroke-width=\"2.5\"/><path d=\"M55 48h50l-6 70H61Z\" fill=\"#9CCFF0\"/><path d=\"M68 60v40\" stroke=\"#fff\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\".7\"/></svg>","topic":"C5","pts":1},{"type":"text","ask":"Correct the mistake.","prompt":"Obrigada muito.","accept":["Muito obrigada"],"explain":"The intensifier comes first: <b>Muito obrigada!</b>","topic":"C5","pts":5},{"type":"text","ask":"Complete the dialogue.","prompt":"A: ___ alguma coisa? B: Não, obrigada.","accept":["Mais"],"explain":"<b>Mais alguma coisa?</b> = Anything else?","topic":"C5","pts":4},{"type":"text","ask":"Complete the dialogue.","prompt":"B: Um chá, ___ favor.","accept":["faz","por"],"explain":"<b>Faz favor</b> (very common in Portugal) or <b>por favor</b> = please.","topic":"C5","pts":2},{"type":"text","ask":"Write the definite article and the noun in the plural.","prompt":"telemóvel → ___","accept":["os telemóveis"],"explain":"-el → -eis: telemóvel → <b>os telemóveis</b>.","topic":"C6","pts":8},{"type":"text","ask":"Rewrite using a possessive.","prompt":"Tenho uma caneta preta. → ___ é preta.","accept":["A minha caneta"],"explain":"eu → <b>a minha</b> (feminine noun <i>caneta</i>).","topic":"C6","pts":6},{"type":"text","ask":"Answer with a possessive.","prompt":"De quem é a caneta verde? <small>(ela)</small>","accept":["É dela","Dela"],"explain":"de + ela = <b>dela</b>: <i>É dela</i> = It's hers.","topic":"C6","pts":6},{"type":"text","ask":"Answer (−).","prompt":"A: Tens água? B: ___","accept":["Não, não tenho","Não tenho"],"explain":"<i>Tens</i> (tu) → answer with <i>eu</i>: <b>Não, não tenho.</b>","topic":"C6","pts":5},{"type":"text","ask":"Type no, na or em.","prompt":"O telemóvel está ___ mala.","accept":["na"],"explain":"<i>A mala</i> → em + a = <b>na</b>.","topic":"C6","pts":4},{"type":"text","ask":"Write the correct form of ter.","prompt":"eu ___","accept":["tenho"],"explain":"<i>Ter</i> is irregular: tenho, tens, tem, temos, <b>têm</b> (plural with a circumflex). eu → <b>tenho</b>.","topic":"C6","pts":2},{"type":"mc","ask":"Your pen is on your colleague's desk, next to them.","prompt":"A minha caneta está ___ na tua secretária.","options":["aí","aqui","ali","lá"],"explain":"<i>Aqui</i> = near me, <b>aí</b> = near you, <i>ali</i> = far from both.","topic":"C6","pts":5},{"type":"multi","nRight":4,"ask":"Select ALL the words where the letter s is pronounced [ʃ].","prompt":"s → [ʃ]?","options":["nós","isto","Moscovo","Espanha","senhor","sete"],"explain":"<i>s</i> at the end of a word or before a consonant → [ʃ]: <b>nós, isto, Moscovo, Espanha</b>. At the start of a word it's [s]: <i>senhor, sete</i>.","topic":"C7","pts":6},{"type":"mc","ask":"In which word is the highlighted e pronounced differently?","prompt":"ond<b>e</b> · d<b>e</b>zoito · pr<b>e</b>to · árab<b>e</b>","options":["pr<b>e</b>to","ond<b>e</b>","d<b>e</b>zoito","árab<b>e</b>"],"explain":"Unstressed e → [ɨ] (onde, dezoito, árabe). In <b>preto</b> the e is stressed: a full [e].","topic":"C7","pts":6},{"type":"mc","ask":"Where is the stress?","prompt":"inglesa","options":["in-<b>GLE</b>-sa","<b>IN</b>-gle-sa","in-gle-<b>SA</b>","equal stress"],"explain":"Second-to-last syllable: in-<b>GLE</b>-sa. (Masculine <i>inglês</i> has a written accent on the last syllable.)","topic":"C7","pts":4}],[{"type":"multi","nRight":2,"ask":"Select ALL the correct options.","prompt":"O Pablo é ___ Espanha.","options":["de","da","do","das","em","na"],"explain":"With <i>Espanha, França, Itália, Inglaterra</i> the article is optional, so both <b>de Espanha</b> and <b>da Espanha</b> are correct. <i>Em/na</i> would mean location, not origin.","topic":"P1","pts":6},{"type":"mc","ask":"Look at the flag and complete.","prompt":"A Oksana é ___.","options":["da Ucrânia","de Ucrânia","na Ucrânia","do Ucrânia"],"explain":"<i>A Ucrânia</i> is feminine: de + a = <b>da</b> → <b>da Ucrânia</b>. <i>Na Ucrânia</i> = in Ukraine (location).","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"Flag of Ukraine\"><rect width=\"30\" height=\"10\" fill=\"#0057B7\"/><rect y=\"10\" width=\"30\" height=\"10\" fill=\"#FFD700\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"P1","pts":3},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"A Grace é ___ Filipinas.","accept":["das"],"explain":"<i>As Filipinas</i> is feminine plural: de + as = <b>das</b>.","topic":"P1","pts":6},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Vocês são ___ Estados Unidos?","accept":["dos"],"explain":"<i>Os Estados Unidos</i> is masculine plural: de + os = <b>dos</b>.","topic":"P1","pts":4},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Eles são ___ Porto.","accept":["do"],"explain":"City names usually have no article, but <i>o Porto</i> does: de + o = <b>do</b>. (Compare: <i>de Lisboa</i>.)","topic":"P1","pts":4},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Nós somos ___ Portugal.","accept":["de"],"explain":"<i>Portugal</i> never takes an article, so <i>de</i> doesn't contract: <b>de Portugal</b>. Same with Angola, Moçambique, Marrocos, Cuba.","topic":"P1","pts":3},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"O Kofi é ___ Angola.","accept":["de"],"explain":"<i>Angola</i> has no article: <b>de Angola</b>.","topic":"P1","pts":3},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"A Anna é ___ Suécia.","accept":["da"],"explain":"Origin → <i>de</i>. <i>A Suécia</i> is feminine: de + a = <b>da</b>.","topic":"P1","pts":2},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"O Takeshi é ___ Japão.","accept":["do"],"explain":"Origin → <i>de</i>. <i>O Japão</i> is masculine: de + o = <b>do</b>.","topic":"P1","pts":2},{"type":"text","ask":"Complete the question.","prompt":"___ onde é a Rita? — É do Brasil.","accept":["De"],"explain":"Asking about origin: <b>De onde</b> é…? The answer also uses <i>de</i>: <i>do Brasil</i>.","topic":"P1","pts":2},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"Berlim fica ___ Alemanha.","accept":["na"],"explain":"Location → <i>em</i>. <i>A Alemanha</i>: em + a = <b>na</b>.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"Flag of Germany\"><rect width=\"30\" height=\"7\" fill=\"#111\"/><rect y=\"6.67\" width=\"30\" height=\"6.67\" fill=\"#DD0000\"/><rect y=\"13.33\" width=\"30\" height=\"6.67\" fill=\"#FFCE00\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"P2","pts":2},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"Manila fica ___ Filipinas.","accept":["nas"],"explain":"<i>As Filipinas</i>: em + as = <b>nas</b>.","topic":"P2","pts":6},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"A Vanessa mora ___ Rio de Janeiro.","accept":["no"],"explain":"<i>O Rio de Janeiro</i> has an article: em + o = <b>no</b>.","topic":"P2","pts":6},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"Não estou ___ casa.","accept":["em"],"explain":"<i>Em casa</i> (at home) is a fixed expression without an article: <b>em casa</b>.","topic":"P2","pts":6},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"Chicago fica ___ Estados Unidos.","accept":["nos"],"explain":"<i>Os Estados Unidos</i>: em + os = <b>nos</b>.","topic":"P2","pts":4},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"Eles moram ___ Porto.","accept":["no"],"explain":"<i>O Porto</i> is one of the few cities with an article: em + o = <b>no</b>.","topic":"P2","pts":4},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"Coimbra é ___ Portugal.","accept":["em"],"explain":"No article with <i>Portugal</i>, so <b>em Portugal</b>.","topic":"P2","pts":3},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"Tóquio fica ___ Japão.","accept":["no"],"explain":"<i>O Japão</i>: em + o = <b>no</b>.","topic":"P2","pts":2},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"Moro ___ Lisboa.","accept":["em"],"explain":"Most cities take no article: <b>em Lisboa</b>, em Braga, em Paris.","topic":"P2","pts":2},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"Estou ___ escritório.","accept":["no"],"explain":"<i>O escritório</i>: em + o = <b>no</b>.","topic":"P2","pts":2},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"O telemóvel está ___ mala.","accept":["na"],"explain":"<i>A mala</i>: em + a = <b>na</b>.","topic":"P2","pts":2},{"type":"mc","ask":"Choose the preposition.","prompt":"Luanda é ___ Angola.","options":["em","na","no","de"],"explain":"<i>Angola</i> has no article: <b>em Angola</b>. <i>De Angola</i> would be origin.","topic":"P2","pts":3},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Os livros ___ alunos estão na mesa.","accept":["dos"],"explain":"Possession, masculine plural <i>os alunos</i>: de + os = <b>dos</b>.","topic":"P3","pts":6},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"As malas ___ senhoras estão aqui.","accept":["das"],"explain":"<i>As senhoras</i>: de + as = <b>das</b>.","topic":"P3","pts":6},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"É uma mesa ___ madeira.","accept":["de"],"explain":"Material uses <b>de</b> without an article: <i>de madeira</i>, <i>de vidro</i>.","topic":"P3","pts":4},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"O carro ___ Pedro é preto.","accept":["do"],"explain":"Possession → <i>de</i>. With a name we use the article: <i>o Pedro</i> → de + o = <b>do</b>.","topic":"P3","pts":3},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"A casa ___ Ana é amarela.","accept":["da"],"explain":"Possession: <i>a Ana</i> → de + a = <b>da</b>.","topic":"P3","pts":3},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Ela é professora ___ português.","accept":["de"],"explain":"Type or subject: <b>de</b> without article: <i>professora de português</i>, <i>dicionário de português</i>.","topic":"P3","pts":3},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Quero um sumo ___ laranja.","accept":["de"],"explain":"Flavour or contents: <b>de</b>: <i>sumo de laranja</i>, <i>chá de limão</i>.","topic":"P3","pts":3},{"type":"text","ask":"Answer: who does it belong to?","prompt":"De quem é a caneta? — É ___ Rita.","accept":["da"],"explain":"<i>A Rita</i> → de + a = <b>da</b>: <b>É da Rita.</b>","topic":"P3","pts":3},{"type":"mc","ask":"Choose the preposition.","prompt":"É um quadro ___ Van Gogh.","options":["de","do","da","em"],"explain":"For the author of a work the textbook uses <b>de</b> without an article: <i>um quadro de Van Gogh</i>, <i>um livro de Saramago</i>.","topic":"P3","pts":4},{"type":"text","ask":"Type em + uma as one word.","prompt":"Trabalhamos ___ empresa de automóveis.","accept":["numa"],"explain":"In European Portuguese <i>em</i> also merges with <i>um/uma</i>: em + um = <b>num</b>, em + uma = <b>numa</b>.","topic":"P4","pts":6},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Eles estão ___ férias no Algarve.","accept":["de"],"explain":"<b>Estar de férias</b> = to be on holiday (fixed expression, no article).","topic":"P4","pts":6},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Gostas ___ Porto?","accept":["do"],"explain":"<i>Gostar</i> always takes <i>de</i>: <i>o Porto</i> → de + o = <b>do</b>.","topic":"P4","pts":6},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"Vou trabalhar ___ sábado.","accept":["no"],"explain":"Days of the week take <i>em</i> + article: <i>o sábado</i> → em + o = <b>no</b>.","topic":"P4","pts":4},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"A aula é ___ segunda-feira.","accept":["na"],"explain":"<i>A segunda-feira</i> → em + a = <b>na</b>.","topic":"P4","pts":4},{"type":"text","ask":"Type em, no, na, nos or nas.","prompt":"As férias são ___ agosto.","accept":["em"],"explain":"Months take <b>em</b> without an article: <i>em agosto</i>, <i>em janeiro</i>.","topic":"P4","pts":4},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Bebo café ___ manhã.","accept":["de"],"explain":"Parts of the day: <b>de manhã</b> (but <i>à tarde</i>, <i>à noite</i>).","topic":"P4","pts":4},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Vou para o Porto ___ comboio.","accept":["de"],"explain":"Means of transport: <b>de</b> without an article: <i>de comboio, de carro, de avião</i> (but <i>a pé</i>).","topic":"P4","pts":4},{"type":"mc","ask":"Choose the preposition.","prompt":"Vamos para Paris ___ avião.","options":["de","no","em","da"],"explain":"Transport → <b>de avião</b>.","topic":"P4","pts":3},{"type":"multi","nRight":3,"ask":"Select ALL the correct sentences.","prompt":"de ou em?","options":["Sou de Lisboa.","Moro em Lisboa.","Estou no Porto.","Sou da Lisboa.","Moro no Lisboa.","Estou em Porto."],"explain":"Lisboa has no article (<i>de Lisboa, em Lisboa</i>); o Porto has one (<i>do Porto, no Porto</i>).","topic":"P5","pts":7},{"type":"multi","nRight":3,"ask":"Select ALL the forms that come from EM.","prompt":"em + …","options":["no","nas","num","do","da","dos"],"explain":"<b>no, nas, num</b> come from <i>em</i>. <i>do, da, dos</i> come from <i>de</i>.","topic":"P5","pts":3},{"type":"text","ask":"Correct the mistake.","prompt":"O Rui mora na Lisboa.","accept":["O Rui mora em Lisboa"],"explain":"Lisboa has no article: <b>em Lisboa</b>.","topic":"P5","pts":6},{"type":"text","ask":"Correct the mistake.","prompt":"A Ana é de Brasil.","accept":["A Ana é do Brasil"],"explain":"<i>O Brasil</i> needs the article: de + o = <b>do</b>.","topic":"P5","pts":5},{"type":"text","ask":"Correct the mistake.","prompt":"Estou em escritório.","accept":["Estou no escritório"],"explain":"<i>O escritório</i> needs the article: em + o = <b>no</b>.","topic":"P5","pts":5},{"type":"text","ask":"Complete the question.","prompt":"___ que cidade moras? — Em Braga.","accept":["Em"],"explain":"The answer is a location with <i>em</i>, so the question starts with <b>Em</b> que cidade…?","topic":"P5","pts":5},{"type":"text","ask":"Complete the question.","prompt":"___ que país é a Maria? — Da Grécia.","accept":["De"],"explain":"The answer is origin (<i>da Grécia</i>), so: <b>De</b> que país…?","topic":"P5","pts":5},{"type":"text","ask":"Correct the mistake.","prompt":"O livro é de o João.","accept":["O livro é do João"],"explain":"<i>De + o</i> must always merge: <b>do</b> João.","topic":"P5","pts":4},{"type":"text","ask":"Type de, do, da, dos or das.","prompt":"Gosto ___ música.","accept":["de"],"explain":"<i>Gostar de</i> + noun without article: <b>de música</b>.","topic":"P5","pts":2},{"type":"mc","ask":"“I'm from Rome, but now I'm in Paris.”","prompt":"___","options":["Sou de Roma, mas agora estou em Paris.","Sou em Roma, mas agora estou de Paris.","Sou da Roma, mas agora estou na Paris.","Estou de Roma, mas agora sou em Paris."],"explain":"Origin: <b>ser de</b>; where you are now: <b>estar em</b>. Neither city takes an article.","topic":"P5","pts":5}]]};

const $=s=>document.querySelector(s), app=$("#app");
let S=load();
function blank(){return{view:"home",book:"home",cur:0,runs:{},best:{}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.runs){s.book=s.book||"livro";return s}}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[.!?¡¿,;:"“”]/g,"").replace(/\s+/g," ").trim();
const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const plain=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const level=p=>p<=3?"Easy":p<=6?"Medium":p<=8?"Hard":"Expert";
const fmtT=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(x).padStart(2,"0")};
const earned=a=>a?(a.earned??(a.ok?a.pts:0)):0;

const VARS=()=>BOOKS[S.book];
const rk=(v,b=S.book)=>b+"-"+v;
function newRun(v){return{order:shuffle(VARS()[v].map((_,i)=>i)),opt:{},ans:{},sel:{},i:0,elapsed:0,done:false}}
const run=()=>S.runs[rk(S.cur)];
const Qs=()=>VARS()[S.cur];
function curQ(){const r=run();return{k:r.order[r.i],q:Qs()[r.order[r.i]]}}
function score(r){return Object.values(r.ans).reduce((s,a)=>s+earned(a),0)}
const correctText=q=>q.type==="mc"?q.options[0]:q.type==="multi"?q.options.slice(0,q.nRight).join(", "):q.accept[0];

/* ---------- timer ---------- */
let last=Date.now(),tick=0;
setInterval(()=>{
  const now=Date.now(),dt=now-last;last=now;
  const r=run();
  if(S.view==="quiz"&&r&&!r.done&&document.visibilityState==="visible"){r.elapsed+=Math.min(dt,5000);$("#sTime").textContent=fmtT(r.elapsed);if(++tick%5===0)save()}
},1000);
document.addEventListener("visibilitychange",()=>{last=Date.now();save()});

/* ---------- header ---------- */
function drawTop(){
  const r=run(),quiz=S.view!=="home"&&r;
  document.querySelector(".top").hidden=!quiz;
  $("#stats").hidden=!quiz;
  $("#btxt").textContent=quiz?`${S.book==="livro"?"Livro":"Caderno"} · Variante ${S.cur+1}${VNAMES[S.book]&&VNAMES[S.book][S.cur]?" · "+VNAMES[S.book][S.cur]:""}`:"Nós falaremos PT";
  if(!quiz){$("#strip").innerHTML="";return}
  const qs=Qs(),answered=Object.keys(r.ans).length;
  $("#sTot").textContent=qs.length;
  $("#sNum").textContent=Math.min(r.i+1,qs.length);
  $("#sLeft").textContent=qs.length-answered;
  $("#sScore").textContent=score(r);
  $("#sTime").textContent=fmtT(r.elapsed);
  $("#strip").innerHTML=r.order.map((k,pos)=>{const a=r.ans[k];const c=a?(a.ok?"ok":earned(a)>0?"part":"bad"):(pos===r.i&&!r.done?"cur":"");return `<span class="seg ${c}" style="flex:${qs[k].pts}"></span>`}).join("");
}

function render(){if(S.view!=="home"&&!run())S.view="home";drawTop();if(S.view==="home")return renderHome();const r=run();if(r.done)return renderResult();renderQ()}

function renderLanding(){
  if(stopGame){stopGame();stopGame=null}
  const bestOf=b=>{const xs=BOOKS[b].map((_,i)=>S.best[rk(i,b)]).filter(Boolean);return xs.length?Math.max(...xs.map(x=>x.score)):null};
  const learnedW=VOCAB.filter(learned).length,learnedV=VERBS.reduce((s,V)=>s+vlearned(V.v),0);
  const cards=[["livro","Livro do aluno",`${BOOKS.livro.length} test variants on units 1–4, ser/estar, ficar, articles and regular verbs.`,bestOf("livro")!=null?`Best: ${bestOf("livro")}/200`:"Not started"],
    ["caderno","Caderno de exercícios",`${BOOKS.caderno.length} workbook-style variants with mostly typed answers, including a de/em special.`,bestOf("caderno")!=null?`Best: ${bestOf("caderno")}/200`:"Not started"],
    ["palavras","Palavras",`${VOCAB.length} words: cards, drag-and-drop, typing, word cloud and a number trainer.`,`${learnedW} words learned`],
    ["verbos","Verbos",`${VERBS.length} verbs: tables, sentences, short texts and the Blocos game.`,`${learnedV} of ${VERBS.length*5} forms learned`]];
  app.innerHTML=`<section class="hero"><div class="hlogo">${LOGO_BIG}</div><h1 class="sr">Nós falaremos PT</h1></section>
   <div class="lgrid">${cards.map(([id,n,d,s],k)=>`<button class="lcard" data-book="${id}" style="animation-delay:${k*70}ms"><span class="lic">${ICONS[id]}</span><span class="ln">${n}</span><span class="ld">${d}</span><span class="ls">${s}</span><span class="lgo">Abrir →</span></button>`).join("")}</div>
   <p class="hint center lfoot">European Portuguese (PT-PT) · progress is saved in this browser</p>`;
  app.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>{switchBook(b.dataset.book);scrollTo({top:0})});
}

/* ---------- home ---------- */
function tabsHTML(){return `<div class="tabs" role="tablist">${["home",...Object.keys(BOOKS),"palavras","verbos"].map(b=>`<button role="tab" class="tab ${b===S.book?"on":""}" aria-selected="${b===S.book}" data-book="${b}">${b==="home"?"Início":b==="palavras"?"Palavras":b==="verbos"?"Verbos":b==="livro"?"Livro":"Caderno"}<span>${b==="home"?"menu":b==="palavras"?VOCAB.length+" words":b==="verbos"?VERBS.length+" verbs":BOOKS[b].length+" variants"}</span></button>`).join("")}</div>`}
function switchBook(b){S.book=b;save();render();try{history.replaceState(null,"","#"+b)}catch(e){}}
function renderHome(){
  if(S.book==="home"||!S.book)return renderLanding();
  if(S.book==="palavras")return renderVocab();
  if(S.book==="verbos")return renderVerbs();
  if(stopGame){stopGame();stopGame=null}
  const V=VARS(),order=TOPIC_ORDER[S.book],counts={};V[0].forEach(q=>counts[q.topic]=(counts[q.topic]||0)+1);
  const desc=S.book==="livro"
    ?"Based on the student's book, units 1–4, plus extra practice on ser/estar, ficar, articles and regular -ar/-er/-ir verbs."
    :"Based on the workbook (Caderno de exercícios): units 1–5 and Português em ação 1. Most answers are typed, like in the workbook. Variant 4 drills only the prepositions de and em with their contractions.";
  app.innerHTML=`${tabsHTML()}
  <section class="intro">
    <h1>${BOOKNAME[S.book]}</h1>
    <p>${desc} Each variant has 50 different questions worth 200 points in total. The order of questions and answers is reshuffled every time you start. The timer runs while a question is open on screen.</p>
    <div class="chips">${order.filter(t=>counts[t]).map(t=>`<span class="chip">${TOPIC[t].split(" · ").reverse()[0]} · ${counts[t]}</span>`).join("")}</div>
  </section>
  <div class="vgrid">${V.map((v,i)=>{
    const r=S.runs[rk(i)],b=S.best[rk(i)];
    const img=v.filter(q=>q.img).length,mul=v.filter(q=>q.type==="multi").length,txt=v.filter(q=>q.type==="text").length;
    let st="",btn=`<button class="btn" data-start="${i}">Start</button>`;
    if(r&&!r.done){st=`<div class="state prog">In progress · ${Object.keys(r.ans).length}/50 · ${score(r)} pts · ${fmtT(r.elapsed)}</div>`;btn=`<button class="btn" data-go="${i}">Continue</button><button class="btn ghost sm" data-start="${i}">Restart</button>`}
    else if(r&&r.done){btn=`<button class="btn ghost" data-go="${i}">Results</button><button class="btn" data-start="${i}">Retake</button>`}
    if(b)st+=`<div class="state best">Best · ${b.score}/200 in ${fmtT(b.time)}</div>`;
    return `<article class="vcard"><div class="vt"><h2>Variante ${i+1}${VNAMES[S.book]&&VNAMES[S.book][i]?`<small class="vsub">${VNAMES[S.book][i]}</small>`:""}</h2><span class="no">${S.book==="livro"?"L":"C"}${i+1}</span></div>
      <div class="meta"><b>50</b> questions · <b>200</b> pts<br>${txt} typed · ${img} with pictures · ${mul} select-all</div>${st}<div class="row">${btn}</div></article>`}).join("")}</div>`;
  app.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>switchBook(b.dataset.book));
  app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{const v=+b.dataset.start;S.cur=v;S.runs[rk(v)]=newRun(v);S.view="quiz";save();render();scrollTo({top:0})});
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.go;S.view="quiz";save();render();scrollTo({top:0})});
}
/* ---------- question ---------- */
function renderQ(){
  const r=run(),{k,q}=curQ(),a=r.ans[k],n=Qs().length;
  const dots=Array.from({length:10},(_,x)=>`<i class="${x<q.pts?"on":""}"></i>`).join("");
  const prompt=q.prompt.replace("___",`<span class="blank">${a&&q.type==="text"?esc(a.given):"&nbsp;"}</span>`);
  if(q.type!=="text"&&!r.opt[k]) r.opt[k]=q.fixed?q.options.map((_,x)=>x):shuffle(q.options.map((_,x)=>x));
  let body="";
  if(q.type==="multi"){
    const sel=a?a.picks:(r.sel[k]||[]);
    body=`<div class="multi-note">Select all that apply</div><div class="opts" role="group" aria-label="Answer options">`+r.opt[k].map((oi,x)=>{
      const on=sel.includes(oi),good=oi<q.nRight;let cls="multi",tag="";
      if(a){cls+=good?(on?" right":" missed"):(on?" wrong":" dim");tag=good&&!on?"missed":""}else if(on)cls+=" sel";
      return `<button class="opt ${cls}" data-oi="${oi}" aria-pressed="${on}" ${a?"disabled":""}><span class="k">${a?(good?"✓":(on?"✕":x+1)):(on?"✓":x+1)}</span><span class="t">${q.options[oi]}</span>${tag?`<span class="tag">${tag}</span>`:""}</button>`}).join("")+`</div>`;
  }else if(q.type==="mc"){
    body=`<div class="opts" role="group" aria-label="Answer options">`+r.opt[k].map((oi,x)=>{
      let cls="";if(a){cls=oi===0?"right":a.pick===oi?"wrong":"dim"}
      return `<button class="opt ${cls}" data-oi="${oi}" ${a?"disabled":""}><span class="k">${x+1}</span><span class="t">${q.options[oi]}</span></button>`}).join("")+`</div>`;
  }else{
    body=`<div class="textans"><label class="hint" for="ans">Type your answer</label>
      <input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" class="${a?(a.ok?"right":"wrong"):""}" ${a?"disabled":""} value="${a?esc(a.given):""}">
      ${a?"":`<div class="keys"><span class="lbl">Accents</span>${["á","à","â","ã","é","ê","í","ó","ô","õ","ú","ç"].map(c=>`<button class="key" type="button" data-c="${c}">${c}</button>`).join("")}</div>`}</div>`;
  }
  let fb="";
  if(a&&q.type==="multi"){
    const e=earned(a),cls=a.ok?"ok":e>0?"part":"bad";
    const head=a.ok?`Correct! +${q.pts} pts`:e>0?`Partly correct. +${e} of ${q.pts} pts`:"Not quite. 0 pts";
    fb=`<div class="fb ${cls}" role="status"><h3>${head}</h3>${a.ok?"":`<p>You found ${a.hits} of ${q.nRight} correct options${a.misses?` and chose ${a.misses} wrong one${a.misses>1?"s":""}`:""}. Correct answers: <span class="ans">${q.options.slice(0,q.nRight).join(", ")}</span></p><p class="hint">Scoring: each correct pick earns a share of the points; each wrong pick takes one share away.</p>`}<p>${q.explain}</p></div>`;
  }else if(a){
    fb=a.ok?`<div class="fb ok" role="status"><h3>Correct! +${q.pts} pts</h3><p>${q.explain}</p></div>`
      :`<div class="fb bad" role="status"><h3>Not quite. 0 pts</h3><p>Correct answer: <span class="ans">${plain(correctText(q))}</span>${a.near?" (check the accents)":""}</p><p>${q.explain}</p></div>`;
  }
  const lastQ=r.i===n-1;
  app.innerHTML=`<p class="unit">${TOPIC[q.topic]}</p>
  <article class="card">

      <div class="stage"><div class="flash" id="fl" tabindex="0" aria-label="Flashcard, tap to flip">

    fl.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;fl.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;g.querySelector(".swipe-r").style.opacity=Math.max(0,dx/120);g.querySelector(".swipe-l").style.opacity=Math.max(0,-dx/120)};

    const tryDrop=(chip,slot)=>{

        if(--left===0){refreshDecks();setTimeout(()=>{g.querySelector(".match").insertAdjacentHTML("afterend",`<div class="actions"><span class="hint">Round complete.</span><button class="btn" id="nr">Next round →</button></div>`);$("#nr").onclick=next;$("#nr").focus()},250)}}
      else{chip.style.transition="transform .3s";chip.style.transform="";chip.classList.remove("shake");void chip.offsetWidth;chip.classList.add("shake");
        if(slot){slot.classList.remove("bad");void slot.offsetWidth;slot.classList.add("bad");mark(items[+slot.dataset.i],false);mist++;}}
      g.querySelector(".hint b.okc").textContent=score;g.querySelector(".hint b.badc").textContent=mist;
    };
    g.querySelectorAll(".mchip").forEach(chip=>{
      let sx,sy,dx=0,dy=0,down=false;
      chip.onpointerdown=e=>{down=true;sx=e.clientX;sy=e.clientY;dx=dy=0;chip.setPointerCapture(e.pointerId);chip.style.transition="none";chip.classList.add("drag")};
      chip.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;chip.style.transform=`translate(${dx}px,${dy}px) scale(1.05)`;
        g.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));chip.style.pointerEvents="none";const el=document.elementFromPoint(e.clientX,e.clientY);chip.style.pointerEvents="";const s=el&&el.closest(".slot:not(.ok)");if(s)s.classList.add("over")};
      chip.onpointerup=e=>{if(!down)return;down=false;chip.classList.remove("drag");g.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));
        if(Math.abs(dx)+Math.abs(dy)<6){g.querySelectorAll(".mchip").forEach(c=>c.classList.remove("sel"));chip.style.transform="";sel=chip;chip.classList.add("sel");return}
        chip.style.pointerEvents="none";const el=document.elementFromPoint(e.clientX,e.clientY);chip.style.pointerEvents="";tryDrop(chip,el&&el.closest(".slot:not(.ok)"))};
      chip.onpointercancel=()=>{down=false;chip.style.transform=""};

    $("#hint").onclick=()=>{hints++;let n=0;$("#rv").textContent=[...target].map(c=>/[\s\-\/!?.…()]/.test(c)?c:(n++<hints?c:"_")).join("")};
    const check=()=>{
      if(answered){q.shift();draw();return}
      const g2=vnorm(inp.value);if(!g2)return;answered=true;
      const good=acc.includes(g2),near=!good&&acc.map(strip).includes(strip(g2));
      const tc=$("#tc");tc.classList.remove("ok","no");void tc.offsetWidth;tc.classList.add(good?"ok":"no");
      if(good){ok++;streak++;mark(w,hints<2)}else{bad++;streak=0;mark(w,false);q.splice(Math.min(q.length,5),0,w)}
      $("#rv").textContent=w.pt;inp.disabled=true;speak(w.pt);
      $("#tfb").innerHTML=`<p class="${good?"okt":"badt"}"><b>${good?"Correct!":near?"Almost: check the accents.":"Not quite."}</b> ${esc(w.pt)} ${spkBtn(w.pt)}</p>${w.ex?`<p class="ex">${esc(w.ex)}</p>`:""}${w.note?`<p class="note">${esc(w.note)}</p>`:""}`;
      $("#tchk").textContent="Next →";$("#tchk").focus();$("#hint").disabled=true;
    };
    $("#tchk").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};
    $("#tchk").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};
  }
  draw();
}

/* ---------- 4. Nuvem: catch the floating words ---------- */
function gCloud(g,P){
  const best=VS().best||{};
  g.innerHTML=`<div class="cloudmenu">
      <button class="cmode" data-cm="tr"><b>Catch the translation</b><span>An English word appears. Tap its Portuguese twin among the floating words.</span><span class="hint">Best: ${best.tr||0}</span></button>
      <button class="cmode" data-cm="cat"><b>Catch the category</b><span>Catch every word that fits: colours, -er verbs, feminine nouns… Uses all topics.</span><span class="hint">Best: ${best.cat||0}</span></button></div>`;
  g.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>playCloud(g,b.dataset.cm));
}
function playCloud(g,mode){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const P=mode==="tr"?pool():(()=>{const s=new Set();return VOCAB.filter(w=>!s.has(w.pt)&&s.add(w.pt))})();
  if(mode==="tr"&&P.length<6){g.innerHTML=`<p class="hint">Select topics with at least 6 words.</p>`;return}
  let score=0,lives=3,time=60,combo=0,target=null,cat=null,need=0,bubbles=[],raf=0,tmr=0,over=false;
  g.innerHTML=`<div class="cloudhud"><span class="lives" id="lv"></span><span class="ctarget" id="ct"></span><span class="cscore"><b id="cs">0</b> pts · <b id="cti">60</b>s</span></div>
    <div class="cloud" id="cl"></div>`;
  const cl=$("#cl");
  const W=()=>cl.clientWidth,H=()=>cl.clientHeight;
  const hud=()=>{$("#lv").textContent="♥".repeat(lives)+"♡".repeat(3-lives);$("#cs").textContent=score;$("#cti").textContent=time};
  function spawn(w){
    const el=document.createElement("button");el.className="bub";el.type="button";const t0=w.pt.split(" / ")[0];el.textContent=mode==="cat"?bare(t0):t0;cl.appendChild(el);
    const bw=el.offsetWidth,bh=el.offsetHeight,sp=reduce?.25:(.5+Math.random()*.7);const a=Math.random()*Math.PI*2;
    let x=0,y=0;for(let k=0;k<30;k++){x=Math.random()*Math.max(1,W()-bw);y=Math.random()*Math.max(1,H()-bh);if(!bubbles.some(o=>!o.dead&&x<o.x+o.bw+6&&x+bw+6>o.x&&y<o.y+o.bh+6&&y+bh+6>o.y))break}
    const b={w,el,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,bw,bh,dead:false};
    el.onclick=()=>hit(b);bubbles.push(b);return b;
  }
  function pickTarget(){const live=bubbles.filter(b=>!b.dead);target=live[Math.floor(Math.random()*live.length)];$("#ct").innerHTML=`Catch: <b>${esc(target.w.en)}</b>`}
  function newCat(){
    bubbles.forEach(b=>b.el.remove());bubbles=[];
    const opts=CATS.filter(c=>P.filter(c.f).length>=4&&c!==cat);cat=opts[Math.floor(Math.random()*opts.length)];
    const yes=shuffle(P.filter(cat.f)).slice(0,4),no=shuffle(P.filter(w=>!cat.f(w))).slice(0,5);need=yes.length;
    shuffle([...yes,...no]).forEach(spawn);$("#ct").innerHTML=`Catch <b>${cat.label}</b> · <span id="nd">${need}</span> left`;
  }
  function fresh(){const on=new Set(bubbles.filter(b=>!b.dead).map(b=>b.w.pt));const c=shuffle(P).find(w=>!on.has(w.pt));return c||P[0]}
  function hit(b){
    if(over||b.dead)return;
    const good=mode==="tr"?b===target:cat.f(b.w);
    if(good){b.dead=true;combo++;const add=10+Math.min(combo-1,5)*2;score+=add;b.el.classList.add("popped");b.el.insertAdjacentHTML("beforeend",`<span class="plus">+${add}</span>`);mark(b.w,true);speak(b.w.pt);
      setTimeout(()=>{b.el.remove();bubbles=bubbles.filter(x=>x!==b);
        if(mode==="tr"){spawn(fresh());pickTarget()}else if(--need<=0){score+=20;newCat()}else{const nd=$("#nd");if(nd)nd.textContent=need}hud()},280)}
    else{combo=0;lives--;b.el.classList.remove("wrongb");void b.el.offsetWidth;b.el.classList.add("wrongb");cl.classList.remove("hurt");void cl.offsetWidth;cl.classList.add("hurt");
      if(mode==="tr")mark(target.w,false);hud();if(lives<=0)end()}
    hud();
  }
  function loop(){
    const w=W(),h=H();
    bubbles.forEach(b=>{if(b.dead)return;b.x+=b.vx;b.y+=b.vy;if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)}if(b.x>w-b.bw){b.x=w-b.bw;b.vx=-Math.abs(b.vx)}if(b.y<0){b.y=0;b.vy=Math.abs(b.vy)}if(b.y>h-b.bh){b.y=h-b.bh;b.vy=-Math.abs(b.vy)}b.el.style.transform=`translate(${b.x}px,${b.y}px)`});
    raf=requestAnimationFrame(loop);
  }
  function end(){
    if(over)return;over=true;cancelAnimationFrame(raf);clearInterval(tmr);
    const v=VS();v.best=v.best||{};const rec=score>(v.best[mode]||0);if(rec)v.best[mode]=score;save();refreshDecks();
    cl.insertAdjacentHTML("beforeend",`<div class="cover"><h2>${lives<=0?"Out of lives":"Time's up"}</h2><p class="bigscore">${score} pts</p>${rec?`<p class="okt"><b>New best!</b></p>`:`<p class="hint">Best: ${v.best[mode]}</p>`}<div class="row"><button class="btn" id="pa">Play again</button><button class="btn ghost" id="pm">Change game</button></div></div>`);
    $("#pa").onclick=()=>playCloud(g,mode);$("#pm").onclick=()=>gCloud(g,P);
  }
  if(mode==="tr"){shuffle(P).slice(0,8).forEach(spawn);pickTarget()}else newCat();
  hud();loop();
  tmr=setInterval(()=>{if(document.visibilityState!=="visible")return;time--;hud();if(time<=0)end()},1000);
  stopGame=()=>{over=true;cancelAnimationFrame(raf);clearInterval(tmr)};
}

/* ===== shared session runner (used by Palavras: Números / Teste, Verbos: Teste) ===== */
const ACC=["á","à","â","ã","é","ê","í","ó","ô","õ","ú","ç"];
const accentKeys=()=>`<div class="keys"><span class="lbl">Accents</span>${ACC.map(c=>`<button class="key" type="button" data-c="${c}">${c}</button>`).join("")}</div>`;
function bindKeys(root,inp){root.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const i=typeof inp==="function"?inp():inp;if(!i||i.disabled)return;const s=i.selectionStart??i.value.length,e=i.selectionEnd??s;i.value=i.value.slice(0,s)+b.dataset.c+i.value.slice(e);i.focus();i.setSelectionRange(s+1,s+1)})}
const KIND={type:"Type",mc:"Choose",tiles:"Build",listen:"Listen"};
// item: {kind:"type"|"mc"|"tiles"|"listen", label, prompt(html), accept[] | options[]+correct | tiles[]+answer, show, say, explain, onResult(ok)}
function runSession(g,items,title,again){
  let i=0,ok=0,streak=0,best=0;
  const typedShare=Math.round(items.filter(x=>x.kind==="type"||x.kind==="listen").length/items.length*100);
  function draw(){
    if(i>=items.length){g.innerHTML=`<div class="gcard done"><h2>${ok} / ${items.length}</h2><p>Best streak: ${best}</p><button class="btn" id="re">New set</button></div>`;$("#re").onclick=again;refreshDecks&&refreshDecks();typeof refreshVerbChips==="function"&&refreshVerbChips();return}
    const it=items[i];let body="";
    if(it.kind==="type"||it.kind==="listen")body=`${it.kind==="listen"?`<button class="btn ghost" id="play" type="button">${SPK} Play again</button>`:""}<input id="sin" class="sin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="${it.numeric?"numeric":"text"}" placeholder="${esc(it.ph||"Type here")}">${it.numeric?"":accentKeys()}<div class="actions"><span></span><button class="btn" id="schk">Check</button></div>`;
    else if(it.kind==="mc")body=`<div class="tiles">${it.options.map((o,k)=>`<button class="tile" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
    else body=`<div class="built" id="built"><span class="hint">Tap the words in order</span></div><div class="tiles tw">${it.tiles.map((t,k)=>`<button class="tile tw" data-k="${k}">${esc(t)}</button>`).join("")}</div><div class="actions"><button class="btn ghost sm" id="undo">Undo</button><button class="btn" id="schk" disabled>Check</button></div>`;
    g.innerHTML=`<div class="cardtop"><span class="hint">${esc(title)} · ${i+1} / ${items.length} · <b class="okc">${ok}</b> correct · streak <b>${streak}</b></span><span class="hint">${typedShare}% typed</span></div>
      <div class="gcard sentc" id="sc"><span class="tl">${KIND[it.kind]} · ${esc(it.label)}</span><div class="sent">${it.prompt}</div>${body}<div id="sfb"></div></div>`;
    const finish=(good,given)=>{
      const sc=$("#sc");sc.classList.remove("ok","no");void sc.offsetWidth;sc.classList.add(good?"ok":"no");
      if(good){ok++;streak++;best=Math.max(best,streak)}else streak=0;it.onResult&&it.onResult(good);
      if(it.say)speak(it.say);
      const near=!good&&given&&it.accept&&it.accept.map(strip).includes(strip(vnorm(given)));
      $("#sfb").innerHTML=`<p class="${good?"okt":"badt"}"><b>${good?"Correct!":near?"Almost: check the accents.":"Not quite."}</b> ${good?"":`Answer: <b>${esc(it.show)}</b>`} ${it.say?spkBtn(it.say):""}</p>${it.explain?`<p class="hint">${it.explain}</p>`:""}<div class="actions"><span></span><button class="btn" id="snx">${i+1<items.length?"Next →":"Finish"}</button></div>`;
      g.querySelectorAll(".tile").forEach(t=>t.disabled=true);$("#snx").onclick=()=>{i++;draw()};$("#snx").focus();
    };
    if(it.kind==="type"||it.kind==="listen"){const inp=$("#sin");inp.focus();bindKeys(g,inp);
      if(it.kind==="listen"){const p=()=>speak(it.say);$("#play").onclick=p;setTimeout(p,250)}
      const chk=()=>{if(!inp.value.trim()||inp.disabled)return;inp.disabled=true;$("#schk").remove();finish(it.accept.includes(vnorm(inp.value)),inp.value)};
      $("#schk").onclick=chk;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();chk()}}}
    else if(it.kind==="mc")g.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const k=+t.dataset.k,good=k===it.correct;t.classList.add(good?"right":"wrong");if(!good)g.querySelector(`.tile[data-k="${it.correct}"]`).classList.add("right");finish(good)});
    else{const picked=[];const built=$("#built");
      const redraw=()=>{built.innerHTML=picked.length?picked.map(k=>`<span class="bw">${esc(it.tiles[k])}</span>`).join(" "):`<span class="hint">Tap the words in order</span>`;$("#schk").disabled=!picked.length;g.querySelectorAll(".tile.tw").forEach(t=>t.classList.toggle("used",picked.includes(+t.dataset.k)))};
      g.querySelectorAll(".tile.tw").forEach(t=>t.onclick=()=>{const k=+t.dataset.k;if(picked.includes(k))return;picked.push(k);redraw()});
      $("#undo").onclick=()=>{picked.pop();redraw()};
      $("#schk").onclick=()=>{const s=picked.map(k=>it.tiles[k]).join(" ");$("#undo").remove();$("#schk").remove();finish(vnorm(s)===vnorm(it.answer),s)}}
  }
  draw();
}

/* ===== Números ===== */
const NU=["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","catorze","quinze","dezasseis","dezassete","dezoito","dezanove"];
const NT=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const NH=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
const numW=n=>{if(n===1000)return"mil";if(n===100)return"cem";const p=[];if(n>=100){p.push(NH[Math.floor(n/100)]);n%=100}if(n>0){if(n<20)p.push(NU[n]);else{p.push(NT[Math.floor(n/10)]);if(n%10)p.push(NU[n%10])}}return p.join(" e ")||"zero"};
const NRANGES=[["a","0–20",0,20],["b","21–100",21,100],["c","101–1000",101,1000],["all","Mix",0,1000]];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function numTip(n){if(n<=20)return "0–19 have their own words. European spelling: dezasseis, dezassete, dezanove.";if(n===100)return "Exactly 100 is <i>cem</i>; 101–199 use <i>cento e…</i>.";if(n===1000)return "1000 = <i>mil</i>.";return "Join every part with <b>e</b>: hundreds <i>e</i> tens <i>e</i> units. Irregular hundreds: duzentos, trezentos, quinhentos.";}
function gNumbers(g){
  const v=VS(),r=v.nrange||"all";
  g.innerHTML=`<div class="cardtop"><span class="hint">Range</span><span class="seg2">${NRANGES.map(([id,l])=>`<button class="btn ${r===id?"":"ghost"} sm" data-nr="${id}">${l}</button>`).join("")}</span></div><div id="ng"></div>`;
  g.querySelectorAll("[data-nr]").forEach(b=>b.onclick=()=>{v.nrange=b.dataset.nr;save();gNumbers(g)});
  const [, ,lo,hi]=NRANGES.find(x=>x[0]===r);const canSay=typeof speechSynthesis!=="undefined";
  const used=new Set(),pickN=()=>{let n,k=0;do{n=rnd(lo,hi);if(r==="c"&&Math.random()<.25)n=rnd(1,9)*100+(Math.random()<.5?0:rnd(1,99))}while(used.has(n)&&k++<50);used.add(n);return n};
  const kinds=["w","w","w","d","d",canSay?"l":"w","b","b"],items=[];
  for(let k=0;k<15;k++){const n=pickN(),w=numW(n),kd=kinds[k%kinds.length];
    const base={say:w,explain:`${n} = <b>${w}</b>. ${numTip(n)}`,onResult:ok=>{const card=VOCAB.find(x=>x.t==="num"&&x.pt===w);if(card)mark(card,ok)}};
    if(kd==="w")items.push({...base,kind:"type",label:"write in words",prompt:`<span class="numbig">${n}</span>`,accept:[vnorm(w)],show:w,ph:"por extenso"});
    else if(kd==="d")items.push({...base,kind:"type",numeric:true,label:"write the digits",prompt:`<span class="numw">${w}</span>`,accept:[String(n)],show:String(n),ph:"0–1000"});
    else if(kd==="l")items.push({...base,kind:"listen",label:"write what you hear",prompt:`<span class="hint">Listen and type the number, in digits or in words.</span>`,accept:[String(n),vnorm(w)],show:`${n} (${w})`,ph:"e.g. 921 or novecentos e vinte e um"});
    else{const parts=w.split(" ");const near=numW(Math.min(1000,Math.max(0,n+(Math.random()<.5?rnd(1,9):rnd(10,90))*(Math.random()<.5?1:-1)))).split(" ").filter(p=>p!=="e"&&!parts.includes(p));
      const tiles=shuffle([...parts,...near.slice(0,2)]);items.push({...base,kind:"tiles",label:"build the number",prompt:`<span class="numbig">${n}</span>`,tiles,answer:w,show:w})}}
  runSession($("#ng"),shuffle(items),"Números "+NRANGES.find(x=>x[0]===r)[1],()=>gNumbers(g));
}

/* ===== Palavras · Teste misto (40% typed) ===== */
function gTest(g,P){
  if(P.length<6){g.innerHTML=`<p class="hint">Select topics with at least 6 words.</p>`;return}
  const words=shuffle(P).slice(0,15),items=[];
  words.forEach((w,k)=>{
    const others=n=>shuffle(P.filter(x=>x.en!==w.en)).slice(0,n);
    const base={say:w.pt.split(" / ")[0],explain:[w.ex,w.note].filter(Boolean).map(esc).join(" · "),onResult:ok=>mark(w,ok)};
    if(k<6)items.push({...base,kind:"type",label:tagLabel(w.t)||"word",prompt:`<span class="en">${esc(w.en)}</span>`,accept:[...new Set(VOCAB.filter(x=>x.en===w.en).flatMap(vAccept))],show:w.pt,ph:"em português"});
    else if(k<11){const o=shuffle([w,...others(3)]);items.push({...base,kind:"mc",label:"what does it mean?",prompt:esc(w.pt),options:o.map(x=>x.en),correct:o.indexOf(w),show:w.en})}
    else{const o=shuffle([w,...others(3)]);items.push({...base,kind:"mc",label:"how do you say it?",prompt:`<span class="en">${esc(w.en)}</span>`,options:o.map(x=>x.pt),correct:o.indexOf(w),show:w.pt})}
  });
  runSession(g,shuffle(items),"Teste",()=>gTest(g,shuffle(pool())));
}

const VGROUPS=[["irr","Irregulares"],["ar","Verbos em -ar"],["er","Verbos em -er"],["ir","Verbos em -ir"]];
const VBS=()=>S.verbs||(S.verbs={sel:["ser","estar","ter","ir","poder","fazer"],mode:"table",cur:"ser",stats:{}});
const vby=v=>VERBS.find(x=>x.v===v);
const vk=(v,p)=>v+"|"+p;
function vmark(v,p,ok){const st=VBS().stats,k=vk(v,p),s=st[k]||(st[k]={s:0,r:0,w:0});if(ok){s.r++;s.s++}else{s.w++;s.s=0}save()}
const vlearned=v=>[0,1,2,3,4].filter(p=>{const s=VBS().stats[vk(v,p)];return s&&s.s>=2}).length;
function hiForm(V,i){const f=V.f[i];if(V.g==="irr")return `<b class="irr">${esc(f)}</b>`;const st=V.v.replace(/-se$/,"").slice(0,-2);
  if(f.startsWith(st)&&V.f[i]===vreg(V.v.replace(/-se$/,""))[i])return esc(st)+`<b>${esc(f.slice(st.length))}</b>`;return `<b class="irr">${esc(f)}</b>`}
const VMODES=[["table","Tabela","Learn the forms"],["link","Ligar","Pronoun ↔ form"],["choose","Escolher","Pick the form"],["write","Escrever","Type the form"],["who","Quem?","Find the subject"],["text","Texto","Verbs in a text"],["test","Teste","Mixed · 40% typed"],["blocks","Blocos","Falling-blocks game"]];
function sentences(){
  const out=[];VBS().sel.forEach(v=>{const V=vby(v);if(!V.c)return;V.c.forEach(c=>[0,1,2,3,4].forEach(p=>{const subs=SUBJ5[p];out.push({V,p,c,subj:subs[(c.length+p)%subs.length]})}))});return out;
}

/* ---- Tabela: study + fill the table ---- */
function vTable(g){
  const st=VBS(),V=vby(st.cur),idx=st.sel.indexOf(st.cur);
  const nav=`<div class="vnav"><button class="btn ghost sm" id="vp" ${st.sel.length<2?"disabled":""}>←</button><div class="vtitle"><b>${V.v}</b><span>${esc(V.en)}</span></div><button class="btn ghost sm" id="vn" ${st.sel.length<2?"disabled":""}>→</button></div>`;
  const go=d=>{st.cur=st.sel[(idx+d+st.sel.length)%st.sel.length];save();vTable(g)};
  function study(){
    g.innerHTML=nav+`<div class="vtable">${PERS.map((p,i)=>`<div class="vrow" style="animation-delay:${i*60}ms"><span class="vp">${p}</span><span class="vf">${hiForm(V,i)}</span>${spkBtn((i===2?"ele ":i===4?"eles ":p+" ")+V.f[i])}</div>`).join("")}</div>
      ${V.note?`<p class="vnote">${esc(V.note)}</p>`:V.g!=="irr"?`<p class="vnote">Regular -${V.g} verb: stem <b>${esc(V.v.slice(0,-2))}-</b> + ${REG[V.g].map(e=>"-"+e).join(", ")}.</p>`:""}
      <div class="actions"><button class="btn ghost" id="vsay">Listen to all</button><button class="btn" id="vtest">Test me →</button></div>`;
    $("#vp").onclick=()=>go(-1);$("#vn").onclick=()=>go(1);
    $("#vsay").onclick=()=>{try{speechSynthesis.cancel()}catch(e){};PERS.forEach((p,i)=>{try{const u=new SpeechSynthesisUtterance((i===2?"ele ":i===4?"eles ":p+" ")+V.f[i]);u.lang="pt-PT";if(ptVoice)u.voice=ptVoice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}})};
    $("#vtest").onclick=test;
  }
  function test(){
    g.innerHTML=nav+`<p class="hint center">Fill in the whole table, then check.</p><div class="vtable">${PERS.map((p,i)=>`<div class="vrow"><label class="vp" for="vi${i}">${p}</label><input class="vin" id="vi${i}" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="vres" id="vr${i}"></span></div>`).join("")}</div>
      <div class="keys"><span class="lbl">Accents</span>${["á","à","â","ã","é","ê","í","ó","ô","õ","ú","ç"].map(c=>`<button class="key" type="button" data-c="${c}">${c}</button>`).join("")}</div>
      <div class="actions"><button class="btn ghost" id="vback">Show table</button><button class="btn" id="vchk">Check</button></div>`;
    $("#vp").onclick=()=>go(-1);$("#vn").onclick=()=>go(1);
    let last=$("#vi0");last.focus();g.querySelectorAll(".vin").forEach(x=>{x.onfocus=()=>last=x;x.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const n=$("#vi"+(+x.dataset.i+1));n?n.focus():$("#vchk").click()}}});
    g.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const i=last,s=i.selectionStart??i.value.length,e=i.selectionEnd??s;i.value=i.value.slice(0,s)+b.dataset.c+i.value.slice(e);i.focus();i.setSelectionRange(s+1,s+1)});
    $("#vback").onclick=study;
    $("#vchk").onclick=()=>{
      if($("#vchk").dataset.done){$("#vchk").dataset.done="";return test()}
      let n=0;g.querySelectorAll(".vin").forEach((x,i)=>{const ok=norm(x.value)===norm(V.f[i]);n+=ok;vmark(V.v,i,ok);x.disabled=true;const row=x.closest(".vrow");
        setTimeout(()=>{row.classList.add(ok?"ok":"no");$("#vr"+i).innerHTML=ok?"✓":`<b>${esc(V.f[i])}</b>`},i*90)});
      setTimeout(()=>{refreshVerbChips();g.querySelector(".actions").insertAdjacentHTML("beforebegin",`<p class="center ${n===5?"okt":"badt"}"><b>${n} / 5 correct.</b> ${n===5?"Perfeito!":"Look at the corrections, then try again."}</p>`)},500);
      $("#vchk").textContent="Try again";$("#vchk").dataset.done="1";
      if(n===5&&st.sel.length>1){$("#vback").textContent="Next verb →";$("#vback").onclick=()=>go(1)}
    };
  }
  study();
}

/* ---- Ligar: drag forms onto pronouns ---- */
function vLink(g){
  const st=VBS();let score=0,mist=0,round=0;
  function next(){
    const V=vby(shuffle(st.sel)[0]);round++;let left=5,sel=null;
    g.innerHTML=`<div class="cardtop"><span class="hint">Round ${round} · <b class="okc">${score}</b> matched · <b class="badc">${mist}</b> mistakes</span></div>
      <div class="vtitle center"><b>${V.v}</b><span>${esc(V.en)}</span></div>
      <p class="hint">Drag each form onto its pronoun (or tap a form, then tap the pronoun).</p>
      <div class="match"><div class="slots">${PERS.map((p,i)=>`<div class="slot" data-i="${i}"><span class="sp">${p}</span><span class="drop">…</span></div>`).join("")}</div>
      <div class="chips2">${shuffle([0,1,2,3,4]).map(i=>`<div class="mchip" data-i="${i}" tabindex="0">${esc(V.f[i])}</div>`).join("")}</div></div>`;
    const tryDrop=(chip,slot)=>{const i=+chip.dataset.i;
      if(slot&&+slot.dataset.i===i){slot.classList.add("ok","pop");slot.querySelector(".drop").textContent=V.f[i];chip.remove();vmark(V.v,i,true);score++;speak(V.f[i]);
        if(--left===0){refreshVerbChips();g.querySelector(".match").insertAdjacentHTML("afterend",`<div class="actions"><span class="hint">All five forms matched.</span><button class="btn" id="nr">Next verb →</button></div>`);$("#nr").onclick=next}}
      else{chip.style.transition="transform .3s";chip.style.transform="";chip.classList.remove("shake");void chip.offsetWidth;chip.classList.add("shake");
        if(slot){slot.classList.remove("bad");void slot.offsetWidth;slot.classList.add("bad");vmark(V.v,+slot.dataset.i,false);mist++}}
      g.querySelector(".okc").textContent=score;g.querySelector(".badc").textContent=mist};
    g.querySelectorAll(".mchip").forEach(chip=>{let sx,sy,dx=0,dy=0,down=false;
      chip.onpointerdown=e=>{down=true;sx=e.clientX;sy=e.clientY;dx=dy=0;chip.setPointerCapture(e.pointerId);chip.style.transition="none";chip.classList.add("drag")};
      chip.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;chip.style.transform=`translate(${dx}px,${dy}px) scale(1.05)`;g.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));chip.style.pointerEvents="none";const el=document.elementFromPoint(e.clientX,e.clientY);chip.style.pointerEvents="";const s=el&&el.closest(".slot:not(.ok)");if(s)s.classList.add("over")};
      chip.onpointerup=e=>{if(!down)return;down=false;chip.classList.remove("drag");g.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));
        if(Math.abs(dx)+Math.abs(dy)<6){g.querySelectorAll(".mchip").forEach(c=>c.classList.remove("sel"));chip.style.transform="";sel=chip;chip.classList.add("sel");return}
        chip.style.pointerEvents="none";const el=document.elementFromPoint(e.clientX,e.clientY);chip.style.pointerEvents="";tryDrop(chip,el&&el.closest(".slot:not(.ok)"))};
      chip.onpointercancel=()=>{down=false;chip.style.transform=""};
      chip.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();g.querySelectorAll(".mchip").forEach(c=>c.classList.remove("sel"));sel=chip;chip.classList.add("sel")}}});
    g.querySelectorAll(".slot").forEach(s=>{s.tabIndex=0;const act=()=>{if(sel&&sel.isConnected&&!s.classList.contains("ok")){const c=sel;sel=null;c.classList.remove("sel");tryDrop(c,s)}};s.onclick=act;s.onkeydown=e=>{if(e.key==="Enter")act()}});
  }
  next();
}

/* ---- Frases: choose / write / who ---- */
function vSent(g,mode){
  const all=sentences();
  if(!all.length){g.innerHTML=`<p class="hint">Select at least one verb other than chamar-se.</p>`;return}
  const N=12;let items=shuffle(all).slice(0,N),i=0,ok=0,streak=0,best=0;
  function draw(){
    if(i>=items.length){g.innerHTML=`<div class="gcard done"><h2>${ok} / ${items.length}</h2><p>Best streak: ${best}</p><button class="btn" id="re">New set of sentences</button></div>`;$("#re").onclick=()=>vSent(g,mode);refreshVerbChips();return}
    const it=items[i],V=it.V,form=V.f[it.p],full=`${it.subj} ${form} ${it.c}`;
    let body,prompt;
    if(mode==="who"){prompt=`<span class="blank">&nbsp;</span> ${esc(form)} ${esc(it.c)}`;
      body=`<div class="tiles">${PSHORT.map((s,k)=>`<button class="tile" data-k="${k}">${s}</button>`).join("")}</div>`}
    else{prompt=`${esc(it.subj)} <span class="blank">&nbsp;</span> ${esc(it.c)}`;
      body=mode==="choose"
        ?`<div class="tiles">${shuffle(uniqForms(V,it.p)).map(f=>`<button class="tile" data-f="${esc(f)}">${esc(f)}</button>`).join("")}</div>`
        :`<input id="sin" class="sin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(V.v)} → ?"><div class="keys"><span class="lbl">Accents</span>${["á","à","â","ã","é","ê","í","ó","ô","õ","ú","ç"].map(c=>`<button class="key" type="button" data-c="${c}">${c}</button>`).join("")}</div><div class="actions"><span></span><button class="btn" id="schk">Check</button></div>`}
    g.innerHTML=`<div class="cardtop"><span class="hint">${i+1} / ${items.length} · <b class="okc">${ok}</b> correct · streak <b>${streak}</b></span></div>
      <div class="gcard sentc" id="sc"><span class="tl">${mode==="who"?"Who is it? Pick the pronoun":`${esc(V.v)} · ${esc(V.en)}`}</span><p class="sent">${prompt}</p>${body}<div id="sfb"></div></div>`;
    const finish=(good,given)=>{
      const sc=$("#sc");sc.classList.remove("ok","no");void sc.offsetWidth;sc.classList.add(good?"ok":"no");
      vmark(V.v,it.p,good);if(good){ok++;streak++;best=Math.max(best,streak)}else streak=0;
      g.querySelector(".sent").innerHTML=`${esc(it.subj)} <b class="${good?"okt":"badt"}">${esc(form)}</b> ${esc(it.c)} ${spkBtn(full)}`;speak(full);
      $("#sfb").innerHTML=`<p class="${good?"okt":"badt"}"><b>${good?"Correct!":"Not quite."}</b> ${good?"":`${mode==="who"?`“${esc(form)}” is the <b>${PERS[it.p]}</b> form.`:`${PERS[it.p]} → <b>${esc(form)}</b>${given&&strip(norm(given))===strip(norm(form))?" (check the accents)":""}.`}`}</p>
        <p class="hint">${esc(V.v)}: ${V.f.map((f,k)=>k===it.p?`<b>${esc(f)}</b>`:esc(f)).join(", ")}</p>
        <div class="actions"><span></span><button class="btn" id="snx">${i+1<items.length?"Next →":"Finish"}</button></div>`;
      g.querySelectorAll(".tile").forEach(t=>t.disabled=true);
      $("#snx").onclick=()=>{i++;draw()};$("#snx").focus();
    };
    if(mode==="who")g.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const k=+t.dataset.k,good=k===it.p;t.classList.add(good?"right":"wrong");if(!good)g.querySelector(`.tile[data-k="${it.p}"]`).classList.add("right");finish(good)});
    else if(mode==="choose")g.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const good=t.dataset.f===form;t.classList.add(good?"right":"wrong");if(!good)g.querySelectorAll(".tile").forEach(x=>{if(x.dataset.f===form)x.classList.add("right")});finish(good,t.dataset.f)});
    else{const inp=$("#sin");inp.focus();
      g.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+1,s+1)});
      const chk=()=>{if(!inp.value.trim()||inp.disabled)return;inp.disabled=true;$("#schk").remove();finish(norm(inp.value)===norm(form),inp.value)};
      $("#schk").onclick=chk;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();chk()}}}
  }
  draw();
}

 {t:"Na cidade",p:["— Vocês ",B("morar","moram")," no centro? — Não, nós ",B("viver","vivemos")," em Sintra, mas ",B("trabalhar","trabalhamos")," em Lisboa. Todos os dias ",B("ir","vamos")," de comboio. A viagem ",B("ser","é")," bonita."]},
 {t:"Apresentações",p:["— Olá! Como te ",B("chamar-se","chamas"),"? — ",B("chamar-se","Chamo-me")," Sofia. E tu? — Eu ",B("ser","sou")," o Tiago. De onde ",B("ser","és"),"? — ",B("ser","Sou")," do Porto, mas ",B("estar","estou")," em Coimbra esta semana."]}
];
function trackForm(v,f){const V=vby(v);if(!V)return null;const i=V.f.indexOf(f.toLowerCase());return i<0?null:i}

const TEXTS_HARD=[
 {t:"A Sofia em Lisboa",p:["A Sofia ",B("ser","é")," brasileira, mas ",B("viver","vive")," em Lisboa há dois anos. Ela ",B("trabalhar","trabalha")," numa escola e ",B("ensinar","ensina")," inglês. Ao fim de semana, ",B("ir","vai")," à praia com os amigos e ",B("comer","come")," sardinhas."]},
 {t:"Uma conversa",p:["— Tu ",B("falar","falas")," inglês? — ",B("falar","Falo"),", mas não muito bem. ",B("perceber","Percebo")," quase tudo, mas ",B("ter","tenho")," dificuldade em falar. — Nós ",B("poder","podemos")," praticar juntos às sextas! E onde ",B("estudar","estudas"),"?"]},
 {t:"O sábado da família Costa",p:["Aos sábados, os Costa ",B("acordar","acordam")," tarde. O pai ",B("fazer","faz")," o pequeno-almoço e as crianças ",B("brincar","brincam")," no jardim. À tarde, eles ",B("ir","vão")," ao parque e ",B("ficar","ficam")," lá até às seis. À noite, a família ",B("jantar","janta")," em casa."]},
 {t:"No escritório",p:["Eu ",B("chegar","chego")," ao escritório às nove. Primeiro, ",B("abrir","abro")," o computador e ",B("responder","respondo")," aos emails. Os meus colegas ",B("beber","bebem")," café comigo. Ao meio-dia, nós ",B("almoçar","almoçamos")," juntos. Às seis, ",B("voltar","volto")," para casa."]},
 {t:"Mensagem para a Inês",p:["Olá, Inês! Hoje não ",B("poder","posso")," ir à aula porque ",B("estar","estou")," doente. ",B("ter","Tenho")," febre e ",B("sentir","sinto")," muito frio. ",B("ficar","Fico")," em casa e ",B("dormir","durmo")," um pouco. Tu ",B("ter","tens")," os apontamentos da aula? Beijinhos!"]},
 {t:"Viagem ao Porto",p:["Na sexta-feira, nós ",B("partir","partimos")," para o Porto de comboio. A viagem ",B("demorar","demora")," três horas. Lá, ",B("ficar","ficamos")," num hotel perto do rio. Os meus pais ",B("preferir","preferem")," o centro, mas eu ",B("preferir","prefiro")," a Ribeira. No domingo, ",B("voltar","voltamos")," para Lisboa."]}
];
/* ---- Texto: fill every verb in a short text (with hints / harder: verbs listed in the title) ---- */
function vText(g){
  const st=VBS(),hard=st.thard===true,L=hard?TEXTS_HARD:TEXTS,key=hard?"tih":"ti";if(st[key]==null)st[key]=0;
  const T=L[st[key]%L.length];let n=0;
  const gaps=T.p.filter(x=>typeof x!=="string");
  const cnt={};gaps.forEach(x=>cnt[x.v]=(cnt[x.v]||0)+1);
  const verbsBox=hard?`<div class="tverbs"><span class="tl">Verbs to use</span><div class="tvl">${Object.keys(cnt).sort((a,b)=>a.localeCompare(b,"pt")).map(v=>`<span class="tvc">${esc(v)}${cnt[v]>1?` <b>×${cnt[v]}</b>`:""}</span>`).join("")}</div></div>`:"";
  g.innerHTML=`<div class="cardtop"><span class="seg2"><button class="btn ${hard?"ghost":""} sm" id="tEasy">With hints · ${TEXTS.length}</button><button class="btn ${hard?"":"ghost"} sm" id="tHard">Harder · ${TEXTS_HARD.length}</button></span>
     <span class="row"><span class="hint">${st[key]%L.length+1} / ${L.length}</span><button class="btn ghost sm" id="tprev">←</button><button class="btn ghost sm" id="tnext">→</button></span></div>
   <div class="gcard textc"><h2>${esc(T.t)}</h2>${verbsBox}<p class="hint">${hard?"Choose the right verb for each gap and write it in the present tense.":"Write every verb in the present tense. The infinitive is in brackets."}</p>
   <p class="ptext">${T.p.map(x=>typeof x==="string"?esc(x):`<span class="gap"><input class="gin" data-n="${n++}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${hard?10:Math.max(4,x.f.length+1.5)}ch">${hard?"":`<small>(${esc(x.v)})</small>`}</span>`).join("")}</p>
   ${accentKeys()}<div id="tfb"></div><div class="actions"><button class="btn ghost" id="tshow">Show answers</button><button class="btn" id="tchk">Check</button></div></div>`;
  const ins=[...g.querySelectorAll(".gin")];let last=ins[0];
  ins.forEach((x,k)=>{x.onfocus=()=>last=x;x.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();ins[k+1]?ins[k+1].focus():$("#tchk").click()}}});
  bindKeys(g,()=>last);ins[0].focus();
  const go=d=>{st[key]=(st[key]+d+L.length)%L.length;save();vText(g)};
  $("#tprev").onclick=()=>go(-1);$("#tnext").onclick=()=>go(1);
  $("#tEasy").onclick=()=>{st.thard=false;save();vText(g)};$("#tHard").onclick=()=>{st.thard=true;save();vText(g)};
  const check=reveal=>{let ok=0;ins.forEach((x,k)=>{const a=gaps[k].f,good=!reveal&&norm(x.value)===norm(a);ok+=good;
      if(!reveal){const i=trackForm(gaps[k].v,a);if(i!=null)vmark(gaps[k].v,i,good)}
      x.disabled=true;x.classList.add(good?"right":"wrong");if(!good){x.value=a}
      if(hard&&!good){x.insertAdjacentHTML("afterend",`<small>(${esc(gaps[k].v)})</small>`)}
      setTimeout(()=>{x.parentElement.classList.add(good?"gok":"gno")},k*80)});
    $("#tfb").innerHTML=reveal?"":`<p class="center ${ok===ins.length?"okt":"badt"}"><b>${ok} / ${ins.length} correct.</b> ${ok===ins.length?"Excelente!":"Wrong answers are replaced by the correct form in red."}</p>`;
    refreshVerbChips();$("#tshow").remove();$("#tchk").textContent="Next text →";$("#tchk").onclick=()=>go(1)};
  $("#tchk").onclick=()=>check(false);$("#tshow").onclick=()=>check(true);
}


/* ---- Teste: 15 mixed items, 40% typed ---- */
function vTestMix(g){
  const all=shuffle(sentences());
  if(all.length<15){g.innerHTML=`<p class="hint">Select more verbs (at least 2 besides chamar-se).</p>`;return}
  const kinds=[..."tttttt",..."ccccc",..."wwww"],items=all.slice(0,15).map((it,k)=>{
    const V=it.V,form=V.f[it.p],full=`${it.subj} ${form} ${it.c}`,kd=kinds[k];
    const base={say:full,explain:`${esc(V.v)}: ${V.f.map((f,j)=>j===it.p?`<b>${esc(f)}</b>`:esc(f)).join(", ")}`,onResult:ok=>vmark(V.v,it.p,ok)};
    if(kd==="t")return {...base,kind:"type",label:`${V.v} · ${V.en}`,prompt:`${esc(it.subj)} <span class="blank">&nbsp;</span> ${esc(it.c)} <small class="vh">(${esc(V.v)})</small>`,accept:[vnorm(form)],show:form};
    if(kd==="c"){const o=shuffle(uniqForms(V,it.p));return {...base,kind:"mc",label:`${V.v} · ${V.en}`,prompt:`${esc(it.subj)} <span class="blank">&nbsp;</span> ${esc(it.c)}`,options:o,correct:o.indexOf(form),show:form}}
    return {...base,kind:"mc",label:"who is it?",prompt:`<span class="blank">&nbsp;</span> ${esc(form)} ${esc(it.c)}`,options:PSHORT,correct:it.p,show:PSHORT[it.p]};
  });
  runSession(g,shuffle(items),"Teste",()=>vTestMix(g));
}

/* ---- Blocos: a brick wall of verb forms falls towards the sentence ---- */
function vBlocksPage(){
  if(stopGame){stopGame();stopGame=null}
  const st=VBS();
  app.innerHTML=`<div class="bgame"><div class="bgtop"><button class="btn ghost sm" id="bback">← Verbos</button><h1 class="bgt">Blocos</h1><span class="hint">${st.sel.length} verbs</span></div>
    <div class="bstats" id="bst"></div><div id="bgame"></div></div>`;
  $("#bback").onclick=()=>{if(stopGame){stopGame();stopGame=null}st.mode=st.prevMode&&st.prevMode!=="blocks"?st.prevMode:"table";save();renderVerbs();scrollTo({top:0})};
  bStats({score:0,level:1,ok:0,bad:0,need:3,prog:0});
  const g=$("#bgame");
  g.innerHTML=`<div class="gcard bintro"><h2>Wall of verbs</h2>
    <p>A wall of bricks slides down towards the sentence. Tap the brick with the correct verb form in the <b>lowest row</b>: it fills the gap and the row crumbles. A wrong brick shakes the wall and drops it one row lower at once. If the wall reaches the sentence, the game is over.</p>
    <ul class="brules"><li><b>Levels 1–9:</b> two verb forms to choose from.</li><li><b>Level 10+:</b> three verb forms, and the wall falls faster.</li><li>Every 3 correct bricks = next level.</li></ul>
    <p class="hint">Verbs in play: ${st.sel.filter(v=>vby(v).c).join(", ")||"none"}. Change them on the Verbos page.</p>
    <button class="btn" id="bgo">Start</button></div>`;
  $("#bgo").onclick=()=>playBlocks(g);
}
function bStats(s){const st=VBS(),el=$("#bst");if(!el)return;const acc=s.ok+s.bad?Math.round(s.ok/(s.ok+s.bad)*100):0;
  el.innerHTML=[["Pontos",s.score],["Nível",s.level],["Recorde",st.bbest||0],["Certos",s.ok],["Erros",s.bad],["Precisão",acc+"%"]].map(([l,v])=>`<div class="bstat"><b>${v}</b><span>${l}</span></div>`).join("")+
   `<div class="blvl"><span>${s.level<10?`Level ${s.level} · 2 words`:`Level ${s.level} · 3 words · fast`}</span><i><em style="width:${Math.round(s.prog/s.need*100)}%"></em></i></div>`}
function playBlocks(g){
  const st=VBS(),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let pool=shuffle(sentences());if(pool.length<4){g.innerHTML=`<p class="hint">Select more verbs on the Verbos page first.</p>`;return}
  let pi=0;const nextTask=()=>{if(pi>=pool.length){pool=shuffle(pool);pi=0}return pool[pi++]};
  g.innerHTML=`<div class="bwrap" id="bw"><div class="bfield" id="bf"><div class="bflash" id="bfl"></div><div class="bbanner" id="bban"></div></div><div class="bsent" id="bsn"></div></div>`;
  const bf=$("#bf"),bw=$("#bw"),RH=54;
  let H=bf.clientHeight,rows=[],bottom=RH*1.4,extra=0,score=0,combo=0,level=1,okN=0,badN=0,over=false,raf=0,last=performance.now(),lock=false,rc=0;
  const speedFor=l=>(l<10?9+(l-1)*1.3:22+(l-10)*2.2)*(reduce?.7:1);
  const stats=()=>bStats({score,level,ok:okN,bad:badN,need:3,prog:okN%3});
  function makeRow(){
    const t=nextTask(),V=t.V,form=V.f[t.p],nW=level<10?2:3,odd=rc++%2===1;
    const others=shuffle([...new Set(V.f.filter(f=>f!==form))]).slice(0,nW-1);
    const slots=odd?3:4,words=shuffle([form,...others]),cells=Array(slots).fill(null);
    shuffle([...Array(slots).keys()]).slice(0,words.length).forEach((pos,k)=>cells[pos]=words[k]);
    const el=document.createElement("div");el.className="brow wait"+(odd?" odd":"");
    const brick=c=>c?`<button class="brick w" data-f="${esc(c)}" style="--r:${(Math.random()*6-3).toFixed(1)}deg"><span>${esc(c)}</span></button>`:`<span class="brick"></span>`;
    el.innerHTML=(odd?`<span class="brick half"></span>`:"")+cells.map(brick).join("")+(odd?`<span class="brick half"></span>`:"");
    bf.appendChild(el);const r={t,form,el};el.querySelectorAll("button.brick").forEach(b=>b.onclick=()=>tap(r,b));return r;
  }
  function showSentence(){const r=rows[0];if(!r)return;const t=r.t;
    $("#bsn").innerHTML=`<span class="tl">${esc(t.V.v)} · ${esc(t.V.en)}</span><p class="sent">${esc(t.subj)} <span class="blank" id="bbl">&nbsp;</span> ${esc(t.c)}</p>`;
    rows.forEach((x,k)=>{x.el.classList.toggle("wait",k>0);x.el.classList.toggle("active",k===0)})}
  function banner(txt){const b=$("#bban");b.textContent=txt;b.classList.remove("on");void b.offsetWidth;b.classList.add("on")}
  function tap(r,b){
    if(over||lock||r!==rows[0])return;
    if(b.dataset.f===r.form){lock=true;combo++;okN++;score+=10+Math.min(combo-1,5)*2+(level>=10?5:0);b.classList.add("bok");
      const bl=$("#bbl");if(bl){bl.textContent=r.form;bl.classList.add("filled")}vmark(r.t.V.v,r.t.p,true);speak(`${r.t.subj} ${r.form} ${r.t.c}`);
      r.el.querySelectorAll(".brick").forEach((x,k)=>{x.style.setProperty("--dx",(k-1.5)*14+"px");x.style.setProperty("--rot",(Math.random()*50-25)+"deg")});
      setTimeout(()=>r.el.classList.add("crumble"),180);
      const nl=1+Math.floor(okN/3);if(nl>level){level=nl;banner(level===10?"Nível 10! Three words, faster wall":`Nível ${level}`)}
      stats();
      setTimeout(()=>{r.el.remove();rows.shift();bottom=Math.max(RH*1.5,bottom-RH);showSentence();lock=false},520)}
    else{combo=0;badN++;extra+=RH;b.classList.add("bbad");vmark(r.t.V.v,r.t.p,false);stats();
      bw.classList.remove("shake2");void bw.offsetWidth;bw.classList.add("shake2");const fl=$("#bfl");fl.classList.remove("on");void fl.offsetWidth;fl.classList.add("on");
      try{navigator.vibrate&&navigator.vibrate(180)}catch(e){}
      setTimeout(()=>b.classList.remove("bbad"),420)}
  }
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;H=bf.clientHeight;
    if(document.visibilityState==="visible"){bottom+=speedFor(level)*dt;if(extra>0){const m=Math.min(extra,420*dt);bottom+=m;extra-=m}}
    while(!rows.length||bottom-rows.length*RH>-RH){rows.push(makeRow());if(rows.length===1)showSentence()}
    rows.forEach((r,k)=>{r.el.style.transform=`translateY(${bottom-(k+1)*RH}px)`});
    if(bottom>=H)return end();
    raf=requestAnimationFrame(frame);
  }
  function end(){over=true;cancelAnimationFrame(raf);const rec=score>(st.bbest||0);if(rec)st.bbest=score;save();stats();refreshVerbChips();
    const acc=okN+badN?Math.round(okN/(okN+badN)*100):0;
    bf.insertAdjacentHTML("beforeend",`<div class="cover"><h2>The wall reached the sentence</h2><p class="bigscore">${score} pts</p><p class="hint">Level ${level} · ${okN} correct · ${badN} mistakes · ${acc}% accuracy</p>${rec?`<p class="okt"><b>New record!</b></p>`:`<p class="hint">Record: ${st.bbest}</p>`}<div class="row"><button class="btn" id="bagain">Play again</button></div></div>`);
    $("#bagain").onclick=()=>playBlocks(g)}
  stats();showSentence();raf=requestAnimationFrame(frame);
  stopGame=()=>{over=true;cancelAnimationFrame(raf)};
}

render();
</script>
