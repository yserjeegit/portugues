function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.runs){s.book=s.book||"livro";return s}}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[.!?¡¿,;:"“”]/g,"").replace(/\s+/g," ").trim();
const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const plain=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const level=p=>p<=3?"Easy":p<=6?"Medium":p<=8?"Hard":"Expert";
const fmtT=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(x).padStart(2,"0")};
const earned=a=>a?(a.earned??(a.ok?a.pts:0)):0;

const VARS=()=>BOOKS[S.book];
const rk=(v,b=S.book)=>b+"-"+v;
function newRun(v){return{order:shuffle(VARS()[v].map((_,i)=>i)),opt:{},ans:{},sel:{},i:0,elapsed:0,done:false}}
const run=()=>S.runs[rk(S.cur)];
const Qs=()=>VARS()[S.cur];
function curQ(){const r=run();return{k:r.order[r.i],q:Qs()[r.order[r.i]]}}
function score(r){return Object.values(r.ans).reduce((s,a)=>s+earned(a),0)}
const correctText=q=>q.type==="mc"?q.options[0]:q.type==="multi"?q.options.slice(0,q.nRight).join(", "):q.accept[0];

/* ---------- timer ---------- */
let last=Date.now(),tick=0;
setInterval(()=>{
  const now=Date.now(),dt=now-last;last=now;
  const r=run();
  if(S.view==="quiz"&&r&&!r.done&&document.visibilityState==="visible"){r.elapsed+=Math.min(dt,5000);$("#sTime").textContent=fmtT(r.elapsed);if(++tick%5===0)save()}
},1000);
document.addEventListener("visibilitychange",()=>{last=Date.now();save()});

/* ---------- header ---------- */
function drawTop(){
  const r=run(),quiz=S.view!=="home"&&r;
  $("#stats").hidden=!quiz;
  $("#brand").textContent=quiz?`${S.book==="livro"?"Livro":"Caderno"} · Variante ${S.cur+1}${VNAMES[S.book]&&VNAMES[S.book][S.cur]?" · "+VNAMES[S.book][S.cur]:""}`:"Passaporte para Português";
  if(!quiz){$("#strip").innerHTML="";return}
  const qs=Qs(),answered=Object.keys(r.ans).length;
  $("#sTot").textContent=qs.length;
  $("#sNum").textContent=Math.min(r.i+1,qs.length);
  $("#sLeft").textContent=qs.length-answered;
  $("#sScore").textContent=score(r);
  $("#sTime").textContent=fmtT(r.elapsed);
  $("#strip").innerHTML=r.order.map((k,pos)=>{const a=r.ans[k];const c=a?(a.ok?"ok":earned(a)>0?"part":"bad"):(pos===r.i&&!r.done?"cur":"");return `<span class="seg ${c}" style="flex:${qs[k].pts}"></span>`}).join("");
}

function render(){if(S.view!=="home"&&!run())S.view="home";drawTop();if(S.view==="home")return renderHome();const r=run();if(r.done)return renderResult();renderQ()}

/* ---------- home ---------- */
function tabsHTML(){return `<div class="tabs" role="tablist">${[...Object.keys(BOOKS),"palavras","verbos"].map(b=>`<button role="tab" class="tab ${b===S.book?"on":""}" aria-selected="${b===S.book}" data-book="${b}">${b==="palavras"?"Palavras":b==="verbos"?"Verbos":b==="livro"?"Livro":"Caderno"}<span>${b==="palavras"?VOCAB.length+" words":b==="verbos"?VERBS.length+" verbs":BOOKS[b].length+" variants"}</span></button>`).join("")}</div>`}
function switchBook(b){S.book=b;save();render();try{history.replaceState(null,"","#"+b)}catch(e){}}
function renderHome(){
  if(S.book==="palavras")return renderVocab();
  if(S.book==="verbos")return renderVerbs();
  if(stopGame){stopGame();stopGame=null}
  const V=VARS(),order=TOPIC_ORDER[S.book],counts={};V[0].forEach(q=>counts[q.topic]=(counts[q.topic]||0)+1);
  const desc=S.book==="livro"
    ?"Based on the student's book, units 1–4, plus extra practice on ser/estar, ficar, articles and regular -ar/-er/-ir verbs."
    :"Based on the workbook (Caderno de exercícios): units 1–5 and Português em ação 1. Most answers are typed, like in the workbook. Variant 4 drills only the prepositions de and em with their contractions.";
  app.innerHTML=`${tabsHTML()}
  <section class="intro">
    <h1>${BOOKNAME[S.book]}</h1>
    <p>${desc} Each variant has 50 different questions worth 200 points in total. The order of questions and answers is reshuffled every time you start. The timer runs while a question is open on screen.</p>
    <div class="chips">${order.filter(t=>counts[t]).map(t=>`<span class="chip">${TOPIC[t].split(" · ").reverse()[0]} · ${counts[t]}</span>`).join("")}</div>
  </section>
  <div class="vgrid">${V.map((v,i)=>{
    const r=S.runs[rk(i)],b=S.best[rk(i)];
    const img=v.filter(q=>q.img).length,mul=v.filter(q=>q.type==="multi").length,txt=v.filter(q=>q.type==="text").length;
    let st="",btn=`<button class="btn" data-start="${i}">Start</button>`;
    if(r&&!r.done){st=`<div class="state prog">In progress · ${Object.keys(r.ans).length}/50 · ${score(r)} pts · ${fmtT(r.elapsed)}</div>`;btn=`<button class="btn" data-go="${i}">Continue</button><button class="btn ghost sm" data-start="${i}">Restart</button>`}
    else if(r&&r.done){btn=`<button class="btn ghost" data-go="${i}">Results</button><button class="btn" data-start="${i}">Retake</button>`}
    if(b)st+=`<div class="state best">Best · ${b.score}/200 in ${fmtT(b.time)}</div>`;
    return `<article class="vcard"><div class="vt"><h2>Variante ${i+1}${VNAMES[S.book]&&VNAMES[S.book][i]?`<small class="vsub">${VNAMES[S.book][i]}</small>`:""}</h2><span class="no">${S.book==="livro"?"L":"C"}${i+1}</span></div>
      <div class="meta"><b>50</b> questions · <b>200</b> pts<br>${txt} typed · ${img} with pictures · ${mul} select-all</div>${st}<div class="row">${btn}</div></article>`}).join("")}</div>`;
  app.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>switchBook(b.dataset.book));
  app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{const v=+b.dataset.start;S.cur=v;S.runs[rk(v)]=newRun(v);S.view="quiz";save();render();scrollTo({top:0})});
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.go;S.view="quiz";save();render();scrollTo({top:0})});
}
/* ---------- question ---------- */
function renderQ(){
  const r=run(),{k,q}=curQ(),a=r.ans[k],n=Qs().length;
  const dots=Array.from({length:10},(_,x)=>`<i class="${x<q.pts?"on":""}"></i>`).join("");
  const prompt=q.prompt.replace("___",`<span class="blank">${a&&q.type==="text"?esc(a.given):"&nbsp;"}</span>`);
  if(q.type!=="text"&&!r.opt[k]) r.opt[k]=q.fixed?q.options.map((_,x)=>x):shuffle(q.options.map((_,x)=>x));
  let body="";
  if(q.type==="multi"){
    const sel=a?a.picks:(r.sel[k]||[]);
    body=`<div class="multi-note">Select all that apply</div><div class="opts" role="group" aria-label="Answer options">`+r.opt[k].map((oi,x)=>{
      const on=sel.includes(oi),good=oi<q.nRight;let cls="multi",tag="";
      if(a){cls+=good?(on?" right":" missed"):(on?" wrong":" dim");tag=good&&!on?"missed":""}else if(on)cls+=" sel";
      return `<button class="opt ${cls}" data-oi="${oi}" aria-pressed="${on}" ${a?"disabled":""}><span class="k">${a?(good?"✓":(on?"✕":x+1)):(on?"✓":x+1)}</span><span class="t">${q.options[oi]}</span>${tag?`<span class="tag">${tag}</span>`:""}</button>`}).join("")+`</div>`;
  }else if(q.type==="mc"){
    body=`<div class="opts" role="group" aria-label="Answer options">`+r.opt[k].map((oi,x)=>{
      let cls="";if(a){cls=oi===0?"right":a.pick===oi?"wrong":"dim"}
      return `<button class="opt ${cls}" data-oi="${oi}" ${a?"disabled":""}><span class="k">${x+1}</span><span class="t">${q.options[oi]}</span></button>`}).join("")+`</div>`;
  }else{
    body=`<div class="textans"><label class="hint" for="ans">Type your answer</label>
      <input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" class="${a?(a.ok?"right":"wrong"):""}" ${a?"disabled":""} value="${a?esc(a.given):""}">
      ${a?"":`<div class="keys"><span class="lbl">Accents</span>${["á","à","â","ã","é","ê","í","ó","ô","õ","ú","ç"].map(c=>`<button class="key" type="button" data-c="${c}">${c}</button>`).join("")}</div>`}</div>`;
  }
  let fb="";
  if(a&&q.type==="multi"){
    const e=earned(a),cls=a.ok?"ok":e>0?"part":"bad";
    const head=a.ok?`Correct! +${q.pts} pts`:e>0?`Partly correct. +${e} of ${q.pts} pts`:"Not quite. 0 pts";
    fb=`<div class="fb ${cls}" role="status"><h3>${head}</h3>${a.ok?"":`<p>You found ${a.hits} of ${q.nRight} correct options${a.misses?` and chose ${a.misses} wrong one${a.misses>1?"s":""}`:""}. Correct answers: <span class="ans">${q.options.slice(0,q.nRight).join(", ")}</span></p><p class="hint">Scoring: each correct pick earns a share of the points; each wrong pick takes one share away.</p>`}<p>${q.explain}</p></div>`;
  }else if(a){
    fb=a.ok?`<div class="fb ok" role="status"><h3>Correct! +${q.pts} pts</h3><p>${q.explain}</p></div>`
      :`<div class="fb bad" role="status"><h3>Not quite. 0 pts</h3><p>Correct answer: <span class="ans">${plain(correctText(q))}</span>${a.near?" (check the accents)":""}</p><p>${q.explain}</p></div>`;
  }
  const lastQ=r.i===n-1;
  app.innerHTML=`<p class="unit">${TOPIC[q.topic]}</p>
  <article class="card">
    <div class="qhead">
      <div><div class="qnum">Question ${r.i+1} of ${n}</div><p class="ask">${q.ask}</p></div>
      <div class="stamp ${q.pts>=7?"hard":""}" aria-label="${q.pts} points"><span class="n">${q.pts}</span><span class="l">pts</span></div>
    </div>
    ${q.img?`<div class="figure">${q.img}</div>`:""}
    <h1 class="prompt">${prompt}</h1>
    <div class="diff">Difficulty <span class="dots">${dots}</span> ${level(q.pts)}</div>
    ${body}${fb}
    <div class="actions">
      <span class="hint">${a?"Press Enter to continue":q.type==="mc"?"Pick an answer or press 1–4":q.type==="multi"?"Tap options (or keys 1–6), then Check":"Press Enter to check"}</span>
      ${a?`<button class="btn" id="next">${lastQ?"See results":"Next question →"}</button>`:q.type==="text"?`<button class="btn" id="check">Check</button>`:q.type==="multi"?`<button class="btn" id="check" ${(r.sel[k]||[]).length?"":"disabled"}>Check</button>`:""}
    </div>
  </article>
  <div class="actions" style="margin-top:18px"><button class="btn ghost" id="home">← All variants</button><span class="hint">Progress and time are saved in this browser</span></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>q.type==="multi"?toggle(+b.dataset.oi):answerMc(+b.dataset.oi));
  const inp=$("#ans");
  if(inp&&!a){inp.focus();inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();answerText()}}}
  app.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const i=$("#ans");const s=i.selectionStart??i.value.length,e=i.selectionEnd??s;i.value=i.value.slice(0,s)+b.dataset.c+i.value.slice(e);i.focus();i.setSelectionRange(s+1,s+1)});
  const ch=$("#check");if(ch)ch.onclick=()=>q.type==="multi"?answerMulti():answerText();
  const nx=$("#next");if(nx){nx.onclick=next;nx.focus()}
  $("#home").onclick=goHome;
}
function answerMc(oi){const r=run(),{k,q}=curQ();if(r.ans[k])return;r.ans[k]={pick:oi,ok:oi===0,pts:q.pts,given:plain(q.options[oi])};save();render()}
function toggle(oi){const r=run(),{k}=curQ();if(r.ans[k])return;const s=r.sel[k]||(r.sel[k]=[]);const i=s.indexOf(oi);i<0?s.push(oi):s.splice(i,1);save();render();const b=app.querySelector(`.opt[data-oi="${oi}"]`);if(b)b.focus()}
function answerMulti(){
  const r=run(),{k,q}=curQ();if(r.ans[k])return;const picks=r.sel[k]||[];if(!picks.length)return;
  const hits=picks.filter(o=>o<q.nRight).length,misses=picks.length-hits,ok=hits===q.nRight&&!misses;
  const e=ok?q.pts:Math.max(0,Math.round(q.pts*(hits-misses)/q.nRight));
  r.ans[k]={picks:picks.slice(),hits,misses,ok,earned:e,pts:q.pts,given:picks.map(o=>plain(q.options[o])).join(", ")};save();render();
}
function answerText(){
  const r=run(),{k,q}=curQ();if(r.ans[k])return;const raw=$("#ans").value;if(!raw.trim()){$("#ans").focus();return}
  const g=norm(raw),ok=q.accept.some(x=>norm(x)===g),near=!ok&&q.accept.some(x=>strip(norm(x))===strip(g));
  r.ans[k]={ok,near,pts:q.pts,given:raw.trim()};save();render();
}
function next(){
  const r=run();
  if(r.i<Qs().length-1)r.i++;
  else{r.done=true;const sc=score(r),b=S.best[rk(S.cur)];if(!b||sc>b.score||(sc===b.score&&r.elapsed<b.time))S.best[rk(S.cur)]={score:sc,time:r.elapsed}}
  save();render();scrollTo({top:0});
}
function goHome(){S.view="home";save();render();scrollTo({top:0})}
$("#brand").onclick=goHome;

/* ---------- results ---------- */
function renderResult(){
  const r=run(),qs=Qs(),sc=score(r),pct=Math.round(sc/200*100);
  const verdict=pct>=85?"Visto aprovado":pct>=60?"Quase lá":"Revisão";
  const col=pct>=85?"var(--ok)":pct>=60?"var(--accent)":"var(--bad)";
  const mins=r.elapsed/60000;
  const rows=TOPIC_ORDER[S.book].map(t=>{
    const ks=qs.map((q,k)=>k).filter(k=>qs[k].topic===t);if(!ks.length)return"";
    const max=ks.reduce((s,k)=>s+qs[k].pts,0),got=ks.reduce((s,k)=>s+earned(r.ans[k]),0),right=ks.filter(k=>r.ans[k]&&r.ans[k].ok).length;
    return `<tr><td>${TOPIC[t]}</td><td class="num">${right}/${ks.length}</td><td class="num">${got}/${max}</td><td><div class="bar"><span style="width:${Math.round(got/max*100)}%"></span></div></td></tr>`}).join("");
  const wrong=r.order.filter(k=>r.ans[k]&&!r.ans[k].ok);
  app.innerHTML=`<p class="unit">Resultado final · ${BOOKNAME[S.book]} · Variante ${S.cur+1}${VNAMES[S.book]&&VNAMES[S.book][S.cur]?" · "+VNAMES[S.book][S.cur]:""}</p>
  <article class="card result">
    <div class="visa"><div class="big">${sc}<small> / 200</small></div><div class="stampbig" style="color:${col}">${verdict}<br><span style="font-size:13px">${pct}%</span></div></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${fmtT(r.elapsed)}</div><div class="l">Total time</div></div>
      <div class="kpi"><div class="v">${Math.round(r.elapsed/1000/qs.length)} s</div><div class="l">Average per question</div></div>
      <div class="kpi"><div class="v">${mins>0?(sc/mins).toFixed(1):"–"}</div><div class="l">Points per minute</div></div>
      <div class="kpi"><div class="v">${qs.length-wrong.length}/${qs.length}</div><div class="l">Fully correct</div></div>
    </div>
    <div><h2>By topic</h2><div class="scroll"><table class="tbl"><thead><tr><th>Topic</th><th class="num">Correct</th><th class="num">Points</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
    ${wrong.length?`<div class="mist"><h2>To review (${wrong.length})</h2>${wrong.map(k=>{const q=qs[k],a=r.ans[k],e=earned(a);return `<div class="${e?"p":""}"><div class="q">${esc(plain(q.prompt))}${q.img?" (picture)":""}</div><div class="a">You: ${esc(a.given)} → Correct: <b>${esc(plain(correctText(q)))}</b>${e?` · ${e}/${q.pts} pts`:""}</div></div>`}).join("")}</div>`:`<p>No mistakes. Parabéns!</p>`}
    <div class="actions"><button class="btn" id="again">Retake this variant</button><button class="btn ghost" id="home">Choose another variant</button></div>
  </article>`;
  $("#again").onclick=()=>{S.runs[rk(S.cur)]=newRun(S.cur);save();render();scrollTo({top:0})};
  $("#home").onclick=goHome;
}

document.addEventListener("keydown",e=>{
  if(S.view!=="quiz")return;const r=run();if(!r||r.done)return;const {k,q}=curQ(),a=r.ans[k];
  if(a&&e.key==="Enter"&&document.activeElement?.id!=="next"){e.preventDefault();next();return}
  if(a)return;
  if(q.type==="mc"&&/^[1-4]$/.test(e.key)){const oi=r.opt[k][+e.key-1];if(oi!==undefined)answerMc(oi)}
  if(q.type==="multi"){if(/^[1-6]$/.test(e.key)){const oi=r.opt[k][+e.key-1];if(oi!==undefined)toggle(oi)}else if(e.key==="Enter"&&!document.activeElement?.classList.contains("opt")){e.preventDefault();answerMulti()}}
});
{const h=(location.hash||"").slice(1);if((BOOKS[h]||h==="palavras"||h==="verbos")&&S.view==="home")S.book=h}
/* ================= PALAVRAS (vocabulary games) ================= */
const VS=()=>S.vocab||(S.vocab={decks:["cump"],mode:"cards",dir:"pt",stats:{}});
const wkey=w=>w.d+"|"+w.pt;
const isNoun=w=>w.t&&w.t.startsWith("n-");
const bare=pt=>pt.replace(/^\((a|o)\)\s*/,"").replace(/^(o|a|os|as)\s+/,"");
const vAccept=w=>{const alts=w.pt.split(" / ");const out=[];alts.forEach(a=>{out.push(a,bare(a),a.replace(/^\((a|o)\)\s*/,"$1 "))});return [...new Set(out.map(norm))]};
const tagLabel=t=>({"n-m":"noun · masculine","n-f":"noun · feminine","n-mp":"noun · masculine plural","n-fp":"noun · feminine plural","v-ar":"verb · -ar","v-er":"verb · -er","v-ir":"verb · -ir","v-irr":"verb · irregular",adj:"nationality / adjective",color:"colour",ph:"phrase",adv:"word",num:"number",day:"day of the week",country:"country",city:"city"}[t]||"");
function pool(){const seen=new Set();return VOCAB.filter(w=>VS().decks.includes(w.d)&&!seen.has(w.pt)&&seen.add(w.pt))}
function mark(w,ok){const st=VS().stats,k=wkey(w),s=st[k]||(st[k]={r:0,w:0,s:0});if(ok){s.r++;s.s++}else{s.w++;s.s=0}save()}
const learned=w=>{const s=VS().stats[wkey(w)];return !!(s&&s.s>=2)};
let ptVoice=null;
function loadVoice(){try{const v=speechSynthesis.getVoices();ptVoice=v.find(x=>/pt[-_]PT/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang))||null}catch(e){}}
try{loadVoice();speechSynthesis.onvoiceschanged=loadVoice}catch(e){}
function speak(t){try{const u=new SpeechSynthesisUtterance(t.replace(/\s\/\s.*$/,"").replace(/[()]/g,""));u.lang="pt-PT";if(ptVoice)u.voice=ptVoice;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const SPK=`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const spkBtn=t=>`<button class="spk" type="button" data-say="${esc(t)}" aria-label="Listen">${SPK}</button>`;
let stopGame=null;
const MODES=[["cards","Cartões","Flip and swipe"],["match","Arrastar","Drag the meaning"],["type","Escrever","Type the word"],["cloud","Nuvem","Catch the words"]];

function renderVocab(){
  if(stopGame){stopGame();stopGame=null}
  const v=VS(),P=pool();
  app.innerHTML=tabsHTML()+`<section class="intro"><h1>Palavras</h1>

    <div class="decks">${VDECKS.map(d=>{const ws=VOCAB.filter(w=>w.d===d.id),l=ws.filter(learned).length,on=v.decks.includes(d.id);
      return `<button class="deck ${on?"on":""}" data-deck="${d.id}" aria-pressed="${on}"><span class="dn">${d.name}</span><span class="ds">${d.src} · ${l}/${ws.length}</span><span class="db"><i style="width:${Math.round(l/ws.length*100)}%"></i></span></button>`}).join("")}</div>
    <div class="deckbar"><span class="hint"><b>${P.length}</b> words selected</span><button class="btn ghost sm" id="dAll">${v.decks.length===VDECKS.length?"Clear":"Select all"}</button></div></details>
    <div class="modes" role="tablist">${MODES.map(([id,n,s])=>`<button class="mode ${v.mode===id?"on":""}" data-mode="${id}" role="tab" aria-selected="${v.mode===id}"><b>${n}</b><span>${s}</span></button>`).join("")}</div>
    <div id="game"></div>`;

function refreshDecks(){app.querySelectorAll("[data-deck]").forEach(b=>{const ws=VOCAB.filter(w=>w.d===b.dataset.deck),l=ws.filter(learned).length;b.querySelector(".ds").textContent=b.querySelector(".ds").textContent.replace(/\d+\/\d+$/,l+"/"+ws.length);b.querySelector(".db i").style.width=Math.round(l/ws.length*100)+"%"})}

/* ---------- 1. Cartões: flip + swipe ---------- */
function gCards(g,P){
  const v=VS();let q=P.slice(),known=0,again=0,total=P.length;
  function draw(){
    if(!q.length){g.innerHTML=`<div class="gcard done"><h2>Deck finished</h2><p>${known} known · ${again} to repeat</p><button class="btn" id="re">Shuffle and start again</button></div>`;$("#re").onclick=()=>gCards(g,shuffle(pool()));refreshDecks();return}
    const w=q[0],front=v.dir==="pt";
    g.innerHTML=`<div class="cardtop"><span class="hint">${total-q.length+1} / ${total} · <b class="okc">${known}</b> known · <b class="badc">${again}</b> again</span>
      <button class="btn ghost sm" id="dir">${front?"PT → EN":"EN → PT"}</button></div>
      <div class="stage"><div class="flash" id="fl" tabindex="0" aria-label="Flashcard, tap to flip">
        <div class="face front">${front?`<span class="big">${esc(w.pt)}</span><span class="tl">${tagLabel(w.t)}</span>${spkBtn(w.pt)}`:`<span class="big en">${esc(w.en)}</span><span class="tl">${tagLabel(w.t)}</span>`}<span class="tap">tap to flip</span></div>
        <div class="face back">${front?`<span class="big en">${esc(w.en)}</span>`:`<span class="big">${esc(w.pt)}</span>${spkBtn(w.pt)}`}${w.ex?`<span class="ex">${esc(w.ex)}</span>`:""}${w.note?`<span class="note">${esc(w.note)}</span>`:""}</div>
      </div><div class="swipe-l">Again</div><div class="swipe-r">Know it</div></div>
      <div class="cardbtns"><button class="btn ghost" id="no">← Again</button><button class="btn ghost" id="flip">Flip</button><button class="btn" id="yes">Know it →</button></div>
      <p class="hint center">Swipe the card right if you know it, left to see it again.</p>`;
    const fl=$("#fl");let flipped=false;
    const flip=()=>{flipped=!flipped;fl.classList.toggle("flipped",flipped);if(flipped&&!front)speak(w.pt)};
    const out=ok=>{fl.style.transition="transform .35s ease, opacity .35s";fl.style.transform=`translateX(${ok?520:-520}px) rotate(${ok?24:-24}deg)`;fl.style.opacity="0";
      mark(w,ok);q.shift();if(ok)known++;else{again++;q.splice(Math.min(q.length,4),0,w)}setTimeout(draw,300)};
    $("#flip").onclick=flip;$("#yes").onclick=()=>out(true);$("#no").onclick=()=>out(false);
    $("#dir").onclick=()=>{v.dir=front?"en":"pt";save();draw()};
    fl.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}if(e.key==="ArrowRight")out(true);if(e.key==="ArrowLeft")out(false)};
    let sx=0,dx=0,down=false;
    fl.onpointerdown=e=>{if(e.target.closest("[data-say]"))return;down=true;sx=e.clientX;dx=0;fl.setPointerCapture(e.pointerId);fl.style.transition="none"};
    fl.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;fl.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;g.querySelector(".swipe-r").style.opacity=Math.max(0,dx/120);g.querySelector(".swipe-l").style.opacity=Math.max(0,-dx/120)};
    fl.onpointerup=fl.onpointercancel=()=>{if(!down)return;down=false;
      if(Math.abs(dx)>100)return out(dx>0);
      fl.style.transition="transform .25s";fl.style.transform="";g.querySelector(".swipe-r").style.opacity=0;g.querySelector(".swipe-l").style.opacity=0;
      if(Math.abs(dx)<6)flip()};
  }
  draw();
}

/* ---------- 2. Arrastar: drag meanings onto words ---------- */
function gMatch(g,P){
  let round=0,score=0,mist=0;const N=5;
  function next(){
    const used=new Set(),items=[];for(const w of shuffle(pool())){if(items.length>=N)break;if(!used.has(w.en)){used.add(w.en);items.push(w)}}
    round++;let left=items.length,sel=null;
    g.innerHTML=`<div class="cardtop"><span class="hint">Round ${round} · <b class="okc">${score}</b> matched · <b class="badc">${mist}</b> mistakes</span></div>
      <p class="hint">Drag each English meaning onto its Portuguese word (or tap a meaning, then tap the word).</p>
      <div class="match"><div class="slots">${items.map((w,i)=>`<div class="slot" data-i="${i}"><span class="sp">${esc(w.pt)}</span><span class="drop">drop here</span></div>`).join("")}</div>
      <div class="chips2">${shuffle(items.map((w,i)=>i)).map(i=>`<div class="mchip" data-i="${i}" tabindex="0">${esc(items[i].en)}</div>`).join("")}</div></div>`;
    const tryDrop=(chip,slot)=>{
      const i=+chip.dataset.i,w=items[i];
      if(slot&&+slot.dataset.i===i){slot.classList.add("ok","pop");slot.querySelector(".drop").textContent=w.en;chip.remove();mark(w,true);score++;speak(w.pt);
        if(--left===0){refreshDecks();setTimeout(()=>{g.querySelector(".match").insertAdjacentHTML("afterend",`<div class="actions"><span class="hint">Round complete.</span><button class="btn" id="nr">Next round →</button></div>`);$("#nr").onclick=next;$("#nr").focus()},250)}}
      else{chip.style.transition="transform .3s";chip.style.transform="";chip.classList.remove("shake");void chip.offsetWidth;chip.classList.add("shake");
        if(slot){slot.classList.remove("bad");void slot.offsetWidth;slot.classList.add("bad");mark(items[+slot.dataset.i],false);mist++;}}
      g.querySelector(".hint b.okc").textContent=score;g.querySelector(".hint b.badc").textContent=mist;
    };
    g.querySelectorAll(".mchip").forEach(chip=>{
      let sx,sy,dx=0,dy=0,down=false;
      chip.onpointerdown=e=>{down=true;sx=e.clientX;sy=e.clientY;dx=dy=0;chip.setPointerCapture(e.pointerId);chip.style.transition="none";chip.classList.add("drag")};
      chip.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;chip.style.transform=`translate(${dx}px,${dy}px) scale(1.05)`;
        g.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));chip.style.pointerEvents="none";const el=document.elementFromPoint(e.clientX,e.clientY);chip.style.pointerEvents="";const s=el&&el.closest(".slot:not(.ok)");if(s)s.classList.add("over")};
      chip.onpointerup=e=>{if(!down)return;down=false;chip.classList.remove("drag");g.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));
        if(Math.abs(dx)+Math.abs(dy)<6){g.querySelectorAll(".mchip").forEach(c=>c.classList.remove("sel"));chip.style.transform="";sel=chip;chip.classList.add("sel");return}
        chip.style.pointerEvents="none";const el=document.elementFromPoint(e.clientX,e.clientY);chip.style.pointerEvents="";tryDrop(chip,el&&el.closest(".slot:not(.ok)"))};
      chip.onpointercancel=()=>{down=false;chip.style.transform=""};
      chip.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();g.querySelectorAll(".mchip").forEach(c=>c.classList.remove("sel"));sel=chip;chip.classList.add("sel")}};
    });
    g.querySelectorAll(".slot").forEach(s=>{s.tabIndex=0;const act=()=>{if(sel&&sel.isConnected&&!s.classList.contains("ok")){const c=sel;sel=null;c.classList.remove("sel");tryDrop(c,s)}};s.onclick=act;s.onkeydown=e=>{if(e.key==="Enter")act()}});
  }
  next();
}

/* ---------- 3. Escrever: type the Portuguese ---------- */
function gType(g,P){
  let q=P.slice(),ok=0,bad=0,streak=0;
  function draw(){
    if(!q.length){g.innerHTML=`<div class="gcard done"><h2>All done</h2><p>${ok} correct · ${bad} mistakes</p><button class="btn" id="re">Start again</button></div>`;$("#re").onclick=()=>gType(g,shuffle(pool()));refreshDecks();return}
    const w=q[0],acc=vAccept(w);let hints=0,answered=false;
    const target=w.pt.split(" / ")[0];
    g.innerHTML=`<div class="cardtop"><span class="hint"><b class="okc">${ok}</b> correct · <b class="badc">${bad}</b> mistakes · streak <b>${streak}</b> · ${q.length} left</span></div>
      <div class="gcard typec" id="tc"><span class="tl">${tagLabel(w.t)}${isNoun(w)?" · article optional":""}</span><span class="big en">${esc(w.en)}</span>
        <div class="reveal" id="rv" aria-live="polite">${target.replace(/[^\s\-\/!?.…()]/g,"_")}</div>
        <input id="tin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type in Portuguese">
        <div class="keys"><span class="lbl">Accents</span>${["á","à","â","ã","é","ê","í","ó","ô","õ","ú","ç"].map(c=>`<button class="key" type="button" data-c="${c}">${c}</button>`).join("")}</div>
        <div id="tfb"></div>
        <div class="actions"><button class="btn ghost sm" id="hint">Show a letter</button><button class="btn" id="tchk">Check</button></div></div>`;
    const inp=$("#tin");inp.focus();
    g.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+1,s+1)});
    $("#hint").onclick=()=>{hints++;let n=0;$("#rv").textContent=[...target].map(c=>/[\s\-\/!?.…()]/.test(c)?c:(n++<hints?c:"_")).join("")};
    const check=()=>{
      if(answered){q.shift();draw();return}
      const g2=norm(inp.value);if(!g2)return;answered=true;
      const good=acc.includes(g2),near=!good&&acc.map(strip).includes(strip(g2));
      const tc=$("#tc");tc.classList.remove("ok","no");void tc.offsetWidth;tc.classList.add(good?"ok":"no");
      if(good){ok++;streak++;mark(w,hints<2)}else{bad++;streak=0;mark(w,false);q.splice(Math.min(q.length,5),0,w)}
      $("#rv").textContent=w.pt;inp.disabled=true;speak(w.pt);
      $("#tfb").innerHTML=`<p class="${good?"okt":"badt"}"><b>${good?"Correct!":near?"Almost: check the accents.":"Not quite."}</b> ${esc(w.pt)} ${spkBtn(w.pt)}</p>${w.ex?`<p class="ex">${esc(w.ex)}</p>`:""}${w.note?`<p class="note">${esc(w.note)}</p>`:""}`;
      $("#tchk").textContent="Next →";$("#tchk").focus();$("#hint").disabled=true;
    };
    $("#tchk").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};
    $("#tchk").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};
  }
  draw();
}

/* ---------- 4. Nuvem: catch the floating words ---------- */
function gCloud(g,P){
  const best=VS().best||{};
  g.innerHTML=`<div class="cloudmenu">
      <button class="cmode" data-cm="tr"><b>Catch the translation</b><span>An English word appears. Tap its Portuguese twin among the floating words.</span><span class="hint">Best: ${best.tr||0}</span></button>
      <button class="cmode" data-cm="cat"><b>Catch the category</b><span>Catch every word that fits: colours, -er verbs, feminine nouns… Uses all topics.</span><span class="hint">Best: ${best.cat||0}</span></button></div>`;
  g.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>playCloud(g,b.dataset.cm));
}
function playCloud(g,mode){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const P=mode==="tr"?pool():(()=>{const s=new Set();return VOCAB.filter(w=>!s.has(w.pt)&&s.add(w.pt))})();
  if(mode==="tr"&&P.length<6){g.innerHTML=`<p class="hint">Select topics with at least 6 words.</p>`;return}
  let score=0,lives=3,time=60,combo=0,target=null,cat=null,need=0,bubbles=[],raf=0,tmr=0,over=false;
  g.innerHTML=`<div class="cloudhud"><span class="lives" id="lv"></span><span class="ctarget" id="ct"></span><span class="cscore"><b id="cs">0</b> pts · <b id="cti">60</b>s</span></div>
    <div class="cloud" id="cl"></div>`;
  const cl=$("#cl");
  const W=()=>cl.clientWidth,H=()=>cl.clientHeight;
  const hud=()=>{$("#lv").textContent="♥".repeat(lives)+"♡".repeat(3-lives);$("#cs").textContent=score;$("#cti").textContent=time};
  function spawn(w){
    const el=document.createElement("button");el.className="bub";el.type="button";const t0=w.pt.split(" / ")[0];el.textContent=mode==="cat"?bare(t0):t0;cl.appendChild(el);
    const bw=el.offsetWidth,bh=el.offsetHeight,sp=reduce?.25:(.5+Math.random()*.7);const a=Math.random()*Math.PI*2;
    let x=0,y=0;for(let k=0;k<30;k++){x=Math.random()*Math.max(1,W()-bw);y=Math.random()*Math.max(1,H()-bh);if(!bubbles.some(o=>!o.dead&&x<o.x+o.bw+6&&x+bw+6>o.x&&y<o.y+o.bh+6&&y+bh+6>o.y))break}
    const b={w,el,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,bw,bh,dead:false};
    el.onclick=()=>hit(b);bubbles.push(b);return b;
  }
  function pickTarget(){const live=bubbles.filter(b=>!b.dead);target=live[Math.floor(Math.random()*live.length)];$("#ct").innerHTML=`Catch: <b>${esc(target.w.en)}</b>`}
  function newCat(){
    bubbles.forEach(b=>b.el.remove());bubbles=[];
    const opts=CATS.filter(c=>P.filter(c.f).length>=4&&c!==cat);cat=opts[Math.floor(Math.random()*opts.length)];
    const yes=shuffle(P.filter(cat.f)).slice(0,4),no=shuffle(P.filter(w=>!cat.f(w))).slice(0,5);need=yes.length;
    shuffle([...yes,...no]).forEach(spawn);$("#ct").innerHTML=`Catch <b>${cat.label}</b> · <span id="nd">${need}</span> left`;
  }
  function fresh(){const on=new Set(bubbles.filter(b=>!b.dead).map(b=>b.w.pt));const c=shuffle(P).find(w=>!on.has(w.pt));return c||P[0]}
  function hit(b){
    if(over||b.dead)return;
    const good=mode==="tr"?b===target:cat.f(b.w);
    if(good){b.dead=true;combo++;const add=10+Math.min(combo-1,5)*2;score+=add;b.el.classList.add("popped");b.el.insertAdjacentHTML("beforeend",`<span class="plus">+${add}</span>`);mark(b.w,true);speak(b.w.pt);
      setTimeout(()=>{b.el.remove();bubbles=bubbles.filter(x=>x!==b);
        if(mode==="tr"){spawn(fresh());pickTarget()}else if(--need<=0){score+=20;newCat()}else{const nd=$("#nd");if(nd)nd.textContent=need}hud()},280)}
    else{combo=0;lives--;b.el.classList.remove("wrongb");void b.el.offsetWidth;b.el.classList.add("wrongb");cl.classList.remove("hurt");void cl.offsetWidth;cl.classList.add("hurt");
      if(mode==="tr")mark(target.w,false);hud();if(lives<=0)end()}
    hud();
  }
  function loop(){
    const w=W(),h=H();
    bubbles.forEach(b=>{if(b.dead)return;b.x+=b.vx;b.y+=b.vy;if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)}if(b.x>w-b.bw){b.x=w-b.bw;b.vx=-Math.abs(b.vx)}if(b.y<0){b.y=0;b.vy=Math.abs(b.vy)}if(b.y>h-b.bh){b.y=h-b.bh;b.vy=-Math.abs(b.vy)}b.el.style.transform=`translate(${b.x}px,${b.y}px)`});
    raf=requestAnimationFrame(loop);
  }
  function end(){
    if(over)return;over=true;cancelAnimationFrame(raf);clearInterval(tmr);
    const v=VS();v.best=v.best||{};const rec=score>(v.best[mode]||0);if(rec)v.best[mode]=score;save();refreshDecks();
    cl.insertAdjacentHTML("beforeend",`<div class="cover"><h2>${lives<=0?"Out of lives":"Time's up"}</h2><p class="bigscore">${score} pts</p>${rec?`<p class="okt"><b>New best!</b></p>`:`<p class="hint">Best: ${v.best[mode]}</p>`}<div class="row"><button class="btn" id="pa">Play again</button><button class="btn ghost" id="pm">Change game</button></div></div>`);
    $("#pa").onclick=()=>playCloud(g,mode);$("#pm").onclick=()=>gCloud(g,P);
  }
  if(mode==="tr"){shuffle(P).slice(0,8).forEach(spawn);pickTarget()}else newCat();
  hud();loop();
  tmr=setInterval(()=>{if(document.visibilityState!=="visible")return;time--;hud();if(time<=0)end()},1000);
  stopGame=()=>{over=true;cancelAnimationFrame(raf);clearInterval(tmr)};
}

];
const VGROUPS=[["irr","Irregulares"],["ar","Verbos em -ar"],["er","Verbos em -er"],["ir","Verbos em -ir"]];
const VBS=()=>S.verbs||(S.verbs={sel:["ser","estar","ter","ir","poder","fazer"],mode:"table",cur:"ser",stats:{}});
const vby=v=>VERBS.find(x=>x.v===v);
const vk=(v,p)=>v+"|"+p;
function vmark(v,p,ok){const st=VBS().stats,k=vk(v,p),s=st[k]||(st[k]={s:0,r:0,w:0});if(ok){s.r++;s.s++}else{s.w++;s.s=0}save()}
const vlearned=v=>[0,1,2,3,4].filter(p=>{const s=VBS().stats[vk(v,p)];return s&&s.s>=2}).length;
function hiForm(V,i){const f=V.f[i];if(V.g==="irr")return `<b class="irr">${esc(f)}</b>`;const st=V.v.replace(/-se$/,"").slice(0,-2);
  if(f.startsWith(st)&&V.f[i]===vreg(V.v.replace(/-se$/,""))[i])return esc(st)+`<b>${esc(f.slice(st.length))}</b>`;return `<b class="irr">${esc(f)}</b>`}
const VMODES=[["table","Tabela","Learn the forms"],["link","Ligar","Pronoun ↔ form"],["choose","Escolher","Pick the form"],["write","Escrever","Type the form"],["who","Quem?","Find the subject"]];
function sentences(){
  const out=[];VBS().sel.forEach(v=>{const V=vby(v);if(!V.c)return;V.c.forEach(c=>[0,1,2,3,4].forEach(p=>{const subs=SUBJ5[p];out.push({V,p,c,subj:subs[(c.length+p)%subs.length]})}))});return out;
}

function renderVerbs(){
  if(stopGame){stopGame();stopGame=null}
  const st=VBS();if(!st.sel.length)st.sel=["ser"];if(!st.sel.includes(st.cur))st.cur=st.sel[0];
  app.innerHTML=tabsHTML()+`<section class="intro"><h1>Verbos</h1><p>First learn the present-tense forms for eu, tu, ele/ela/você, nós and eles/vocês. Then practise them in short sentences. A form counts as learned after two correct answers in a row.</p></section>
   <details class="dwrap" id="vw" ${st.open===false?"":"open"}><summary><b>Verbs</b> · ${st.sel.length} selected</summary>
   ${VGROUPS.map(([g,n])=>`<div class="vgroup"><span class="tl">${n}</span><div class="vchips">${VERBS.filter(V=>V.g===g).map(V=>{const on=st.sel.includes(V.v),l=vlearned(V.v);
     return `<button class="vchip ${on?"on":""}" data-verb="${V.v}" aria-pressed="${on}"><b>${V.v}</b><span class="vdots">${[0,1,2,3,4].map(i=>`<i class="${i<l?"on":""}"></i>`).join("")}</span></button>`}).join("")}</div></div>`).join("")}
   <div class="deckbar"><span class="hint">Tip: start with the six irregular verbs.</span><span class="row"><button class="btn ghost sm" id="vIrr">Only irregular</button><button class="btn ghost sm" id="vAll">All verbs</button></span></div></details>
   <div class="modes m5" role="tablist">${VMODES.map(([id,n,s])=>`<button class="mode ${st.mode===id?"on":""}" data-vmode="${id}" role="tab" aria-selected="${st.mode===id}"><b>${n}</b><span>${s}</span></button>`).join("")}</div>
   <div id="game"></div>`;
  app.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>switchBook(b.dataset.book));
  $("#vw").ontoggle=()=>{st.open=$("#vw").open;save()};
  app.querySelectorAll("[data-verb]").forEach(b=>b.onclick=()=>{const v=b.dataset.verb,i=st.sel.indexOf(v);if(i<0){st.sel.push(v);st.cur=v}else if(st.sel.length>1)st.sel.splice(i,1);save();renderVerbs()});
  $("#vIrr").onclick=()=>{st.sel=VERBS.filter(V=>V.g==="irr").map(V=>V.v);save();renderVerbs()};
  $("#vAll").onclick=()=>{st.sel=VERBS.map(V=>V.v);save();renderVerbs()};
  app.querySelectorAll("[data-vmode]").forEach(b=>b.onclick=()=>{st.mode=b.dataset.vmode;st.open=false;save();renderVerbs();setTimeout(()=>{const m=document.querySelector(".modes");if(m)m.scrollIntoView({block:"start",behavior:"smooth"})},30)});
  const g=$("#game");g.addEventListener("click",e=>{const s=e.target.closest("[data-say]");if(s){e.stopPropagation();speak(s.dataset.say)}});
  ({table:vTable,link:vLink,choose:vSent,write:vSent,who:vSent})[st.mode](g,st.mode);
}
function refreshVerbChips(){app.querySelectorAll("[data-verb]").forEach(b=>{const l=vlearned(b.dataset.verb);b.querySelectorAll(".vdots i").forEach((d,i)=>d.classList.toggle("on",i<l))})}

/* ---- Tabela: study + fill the table ---- */
function vTable(g){
  const st=VBS(),V=vby(st.cur),idx=st.sel.indexOf(st.cur);
  const nav=`<div class="vnav"><button class="btn ghost sm" id="vp" ${st.sel.length<2?"disabled":""}>←</button><div class="vtitle"><b>${V.v}</b><span>${esc(V.en)}</span></div><button class="btn ghost sm" id="vn" ${st.sel.length<2?"disabled":""}>→</button></div>`;
  const go=d=>{st.cur=st.sel[(idx+d+st.sel.length)%st.sel.length];save();vTable(g)};
  function study(){
    g.innerHTML=nav+`<div class="vtable">${PERS.map((p,i)=>`<div class="vrow" style="animation-delay:${i*60}ms"><span class="vp">${p}</span><span class="vf">${hiForm(V,i)}</span>${spkBtn((i===2?"ele ":i===4?"eles ":p+" ")+V.f[i])}</div>`).join("")}</div>
      ${V.note?`<p class="vnote">${esc(V.note)}</p>`:V.g!=="irr"?`<p class="vnote">Regular -${V.g} verb: stem <b>${esc(V.v.slice(0,-2))}-</b> + ${REG[V.g].map(e=>"-"+e).join(", ")}.</p>`:""}
      <div class="actions"><button class="btn ghost" id="vsay">Listen to all</button><button class="btn" id="vtest">Test me →</button></div>`;
    $("#vp").onclick=()=>go(-1);$("#vn").onclick=()=>go(1);
    $("#vsay").onclick=()=>{try{speechSynthesis.cancel()}catch(e){};PERS.forEach((p,i)=>{try{const u=new SpeechSynthesisUtterance((i===2?"ele ":i===4?"eles ":p+" ")+V.f[i]);u.lang="pt-PT";if(ptVoice)u.voice=ptVoice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}})};
    $("#vtest").onclick=test;
  }
  function test(){
    g.innerHTML=nav+`<p class="hint center">Fill in the whole table, then check.</p><div class="vtable">${PERS.map((p,i)=>`<div class="vrow"><label class="vp" for="vi${i}">${p}</label><input class="vin" id="vi${i}" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="vres" id="vr${i}"></span></div>`).join("")}</div>
      <div class="keys"><span class="lbl">Accents</span>${["á","à","â","ã","é","ê","í","ó","ô","õ","ú","ç"].map(c=>`<button class="key" type="button" data-c="${c}">${c}</button>`).join("")}</div>
      <div class="actions"><button class="btn ghost" id="vback">Show table</button><button class="btn" id="vchk">Check</button></div>`;
    $("#vp").onclick=()=>go(-1);$("#vn").onclick=()=>go(1);
    let last=$("#vi0");last.focus();g.querySelectorAll(".vin").forEach(x=>{x.onfocus=()=>last=x;x.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const n=$("#vi"+(+x.dataset.i+1));n?n.focus():$("#vchk").click()}}});
    g.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const i=last,s=i.selectionStart??i.value.length,e=i.selectionEnd??s;i.value=i.value.slice(0,s)+b.dataset.c+i.value.slice(e);i.focus();i.setSelectionRange(s+1,s+1)});
    $("#vback").onclick=study;
    $("#vchk").onclick=()=>{
      if($("#vchk").dataset.done){$("#vchk").dataset.done="";return test()}
      let n=0;g.querySelectorAll(".vin").forEach((x,i)=>{const ok=norm(x.value)===norm(V.f[i]);n+=ok;vmark(V.v,i,ok);x.disabled=true;const row=x.closest(".vrow");
        setTimeout(()=>{row.classList.add(ok?"ok":"no");$("#vr"+i).innerHTML=ok?"✓":`<b>${esc(V.f[i])}</b>`},i*90)});
      setTimeout(()=>{refreshVerbChips();g.querySelector(".actions").insertAdjacentHTML("beforebegin",`<p class="center ${n===5?"okt":"badt"}"><b>${n} / 5 correct.</b> ${n===5?"Perfeito!":"Look at the corrections, then try again."}</p>`)},500);
      $("#vchk").textContent="Try again";$("#vchk").dataset.done="1";
      if(n===5&&st.sel.length>1){$("#vback").textContent="Next verb →";$("#vback").onclick=()=>go(1)}
    };
  }
  study();
}

/* ---- Ligar: drag forms onto pronouns ---- */
function vLink(g){
  const st=VBS();let score=0,mist=0,round=0;
  function next(){
    const V=vby(shuffle(st.sel)[0]);round++;let left=5,sel=null;
    g.innerHTML=`<div class="cardtop"><span class="hint">Round ${round} · <b class="okc">${score}</b> matched · <b class="badc">${mist}</b> mistakes</span></div>
      <div class="vtitle center"><b>${V.v}</b><span>${esc(V.en)}</span></div>
      <p class="hint">Drag each form onto its pronoun (or tap a form, then tap the pronoun).</p>
      <div class="match"><div class="slots">${PERS.map((p,i)=>`<div class="slot" data-i="${i}"><span class="sp">${p}</span><span class="drop">…</span></div>`).join("")}</div>
      <div class="chips2">${shuffle([0,1,2,3,4]).map(i=>`<div class="mchip" data-i="${i}" tabindex="0">${esc(V.f[i])}</div>`).join("")}</div></div>`;
    const tryDrop=(chip,slot)=>{const i=+chip.dataset.i;
      if(slot&&+slot.dataset.i===i){slot.classList.add("ok","pop");slot.querySelector(".drop").textContent=V.f[i];chip.remove();vmark(V.v,i,true);score++;speak(V.f[i]);
        if(--left===0){refreshVerbChips();g.querySelector(".match").insertAdjacentHTML("afterend",`<div class="actions"><span class="hint">All five forms matched.</span><button class="btn" id="nr">Next verb →</button></div>`);$("#nr").onclick=next}}
      else{chip.style.transition="transform .3s";chip.style.transform="";chip.classList.remove("shake");void chip.offsetWidth;chip.classList.add("shake");
        if(slot){slot.classList.remove("bad");void slot.offsetWidth;slot.classList.add("bad");vmark(V.v,+slot.dataset.i,false);mist++}}
      g.querySelector(".okc").textContent=score;g.querySelector(".badc").textContent=mist};
    g.querySelectorAll(".mchip").forEach(chip=>{let sx,sy,dx=0,dy=0,down=false;
      chip.onpointerdown=e=>{down=true;sx=e.clientX;sy=e.clientY;dx=dy=0;chip.setPointerCapture(e.pointerId);chip.style.transition="none";chip.classList.add("drag")};
      chip.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;chip.style.transform=`translate(${dx}px,${dy}px) scale(1.05)`;g.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));chip.style.pointerEvents="none";const el=document.elementFromPoint(e.clientX,e.clientY);chip.style.pointerEvents="";const s=el&&el.closest(".slot:not(.ok)");if(s)s.classList.add("over")};
      chip.onpointerup=e=>{if(!down)return;down=false;chip.classList.remove("drag");g.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));
        if(Math.abs(dx)+Math.abs(dy)<6){g.querySelectorAll(".mchip").forEach(c=>c.classList.remove("sel"));chip.style.transform="";sel=chip;chip.classList.add("sel");return}
        chip.style.pointerEvents="none";const el=document.elementFromPoint(e.clientX,e.clientY);chip.style.pointerEvents="";tryDrop(chip,el&&el.closest(".slot:not(.ok)"))};
      chip.onpointercancel=()=>{down=false;chip.style.transform=""};
      chip.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();g.querySelectorAll(".mchip").forEach(c=>c.classList.remove("sel"));sel=chip;chip.classList.add("sel")}}});
    g.querySelectorAll(".slot").forEach(s=>{s.tabIndex=0;const act=()=>{if(sel&&sel.isConnected&&!s.classList.contains("ok")){const c=sel;sel=null;c.classList.remove("sel");tryDrop(c,s)}};s.onclick=act;s.onkeydown=e=>{if(e.key==="Enter")act()}});
  }
  next();
}

/* ---- Frases: choose / write / who ---- */
function vSent(g,mode){
  const all=sentences();
  if(!all.length){g.innerHTML=`<p class="hint">Select at least one verb other than chamar-se.</p>`;return}
  const N=12;let items=shuffle(all).slice(0,N),i=0,ok=0,streak=0,best=0;
  function draw(){
    if(i>=items.length){g.innerHTML=`<div class="gcard done"><h2>${ok} / ${items.length}</h2><p>Best streak: ${best}</p><button class="btn" id="re">New set of sentences</button></div>`;$("#re").onclick=()=>vSent(g,mode);refreshVerbChips();return}
    const it=items[i],V=it.V,form=V.f[it.p],full=`${it.subj} ${form} ${it.c}`;
    let body,prompt;
    if(mode==="who"){prompt=`<span class="blank">&nbsp;</span> ${esc(form)} ${esc(it.c)}`;
      body=`<div class="tiles">${PSHORT.map((s,k)=>`<button class="tile" data-k="${k}">${s}</button>`).join("")}</div>`}
    else{prompt=`${esc(it.subj)} <span class="blank">&nbsp;</span> ${esc(it.c)}`;
      body=mode==="choose"
        ?`<div class="tiles">${shuffle(uniqForms(V,it.p)).map(f=>`<button class="tile" data-f="${esc(f)}">${esc(f)}</button>`).join("")}</div>`
        :`<input id="sin" class="sin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(V.v)} → ?"><div class="keys"><span class="lbl">Accents</span>${["á","à","â","ã","é","ê","í","ó","ô","õ","ú","ç"].map(c=>`<button class="key" type="button" data-c="${c}">${c}</button>`).join("")}</div><div class="actions"><span></span><button class="btn" id="schk">Check</button></div>`}
    g.innerHTML=`<div class="cardtop"><span class="hint">${i+1} / ${items.length} · <b class="okc">${ok}</b> correct · streak <b>${streak}</b></span></div>
      <div class="gcard sentc" id="sc"><span class="tl">${mode==="who"?"Who is it? Pick the pronoun":`${esc(V.v)} · ${esc(V.en)}`}</span><p class="sent">${prompt}</p>${body}<div id="sfb"></div></div>`;
    const finish=(good,given)=>{
      const sc=$("#sc");sc.classList.remove("ok","no");void sc.offsetWidth;sc.classList.add(good?"ok":"no");
      vmark(V.v,it.p,good);if(good){ok++;streak++;best=Math.max(best,streak)}else streak=0;
      g.querySelector(".sent").innerHTML=`${esc(it.subj)} <b class="${good?"okt":"badt"}">${esc(form)}</b> ${esc(it.c)} ${spkBtn(full)}`;speak(full);
      $("#sfb").innerHTML=`<p class="${good?"okt":"badt"}"><b>${good?"Correct!":"Not quite."}</b> ${good?"":`${mode==="who"?`“${esc(form)}” is the <b>${PERS[it.p]}</b> form.`:`${PERS[it.p]} → <b>${esc(form)}</b>${given&&strip(norm(given))===strip(norm(form))?" (check the accents)":""}.`}`}</p>
        <p class="hint">${esc(V.v)}: ${V.f.map((f,k)=>k===it.p?`<b>${esc(f)}</b>`:esc(f)).join(", ")}</p>
        <div class="actions"><span></span><button class="btn" id="snx">${i+1<items.length?"Next →":"Finish"}</button></div>`;
      g.querySelectorAll(".tile").forEach(t=>t.disabled=true);
      $("#snx").onclick=()=>{i++;draw()};$("#snx").focus();
    };
    if(mode==="who")g.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const k=+t.dataset.k,good=k===it.p;t.classList.add(good?"right":"wrong");if(!good)g.querySelector(`.tile[data-k="${it.p}"]`).classList.add("right");finish(good)});
    else if(mode==="choose")g.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const good=t.dataset.f===form;t.classList.add(good?"right":"wrong");if(!good)g.querySelectorAll(".tile").forEach(x=>{if(x.dataset.f===form)x.classList.add("right")});finish(good,t.dataset.f)});
    else{const inp=$("#sin");inp.focus();
      g.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+1,s+1)});
      const chk=()=>{if(!inp.value.trim()||inp.disabled)return;inp.disabled=true;$("#schk").remove();finish(norm(inp.value)===norm(form),inp.value)};
      $("#schk").onclick=chk;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();chk()}}}
  }
  draw();
}
function uniqForms(V,p){const others=shuffle([0,1,2,3,4].filter(k=>k!==p&&V.f[k]!==V.f[p])).slice(0,3).map(k=>V.f[k]);return [V.f[p],...new Set(others)]}

render();
</script>
