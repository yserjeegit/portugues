/* ---------- 1. Cartões: flip + swipe ---------- */
function gCards(g,P){
  const v=VS();let q=P.slice(),known=0,again=0,total=P.length;
  function draw(){
    if(!q.length){g.innerHTML=`<div class="gcard done"><h2>Deck finished</h2><p>${known} known · ${again} to repeat</p><button class="btn" id="re">Shuffle and start again</button></div>`;$("#re").onclick=()=>gCards(g,shuffle(pool()));refreshDecks();return}
    const w=q[0],front=v.dir==="pt";
    g.innerHTML=`<div class="cardtop"><span class="hint">${total-q.length+1} / ${total} · <b class="okc">${known}</b> known · <b class="badc">${again}</b> again</span>
      <button class="btn ghost sm" id="dir">${front?"PT → EN":"EN → PT"}</button></div>
      <div class="stage"><div class="flash" id="fl" tabindex="0" aria-label="Flashcard, tap to flip">
        <div class="face front">${front?`<span class="big">${esc(w.pt)}</span><span class="tl">${tagLabel(w.t)}</span>${spkBtn(w.pt)}`:`<span class="big en">${esc(w.en)}</span><span class="tl">${tagLabel(w.t)}</span>`}<span class="tap">tap to flip</span></div>
        <div class="face back">${front?`<span class="big en">${esc(w.en)}</span>`:`<span class="big">${esc(w.pt)}</span>${spkBtn(w.pt)}`}${w.ex?`<span class="ex">${esc(w.ex)}</span>`:""}${w.note?`<span class="note">${esc(w.note)}</span>`:""}</div>
      </div><div class="swipe-l">Again</div><div class="swipe-r">Know it</div></div>
      <div class="cardbtns"><button class="btn ghost" id="no">← Again</button><button class="btn ghost" id="flip">Flip</button><button class="btn" id="yes">Know it →</button></div>
      <p class="hint center">Swipe the card right if you know it, left to see it again.</p>`;
    const fl=$("#fl");let flipped=false;
    const flip=()=>{flipped=!flipped;fl.classList.toggle("flipped",flipped);if(flipped&&!front)speak(w.pt)};
    const out=ok=>{fl.style.transition="transform .35s ease, opacity .35s";fl.style.transform=`translateX(${ok?520:-520}px) rotate(${ok?24:-24}deg)`;fl.style.opacity="0";
      mark(w,ok);q.shift();if(ok)known++;else{again++;q.splice(Math.min(q.length,4),0,w)}setTimeout(draw,300)};
    $("#flip").onclick=flip;$("#yes").onclick=()=>out(true);$("#no").onclick=()=>out(false);
    $("#dir").onclick=()=>{v.dir=front?"en":"pt";save();draw()};
    fl.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}if(e.key==="ArrowRight")out(true);if(e.key==="ArrowLeft")out(false)};
    let sx=0,dx=0,down=false;
    fl.onpointerdown=e=>{if(e.target.closest("[data-say]"))return;down=true;sx=e.clientX;dx=0;fl.setPointerCapture(e.pointerId);fl.style.transition="none"};
    fl.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;fl.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;g.querySelector(".swipe-r").style.opacity=Math.max(0,dx/120);g.querySelector(".swipe-l").style.opacity=Math.max(0,-dx/120)};
    fl.onpointerup=fl.onpointercancel=()=>{if(!down)return;down=false;
      if(Math.abs(dx)>100)return out(dx>0);
      fl.style.transition="transform .25s";fl.style.transform="";g.querySelector(".swipe-r").style.opacity=0;g.querySelector(".swipe-l").style.opacity=0;
      if(Math.abs(dx)<6)flip()};
  }
  draw();
}

    round++;let left=items.length,sel=null;
    g.innerHTML=`<div class="cardtop"><span class="hint">Round ${round} · <b class="okc">${score}</b> matched · <b class="badc">${mist}</b> mistakes</span></div>
      <p class="hint">Drag each English meaning onto its Portuguese word (or tap a meaning, then tap the word).</p>
      <div class="match"><div class="slots">${items.map((w,i)=>`<div class="slot" data-i="${i}"><span class="sp">${esc(w.pt)}</span><span class="drop">drop here</span></div>`).join("")}</div>
      <div class="chips2">${shuffle(items.map((w,i)=>i)).map(i=>`<div class="mchip" data-i="${i}" tabindex="0">${esc(items[i].en)}</div>`).join("")}</div></div>`;
    const tryDrop=(chip,slot)=>{
      const i=+chip.dataset.i,w=items[i];
      if(slot&&+slot.dataset.i===i){slot.classList.add("ok","pop");slot.querySelector(".drop").textContent=w.en;chip.remove();mark(w,true);score++;speak(w.pt);
        if(--left===0){refreshDecks();setTimeout(()=>{g.querySelector(".match").insertAdjacentHTML("afterend",`<div class="actions"><span class="hint">Round complete.</span><button class="btn" id="nr">Next round →</button></div>`);$("#nr").onclick=next;$("#nr").focus()},250)}}
      else{chip.style.transition="transform .3s";chip.style.transform="";chip.classList.remove("shake");void chip.offsetWidth;chip.classList.add("shake");
        if(slot){slot.classList.remove("bad");void slot.offsetWidth;slot.classList.add("bad");mark(items[+slot.dataset.i],false);mist++;}}
      g.querySelector(".hint b.okc").textContent=score;g.querySelector(".hint b.badc").textContent=mist;
    };
    g.querySelectorAll(".mchip").forEach(chip=>{
      let sx,sy,dx=0,dy=0,down=false;
      chip.onpointerdown=e=>{down=true;sx=e.clientX;sy=e.clientY;dx=dy=0;chip.setPointerCapture(e.pointerId);chip.style.transition="none";chip.classList.add("drag")};
      chip.onpointermove=e=>{if(!down)return;dx=e.clientX-sx;dy=e.clientY-sy;chip.style.transform=`translate(${dx}px,${dy}px) scale(1.05)`;
        g.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));chip.style.pointerEvents="none";const el=document.elementFromPoint(e.clientX,e.clientY);chip.style.pointerEvents="";const s=el&&el.closest(".slot:not(.ok)");if(s)s.classList.add("over")};
      chip.onpointerup=e=>{if(!down)return;down=false;chip.classList.remove("drag");g.querySelectorAll(".slot").forEach(s=>s.classList.remove("over"));
        if(Math.abs(dx)+Math.abs(dy)<6){g.querySelectorAll(".mchip").forEach(c=>c.classList.remove("sel"));chip.style.transform="";sel=chip;chip.classList.add("sel");return}
        chip.style.pointerEvents="none";const el=document.elementFromPoint(e.clientX,e.clientY);chip.style.pointerEvents="";tryDrop(chip,el&&el.closest(".slot:not(.ok)"))};
      chip.onpointercancel=()=>{down=false;chip.style.transform=""};
      chip.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();g.querySelectorAll(".mchip").forEach(c=>c.classList.remove("sel"));sel=chip;chip.classList.add("sel")}};
    });
    g.querySelectorAll(".slot").forEach(s=>{s.tabIndex=0;const act=()=>{if(sel&&sel.isConnected&&!s.classList.contains("ok")){const c=sel;sel=null;c.classList.remove("sel");tryDrop(c,s)}};s.onclick=act;s.onkeydown=e=>{if(e.key==="Enter")act()}});
  }
  next();
}

/* ---------- 3. Escrever: type the Portuguese ---------- */
function gType(g,P){
  let q=P.slice(),ok=0,bad=0,streak=0;
  function draw(){
    if(!q.length){g.innerHTML=`<div class="gcard done"><h2>All done</h2><p>${ok} correct · ${bad} mistakes</p><button class="btn" id="re">Start again</button></div>`;$("#re").onclick=()=>gType(g,shuffle(pool()));refreshDecks();return}
    const w=q[0],acc=[...new Set(VOCAB.filter(x=>x.en===w.en).flatMap(vAccept))];let hints=0,answered=false;
    const target=w.pt.split(" / ")[0];
    g.innerHTML=`<div class="cardtop"><span class="hint"><b class="okc">${ok}</b> correct · <b class="badc">${bad}</b> mistakes · streak <b>${streak}</b> · ${q.length} left</span></div>
      <div class="gcard typec" id="tc"><span class="tl">${tagLabel(w.t)}${isNoun(w)?" · article optional":""}</span><span class="big en">${esc(w.en)}</span>
        <div class="reveal" id="rv" aria-live="polite">${target.replace(/[^\s\-\/!?.…()]/g,"_")}</div>
        <input id="tin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type in Portuguese">
        <div class="keys"><span class="lbl">Accents</span>${["á","à","â","ã","é","ê","í","ó","ô","õ","ú","ç"].map(c=>`<button class="key" type="button" data-c="${c}">${c}</button>`).join("")}</div>
        <div id="tfb"></div>
        <div class="actions"><button class="btn ghost sm" id="hint">Show a letter</button><button class="btn" id="tchk">Check</button></div></div>`;
    const inp=$("#tin");inp.focus();
    g.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+1,s+1)});
    $("#hint").onclick=()=>{hints++;let n=0;$("#rv").textContent=[...target].map(c=>/[\s\-\/!?.…()]/.test(c)?c:(n++<hints?c:"_")).join("")};
    const check=()=>{
      if(answered){q.shift();draw();return}
      const g2=vnorm(inp.value);if(!g2)return;answered=true;
      const good=acc.includes(g2),near=!good&&acc.map(strip).includes(strip(g2));
      const tc=$("#tc");tc.classList.remove("ok","no");void tc.offsetWidth;tc.classList.add(good?"ok":"no");
      if(good){ok++;streak++;mark(w,hints<2)}else{bad++;streak=0;mark(w,false);q.splice(Math.min(q.length,5),0,w)}
      $("#rv").textContent=w.pt;inp.disabled=true;speak(w.pt);
      $("#tfb").innerHTML=`<p class="${good?"okt":"badt"}"><b>${good?"Correct!":near?"Almost: check the accents.":"Not quite."}</b> ${esc(w.pt)} ${spkBtn(w.pt)}</p>${w.ex?`<p class="ex">${esc(w.ex)}</p>`:""}${w.note?`<p class="note">${esc(w.note)}</p>`:""}`;
      $("#tchk").textContent="Next →";$("#tchk").focus();$("#hint").disabled=true;
    };
    $("#tchk").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};
    $("#tchk").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};
  }
  draw();
}

/* ---------- 4. Nuvem: catch the floating words ---------- */
function gCloud(g,P){
  const best=VS().best||{};
  g.innerHTML=`<div class="cloudmenu">
      <button class="cmode" data-cm="tr"><b>Catch the translation</b><span>An English word appears. Tap its Portuguese twin among the floating words.</span><span class="hint">Best: ${best.tr||0}</span></button>
      <button class="cmode" data-cm="cat"><b>Catch the category</b><span>Catch every word that fits: colours, -er verbs, feminine nouns… Uses all topics.</span><span class="hint">Best: ${best.cat||0}</span></button></div>`;
  g.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>playCloud(g,b.dataset.cm));
}
function playCloud(g,mode){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const P=mode==="tr"?pool():(()=>{const s=new Set();return VOCAB.filter(w=>!s.has(w.pt)&&s.add(w.pt))})();
  if(mode==="tr"&&P.length<6){g.innerHTML=`<p class="hint">Select topics with at least 6 words.</p>`;return}
  let score=0,lives=3,time=60,combo=0,target=null,cat=null,need=0,bubbles=[],raf=0,tmr=0,over=false;
  g.innerHTML=`<div class="cloudhud"><span class="lives" id="lv"></span><span class="ctarget" id="ct"></span><span class="cscore"><b id="cs">0</b> pts · <b id="cti">60</b>s</span></div>
    <div class="cloud" id="cl"></div>`;
  const cl=$("#cl");
  const W=()=>cl.clientWidth,H=()=>cl.clientHeight;
  const hud=()=>{$("#lv").textContent="♥".repeat(lives)+"♡".repeat(3-lives);$("#cs").textContent=score;$("#cti").textContent=time};
  function spawn(w){
    const el=document.createElement("button");el.className="bub";el.type="button";const t0=w.pt.split(" / ")[0];el.textContent=mode==="cat"?bare(t0):t0;cl.appendChild(el);
    const bw=el.offsetWidth,bh=el.offsetHeight,sp=reduce?.25:(.5+Math.random()*.7);const a=Math.random()*Math.PI*2;
    let x=0,y=0;for(let k=0;k<30;k++){x=Math.random()*Math.max(1,W()-bw);y=Math.random()*Math.max(1,H()-bh);if(!bubbles.some(o=>!o.dead&&x<o.x+o.bw+6&&x+bw+6>o.x&&y<o.y+o.bh+6&&y+bh+6>o.y))break}
    const b={w,el,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,bw,bh,dead:false};
    el.onclick=()=>hit(b);bubbles.push(b);return b;
  }
  function pickTarget(){const live=bubbles.filter(b=>!b.dead);target=live[Math.floor(Math.random()*live.length)];$("#ct").innerHTML=`Catch: <b>${esc(target.w.en)}</b>`}
  function newCat(){
    bubbles.forEach(b=>b.el.remove());bubbles=[];
    const opts=CATS.filter(c=>P.filter(c.f).length>=4&&c!==cat);cat=opts[Math.floor(Math.random()*opts.length)];
    const yes=shuffle(P.filter(cat.f)).slice(0,4),no=shuffle(P.filter(w=>!cat.f(w))).slice(0,5);need=yes.length;
    shuffle([...yes,...no]).forEach(spawn);$("#ct").innerHTML=`Catch <b>${cat.label}</b> · <span id="nd">${need}</span> left`;
  }
  function fresh(){const on=new Set(bubbles.filter(b=>!b.dead).map(b=>b.w.pt));const c=shuffle(P).find(w=>!on.has(w.pt));return c||P[0]}
  function hit(b){
    if(over||b.dead)return;
    const good=mode==="tr"?b===target:cat.f(b.w);
    if(good){b.dead=true;combo++;const add=10+Math.min(combo-1,5)*2;score+=add;b.el.classList.add("popped");b.el.insertAdjacentHTML("beforeend",`<span class="plus">+${add}</span>`);mark(b.w,true);speak(b.w.pt);
      setTimeout(()=>{b.el.remove();bubbles=bubbles.filter(x=>x!==b);
        if(mode==="tr"){spawn(fresh());pickTarget()}else if(--need<=0){score+=20;newCat()}else{const nd=$("#nd");if(nd)nd.textContent=need}hud()},280)}
    else{combo=0;lives--;b.el.classList.remove("wrongb");void b.el.offsetWidth;b.el.classList.add("wrongb");cl.classList.remove("hurt");void cl.offsetWidth;cl.classList.add("hurt");
      if(mode==="tr")mark(target.w,false);hud();if(lives<=0)end()}
    hud();
  }
  function loop(){
    const w=W(),h=H();
    bubbles.forEach(b=>{if(b.dead)return;b.x+=b.vx;b.y+=b.vy;if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)}if(b.x>w-b.bw){b.x=w-b.bw;b.vx=-Math.abs(b.vx)}if(b.y<0){b.y=0;b.vy=Math.abs(b.vy)}if(b.y>h-b.bh){b.y=h-b.bh;b.vy=-Math.abs(b.vy)}b.el.style.transform=`translate(${b.x}px,${b.y}px)`});
    raf=requestAnimationFrame(loop);
  }
  function end(){
    if(over)return;over=true;cancelAnimationFrame(raf);clearInterval(tmr);
    const v=VS();v.best=v.best||{};const rec=score>(v.best[mode]||0);if(rec)v.best[mode]=score;save();refreshDecks();
    cl.insertAdjacentHTML("beforeend",`<div class="cover"><h2>${lives<=0?"Out of lives":"Time's up"}</h2><p class="bigscore">${score} pts</p>${rec?`<p class="okt"><b>New best!</b></p>`:`<p class="hint">Best: ${v.best[mode]}</p>`}<div class="row"><button class="btn" id="pa">Play again</button><button class="btn ghost" id="pm">Change game</button></div></div>`);
    $("#pa").onclick=()=>playCloud(g,mode);$("#pm").onclick=()=>gCloud(g,P);
  }
  if(mode==="tr"){shuffle(P).slice(0,8).forEach(spawn);pickTarget()}else newCat();
  hud();loop();
  tmr=setInterval(()=>{if(document.visibilityState!=="visible")return;time--;hud();if(time<=0)end()},1000);
  stopGame=()=>{over=true;cancelAnimationFrame(raf);clearInterval(tmr)};
}

/* ===== shared session runner (used by Palavras: Números / Teste, Verbos: Teste) ===== */
const ACC=["á","à","â","ã","é","ê","í","ó","ô","õ","ú","ç"];
const accentKeys=()=>`<div class="keys"><span class="lbl">Accents</span>${ACC.map(c=>`<button class="key" type="button" data-c="${c}">${c}</button>`).join("")}</div>`;
function bindKeys(root,inp){root.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const i=typeof inp==="function"?inp():inp;if(!i||i.disabled)return;const s=i.selectionStart??i.value.length,e=i.selectionEnd??s;i.value=i.value.slice(0,s)+b.dataset.c+i.value.slice(e);i.focus();i.setSelectionRange(s+1,s+1)})}
const KIND={type:"Type",mc:"Choose",tiles:"Build",listen:"Listen"};
// item: {kind:"type"|"mc"|"tiles"|"listen", label, prompt(html), accept[] | options[]+correct | tiles[]+answer, show, say, explain, onResult(ok)}
function runSession(g,items,title,again){
  let i=0,ok=0,streak=0,best=0;
  const typedShare=Math.round(items.filter(x=>x.kind==="type"||x.kind==="listen").length/items.length*100);
  function draw(){
    if(i>=items.length){g.innerHTML=`<div class="gcard done"><h2>${ok} / ${items.length}</h2><p>Best streak: ${best}</p><button class="btn" id="re">New set</button></div>`;$("#re").onclick=again;refreshDecks&&refreshDecks();typeof refreshVerbChips==="function"&&refreshVerbChips();return}
    const it=items[i];let body="";
    if(it.kind==="type"||it.kind==="listen")body=`${it.kind==="listen"?`<button class="btn ghost" id="play" type="button">${SPK} Play again</button>`:""}<input id="sin" class="sin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="${it.numeric?"numeric":"text"}" placeholder="${esc(it.ph||"Type here")}">${it.numeric?"":accentKeys()}<div class="actions"><span></span><button class="btn" id="schk">Check</button></div>`;
    else if(it.kind==="mc")body=`<div class="tiles">${it.options.map((o,k)=>`<button class="tile" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
    else body=`<div class="built" id="built"><span class="hint">Tap the words in order</span></div><div class="tiles tw">${it.tiles.map((t,k)=>`<button class="tile tw" data-k="${k}">${esc(t)}</button>`).join("")}</div><div class="actions"><button class="btn ghost sm" id="undo">Undo</button><button class="btn" id="schk" disabled>Check</button></div>`;
    g.innerHTML=`<div class="cardtop"><span class="hint">${esc(title)} · ${i+1} / ${items.length} · <b class="okc">${ok}</b> correct · streak <b>${streak}</b></span><span class="hint">${typedShare}% typed</span></div>
      <div class="gcard sentc" id="sc"><span class="tl">${KIND[it.kind]} · ${esc(it.label)}</span><div class="sent">${it.prompt}</div>${body}<div id="sfb"></div></div>`;
    const finish=(good,given)=>{
      const sc=$("#sc");sc.classList.remove("ok","no");void sc.offsetWidth;sc.classList.add(good?"ok":"no");
      if(good){ok++;streak++;best=Math.max(best,streak)}else streak=0;it.onResult&&it.onResult(good);
      if(it.say)speak(it.say);
      const near=!good&&given&&it.accept&&it.accept.map(strip).includes(strip(vnorm(given)));
      $("#sfb").innerHTML=`<p class="${good?"okt":"badt"}"><b>${good?"Correct!":near?"Almost: check the accents.":"Not quite."}</b> ${good?"":`Answer: <b>${esc(it.show)}</b>`} ${it.say?spkBtn(it.say):""}</p>${it.explain?`<p class="hint">${it.explain}</p>`:""}<div class="actions"><span></span><button class="btn" id="snx">${i+1<items.length?"Next →":"Finish"}</button></div>`;
      g.querySelectorAll(".tile").forEach(t=>t.disabled=true);$("#snx").onclick=()=>{i++;draw()};$("#snx").focus();
    };
    if(it.kind==="type"||it.kind==="listen"){const inp=$("#sin");inp.focus();bindKeys(g,inp);
      if(it.kind==="listen"){const p=()=>speak(it.say);$("#play").onclick=p;setTimeout(p,250)}
      const chk=()=>{if(!inp.value.trim()||inp.disabled)return;inp.disabled=true;$("#schk").remove();finish(it.accept.includes(vnorm(inp.value)),inp.value)};
      $("#schk").onclick=chk;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();chk()}}}
    else if(it.kind==="mc")g.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const k=+t.dataset.k,good=k===it.correct;t.classList.add(good?"right":"wrong");if(!good)g.querySelector(`.tile[data-k="${it.correct}"]`).classList.add("right");finish(good)});
    else{const picked=[];const built=$("#built");
      const redraw=()=>{built.innerHTML=picked.length?picked.map(k=>`<span class="bw">${esc(it.tiles[k])}</span>`).join(" "):`<span class="hint">Tap the words in order</span>`;$("#schk").disabled=!picked.length;g.querySelectorAll(".tile.tw").forEach(t=>t.classList.toggle("used",picked.includes(+t.dataset.k)))};
      g.querySelectorAll(".tile.tw").forEach(t=>t.onclick=()=>{const k=+t.dataset.k;if(picked.includes(k))return;picked.push(k);redraw()});
      $("#undo").onclick=()=>{picked.pop();redraw()};
      $("#schk").onclick=()=>{const s=picked.map(k=>it.tiles[k]).join(" ");$("#undo").remove();$("#schk").remove();finish(vnorm(s)===vnorm(it.answer),s)}}
  }
  draw();
}

/* ===== Números ===== */
const NU=["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","catorze","quinze","dezasseis","dezassete","dezoito","dezanove"];
const NT=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const NH=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
const numW=n=>{if(n===1000)return"mil";if(n===100)return"cem";const p=[];if(n>=100){p.push(NH[Math.floor(n/100)]);n%=100}if(n>0){if(n<20)p.push(NU[n]);else{p.push(NT[Math.floor(n/10)]);if(n%10)p.push(NU[n%10])}}return p.join(" e ")||"zero"};
const NRANGES=[["a","0–20",0,20],["b","21–100",21,100],["c","101–1000",101,1000],["all","Mix",0,1000]];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function numTip(n){if(n<=20)return "0–19 have their own words. European spelling: dezasseis, dezassete, dezanove.";if(n===100)return "Exactly 100 is <i>cem</i>; 101–199 use <i>cento e…</i>.";if(n===1000)return "1000 = <i>mil</i>.";return "Join every part with <b>e</b>: hundreds <i>e</i> tens <i>e</i> units. Irregular hundreds: duzentos, trezentos, quinhentos.";}
function gNumbers(g){
  const v=VS(),r=v.nrange||"all";
  g.innerHTML=`<div class="cardtop"><span class="hint">Range</span><span class="seg2">${NRANGES.map(([id,l])=>`<button class="btn ${r===id?"":"ghost"} sm" data-nr="${id}">${l}</button>`).join("")}</span></div><div id="ng"></div>`;
  g.querySelectorAll("[data-nr]").forEach(b=>b.onclick=()=>{v.nrange=b.dataset.nr;save();gNumbers(g)});
  const [, ,lo,hi]=NRANGES.find(x=>x[0]===r);const canSay=typeof speechSynthesis!=="undefined";
  const used=new Set(),pickN=()=>{let n,k=0;do{n=rnd(lo,hi);if(r==="c"&&Math.random()<.25)n=rnd(1,9)*100+(Math.random()<.5?0:rnd(1,99))}while(used.has(n)&&k++<50);used.add(n);return n};
  const kinds=["w","w","w","d","d",canSay?"l":"w","b","b"],items=[];
  for(let k=0;k<15;k++){const n=pickN(),w=numW(n),kd=kinds[k%kinds.length];
    const base={say:w,explain:`${n} = <b>${w}</b>. ${numTip(n)}`,onResult:ok=>{const card=VOCAB.find(x=>x.t==="num"&&x.pt===w);if(card)mark(card,ok)}};
    if(kd==="w")items.push({...base,kind:"type",label:"write in words",prompt:`<span class="numbig">${n}</span>`,accept:[vnorm(w)],show:w,ph:"por extenso"});
    else if(kd==="d")items.push({...base,kind:"type",numeric:true,label:"write the digits",prompt:`<span class="numw">${w}</span>`,accept:[String(n)],show:String(n),ph:"0–1000"});
    else if(kd==="l")items.push({...base,kind:"listen",label:"write what you hear",prompt:`<span class="hint">Listen and type the number, in digits or in words.</span>`,accept:[String(n),vnorm(w)],show:`${n} (${w})`,ph:"e.g. 921 or novecentos e vinte e um"});
    else{const parts=w.split(" ");const near=numW(Math.min(1000,Math.max(0,n+(Math.random()<.5?rnd(1,9):rnd(10,90))*(Math.random()<.5?1:-1)))).split(" ").filter(p=>p!=="e"&&!parts.includes(p));
      const tiles=shuffle([...parts,...near.slice(0,2)]);items.push({...base,kind:"tiles",label:"build the number",prompt:`<span class="numbig">${n}</span>`,tiles,answer:w,show:w})}}
  runSession($("#ng"),shuffle(items),"Números "+NRANGES.find(x=>x[0]===r)[1],()=>gNumbers(g));
}

/* ===== Palavras · Teste misto (40% typed) ===== */
function gTest(g,P){
  if(P.length<6){g.innerHTML=`<p class="hint">Select topics with at least 6 words.</p>`;return}
  const words=shuffle(P).slice(0,15),items=[];
  words.forEach((w,k)=>{
    const others=n=>shuffle(P.filter(x=>x.en!==w.en)).slice(0,n);
    const base={say:w.pt.split(" / ")[0],explain:[w.ex,w.note].filter(Boolean).map(esc).join(" · "),onResult:ok=>mark(w,ok)};
    if(k<6)items.push({...base,kind:"type",label:tagLabel(w.t)||"word",prompt:`<span class="en">${esc(w.en)}</span>`,accept:[...new Set(VOCAB.filter(x=>x.en===w.en).flatMap(vAccept))],show:w.pt,ph:"em português"});
    else if(k<11){const o=shuffle([w,...others(3)]);items.push({...base,kind:"mc",label:"what does it mean?",prompt:esc(w.pt),options:o.map(x=>x.en),correct:o.indexOf(w),show:w.en})}

  });
  runSession(g,shuffle(items),"Teste",()=>gTest(g,shuffle(pool())));

      <div class="actions"><button class="btn ghost" id="vback">Show table</button><button class="btn" id="vchk">Check</button></div>`;

    const it=items[i],V=it.V,form=V.f[it.p],full=`${it.subj} ${form} ${it.c}`;

    g.innerHTML=`<div class="cardtop"><span class="hint">${i+1} / ${items.length} · <b class="okc">${ok}</b> correct · streak <b>${streak}</b></span></div>
      <div class="gcard sentc" id="sc"><span class="tl">${mode==="who"?"Who is it? Pick the pronoun":`${esc(V.v)} · ${esc(V.en)}`}</span><p class="sent">${prompt}</p>${body}<div id="sfb"></div></div>`;
    const finish=(good,given)=>{
      const sc=$("#sc");sc.classList.remove("ok","no");void sc.offsetWidth;sc.classList.add(good?"ok":"no");
      vmark(V.v,it.p,good);if(good){ok++;streak++;best=Math.max(best,streak)}else streak=0;
      g.querySelector(".sent").innerHTML=`${esc(it.subj)} <b class="${good?"okt":"badt"}">${esc(form)}</b> ${esc(it.c)} ${spkBtn(full)}`;speak(full);

        <p class="hint">${esc(V.v)}: ${V.f.map((f,k)=>k===it.p?`<b>${esc(f)}</b>`:esc(f)).join(", ")}</p>
        <div class="actions"><span></span><button class="btn" id="snx">${i+1<items.length?"Next →":"Finish"}</button></div>`;
      g.querySelectorAll(".tile").forEach(t=>t.disabled=true);
      $("#snx").onclick=()=>{i++;draw()};$("#snx").focus();
    };
    if(mode==="who")g.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const k=+t.dataset.k,good=k===it.p;t.classList.add(good?"right":"wrong");if(!good)g.querySelector(`.tile[data-k="${it.p}"]`).classList.add("right");finish(good)});
    else if(mode==="choose")g.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const good=t.dataset.f===form;t.classList.add(good?"right":"wrong");if(!good)g.querySelectorAll(".tile").forEach(x=>{if(x.dataset.f===form)x.classList.add("right")});finish(good,t.dataset.f)});
    else{const inp=$("#sin");inp.focus();
      g.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+1,s+1)});

      $("#schk").onclick=chk;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();chk()}}}
  }

}

  const bf=$("#bf"),bw=$("#bw"),RH=54;
  let H=bf.clientHeight,rows=[],bottom=RH*1.4,extra=0,score=0,combo=0,level=1,okN=0,badN=0,over=false,raf=0,last=performance.now(),lock=false,rc=0;
  const speedFor=l=>(l<10?9+(l-1)*1.3:22+(l-10)*2.2)*(reduce?.7:1);
  const stats=()=>bStats({score,level,ok:okN,bad:badN,need:3,prog:okN%3});
  function makeRow(){
    const t=nextTask(),V=t.V,form=V.f[t.p],nW=level<10?2:3,odd=rc++%2===1;
    const others=shuffle([...new Set(V.f.filter(f=>f!==form))]).slice(0,nW-1);
    const slots=odd?3:4,words=shuffle([form,...others]),cells=Array(slots).fill(null);
    shuffle([...Array(slots).keys()]).slice(0,words.length).forEach((pos,k)=>cells[pos]=words[k]);
    const el=document.createElement("div");el.className="brow wait"+(odd?" odd":"");
    const brick=c=>c?`<button class="brick w" data-f="${esc(c)}" style="--r:${(Math.random()*6-3).toFixed(1)}deg"><span>${esc(c)}</span></button>`:`<span class="brick"></span>`;
    el.innerHTML=(odd?`<span class="brick half"></span>`:"")+cells.map(brick).join("")+(odd?`<span class="brick half"></span>`:"");
    bf.appendChild(el);const r={t,form,el};el.querySelectorAll("button.brick").forEach(b=>b.onclick=()=>tap(r,b));return r;
  }
  function showSentence(){const r=rows[0];if(!r)return;const t=r.t;
    $("#bsn").innerHTML=`<span class="tl">${esc(t.V.v)} · ${esc(t.V.en)}</span><p class="sent">${esc(t.subj)} <span class="blank" id="bbl">&nbsp;</span> ${esc(t.c)}</p>`;
    rows.forEach((x,k)=>{x.el.classList.toggle("wait",k>0);x.el.classList.toggle("active",k===0)})}
  function banner(txt){const b=$("#bban");b.textContent=txt;b.classList.remove("on");void b.offsetWidth;b.classList.add("on")}
  function tap(r,b){
    if(over||lock||r!==rows[0])return;
    if(b.dataset.f===r.form){lock=true;combo++;okN++;score+=10+Math.min(combo-1,5)*2+(level>=10?5:0);b.classList.add("bok");
      const bl=$("#bbl");if(bl){bl.textContent=r.form;bl.classList.add("filled")}vmark(r.t.V.v,r.t.p,true);speak(`${r.t.subj} ${r.form} ${r.t.c}`);
      r.el.querySelectorAll(".brick").forEach((x,k)=>{x.style.setProperty("--dx",(k-1.5)*14+"px");x.style.setProperty("--rot",(Math.random()*50-25)+"deg")});
      setTimeout(()=>r.el.classList.add("crumble"),180);
      const nl=1+Math.floor(okN/3);if(nl>level){level=nl;banner(level===10?"Nível 10! Three words, faster wall":`Nível ${level}`)}
      stats();
      setTimeout(()=>{r.el.remove();rows.shift();bottom=Math.max(RH*1.5,bottom-RH);showSentence();lock=false},520)}
    else{combo=0;badN++;extra+=RH;b.classList.add("bbad");vmark(r.t.V.v,r.t.p,false);stats();
      bw.classList.remove("shake2");void bw.offsetWidth;bw.classList.add("shake2");const fl=$("#bfl");fl.classList.remove("on");void fl.offsetWidth;fl.classList.add("on");
      try{navigator.vibrate&&navigator.vibrate(180)}catch(e){}
      setTimeout(()=>b.classList.remove("bbad"),420)}
  }
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;H=bf.clientHeight;
    if(document.visibilityState==="visible"){bottom+=speedFor(level)*dt;if(extra>0){const m=Math.min(extra,420*dt);bottom+=m;extra-=m}}
    while(!rows.length||bottom-rows.length*RH>-RH){rows.push(makeRow());if(rows.length===1)showSentence()}
    rows.forEach((r,k)=>{r.el.style.transform=`translateY(${bottom-(k+1)*RH}px)`});
    if(bottom>=H)return end();
    raf=requestAnimationFrame(frame);
  }
  function end(){over=true;cancelAnimationFrame(raf);const rec=score>(st.bbest||0);if(rec)st.bbest=score;save();stats();refreshVerbChips();
    const acc=okN+badN?Math.round(okN/(okN+badN)*100):0;
    bf.insertAdjacentHTML("beforeend",`<div class="cover"><h2>The wall reached the sentence</h2><p class="bigscore">${score} pts</p><p class="hint">Level ${level} · ${okN} correct · ${badN} mistakes · ${acc}% accuracy</p>${rec?`<p class="okt"><b>New record!</b></p>`:`<p class="hint">Record: ${st.bbest}</p>`}<div class="row"><button class="btn" id="bagain">Play again</button></div></div>`);
    $("#bagain").onclick=()=>playBlocks(g)}
  stats();showSentence();raf=requestAnimationFrame(frame);
  stopGame=()=>{over=true;cancelAnimationFrame(raf)};
}

/* ===== Easy / Hard mode: hints and extended explanations ===== */
const HINTS_PER_RUN=3;
const T_=(rows)=>`<table class="tipt">${rows.map(r=>`<tr>${r.map((c,i)=>i?`<td>${c}</td>`:`<th>${c}</th>`).join("")}</tr>`).join("")}</table>`;
const TIPS={
 greet:`<p><b>Greetings:</b> Bom dia (morning) · Boa tarde (afternoon) · Boa noite (evening/night, also goodbye).</p><p><b>chamar-se:</b> pronoun <i>after</i> the verb in statements (<i>Chamo-me Ana, Ele chama-se Rui</i>) but <i>before</i> it after question words and não (<i>Como te chamas? Não se chama</i>).</p>${T_([["eu","chamo-me","sou"],["tu","chamas-te","és"],["ele / você","chama-se","é"]])}`,
 prep:`<p><b>de</b> = origin, possession · <b>em</b> = location. Both merge with the article:</p>${T_([["","o","a","os","as"],["de","do","da","dos","das"],["em","no","na","nos","nas"]])}<p>No article: <i>Portugal, Angola, Marrocos</i>, most cities (<i>em Lisboa</i>), <i>em casa</i>. With article: <i>o Brasil, o Porto, os Estados Unidos</i>.</p>`,
 num:`<p><b>Numbers:</b> join every part with <b>e</b>: <i>trezentos e quarenta e cinco</i>. 100 = <i>cem</i>, 101 = <i>cento e um</i>. Irregular hundreds: duzentos, trezentos, quinhentos. European spelling: dezasseis, dezassete, dezanove.</p>`,
 nat:`<p><b>Nationalities</b> agree with the person:</p>${T_([["m.","f.","m. pl.","f. pl."],["inglês","inglesa","ingleses","inglesas"],["espanhol","espanhola","espanhóis","espanholas"],["alemão","alemã","alemães","alemãs"],["russo","russa","russos","russas"]])}<p>A mixed group takes the masculine plural.</p>`,
 cls:`<p><b>um / uma:</b> learn each noun with its gender (<i>o mapa, o dia</i> are masculine; <i>a parede</i> is feminine).</p><p><b>isto</b> near me · <b>isso</b> near you · <b>aquilo</b> far from both.</p><p><b>Colours</b> in -o agree: branco/branca/brancos/brancas; azul → azuis; verde → verdes.</p>`,
 pron:`<p><b>European Portuguese sounds:</b> unstressed final -o → [u]; unstressed e → [ɨ]; s at the end or before a consonant → [ʃ]; s between vowels → [z]; ss → [s]; initial r and rr → strong [ʁ]; -em → [ɐ̃j].</p>`,
 se:`${T_([["","ser","estar"],["eu","sou","estou"],["tu","és","estás"],["ele / você","é","está"],["nós","somos","estamos"],["eles / vocês","são","estão"]])}<p><b>ser</b>: identity, origin, nationality, profession, permanent location, days. <b>estar</b>: temporary states, feelings, where someone is now.</p>`,
 fic:`<p><b>ficar</b> (regular -ar): fico, ficas, fica, ficamos, ficam. Person + place = <i>to stay</i> (<i>Fico em casa</i>); place + place = <i>to be located</i> (<i>Onde fica Lisboa?</i>).</p>`,
 art:`${T_([["","singular","plural"],["masc.","o / um","os / uns"],["fem.","a / uma","as / umas"]])}<p><b>Plurals:</b> +s (livro → livros) · -r/-z/-s +es (andar → andares) · -l → -is (jornal → jornais) · -m → -ns (viagem → viagens) · -ão → -ões/-ães/-ãos.</p>`,
 verb:`${T_([["","-ar","-er","-ir"],["eu","-o","-o","-o"],["tu","-as","-es","-es"],["ele","-a","-e","-e"],["nós","-amos","-emos","-imos"],["eles","-am","-em","-em"]])}<p>-er and -ir only differ in the nós form.</p>`,
 ter:`${T_([["eu","tenho"],["tu","tens"],["ele / você","tem"],["nós","temos"],["eles / vocês","têm"]])}<p>Short answers repeat the verb: <i>Tens caneta? — Tenho. / Não, não tenho.</i></p>`,
 poss:`${T_([["","m.","f.","m. pl.","f. pl."],["eu","o meu","a minha","os meus","as minhas"],["tu","o teu","a tua","os teus","as tuas"],["você","o seu","a sua","os seus","as suas"],["nós","o nosso","a nossa","os nossos","as nossas"],["vocês","o vosso","a vossa","os vossos","as vossas"]])}<p>The possessive agrees with the <b>thing</b>, not the owner. For ele/ela/eles/elas use <b>dele, dela, deles, delas</b> after the noun: <i>o carro dela</i>.</p>`,
 place:`<p><b>aqui</b> near me · <b>aí</b> near you · <b>ali</b> far from both (like isto / isso / aquilo). <b>cá</b> ≈ here, <b>lá</b> = there, far away. <b>perto de / longe de</b> + article: <i>perto da escola</i>.</p><p><b>em casa</b> has no article; <i>no carro, na rua, no escritório</i>.</p>`,
 dem:`${T_([["","m.","f.","m. pl.","f. pl."],["near me","este","esta","estes","estas"],["near you","esse","essa","esses","essas"],["far","aquele","aquela","aqueles","aquelas"]])}<p>Before a noun they agree with it; alone, use isto / isso / aquilo for things.</p>`,
 eque:`<p><b>é que</b> goes right after the question word: <i>Onde é que moras? O que é que tens? Quem é que é?</i> It adds emphasis; the meaning doesn't change.</p>`,
 prof:`<p><b>Professions:</b> -o → -a (médico/médica) · -or → -ora (professor/professora) · ator → atriz · -e and -ista don't change (estudante, jornalista).</p><p>After <i>ser</i> there is <b>no article</b>: <i>Sou enfermeiro. Ela é advogada.</i></p>`,
 ord:`<p><b>Ordinals:</b> primeiro, segundo, terceiro, quarto, quinto, sexto, sétimo, oitavo, nono, décimo. Feminine: -a (a segunda rua). They go <b>before</b> the noun: <i>o terceiro andar</i>.</p><p>R/C = rés do chão · Esq. = esquerdo · Dto. = direito.</p>`,
 qw:`<p><b>Qual é…?</b> for a piece of information (nome, morada, profissão). <b>Que idade tem?</b> = Quantos anos tem? <b>Quanto</b> agrees with the noun: quanto dinheiro, quanta água, quantos anos, quantas línguas.</p>`,
 data:`<p><b>Personal data:</b> o nome / o apelido (surname) · a idade · a nacionalidade · o estado civil (solteiro, casado, divorciado) · a profissão · a morada · o código postal · o número de telefone · @ = arroba, . = ponto.</p>`,
 aviao:`<p><b>No avião:</b> café ou chá? · com / sem açúcar · água com gás / sem gás · faz favor = please · Mais alguma coisa? = anything else? · Aqui está = here it is.</p>`
};
const TIPMAP={U1:"greet",C1:"greet",U2:"prep",C2:"prep",P1:"prep",P2:"prep",P3:"prep",P4:"prep",P5:"prep",K5F:"place",NUM:"num",NAT:"nat",C3:"nat",U4:"cls",C4:"cls",
 PRON:"pron",C7:"pron",L5G:"pron",L6F:"pron",K6G:"pron",SE:"se",FIC:"fic",ART:"art",K5A:"art",K6B:"art",L5A:"art",VERB:"verb",
 L5B:"ter",K5B:"ter",K5C:"ter",C6:"poss",L5C:"poss",K5G:"poss",K5H:"poss",PA1:"poss",PA2:"poss",PA3:"poss",X5:"poss",K6E:"poss",K5E:"poss",
 L5D:"place",K5D:"place",PA4:"place",L5F:"dem",L5E:"eque",K5I:"eque",L6A:"prof",K6A:"prof",L6B:"ord",K6F:"ord",L6C:"qw",K6D:"qw",
 L6D:"data",L6E:"data",K6C:"data",X6:"prof",CX6:"data",C5:"aviao"};
function tipFor(q){const k=TIPMAP[q.topic];if(k==="prof"&&/andar|ordinal|º/.test(q.prompt+q.ask))return TIPS.ord;if((q.topic==="X6"||q.topic==="CX6")&&/quant/i.test(q.prompt+q.ask))return TIPS.qw;return k?TIPS[k]:""}
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function answers(q){return q.type==="text"?q.accept:q.type==="mc"?[plain(q.options[0])]:q.options.slice(0,q.nRight).map(plain)}
function maskedRule(q){
  let t=plain(q.explain.replace(/<b>[\s\S]*?<\/b>/g,"<b>___</b>"));
  answers(q).forEach(a=>{if(a&&a.trim().length>1)t=t.replace(new RegExp(reEsc(a.trim()),"gi"),"___")});
  t=t.replace(/(___\s*)+/g,"___ ");
  const sents=t.match(/[^.!?]+[.!?]*/g)||[t];
  const words=x=>x.replace(/___/g,"").split(/\s+/).filter(w=>/[a-zà-ú]{2}/i.test(w)).length;
  let out=sents.find(x=>words(x)>=4)||sents[0];
  out=out.trim().replace(/^(___\s*[?!.:,→-]*\s*)+/,"").trim();
  return out?out.charAt(0).toUpperCase()+out.slice(1):"";
}
function letterPattern(a){const w=a.trim().split(/\s+/);
  if(w.length>=4)return `Starts with “${w[0]}” · ${w.length} words`;
  return w.map(x=>[...x].map((c,i)=>i===0?c:/[\-’']/.test(c)?c:"_").join(" ")).join("   ")+` · ${a.replace(/\s/g,"").length} letters`}
function makeHint(q,r,k){
  const rule=maskedRule(q);let main="";
  if(q.type==="text")main=`<b>Pattern:</b> <span class="pat">${esc(letterPattern(q.accept[0]))}</span>`;
  else if(q.type==="mc"){const wrong=r.opt[k].filter(oi=>oi!==0);const el=shuffle(wrong).slice(0,Math.min(2,wrong.length-1));r.elim[k]=el;main=el.length?`<b>${el.length===1?"One wrong option is":"Two wrong options are"} crossed out.</b>`:""}
  else{const good=r.opt[k].filter(oi=>oi<q.nRight);r.rev[k]=good[Math.floor(Math.random()*good.length)];main=`<b>One correct option is marked.</b> There are ${q.nRight} correct options in total.`}
  r.hint[k]={main,rule};
}
function editDiff(given,correct){ // returns HTML of the correct answer with letters the learner missed or got wrong highlighted
  const a=[...given.toLowerCase()],b=[...correct],B=[...correct.toLowerCase()],n=a.length,m=b.length;
  const D=Array.from({length:n+1},(_,i)=>Array(m+1).fill(0));for(let i=0;i<=n;i++)D[i][0]=i;for(let j=0;j<=m;j++)D[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===B[j-1]?0:1));
  const mark=Array(m).fill(false);let i=n,j=m;
  while(i>0&&j>0){if(a[i-1]===B[j-1]&&D[i][j]===D[i-1][j-1]){i--;j--}else if(D[i][j]===D[i-1][j-1]+1){mark[j-1]=true;i--;j--}else if(D[i][j]===D[i][j-1]+1){mark[j-1]=true;j--}else i--}
  while(j>0){mark[j-1]=true;j--}
  return b.map((c,x)=>mark[x]?`<mark>${esc(c)}</mark>`:esc(c)).join("");
}
function easyExtra(q,a){
  let h="";
  if(q.type==="text"&&a.given){const c=q.accept[0];h+=`<div class="xrow"><span class="xl">You wrote</span><span class="xv bad">${esc(a.given)}</span></div><div class="xrow"><span class="xl">Correct</span><span class="xv">${editDiff(a.given,c)}</span></div><p class="hint">Highlighted letters are the ones that were missing or different${a.near?" (here only the accents)":""}.</p>`}
  else if(q.type==="mc"&&a.given)h+=`<div class="xrow"><span class="xl">You chose</span><span class="xv bad">${esc(a.given)}</span></div><div class="xrow"><span class="xl">Correct</span><span class="xv">${esc(plain(q.options[0]))}</span></div>`;
  const tip=tipFor(q);if(tip)h+=`<details class="tip" open><summary>Remember the rule</summary>${tip}</details>`;
  return h?`<div class="xbox">${h}</div>`:"";
}
