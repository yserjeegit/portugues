lain":"10:30 is still morning, so the greeting is <b>Bom dia!</b>. <i>Bom dia</i> = morning, <i>Boa tarde</i> = afternoon, <i>Boa noite</i> = evening and night (also used to say goodbye at night).","img":"<svg viewBox=\"0 0 225 120\" role=\"img\" aria-label=\"Digital clock showing 10:30\"><rect x=\"10\" y=\"22\" width=\"150\" height=\"76\" rx=\"10\" fill=\"#1E2430\"/><rect x=\"18\" y=\"30\" width=\"134\" height=\"60\" rx=\"5\" fill=\"#0D1118\"/><text x=\"85\" y=\"76\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"38\" font-weight=\"700\" fill=\"#F5B83D\">10:30</text><g transform=\"translate(190 64)\"><circle r=\"16\" fill=\"#F5B83D\"/><g stroke=\"#F5B83D\" stroke-width=\"4\" stroke-linecap=\"round\"><line y1=\"-24\" y2=\"-31\"/><line y1=\"24\" y2=\"31\"/><line x1=\"-24\" x2=\"-31\"/><line x1=\"24\" x2=\"31\"/><line x1=\"17\" y1=\"-17\" x2=\"22\" y2=\"-22\"/><line x1=\"-17\" y1=\"-17\" x2=\"-22\" y2=\"-22\"/><line x1=\"17\" y1=\"17\" x2=\"22\" y2=\"22\"/><line x1=\"-17\" y1=\"17\" x2=\"-22\" y2=\"22\"/></g></g></svg>","topic":"U1","pts":1},{"type":"mc","ask":"Look at the clock. How do you greet someone at this time?","prompt":"___","options":["Boa noite!","Bom dia!","Boa tarde!","Até logo!"],"explain":"23:00 is night, so the greeting is <b>Boa noite!</b>. <i>Bom dia</i> = morning, <i>Boa tarde</i> = afternoon, <i>Boa noite</i> = evening and night (also used to say goodbye at night).","img":"<svg viewBox=\"0 0 225 120\" role=\"img\" aria-label=\"Digital clock showing 23:00\"><rect x=\"10\" y=\"22\" width=\"150\" height=\"76\" rx=\"10\" fill=\"#1E2430\"/><rect x=\"18\" y=\"30\" width=\"134\" height=\"60\" rx=\"5\" fill=\"#0D1118\"/><text x=\"85\" y=\"76\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"38\" font-weight=\"700\" fill=\"#F5B83D\">23:00</text><g transform=\"translate(190 64)\"><path d=\"M6-22A22 22 0 1 0 6 22 17 17 0 1 1 6-22Z\" fill=\"#E8E2C4\"/><circle cx=\"-20\" cy=\"-26\" r=\"2\" fill=\"#E8E2C4\"/><circle cx=\"18\" cy=\"26\" r=\"1.6\" fill=\"#E8E2C4\"/></g></svg>","topic":"U1","pts":1},{"type":"mc","ask":"Choose the correct informal question (tu).","prompt":"“What's your name?”","options":["Como te chamas?","Como chamas-te?","Como se chamas?","Como chamas?"],"explain":"After a question word like <i>como</i>, the pronoun comes <b>before</b> the verb: <b>Como te chamas?</b> The pronoun matches the person: <i>tu</i> → <b>te</b> + <i>chamas</i>.","topic":"U1","pts":4},{"type":"mc","ask":"Complete the yes/no question (tu).","prompt":"___ Rita?","options":["Chamas-te","Te chamas","Chama-se","Chamo-me"],"explain":"A yes/no question has no question word, so the pronoun stays <b>after</b> the verb: <b>Chamas-te Rita?</b> Only words like <i>como</i>, <i>quem</i>, <i>onde</i> pull the pronoun in front.","topic":"U1","pts":3},{"type":"multi","nRight":3,"ask":"Select ALL the countries used WITHOUT an article.","prompt":"Sou de ___","options":["Portugal","Marrocos","Angola","Brasil","China","México"],"explain":"No article: <b>Portugal, Marrocos, Angola</b> (also Moçambique, Cuba, Israel). Others need one: <i>do Brasil, da China, do México</i>.","topic":"U2","pts":4},{"type":"mc","ask":"Which country does this flag belong to?","prompt":"___","options":["França","Itália","Irlanda","Rússia"],"explain":"The French flag has vertical stripes: blue, white, red. <b>França</b> → francês/francesa.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"10\" height=\"20\" fill=\"#0055A4\"/><rect x=\"10\" width=\"10\" height=\"20\" fill=\"#F7F7F2\"/><rect x=\"20\" width=\"10\" height=\"20\" fill=\"#EF4135\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U2","pts":1},{"type":"text","ask":"Type de / do / da / dos / das.","prompt":"O Mark é ___ Estados Unidos.","accept":["dos"],"explain":"<i>De</i> shows origin. The country is <i>os Estados Unidos</i>, so the preposition merges with the article: de + os = <b>dos</b>.","topic":"U2","pts":4},{"type":"mc","ask":"Complete with de, do, da, dos or das.","prompt":"O Paulo é ___ Portugal.","options":["de","do","da","dos"],"explain":"<i>De</i> shows origin. <b>Portugal</b> takes no article, so the preposition stays as it is: <b>de Portugal</b>.","topic":"U2","pts":3},{"type":"mc","ask":"Read the house number on the tile plate.","prompt":"Número ___","options":["oitocentos e vinte e oito","oitocentos e oitenta e dois","duzentos e oitenta e oito","oito centos e vinte e oito"],"explain":"828 = <b>oitocentos e vinte e oito</b>. 800 is one word: <i>oitocentos</i>.","img":"<svg viewBox=\"0 0 200 130\" role=\"img\" aria-label=\"Blue-and-white tile house-number plate showing 828\"><rect x=\"8\" y=\"8\" width=\"184\" height=\"114\" rx=\"4\" fill=\"#F7F6F0\" stroke=\"#1F4E9C\" stroke-width=\"6\"/><rect x=\"20\" y=\"20\" width=\"160\" height=\"90\" fill=\"none\" stroke=\"#1F4E9C\" stroke-width=\"2\"/><g fill=\"#1F4E9C\"><path d=\"M20 20h18L20 38Z\"/><path d=\"M180 20h-18l18 18Z\"/><path d=\"M20 110h18L20 92Z\"/><path d=\"M180 110h-18l18-18Z\"/></g><text x=\"100\" y=\"86\" text-anchor=\"middle\" font-family=\"Georgia, serif\" font-size=\"54\" font-weight=\"700\" fill=\"#1F4E9C\">828</text></svg>","topic":"NUM","pts":6},{"type":"text","ask":"Do the sum and write the result in words.","prompt":"44 + 45 = ___","accept":["oitenta e nove"],"explain":"44 + 45 = 89 → <b>oitenta e nove</b>. Each part is joined with <b>e</b>: hundreds <i>e</i> tens <i>e</i> units.","topic":"NUM","pts":6},{"type":"mc","ask":"How is this number written?","prompt":"234 = ___","options":["duzentos e trinta e quatro","duzentos trinta e quatro","dois centos e trinta e quatro","duzentos e quarenta e três"],"explain":"<b>Duzentos e trinta e quatro</b>: put <i>e</i> between hundreds and tens and between tens and units. 200 has its own word, <i>duzentos</i>.","topic":"NUM","pts":4},{"type":"text","ask":"Type the masculine plural.","prompt":"O Pablo e o Diego são ___. <small>(espanhol)</small>","accept":["espanhóis"],"explain":"Words ending in <i>-ol</i> form the plural in <b>-óis</b>, with an accent: espanhol → <b>espanhóis</b>. The feminine plural is regular: <i>espanholas</i>.","topic":"NAT","pts":7},{"type":"text","ask":"Type the nationality in the correct form.","prompt":"A Misaki é do Japão. Ela é ___.","accept":["japonesa"],"explain":"Japão → japonês / japonesa / japoneses / japonesas (m. / f. / m. pl. / f. pl.). Here it's one woman → feminine singular: <b>japonesa</b>.","topic":"NAT","pts":4},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"A Inês e a Joana são de Portugal. Elas são ___.","options":["portuguesas","português","portuguesa","portugueses"],"explain":"Portugal → português / portuguesa / portugueses / portuguesas (m. / f. / m. pl. / f. pl.). Here it's only women → feminine plural: <b>portuguesas</b>.","topic":"NAT","pts":4},{"type":"mc","ask":"Look at the picture and complete with the colour.","prompt":"As cadeiras são ___.","options":["verdes","verde","verdas","pretas"],"explain":"The colour is green. <i>verde</i> has the same form for masculine and feminine; only the number changes (verde → verdes). So: <b>As cadeiras são verdes.</b>","img":"<svg viewBox=\"0 0 230 140\" role=\"img\" aria-label=\"green cadeiras\"><g transform=\"translate(0 0) scale(1)\" fill=\"#2E8B57\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"30\" y=\"10\" width=\"60\" height=\"44\" rx=\"5\"/><rect x=\"30\" y=\"54\" width=\"8\" height=\"30\"/><rect x=\"82\" y=\"54\" width=\"8\" height=\"30\"/><path d=\"M22 84h76l-6 14H28Z\"/><rect x=\"28\" y=\"98\" width=\"8\" height=\"38\"/><rect x=\"84\" y=\"98\" width=\"8\" height=\"38\"/></g><g transform=\"translate(110 0) scale(1)\" fill=\"#2E8B57\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"30\" y=\"10\" width=\"60\" height=\"44\" rx=\"5\"/><rect x=\"30\" y=\"54\" width=\"8\" height=\"30\"/><rect x=\"82\" y=\"54\" width=\"8\" height=\"30\"/><path d=\"M22 84h76l-6 14H28Z\"/><rect x=\"28\" y=\"98\" width=\"8\" height=\"38\"/><rect x=\"84\" y=\"98\" width=\"8\" height=\"38\"/></g></svg>","topic":"U4","pts":3},{"type":"mc","ask":"What is this?","prompt":"O que é isto? ___","options":["É uma mesa.","É um mesa.","É uma porta.","É uma janela."],"explain":"It's a table: <b>uma mesa</b>. It is feminine, so it takes <i>uma</i>.","img":"<svg viewBox=\"0 0 160 125\" role=\"img\" aria-label=\"table\"><g transform=\"translate(0 0) scale(1)\" fill=\"#7B4A26\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"10\" y=\"34\" width=\"140\" height=\"16\" rx=\"3\"/><rect x=\"22\" y=\"50\" width=\"11\" height=\"70\"/><rect x=\"127\" y=\"50\" width=\"11\" height=\"70\"/></g></svg>","topic":"U4","pts":2},{"type":"mc","ask":"What is this?","prompt":"O que é isto? ___","options":["É um livro.","É uma livro.","É uma janela.","É uma cadeira."],"explain":"It's a book: <b>um livro</b>. It is masculine, so it takes <i>um</i>.","img":"<svg viewBox=\"0 0 120 120\" role=\"img\" aria-label=\"book\"><g transform=\"translate(25 14) rotate(0)\"><rect x=\"0\" y=\"0\" width=\"70\" height=\"92\" rx=\"4\" fill=\"#7B4A26\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"8\" y=\"0\" width=\"5\" height=\"92\" fill=\"#2A2A2A\" opacity=\".25\"/><rect x=\"22\" y=\"22\" width=\"36\" height=\"12\" rx=\"2\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"1.5\"/></g></svg>","topic":"U4","pts":1},{"type":"mc","ask":"Look at the picture and complete with the colour.","prompt":"O livro é ___.","options":["amarelo","amarela","amarelos","amarelas"],"explain":"The colour is yellow. Colours ending in <i>-o</i> agree in gender and number: amarelo, amarela, amarelos, amarelas. So: <b>O livro é amarelo.</b>","img":"<svg viewBox=\"0 0 120 120\" role=\"img\" aria-label=\"yellow livro\"><g transform=\"translate(25 14) rotate(0)\"><rect x=\"0\" y=\"0\" width=\"70\" height=\"92\" rx=\"4\" fill=\"#F2C230\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"8\" y=\"0\" width=\"5\" height=\"92\" fill=\"#2A2A2A\" opacity=\".25\"/><rect x=\"22\" y=\"22\" width=\"36\" height=\"12\" rx=\"2\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"1.5\"/></g></svg>","topic":"U4","pts":1},{"type":"mc","ask":"In which word is the underlined e NOT pronounced [ɨ]?","prompt":"The letter <span class='blank' style='min-width:1.4em'>e</span>","options":["m<b>e</b>sa","tard<b>e</b>","verd<b>e</b>","pared<b>e</b>"],"explain":"Unstressed <i>e</i> is reduced to [ɨ], almost silent: <i>tarde, verde, parede</i>. In <b>mesa</b> the e is stressed, so it's a full [e].","topic":"PRON","pts":6},{"type":"mc","ask":"How is the first s pronounced?","prompt":"e<b>s</b>tados","options":["[ʃ]","[s]","[z]","silent"],"explain":"<i>s</i> before a voiceless consonant (here <i>t</i>) sounds [ʃ]: e<b>s</b>tados, e<b>s</b>tá, E<b>s</b>panha.","topic":"PRON","pts":6},{"type":"multi","nRight":3,"ask":"Select ALL the sentences that are correct.","prompt":"Ser ou estar?","options":["Eu estou bem.","A Ana está em Roma.","Hamburgo é na Alemanha.","Eles estão gregos.","Lisboa está em Portugal.","Eu sou cansado hoje."],"explain":"Correct: <b>Eu estou bem</b> (temporary state), <b>A Ana está em Roma</b> (where she is now), <b>Hamburgo é na Alemanha</b> (permanent location). Nationality takes <i>ser</i> (<i>Eles são gregos</i>), cities don't move (<i>Lisboa é/fica em Portugal</i>), and tiredness is temporary (<i>Estou cansado</i>).","topic":"SE","pts":7},{"type":"text","ask":"Type the correct form of ser or estar.","prompt":"A Ana ___ em Roma esta semana.","accept":["está"],"explain":"Use <b>estar</b>: it's where a person is <b>right now</b> (temporary location). With <i>ele/ela/você</i> → <b>está</b>. (<i>é</i> would describe a permanent characteristic.)","topic":"SE","pts":4},{"type":"mc","ask":"Choose the correct sentence.","prompt":"Who is sick today?","options":["O Rui está doente hoje.","O Rui é doente hoje.","O Rui estão doente hoje.","O Rui fica doente hoje."],"explain":"Being sick <i>today</i> is a temporary state → <b>estar</b>: <i>O Rui está doente hoje.</i>","topic":"SE","pts":6},{"type":"mc","ask":"Ser or estar?","prompt":"O café ___ frio.","options":["está","é","estou","somos"],"explain":"Use <b>estar</b>: it's the current condition of something (open/closed, hot/cold). With <i>ele/ela/você</i> → <b>está</b>. (<i>é</i> would describe a permanent characteristic.)","topic":"SE","pts":4},{"type":"mc","ask":"Ser or estar?","prompt":"Eles ___ contentes com o teste.","options":["estão","são","estás","somos"],"explain":"Use <b>estar</b>: it's a temporary state or feeling that can change soon. With <i>eles/elas/vocês</i> → <b>estão</b>. (<i>são</i> would describe a permanent characteristic.)","topic":"SE","pts":4},{"type":"text","ask":"Type the correct form of ficar (to stay).","prompt":"Tu ___ no Porto até domingo?","accept":["ficas"],"explain":"Here <i>ficar</i> means <b>to stay</b>. It's a regular -ar verb: fico, ficas, fica, ficamos, ficam. With <i>tu</i> → <b>ficas</b>.","topic":"FIC","pts":6},{"type":"mc","ask":"What does it mean?","prompt":"Onde ficas em Lisboa?","options":["Where are you staying in Lisbon?","Where is Lisbon?","Where do you work in Lisbon?","Are you from Lisbon?"],"explain":"<i>Ficas</i> is the <i>tu</i> form and refers to a person, so here <b>ficar = to stay</b>: Where are you staying in Lisbon? Compare <i>Onde fica Lisboa?</i> (where is Lisbon located).","topic":"FIC","pts":6},{"type":"mc","ask":"Complete with ficar.","prompt":"Lisboa e o Porto ___ em Portugal.","options":["ficam","fica","ficamos","estão"],"explain":"Two cities = plural subject → <b>ficam</b>. Location of places: <i>ficar</i> or <i>ser</i>, not <i>estar</i>.","topic":"FIC","pts":4},{"type":"text","ask":"Type the definite (o/a/os/as) article.","prompt":"___ mãos","accept":["as"],"explain":"<i>mão</i> is feminine even though it ends in -ão, and here it's plural. Definite articles: o / a / os / as. → <b>as mãos</b>.","topic":"ART","pts":4},{"type":"mc","ask":"Make it plural.","prompt":"o país → ___","options":["os países","os paises","as países","os país"],"explain":"<i>País</i> → <b>países</b> (add -es; the accent stays on the i). Masculine plural article: <b>os</b>.","topic":"ART","pts":5},{"type":"mc","ask":"Make it plural.","prompt":"um jornal → ___","options":["uns jornais","uns jornals","umas jornais","um jornais"],"explain":"<i>-al</i> → <i>-ais</i>: jornal → jornais. <i>Um</i> → <b>uns</b>: <b>uns jornais</b>.","topic":"ART","pts":5},{"type":"mc","ask":"Complete with the definite article (o, a, os, as).","prompt":"___ lápis","options":["os","o","a","as"],"explain":"<i>lápis</i> is masculine, and the same in singular and plural, and here it's plural. Definite articles: o / a / os / as. → <b>os lápis</b>.","topic":"ART","pts":4},{"type":"multi","nRight":3,"ask":"Select ALL the correctly conjugated forms.","prompt":"-ar / -er / -ir","options":["eu como","tu abres","nós partimos","nós comimos","tu abras","eles partam"],"explain":"Correct: <b>eu como</b> (-er), <b>tu abres</b> (-ir: -es), <b>nós partimos</b> (-ir: -imos). <i>Comimos</i> mixes -er with the -ir ending; <i>abras</i> and <i>partam</i> use the wrong vowel.","topic":"VERB","pts":7},{"type":"text","ask":"Type the present tense of abrir.","prompt":"Tu ___ a janela. <small>(abrir)</small>","accept":["abres"],"explain":"<b>abrir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. tu → <b>abres</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":5},{"type":"text","ask":"Type the present tense of trabalhar.","prompt":"Você ___ em Coimbra. <small>(trabalhar)</small>","accept":["trabalha"],"explain":"<b>trabalhar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. ele/ela/você → <b>trabalha</b>.","topic":"VERB","pts":4},{"type":"mc","ask":"Which sentence has a mistake?","prompt":"Find the error","options":["Nós vivimos em Lisboa.","Eles abrem a porta.","Tu escreves bem.","Eu falo inglês."],"explain":"<i>Viver</i> is an <b>-er</b> verb, so nós → <b>vivemos</b>, not <i>vivimos</i> (that ending belongs to -ir verbs like <i>partimos</i>).","topic":"VERB","pts":5},{"type":"mc","ask":"Complete with the present tense of beber.","prompt":"Tu ___ café de manhã. <small>(beber)</small>","options":["bebes","bebas","bebo","bebe"],"explain":"<b>beber</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. tu → <b>bebes</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":3},{"type":"text","ask":"Type dele, dela, deles or delas.","prompt":"A casa ___ é grande. <small>(ele)</small>","accept":["dele"],"explain":"For <i>ele, ela, eles, elas</i> we use <b>de + pronoun</b> after the noun: dele, dela, deles, delas. → <b>A casa dele</b>. It agrees with the owner, not with the thing.","topic":"X5","pts":5},{"type":"text","ask":"Complete with the article and the possessive.","prompt":"___ irmã é médica. <small>(eu)</small>","accept":["a minha"],"explain":"<i>eu</i> → meu / minha / meus / minhas. <i>irmã</i> is feminine singular, so: <b>A minha irmã</b>. In European Portuguese the article comes before the possessive.","topic":"X5","pts":4},{"type":"text","ask":"Type the demonstrative (este / esse / aquele in the right form).","prompt":"___ óculos são de sol. <small>(near me (isto))</small>","accept":["Estes"],"explain":"near me (isto) → este / esta / estes / estas. <i>óculos</i> is masculine plural → <b>Estes</b>.","topic":"X5","pts":4},{"type":"text","ask":"Type the demonstrative (este / esse / aquele in the right form).","prompt":"___ telemóvel é novo. <small>(near you (isso))</small>","accept":["Esse"],"explain":"near you (isso) → esse / essa / esses / essas. <i>telemóvel</i> is masculine singular → <b>Esse</b>.","topic":"X5","pts":4},{"type":"text","ask":"Type the correct form of ter.","prompt":"A Ana ___ a carta de condução?","accept":["tem"],"explain":"<i>Ter</i>: tenho, tens, tem, temos, <b>têm</b>. A Ana → <b>tem</b>.","topic":"X5","pts":3},{"type":"text","ask":"Write the plural with the article.","prompt":"o telemóvel → ___","accept":["os telemóveis"],"explain":"-el → -eis: <b>os telemóveis</b>.","topic":"X5","pts":3},{"type":"mc","ask":"Choose the possessive.","prompt":"Os ___ filhos chamam-se Ana e Hugo. <small>(eu)</small>","options":["meus","meu","minha","minhas"],"explain":"<i>eu</i> → meu / minha / meus / minhas. <i>filhos</i> is masculine plural, so: <b>Os meus filhos</b>. In European Portuguese the article comes before the possessive.","topic":"X5","pts":3},{"type":"text","ask":"Type quanto, quanta, quantos or quantas.","prompt":"___ horas trabalhas? — Oito.","accept":["Quantas"],"explain":"<i>Quanto</i> agrees with the noun: <i>horas</i> is feminine plural → <b>Quantas</b>.","topic":"X6","pts":4},{"type":"text","ask":"Write the profession in Portuguese.","prompt":"A Joana é ___. <small>(nurse)</small>","accept":["enfermeira"],"explain":"Profession after <i>ser</i> has <b>no article</b>: <i>A Joana é enfermeira</i>. -o → -a: enfermeiro → <b>enfermeira</b>.","topic":"X6","pts":3},{"type":"text","ask":"Complete with the ordinal.","prompt":"Moro no ___ andar. <small>(8.º)</small>","accept":["oitavo"],"explain":"<i>O andar</i> is masculine: 8.º = <b>oitavo</b>. Ordinals go before the noun.","topic":"X6","pts":3},{"type":"text","ask":"Type quanto, quanta, quantos or quantas.","prompt":"___ café bebes por dia? — Muito pouco.","accept":["Quanto"],"explain":"<i>Quanto</i> agrees with the noun: <i>café</i> is masculine singular → <b>Quanto</b>.","topic":"X6","pts":3},{"type":"mc","ask":"Choose the correct word order.","prompt":"the first name","options":["o primeiro nome","o nome primeiro","primeiro o nome","o nome o primeiro"],"explain":"Ordinals come <b>before</b> the noun: <i>o primeiro nome, o último nome</i>; but <i>completo</i> comes after: <i>o nome completo</i>.","topic":"X6","pts":4},{"type":"mc","ask":"Which question fits the answer?","prompt":"___ — Sou casado.","options":["Qual é o seu estado civil?","Qual é a sua profissão?","Onde mora?","Quantos anos tem?"],"explain":"<b>O estado civil</b> = marital status: solteiro, casado, divorciado.","topic":"X6","pts":3}],[{"type":"mc","ask":"Look at the clock. How do you greet someone at this time?","prompt":"___","options":["Boa tarde!","Bom dia!","Boa noite!","Até logo!"],"explain":"15:00 is afternoon, so the greeting is <b>Boa tarde!</b>. <i>Bom dia</i> = morning, <i>Boa tarde</i> = afternoon, <i>Boa noite</i> = evening and night (also used to say goodbye at night).","img":"<svg viewBox=\"0 0 225 120\" role=\"img\" aria-label=\"Digital clock showing 15:00\"><rect x=\"10\" y=\"22\" width=\"150\" height=\"76\" rx=\"10\" fill=\"#1E2430\"/><rect x=\"18\" y=\"30\" width=\"134\" height=\"60\" rx=\"5\" fill=\"#0D1118\"/><text x=\"85\" y=\"76\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"38\" font-weight=\"700\" fill=\"#F5B83D\">15:00</text><g transform=\"translate(190 64)\"><circle r=\"16\" fill=\"#F5B83D\"/><g stroke=\"#F5B83D\" stroke-width=\"4\" stroke-linecap=\"round\"><line y1=\"-24\" y2=\"-31\"/><line y1=\"24\" y2=\"31\"/><line x1=\"-24\" x2=\"-31\"/><line x1=\"24\" x2=\"31\"/><line x1=\"17\" y1=\"-17\" x2=\"22\" y2=\"-22\"/><line x1=\"-17\" y1=\"-17\" x2=\"-22\" y2=\"-22\"/><line x1=\"17\" y1=\"17\" x2=\"22\" y2=\"22\"/><line x1=\"-17\" y1=\"17\" x2=\"-22\" y2=\"22\"/></g></g></svg>","topic":"U1","pts":2},{"type":"text","ask":"Type the correct form of ser (subject: tu).","prompt":"___ a Teresa? <small>(tu)</small>","accept":["És"],"explain":"Verb <i>ser</i>, singular: eu <b>sou</b>, tu <b>és</b>, você/ele/ela <b>é</b>. With <i>tu</i> the form is <b>És</b>, and the accent is required.","topic":"U1","pts":3},{"type":"mc","ask":"Complete with the verb chamar-se.","prompt":"Ele ___ Eduardo Sousa.","options":["chama-se","se chama","chamo-me","chamas-te"],"explain":"In European Portuguese affirmative sentences, the reflexive pronoun goes <b>after</b> the verb with a hyphen: <b>Ele chama-se</b>. It moves before the verb only after question words or negation (<i>Como se chama?</i>, <i>Não se chama</i>).","topic":"U1","pts":3},{"type":"mc","ask":"Which farewell means you will see the person again the soonest?","prompt":"Até… ?","options":["Até já!","Até logo!","Até amanhã!","Até à próxima!"],"explain":"<b>Até já</b> = “see you in a moment”. <i>Até logo</i> = later (usually the same day), <i>Até amanhã</i> = tomorrow, <i>Até à próxima</i> = until next time.","topic":"U1","pts":3},{"type":"mc","ask":"Which country does this flag belong to?","prompt":"___","options":["Polónia","Rússia","Ucrânia","Alemanha"],"explain":"White over red: <b>a Polónia</b> (European Portuguese spelling; Brazil writes <i>Polônia</i>). Nationality: polaco.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"10\" fill=\"#F7F7F2\"/><rect y=\"10\" width=\"30\" height=\"10\" fill=\"#DC143C\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U2","pts":2},{"type":"mc","ask":"Which country does this flag belong to?","prompt":"___","options":["Alemanha","Rússia","Polónia","Ucrânia"],"explain":"Horizontal black, red and gold stripes: <b>a Alemanha</b> (Germany) → alemão/alemã.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"7\" fill=\"#111\"/><rect y=\"6.67\" width=\"30\" height=\"6.67\" fill=\"#DD0000\"/><rect y=\"13.33\" width=\"30\" height=\"6.67\" fill=\"#FFCE00\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"U2","pts":2},{"type":"text","ask":"Type em / no / na / nos / nas.","prompt":"Luanda é ___ Angola.","accept":["em"],"explain":"<i>Em</i> shows location. <b>Angola</b> takes no article, so the preposition stays as it is: <b>em Angola</b>. Be careful not to confuse it with <i>de</i> (origin).","topic":"U2","pts":5},{"type":"mc","ask":"Complete with de, do, da, dos or das.","prompt":"O Karim é ___ Marrocos.","options":["de","do","da","dos"],"explain":"<i>De</i> shows origin. <b>Marrocos</b> takes no article, so the preposition stays as it is: <b>de Marrocos</b>.","topic":"U2","pts":3},{"type":"mc","ask":"Read the house number on the tile plate.","prompt":"Número ___","options":["trezentos e cinquenta","trezentos cinquenta","três cento e cinquenta","trezentos e quinze"],"explain":"350 = <b>trezentos e cinquenta</b>. Don't confuse <i>cinquenta</i> (50) with <i>quinze</i> (15). Tile house numbers (<i>azulejos</i>) are typical in Portugal.","img":"<svg viewBox=\"0 0 200 130\" role=\"img\" aria-label=\"Blue-and-white tile house-number plate showing 350\"><rect x=\"8\" y=\"8\" width=\"184\" height=\"114\" rx=\"4\" fill=\"#F7F6F0\" stroke=\"#1F4E9C\" stroke-width=\"6\"/><rect x=\"20\" y=\"20\" width=\"160\" height=\"90\" fill=\"none\" stroke=\"#1F4E9C\" stroke-width=\"2\"/><g fill=\"#1F4E9C\"><path d=\"M20 20h18L20 38Z\"/><path d=\"M180 20h-18l18 18Z\"/><path d=\"M20 110h18L20 92Z\"/><path d=\"M180 110h-18l18-18Z\"/></g><text x=\"100\" y=\"86\" text-anchor=\"middle\" font-family=\"Georgia, serif\" font-size=\"54\" font-weight=\"700\" fill=\"#1F4E9C\">350</text></svg>","topic":"NUM","pts":5},{"type":"text","ask":"Do the sum and write the result in words.","prompt":"17 + 54 = ___","accept":["setenta e um"],"explain":"17 + 54 = 71 → <b>setenta e um</b>. Each part is joined with <b>e</b>: hundreds <i>e</i> tens <i>e</i> units.","topic":"NUM","pts":6},{"type":"mc","ask":"How is this number written?","prompt":"101 = ___","options":["cento e um","cem e um","um cento e um","cento e dez"],"explain":"<b>Cento e um</b>. Exactly 100 is <i>cem</i>, but as soon as something follows it becomes <i>cento</i>: 101 cento e um, 150 cento e cinquenta.","topic":"NUM","pts":4},{"type":"multi","nRight":3,"ask":"Select ALL the nationalities in the FEMININE PLURAL.","prompt":"Elas são…","options":["inglesas","alemãs","espanholas","alemães","espanhóis","ingleses"],"explain":"Feminine plural: <b>inglesas, alemãs, espanholas</b>. The others are masculine plural: <i>ingleses, alemães, espanhóis</i>.","topic":"NAT","pts":4},{"type":"text","ask":"Type the nationality in the correct form.","prompt":"A Carmen e a Lucía são de Espanha. Elas são ___.","accept":["espanholas"],"explain":"Espanha → espanhol / espanhola / espanhóis / espanholas (m. / f. / m. pl. / f. pl.). Here it's only women → feminine plural: <b>espanholas</b>.","topic":"NAT","pts":6},{"type":"mc","ask":"Choose the nationality in the correct form.","prompt":"O Tom e a Kate são de Inglaterra. Eles são ___.","options":["ingleses","inglês","inglesa","inglesas"],"explain":"Inglaterra → inglês / inglesa / ingleses / inglesas (m. / f. / m. pl. / f. pl.). Here it's a group of men or a mixed group → masculine plural: <b>ingleses</b>.","topic":"NAT","pts":4},{"type":"mc","ask":"Look at the picture and complete with the colour.","prompt":"As mesas são ___.","options":["brancas","branco","branca","brancos"],"explain":"The colour is white. Colours ending in <i>-o</i> agree in gender and number: branco, branca, brancos, brancas. So: <b>As mesas são brancas.</b>","img":"<svg viewBox=\"0 0 330 125\" role=\"img\" aria-label=\"white mesas\"><g transform=\"translate(0 0) scale(1)\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"10\" y=\"34\" width=\"140\" height=\"16\" rx=\"3\"/><rect x=\"22\" y=\"50\" width=\"11\" height=\"70\"/><rect x=\"127\" y=\"50\" width=\"11\" height=\"70\"/></g><g transform=\"translate(170 0) scale(1)\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"10\" y=\"34\" width=\"140\" height=\"16\" rx=\"3\"/><rect x=\"22\" y=\"50\" width=\"11\" height=\"70\"/><rect x=\"127\" y=\"50\" width=\"11\" height=\"70\"/></g></svg>","topic":"U4","pts":4},{"type":"mc","ask":"What is this?","prompt":"O que é isto? ___","options":["É uma cadeira.","É um cadeira.","É uma mesa.","É um livro."],"explain":"It's a chair: <b>uma cadeira</b>. It is feminine, so it takes <i>uma</i>.","img":"<svg viewBox=\"0 0 120 140\" role=\"img\" aria-label=\"chair\"><g transform=\"translate(0 0) scale(1)\" fill=\"#7B4A26\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"30\" y=\"10\" width=\"60\" height=\"44\" rx=\"5\"/><rect x=\"30\" y=\"54\" width=\"8\" height=\"30\"/><rect x=\"82\" y=\"54\" width=\"8\" height=\"30\"/><path d=\"M22 84h76l-6 14H28Z\"/><rect x=\"28\" y=\"98\" width=\"8\" height=\"38\"/><rect x=\"84\" y=\"98\" width=\"8\" height=\"38\"/></g></svg>","topic":"U4","pts":2},{"type":"mc","ask":"Look at the picture and complete with the colour.","prompt":"A mesa é ___.","options":["vermelha","vermelho","vermelhos","vermelhas"],"explain":"The colour is red. Colours ending in <i>-o</i> agree in gender and number: vermelho, vermelha, vermelhos, vermelhas. So: <b>A mesa é vermelha.</b>","img":"<svg viewBox=\"0 0 160 125\" role=\"img\" aria-label=\"red mesa\"><g transform=\"translate(0 0) scale(1)\" fill=\"#D7322B\" stroke=\"#2A2A2A\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><rect x=\"10\" y=\"34\" width=\"140\" height=\"16\" rx=\"3\"/><rect x=\"22\" y=\"50\" width=\"11\" height=\"70\"/><rect x=\"127\" y=\"50\" width=\"11\" height=\"70\"/></g></svg>","topic":"U4","pts":2},{"type":"text","ask":"Type the plural.","prompt":"um jornal → dois ___","accept":["jornais"],"explain":"Nouns ending in <i>-al</i> change to <b>-ais</b>: jornal → <b>jornais</b>.","topic":"U4","pts":4},{"type":"mc","ask":"How is the underlined s pronounced?","prompt":"france<b>s</b>a","options":["[z]","[s]","[ʃ]","silent"],"explain":"A single <i>s</i> between two vowels sounds like [z]: <i>france<b>s</b>a, chine<b>s</b>a, japone<b>s</b>a, mesa</i>.","topic":"PRON","pts":6},{"type":"mc","ask":"In which word is the underlined o NOT pronounced [u]?","prompt":"The letter <span class='blank' style='min-width:1.4em'>o</span>","options":["<b>o</b>ito","quatr<b>o</b>","sábad<b>o</b>","cinc<b>o</b>"],"explain":"Unstressed final <i>-o</i> is reduced to [u]: <i>quatro, sábado, cinco</i>. In <b>oito</b> the o is stressed and part of the diphthong <i>oi</i>, so it stays [o].","topic":"PRON","pts":4},{"type":"text","ask":"Type the correct form of ser or estar.","prompt":"Elas ___ de Angola.","accept":["são"],"explain":"Use <b>ser</b>: where someone is <b>from</b> is permanent (ser de). With <i>eles/elas/vocês</i> → <b>são</b>. (<i>estão</i> would describe a temporary state or location.)","topic":"SE","pts":3},{"type":"mc","ask":"Ser or estar?","prompt":"A mesa ___ de madeira.","options":["é","está","somos","estou"],"explain":"Use <b>ser</b>: what something is made of doesn't change. With <i>ele/ela/você</i> → <b>é</b>. (<i>está</i> would describe a temporary state or location.)","topic":"SE","pts":6},{"type":"mc","ask":"Ser or estar?","prompt":"Lisboa ___ em Portugal.","options":["é","está","és","estão"],"explain":"Use <b>ser</b>: the location of a place (city, country, monument) never changes. With <i>ele/ela/você</i> → <b>é</b>. (<i>está</i> would describe a temporary state or location.)","topic":"SE","pts":4},{"type":"mc","ask":"Ser or estar?","prompt":"Nós ___ em Paris de férias.","options":["estamos","somos","estão","és"],"explain":"Use <b>estar</b>: it's where a person is <b>right now</b> (temporary location). With <i>nós</i> → <b>estamos</b>. (<i>somos</i> would describe a permanent characteristic.)","topic":"SE","pts":4},{"type":"mc","ask":"Ser or estar?","prompt":"Onde ___ vocês agora?","options":["estão","são","estamos","és"],"explain":"Use <b>estar</b>: it's where a person is <b>right now</b> (temporary location). With <i>eles/elas/vocês</i> → <b>estão</b>. (<i>são</i> would describe a permanent characteristic.)","topic":"SE","pts":3},{"type":"multi","nRight":3,"ask":"Select ALL the correct forms of ficar.","prompt":"ficar","options":["eu fico","nós ficamos","eles ficam","tu fica","nós ficemos","eles ficão"],"explain":"Ficar is a regular -ar verb: eu <b>fico</b>, tu <b>ficas</b>, ele <b>fica</b>, nós <b>ficamos</b>, eles <b>ficam</b>.","topic":"FIC","pts":6},{"type":"text","ask":"Type the correct form of ficar.","prompt":"Onde ___ Sevilha?","accept":["fica"],"explain":"<i>Sevilha</i> is one city (3rd person singular): <b>Onde fica Sevilha?</b> (Em Espanha.)","topic":"FIC","pts":3},{"type":"mc","ask":"Translate (informal tu).","prompt":"“Where are you staying?”","options":["Onde ficas?","Onde estás?","De onde és?","Onde fica?"],"explain":"To stay = <b>ficar</b>, tu → <b>ficas</b>: <i>Onde ficas?</i> <i>Onde estás?</i> asks where you are right now, and <i>Onde fica?</i> is 3rd person (where is it / where does he stay).","topic":"FIC","pts":6},{"type":"multi","nRight":3,"ask":"Select ALL the nouns that take “umas”.","prompt":"umas ___","options":["cidades","mãos","paredes","mapas","dias","lápis"],"explain":"<i>Umas</i> = feminine plural: <b>umas cidades, umas mãos, umas paredes</b>. <i>Mapas, dias, lápis</i> are masculine → <i>uns</i>.","topic":"ART","pts":7},{"type":"text","ask":"Type the definite (o/a/os/as) article.","prompt":"___ janelas","accept":["as"],"explain":"<i>janela</i> is feminine, and here it's plural. Definite articles: o / a / os / as. → <b>as janelas</b>.","topic":"ART","pts":2},{"type":"mc","ask":"Make it plural.","prompt":"uma viagem → ___","options":["umas viagens","umas viagems","uns viagens","umas viagem"],"explain":"Nouns in <i>-m</i> change to <b>-ns</b>: viagem → viagens. <i>Viagem</i> is feminine: <b>umas viagens</b>.","topic":"ART","pts":6},{"type":"mc","ask":"First mention, then a known thing.","prompt":"Isto é ___ dicionário. ___ dicionário é do João.","options":["um / O","o / Um","um / Um","o / O"],"explain":"First mention, something new → indefinite <b>um</b>. Then we know which one → definite <b>o</b>: <i>Isto é um dicionário. O dicionário é do João.</i>","topic":"ART","pts":6},{"type":"text","ask":"Type the present tense of dividir.","prompt":"A Ana e o Rui ___ a pizza. <small>(dividir)</small>","accept":["dividem"],"explain":"<b>dividir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. eles/elas/vocês → <b>dividem</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":6},{"type":"text","ask":"Type the present tense of vender.","prompt":"Você ___ livros. <small>(vender)</small>","accept":["vende"],"explain":"<b>vender</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. ele/ela/você → <b>vende</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":4},{"type":"mc","ask":"Complete with the present tense of decidir.","prompt":"Nós ___ hoje. <small>(decidir)</small>","options":["decidimos","decidamos","decidemos","decido"],"explain":"<b>decidir</b> is an <b>-ir</b> verb. Present endings for -ir: -o, -es, -e, -imos, -em. nós → <b>decidimos</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":6},{"type":"mc","ask":"Complete with the present tense of beber.","prompt":"Nós ___ café de manhã. <small>(beber)</small>","options":["bebemos","bebamos","bebimos","bebo"],"explain":"<b>beber</b> is an <b>-er</b> verb. Present endings for -er: -o, -es, -e, -emos, -em. nós → <b>bebemos</b>. Remember: -er and -ir only differ in the nós form (-emos / -imos).","topic":"VERB","pts":6},{"type":"mc","ask":"Complete with the present tense of morar.","prompt":"Tu ___ em Lisboa. <small>(morar)</small>","options":["moras","mores","moro","mora"],"explain":"<b>morar</b> is an <b>-ar</b> verb. Present endings for -ar: -o, -as, -a, -amos, -am. tu → <b>moras</b>.","topic":"VERB","pts":3},{"type":"text","ask":"Type dele, dela, deles or delas.","prompt":"A irmã ___ é médica. <small>(ele)</small>","accept":["dele"],"explain":"For <i>ele, ela, eles, elas</i> we use <b>de + pronoun</b> after the noun: dele, dela, deles, delas. → <b>A irmã dele</b>. It agrees with the owner, not with the thing.","topic":"X5","pts":6},{"type":"text","ask":"Complete with the article and the possessive.","prompt":"___ apelido é Costa. <small>(nós)</small>","accept":["o nosso"],"explain":"<i>nós</i> → nosso / nossa / nossos / nossas. <i>apelido</i> is masculine singular, so: <b>O nosso apelido</b>. In European Portuguese the article comes before the possessive.","topic":"X5","pts":4},{"type":"text","ask":"Type the demonstrative (este / esse / aquele in the right form).","prompt":"___ senhora é a minha tia. <small>(far from both of us (aquilo))</small>","accept":["Aquela"],"explain":"far from both of us (aquilo) → aquele / aquela / aqueles / aquelas. <i>senhora</i> is feminine singular → <b>Aquela</b>.","topic":"X5","pts":4},{"type":"text","ask":"Answer with a possessive (ela).","prompt":"De quem é a mala? — É ___.","accept":["dela"],"explain":"de + ela = <b>dela</b>.","topic":"X5","pts":4},{"type":"text","ask":"Type the correct form of ter.","prompt":"Nós ___ a carta de condução?","accept":["temos"],"explain":"<i>Ter</i>: tenho, tens, tem, temos, <b>têm</b>. Nós → <b>temos</b>.","topic":"X5","pts":3},{"type":"mc","ask":"Choose the possessive.","prompt":"As ___ malas são pesadas. <small>(vocês)</small>","options":["vossas","vosso","vossa","vossos"],"explain":"<i>vocês</i> → vosso / vossa / vossos / vossas. <i>malas</i> is feminine plural, so: <b>As vossas malas</b>. In European Portuguese the article comes before the possessive.","topic":"X5","pts":3},{"type":"mc","ask":"The keys are far from both of you.","prompt":"As chaves estão ___.","options":["ali","aqui","aí","isto"],"explain":"Far from both → <b>ali</b>.","topic":"X5","pts":2},{"type":"text","ask":"Complete with the ordinal (feminine).","prompt":"a ___ rua à direita <small>(2.ª)</small>","accept":["segunda"],"explain":"Ordinals agree in gender: segundo → <b>segunda</b> (2.ª).","topic":"X6","pts":4},{"type":"text","ask":"Write the profession in Portuguese.","prompt":"A Joana é ___. <small>(journalist)</small>","accept":["jornalista"],"explain":"Profession after <i>ser</i> has <b>no article</b>: <i>A Joana é jornalista</i>. <i>jornalista</i> has the same form for men and women (like <i>estudante, jornalista</i>).","topic":"X6","pts":3},{"type":"text","ask":"Write the feminine form.","prompt":"o professor → a ___","accept":["professora"],"explain":"-or → -ora: professor → <b>professora</b>.","topic":"X6","pts":3},{"type":"text","ask":"Complete with the ordinal.","prompt":"Moro no ___ andar. <small>(6.º)</small>","accept":["sexto"],"explain":"<i>O andar</i> is masculine: 6.º = <b>sexto</b>. Ordinals go before the noun.","topic":"X6","pts":3},{"type":"text","ask":"Type quanto, quanta, quantos or quantas.","prompt":"___ carros tens? — Um.","accept":["Quantos"],"explain":"<i>Quanto</i> agrees with the noun: <i>carros</i> is masculine plural → <b>Quantos</b>.","topic":"X6","pts":3},{"type":"mc","ask":"Which questions ask for the same information?","prompt":"Quantos anos tem?","options":["Que idade tem?","Qual é o seu nome?","É casado?","Onde mora?"],"explain":"<b>Quantos anos tem?</b> = <b>Que idade tem?</b> (age).","topic":"X6","pts":3}],[{"type":"multi","nRight":3,"ask":"Select ALL the things you normally find in a wallet.","prompt":"Na carteira…","options":["dinheiro","moedas","a carta de condução","uma garrafa de água","um computador","uma mesa"],"explain":"In a <i>carteira</i>: <b>dinheiro, moedas, a carta de condução</b> (and cards, the B.I.).","topic":"L5A","pts":2},{"type":"mc","ask":"What are these?","prompt":"O que é isto? ___","options":["São uns óculos de sol.","É um óculo de sol.","É uma óculos de sol.","São umas óculos de sol."],"explain":"<i>Óculos</i> is always plural and masculine: <b>uns óculos de sol</b> (sunglasses), <i>os meus óculos</i>.","img":"<svg viewBox=\" correct form of ter.","prompt":"Tu ___ água?","accept":["tens"],"explain":"<i>Tu</i> → <b>tens</b>.","topic":"L5B","pts":2},{"type":"text","ask":"Type the correct form of ter.","prompt":"Nós ___ as chaves de casa.","accept":["temos"],"explain":"<i>Nós</i> → <b>temos</b>.","topic":"L5B","pts":2},{"type":"mc","ask":"Which is correct? (They have a car.)","prompt":"Eles ___ um carro.","options":["têm","tem","teem","tens"],"explain":"Plural <b>têm</b>: the circumflex marks the plural (pronounced as a double nasal sound).","topic":"L5B","pts":5},{"type":"mc","ask":"Choose the correct form of ter.","prompt":"Ele ___ passaporte francês.","options":["tem","têm","tens","temos"],"explain":"<i>Ele</i> → <b>tem</b> (no accent in the singular).","topic":"L5B","pts":2},{"type":"text","ask":"Complete (vocês).","prompt":"Vocês são chineses. ___ país é a China.","accept":["O vosso"],"explain":"vocês → <b>o vosso / a vossa</b>: <b>O vosso</b> país.","topic":"L5C","pts":8},{"type":"text","ask":"Complete with a possessive (ele).","prompt":"Ele tem um livro azul. → O livro ___ é azul.","accept":["dele"],"explain":"For <i>ele/ela/eles/elas</i> the possessive goes after the noun: o livro <b>dele</b>.","topic":"L5C","pts":6},{"type":"text","ask":"Complete with a possessive (elas).","prompt":"Elas têm um computador. → O computador ___ é novo.","accept":["delas"],"explain":"elas → <b>delas</b>: o computador delas.","topic":"L5C","pts":6},{"type":"text","ask":"Complete with the possessive (tu).","prompt":"Onde tens as ___ malas?","accept":["tuas"],"explain":"tu + feminine plural (<i>malas</i>) → <b>tuas</b>.","topic":"L5C","pts":6},{"type":"text","ask":"Rewrite with a possessive (eu).","prompt":"Tenho uma caneta preta. → ___ caneta é preta.","accept":["A minha"],"explain":"eu → <b>o meu / a minha</b>; <i>caneta</i> is feminine: <b>A minha</b> caneta.","topic":"L5C","pts":5},{"type":"text","ask":"Rewrite with a possessive (tu).","prompt":"Tens um carro verde. → ___ carro é verde.","accept":["O teu"],"explain":"tu → <b>o teu / a tua</b>; <i>carro</i> is masculine: <b>O teu</b> carro.","topic":"L5C","pts":5},{"type":"text","ask":"Rewrite with a possessive (nós).","prompt":"Temos uma casa no Porto. → ___ casa é no Porto.","accept":["A nossa"],"explain":"nós → <b>o nosso / a nossa</b>: <b>A nossa</b> casa.","topic":"L5C","pts":5},{"type":"text","ask":"Complete with the possessive (eu).","prompt":"As ___ chaves estão aqui.","accept":["minhas"],"explain":"eu + feminine plural (<i>chaves</i>) → <b>minhas</b>.","topic":"L5C","pts":5},{"type":"mc","ask":"Complete (você).","prompt":"Você é espanhol. ___ país é Espanha.","options":["O seu","O teu","O dele","A sua"],"explain":"<i>Você</i> / <i>o senhor</i> → <b>o seu / a sua</b>. <i>País</i> is masculine: <b>O seu</b> país.","topic":"L5C","pts":6},{"type":"mc","ask":"Complete with the possessive (nós).","prompt":"Os ___ filhos chamam-se Ana e Hugo.","options":["nossos","nossas","nosso","vossos"],"explain":"<i>Filhos</i> is masculine plural → <b>nossos</b>.","topic":"L5C","pts":5},{"type":"text","ask":"Type no, na or em.","prompt":"Ele está ___ casa.","accept":["em"],"explain":"<b>Em casa</b> (at home) never takes an article.","topic":"L5D","pts":5},{"type":"text","ask":"Type no, na or em.","prompt":"Ele está ___ carro.","accept":["no"],"explain":"<i>O carro</i>: em + o = <b>no</b>.","topic":"L5D","pts":2},{"type":"text","ask":"Type no, na or em.","prompt":"Ele está ___ escola.","accept":["na"],"explain":"<i>A escola</i>: em + a = <b>na</b>.","topic":"L5D","pts":2},{"type":"mc","ask":"The key is next to the person you are talking to.","prompt":"A tua chave está ___.","options":["aí","aqui","ali","este"],"explain":"Near the listener → <b>aí</b>.","topic":"L5D","pts":3},{"type":"mc","ask":"The key is far from both of you.","prompt":"A tua chave está ___.","options":["ali","aqui","aí","aquela"],"explain":"Far from both → <b>ali</b>. (Compare <i>isto / isso / aquilo</i>.)","topic":"L5D","pts":3},{"type":"mc","ask":"The key is in YOUR (the speaker's) hand.","prompt":"A chave está ___.","options":["aqui","aí","ali","isso"],"explain":"Near the speaker → <b>aqui</b>.","topic":"L5D","pts":2},{"type":"mc","ask":"What does it mean?","prompt":"Estou em casa.","options":["I'm at home.","I'm going home.","I have a house.","My house is here."],"explain":"<b>Estar em casa</b> = to be at home.","topic":"L5D","pts":1},{"type":"text","ask":"Write the question with these words.","prompt":"mora / é / onde / que","accept":["Onde é que mora"],"explain":"Question word + <b>é que</b> + verb: <b>Onde é que mora?</b>","topic":"L5E","pts":6},{"type":"text","ask":"Answer with a possessive (ela).","prompt":"De quem é a caneta verde? → É ___.","accept":["dela"],"explain":"de + ela = <b>dela</b>: É dela.","topic":"L5E","pts":5},{"type":"text","ask":"Answer with a possessive (eu).","prompt":"De quem é isto? → É ___.","accept":["meu"],"explain":"<i>Isto</i> is neuter → masculine form: <b>É meu.</b>","topic":"L5E","pts":3},{"type":"text","ask":"Complete the question.","prompt":"De ___ é o carro branco? — É meu.","accept":["quem"],"explain":"<b>De quem é…?</b> = Whose is…?","topic":"L5E","pts":2},{"type":"mc","ask":"Which question is correct?","prompt":"O que… ?","options":["O que é que tens na mala?","O que tens é que na mala?","É que o que tens na mala?","O que que é tens na mala?"],"explain":"<b>é que</b> goes right after the question word: <i>O que <b>é que</b> tens…? Onde <b>é que</b> moras?</i>","topic":"L5E","pts":5},{"type":"mc","ask":"Answer: the car belongs to José.","prompt":"De quem é o carro preto? — ___","options":["É do José.","É de José.","É o José.","É dele José."],"explain":"de + o José = <b>do José</b>: <i>É do José.</i>","topic":"L5E","pts":3},{"type":"text","ask":"Type the demonstrative (isso → near you).","prompt":"___ livro é teu.","accept":["Esse"],"explain":"Near the listener: <b>esse / essa / esses / essas</b>. <i>Livro</i> → <b>Esse</b>.","topic":"L5F","pts":5},{"type":"text","ask":"Type the demonstrative (aquilo → far).","prompt":"___ relógio é da Ana.","accept":["Aquele"],"explain":"Far from both: <b>aquele / aquela / aqueles / aquelas</b>. → <b>Aquele</b> relógio.","topic":"L5F","pts":5},{"type":"text","ask":"Type este, esta, estes or estas (near me).","prompt":"___ é a minha mãe.","accept":["Esta"],"explain":"<i>Mãe</i> is feminine singular → <b>Esta</b>.","topic":"L5F","pts":3},{"type":"text","ask":"Type este, esta, estes or estas (near me).","prompt":"___ telemóvel é meu.","accept":["Este"],"explain":"<i>Telemóvel</i> is masculine singular → <b>Este</b>.","topic":"L5F","pts":3},{"type":"mc","ask":"Far from both.","prompt":"___ mesas são nossas.","options":["Aquelas","Aqueles","Aquela","Aquilo"],"explain":"<i>Mesas</i> is feminine plural → <b>Aquelas</b>.","topic":"L5F","pts":6},{"type":"mc","ask":"Near me.","prompt":"___ são as minhas primas.","options":["Estas","Estes","Esta","Isto"],"explain":"<i>Primas</i> is feminine plural → <b>Estas</b>.","topic":"L5F","pts":5},{"type":"multi","nRight":3,"ask":"Select ALL the words with the strong r [ʁ].","prompt":"[ʁ]","options":["carro","Roma","rosa","livro","verde","estar"],"explain":"Strong [ʁ]: <i>rr</i> (<b>carro</b>) and initial r (<b>Roma, rosa</b>). Between vowels or after a consonant it's the soft [ɾ].","topic":"L5G","pts":6},{"type":"mc","ask":"How do tem and têm sound different?","prompt":"tem / têm","options":["têm repeats the nasal sound: [ˈtɐ̃jɐ̃j]","têm is pronounced like “tim”","There is no difference","têm has an open [ɛ]"],"explain":"Plural <b>têm</b> is pronounced with the nasal diphthong twice [ˈtɐ̃jɐ̃j]; singular <i>tem</i> has it once.","topic":"L5G","pts":8},{"type":"mc","ask":"In which word is r pronounced as the strong r [ʁ]?","prompt":"r → [ʁ]?","options":["rua","parede","carta","falar"],"explain":"<i>r</i> at the start of a word is strong [ʁ], like <i>rr</i>: <b>rua</b>, Roma, russo.","topic":"L5G","pts":5},{"type":"mc","ask":"Which word rhymes with “bem”?","prompt":"bem","op :"mc","ask":"Which pair is correct?","prompt":"masculino / feminino","options":["o ator / a atriz","o ator / a atora","o atriz / a ator","o actor / a actriza"],"explain":"<b>ator → atriz</b> is irregular. (Pre-reform spelling was <i>actor/actriz</i>.)","topic":"L6A","pts":5},{"type":"mc","ask":"Choose the correct sentence (European Portuguese).","prompt":"“I'm a doctor.”","options":["Sou médico.","Sou o médico.","Sou uma médico.","Estou médico."],"explain":"With <i>ser</i> + profession there is <b>no article</b>: <i>Sou médico. Ela é professora.</i> A profession uses <i>ser</i>, not <i>estar</i>.","topic":"L6A","pts":4},{"type":"mc","ask":"What is this profession in Portuguese?","prompt":"pupil = ___","options":["aluno","dono de casa","médico","empresário"],"explain":"<b>aluno</b> (feminine: aluna).","topic":"L6A","pts":1},{"type":"mc","ask":"What is this profession in Portuguese?","prompt":"actor = ___","options":["ator","empregado de mesa","professor","advogado"],"explain":"<b>ator</b> (feminine: atriz).","topic":"L6A","pts":1},{"type":"mc","ask":"What is this profession in Portuguese?","prompt":"engineer = ___","options":["engenheiro","aluno","cantor","ator"],"explain":"<b>engenheiro</b> (feminine: engenheira).","topic":"L6A","pts":1},{"type":"text","ask":"What does R/C mean? Write it in full.","prompt":"R/C = ___","accept":["rés do chão","rés-do-chão"],"explain":"<b>R/C = rés do chão</b> (ground floor). Esq. = esquerdo, Dto. = direito.","topic":"L6B","pts":5},{"type":"text","ask":"Answer: you live on the 3rd floor.","prompt":"Em que andar moras? — No ___.","accept":["terceiro"],"explain":"<b>No terceiro</b> (andar). em + o = no.","topic":"L6B","pts":5},{"type":"text","ask":"Write the ordinal number (masculine).","prompt":"sete → ___ <small>(7.º)</small>","accept":["sétimo"],"explain":"7.º = <b>sétimo</b> (feminine sétima, 7.ª).","topic":"L6B","pts":4},{"type":"text","ask":"Complete with the ordinal.","prompt":"Moro no ___ andar. <small>(2.º)</small>","accept":["segundo"],"explain":"<i>O andar</i> is masculine: 2.º = <b>segundo</b>. Ordinals go before the noun.","topic":"L6B","pts":4},{"type":"text","ask":"Write the ordinal number (masculine).","prompt":"oito → ___ <small>(8.º)</small>","accept":["oitavo"],"explain":"8.º = <b>oitavo</b> (feminine oitava, 8.ª).","topic":"L6B","pts":4},{"type":"text","ask":"Write the ordinal number (masculine).","prompt":"cinco → ___ <small>(5.º)</small>","accept":["quinto"],"explain":"5.º = <b>quinto</b> (feminine quinta, 5.ª).","topic":"L6B","pts":3},{"type":"text","ask":"Write the ordinal number (masculine).","prompt":"três → ___ <small>(3.º)</small>","accept":["terceiro"],"explain":"3.º = <b>terceiro</b> (feminine terceira, 3.ª).","topic":"L6B","pts":3},{"type":"mc","ask":"How do you read the sign?","prompt":"Praça D. Pedro IV","options":["Praça Dom Pedro Quarto","Praça Dom Pedro Quatro","Praça Dom Pedro Quarenta","Praça Dom Pedro Décimo"],"explain":"Kings and queens are read with ordinals: <b>D. Pedro IV = Dom Pedro Quarto</b>; Teatro D. Maria II = Dona Maria Segunda.","topic":"L6B","pts":4},{"type":"mc","ask":"Read the address.","prompt":"1.º Esq.","options":["primeiro esquerdo","primeiro direito","um esquerdo","primeira esquerda"],"explain":"<b>1.º Esq.</b> = primeiro (andar) esquerdo: first floor, left-hand flat.","topic":"L6B","pts":4},{"type":"text","ask":"Complete the question.","prompt":"___ se escreve o seu apelido? — C-O-S-T-A.","accept":["Como"],"explain":"<b>Como se escreve…?</b> = How do you spell…?","topic":"L6C","pts":5},{"type":"text","ask":"Type quanto, quanta, quantos or quantas.","prompt":"___ línguas falas? — Três.","accept":["Quantas"],"explain":"<i>Quanto</i> agrees with the noun: <i>línguas</i> is feminine plural → <b>Quantas</b>.","topic":"L6C","pts":5},{"type":"text","ask":"Complete the question.","prompt":"___ idade tem? — 24 anos.","accept":["Que"],"explain":"<b>Que idade tem?</b> = <i>Quantos anos tem?</i>","topic":"L6C","pts":4},{"type":"text","ask":"Complete the question.","prompt":"___ anos tem? — 24.","accept":["Quantos"],"explain":"<i>Anos</i> is masculine plural → <b>Quantos anos</b> tem?","topic":"L6C","pts":4},{"type":"text","ask":"Complete the question.","prompt":"___ é a sua morada? — Rua das Flores, 18.","accept":["Qual"],"explain":"<b>Qual é a sua morada?</b> = What's your address?","topic":"L6C","pts":4},{"type":"text","ask":"Complete the question.","prompt":"Em ___ andar mora? — No segundo.","accept":["que"],"explain":"<b>Em que andar</b> mora? = Which floor do you live on?","topic":"L6C","pts":4},{"type":"text","ask":"Type quanto, quanta, quantos or quantas.","prompt":"___ alunos estão aqui? — Doze.","accept":["Quantos"],"explain":"<i>Quanto</i> agrees with the noun: <i>alunos</i> is masculine plural → <b>Quantos</b>.","topic":"L6C","pts":4},{"type":"text","ask":"Type quanto, quanta, quantos or quantas.","prompt":"___ anos tens? — Trinta e dois.","accept":["Quantos"],"explain":"<i>Quanto</i> agrees with the noun: <i>anos</i> is masculine plural → <b>Quantos</b>.","topic":"L6C","pts":4},{"type":"text","ask":"Type quanto, quanta, quantos or quantas.","prompt":"___ lápis tem o Pedro? — Cinco.","accept":["Quantos"],"explain":"<i>Quanto</i> agrees with the noun: <i>lápis</i> is masculine plural → <b>Quantos</b>.","topic":"L6C","pts":4},{"type":"text","ask":"Complete the question.","prompt":"___ é o seu nome? — Paulo Albuquerque.","accept":["Qual"],"explain":"<b>Qual é…?</b> asks for a piece of information: o nome, a morada, a profissão, o estado civil.","topic":"L6C","pts":3},{"type":"text","ask":"Write the word (a woman, married).","prompt":"A Mafalda é ___.","accept":["casada"],"explain":"<i>Casado</i> agrees with the person: <b>casada</b>. Also: solteira, divorciada.","topic":"L6D","pts":5},{"type":"text","ask":"How do you say @ in an email address?","prompt":"@ = ___","accept":["arroba"],"explain":"<b>@ = arroba</b>, <b>. = ponto</b>: christrek arroba gmail ponto com.","topic":"L6D","pts":4},{"type":"mc","ask":"Which personal detail is this?","prompt":"“Chamo-me Mafalda Lemos.”","options":["nome","nacionalidade","idade","profissão"],"explain":"“Chamo-me Mafalda Lemos.” → <b>nome</b>.","topic":"L6D","pts":3},{"type":"mc","ask":"Which personal detail is this?","prompt":"“Sou portuguesa.”","options":["nacionalidade","nome","idade","profissão"],"explain":"“Sou portuguesa.” → <b>nacionalidade</b>.","topic":"L6D","pts":3},{"type":"mc","ask":"Which personal detail is this?","prompt":"“Tenho 32 anos.”","options":["idade","nome","nacionalidade","profissão"],"explain":"“Tenho 32 anos.” → <b>idade</b>.","topic":"L6D","pts":3},{"type":"mc","ask":"Which personal detail is this?","prompt":"“Sou advogada.”","options":["profissão","nome","nacionalidade","idade"],"explain":"“Sou advogada.” → <b>profissão</b>.","topic":"L6D","pts":3},{"type":"mc","ask":"What does it mean?","prompt":"o apelido","options":["surname","nickname","address","first name"],"explain":"<b>O apelido</b> = surname (last name). A nickname is <i>a alcunha</i>.","topic":"L6D","pts":3},{"type":"mc","ask":"What does it mean?","prompt":"o código postal","options":["postcode","phone number","ID number","street"],"explain":"<b>O código postal</b> = postcode, e.g. 1200-015 Lisboa.","topic":"L6D","pts":2},{"type":"mc","ask":"Choose the word for “single” (not married).","prompt":"Sou ___.","options":["solteiro","casado","divorciado","sozinho"],"explain":"<b>Solteiro / solteira</b> = single.","topic":"L6D","pts":2},{"type":"text","ask":"Write a question with these words.","prompt":"seu / é / nome / qual / completo / o","accept":["Qual é o seu nome completo"],"explain":"<b>Qual é o seu nome completo?</b> <i>Completo</i> comes after the noun.","topic":"L6E","pts":9},{"type":"text","ask":"Write a sentence with these words.","prompt":"dele / último / Pereira / nome / o / é","accept":["O último nome dele é Pereira"],"explain":"<b>O último nome dele é Pereira.</b> <i>Último</i> before the noun, <i>dele</i> after it.","topic":"L6E","pts":9},{"type":"text","ask":"Write a sentence with these words.","prompt":"andar / no / mora / terceiro / ela","accept":["Ela mora no terceiro andar"],"explain":"<b>Ela mora no terceiro andar.</b> The ordinal goes before <i>andar</i>.","topic":"L6E","pts":7},{"type":"mc","ask":"Which letter is it?","prompt":"xis","options":["X","S","Z","C"],"explain":"<b>X</b> = <i>xis</i>; S = <i>esse</i>; Z = <i>zê</i>.","topic":"L6E","pts":4},{"type":"mc","ask":"Which letter is it?","prompt":"agá","options":["H","A","G","J"],"explain":"The letter <b>H</b> is called <i>agá</i>. It is silent in Portuguese: <i>hotel</i> [ɔˈtɛɫ].","topic":"L6E","pts":2},{"type":"mc","ask":"Which letter is it?","prompt":"jota","options":["J","G","I","Y"],"explain":"<b>J</b> = <i>jota</i>; G = <i>gê</i>; I = <i>i</i>.","topic":"L6E","pts":2},{"type":"multi","nRight":3,"ask":"Select ALL the words where s sounds [ʃ].","prompt":"s → [ʃ]","options":["Espanha","nós","Marrocos","casado","inglesa","professor"],"explain":"<b>s</b> at the end of a word or before a consonant → [ʃ]: Espanha, nós, Marrocos. <i>casado, inglesa</i> → [z]; <i>professor</i> (ss) → [s].","topic":"L6F","pts":7},{"type":"mc","ask":"How is the s pronounced?","prompt":"ca<b>s</b>ado · ingle<b>s</b>a · pa<b>í</b>s → casado","options":["[z]","[s]","[ʃ]","silent"],"explain":"A single <b>s between vowels</b> sounds [z]: casado, inglesa, mesa, brasileiro.","topic":"L6F","pts":5},{"type":"mc","ask":"How is ss pronounced?","prompt":"pa<b>ss</b>aporte · Rú<b>ss</b>ia · no<b>ss</b>o","options":["[s]","[z]","[ʃ]","silent"],"explain":"<b>ss</b> is always [s]: passaporte, Rússia, nosso, dezassete.","topic":"L6F","pts":4},{"type":"mc","ask":"How does en-/em- at the start of a word sound?","prompt":"enfermeiro · engenheiro · empregado","options":["nasal [ẽ]","open [ɛ]","[i]","silent"],"explain":"Initial <b>en-/em-</b> is a nasal vowel [ẽ]: enfermeiro, engenheiro, empregado, empresário.","topic":"L6F","pts":4}]],"caderno":[[{"type":"multi","nRight":3,"ask":"Select ALL the greetings (not farewells).","prompt":"Cumprimentos","options":["Bom dia!","Olá!","Boa tarde!","Até amanhã!","Adeus!","Até logo!"],"explain":"Greetings: <b>Bom dia!, Olá!, Boa tarde!</b> Farewells: <i>Até amanhã!, Adeus!, Até logo!</i> (<i>Boa noite!</i> works for both.)","topic":"C1","pts":3},{"type":"text","ask":"Write a sentence with these words.","prompt":"sei / és / não / quem","accept":["Não sei quem és"],"explain":"Negation comes before the verb: <b>Não sei quem és.</b> = I don't know who you are.","topic":"C1","pts":6},{"type":"text","ask":"Type me, te or se.","prompt":"Como ___ chamas?","accept":["te"],"explain":"<i>Chamas</i> is the <i>tu</i> form → <b>te</b>. After <i>como</i> the pronoun goes before the verb: <i>Como te chamas?</i>","topic":"C1","pts":3},{"type":"text","ask":"Complete the dialogue.","prompt":"A: ___ o Jorge? B: Sim, sou.","accept":["És","É"],"explain":"Asking someone if they are Jorge: <b>És o Jorge?</b> (tu, informal) or <b>É o Jorge?</b> (formal). The answer <i>Sim, sou</i> uses <i>eu sou</i>.","topic":"C1","pts":3},{"type":"text","ask":"Write the expression with these words.","prompt":"próxima / até / à","accept":["Até à próxima"],"explain":"<b>Até à próxima!</b> = Until next time. In European Portuguese <i>à</i> (a + a) is used here.","topic":"C1","pts":3},{"type":"text","ask":"Type me, te or se.","prompt":"Chamas-___ António?","accept":["te"],"explain":"<i>Chamas</i> = tu → <b>te</b>: <i>Chamas-te António?</i>","topic":"C1","pts":2},{"type":"text","ask":"Type the name of the country in Portuguese.","prompt":"Que país é este? ___","accept":["Polónia"],"explain":"It's the flag of <b>Polónia</b>. Note the European Portuguese spelling with ó.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"10\" fill=\"#F7F7F2\"/><rect y=\"10\" width=\"30\" height=\"10\" fill=\"#DC143C\"/><rect width=\"30\" height=\"20\" fill=\"none\" stroke=\"#9AA19D\" stroke-width=\".25\"/></svg>","topic":"C2","pts":3},{"type":"text","ask":"Type the name of the country in Portuguese.","prompt":"Que país é este? ___","accept":["Brasil"],"explain":"It's the flag of <b>Brasil</b>.","img":"<svg viewBox=\"0 0 30 20\" role=\"img\" aria-label=\"A national flag\"><rect width=\"30\" height=\"20\" fill=\"#009C3B\"/><path d=\"M15 2.4 27.6 10 15 17.6 2.4 10Z\" fill=\"#FFDF00\"/><circle cx=\"15\" cy=\"10\" r=\"5\" fill=\"#002776\"/><path d=\"M10.2 9.1c3.1-.6 6.8-.2 9.7 1.7\" stroke=\"#fff\" stroke-width=\".8\" fill=\"none\"/></svg>","topic":"C2","pts":1},{"type":"text","ask":"Write the missing number.","prompt":"trinta e três, ___, noventa e nove","accept":["sessenta e seis"],"explain":"33, 66, 99: each step adds 33 → <b>sessenta e seis</b>. Remember the <i>e</i> between tens and units.","topic":"C2","pts":6},{"type":"text","ask":"Write the sentence in the negative.","prompt":"Woody Allen é de Londres. → ___","accept":["Woody Allen não é de Londres"],"explain":"Put <b>não</b> before the verb: <i>Woody Allen <b>não é</b> de Londres.</i>","topic":"C2","pts":4},{"type":"text","ask":"Complete with de/da/do/dos or em/na/no/nos.","prompt":"A Vanessa é ___ Rio de Janeiro.","accept":["do"],"explain":"Rio de Janeiro is one of the cities with an article (<i>o Rio</i>): de + o = <b>do</b>.","topic":"C2","pts":4},{"type":"text","ask":"Answer the question.","prompt":"Onde é Hamburgo? ___","accept":["Na Alemanha","É na Alemanha","Fica na Alemanha"],"explain":"<i>A Alemanha</i> is feminine: em + a = <b>na</b>. <i>Na Alemanha.</i>","topic":"C2","pts":3},{"type":"text","ask":"Rewrite the sentence using the pronoun and the nationality.","prompt":"O Johannes e a Anke são da Alemanha. → ___","accept":["Eles são alemães"],"explain":"a mixed group → masculine plural: <b>Eles são alemães.</b>","topic":"C3","pts":7},{"type":"text","ask":"Rewrite the sentence using the pronoun and the nationality.","prompt":"A Daniela e a María são de Espanha. → ___","accept":["Elas são espanholas"],"explain":"two women → feminine plural: <b>Elas são espanholas.</b>","topic":"C3","pts":6},{"type":"text","ask":"Write a sentence with these words.","prompt":"de / falamos / japonês / pouco / um","accept":["Falamos um pouco de japonês"],"explain":"<b>Falamos um pouco de japonês.</b> The expression is <i>um pouco de</i> + language.","topic":"C3","pts":6},{"type":"text","ask":"Write a sentence with these words.","prompt":"não / alemã / é / ela","accept":["Ela não é alemã"],"explain":"<b>Ela não é alemã.</b> <i>Não</i> always goes right before the verb.","topic":"C3","pts":4},{"type":"text","ask":"Rewrite the sentence using the pronoun and the nationality.","prompt":"O Josiah é dos Estados Unidos. → ___","accept":["Ele é americano"],"explain":"one man → masculine singular: <b>Ele é americano.</b>","topic":"C3","pts":3},{"type":"text","ask":"Complete with ser, estar or falar in the correct form.","prompt":"Onde ___ vocês?","accept":["estão"],"explain":"where you are → <i>estar</i>: <b>estão</b>. (<i>Onde moram vocês?</i> would ask where you live.)","topic":"C3","pts":3},{"type":"text","ask":"Write the sentence in the plural.","prompt":"O computador é preto. → ___","accept":["Os computadores são pretos","Os computadores são pretos"],"explain":"-or → -ores: <b>Os computadores são pretos.</b>","topic":"C4","pts":7},{"type":"text","ask":"Write the sentence in the plural.","prompt":"A cadeira é verde. → ___","accept":["As cadeiras são verdes","As cadeiras são verdes"],"explain":"Article, noun, verb and colour all go to the plural: <b>As cadeiras são verdes.</b>","topic":"C4","pts":6},{"type":"text","ask":"Type o, a, um or uma.","prompt":"Isto é ___ Volvo.","accept":["um"],"explain":"A car brand refers to <i>um carro</i> (masculine) → <b>um</b> Volvo.","topic":"C4","pts":6},{"type":"text","ask":"Write the sentence in the plural.","prompt":"É um livro de Saramago. → ___","accept":["São livros de Saramago","São uns livros de Saramago"],"explain":"<b>São livros de Saramago.</b> (The indefinite plural <i>uns</i> is usually dropped here.)","topic":"C4","pts":4},{"type":"text","ask":"Complete with a word from the box: pode / não / abram / qual / o que / trabalhem.","prompt":"___ em pares.","accept":["Trabalhem"],"explain":"Instruction to the class: <b>Trabalhem</b> em pares (work in pairs).","topic":"C4","pts":4},{"type":"text","ask":"Two men look at a house on a distant hill: Type isto, isso or aquilo.","prompt":"___ é uma casa?","accept":["Aquilo"],"explain":"The house is far from both of them → <b>Aquilo</b>.","topic":"C4","pts":3},{"type":"mc","ask":"What is this?","prompt":"___","options":["o café","o chá","o sumo","a água"],"explain":"It's coffee: <b>o café</b>.","img":"<svg viewBox=\"0 0 160 130\" role=\"img\" aria-label=\"A cup of coffee\"><ellipse cx=\"80\" cy=\"108\" rx=\"60\" ry=\"12\" fill=\"#F2EFE6\" stroke=\"#2A2A2A\" stroke-width=\"2.5\"/><path d=\"M40 52h72l-8 50H48Z\" fill=\"#F8F8F4\" stroke=\"#2A2A2A\" stroke-width=\"2.5\"/><ellipse cx=\"76\" cy=\"52\" rx=\"36\" ry=\"8\" fill=\"#5A3416\" stroke=\"#2A2A2A\" stroke-width=\"2.5\"/><path d=\"M112 62c18 0 18 26-2 26\" fill=\"none\" stroke=\"#2A2A2A\" stroke-width=\"5\"/><path d=\"M64 36c-6-8 6-12 0-22M84 36c-6-8 6-12 0-22\" stroke=\"#9AA19D\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/></svg>","topic":"C5","pts":2},{"type":"text","ask":"Correct the mistake.","prompt":"Obrigada muito.","accept":["Muito obrigada"],"explain":"The intensifier comes first: <b>Muito obrigada!</b>","topic":"C5","pts":4},{"type":"text","ask":"Complete the dialogue.","prompt":"A: ___ alguma coisa? B: Não, obrigada.","accept":["Mais"],"explain":"<b>Mais alguma coisa?</b> = Anything else?","topic":"C5","pts":3},{"type":"text","ask":"Write the definite article and the noun in the plural.","prompt":"telemóvel → ___","accept":["os telemóveis"],"explain":"-el → -eis: telemóvel → <b>os telemóveis</b>.","topic":"C6","pts":7},{"type":"text","ask":"Answer (−).","prompt":"A: Ele tem passaporte francês? B: ___","accept":["Não, não tem","Não tem"],"explain":"Short negative answer repeats the verb: <b>Não, não tem.</b>","topic":"C6","pts":6},{"type":"text","ask":"Rewrite using a possessive.","prompt":"Temos uma casa no Porto. → ___ é no Porto.","accept":["A nossa casa"],"explain":"nós → <b>a nossa</b> casa.","topic":"C6","pts":6},{"type":"text","ask":"Write the definite article and the noun in the plural.","prompt":"lápis → ___","accept":["os lápis"],"explain":"<i>Lápis</i> is masculine and doesn't change in the plural: <b>os lápis</b>.","topic":"C6","pts":4},{"type":"text","ask":"Write the definite article and the noun in the plural.","prompt":"mala → ___","accept":["as malas"],"explain":"<i>Mala</i> (bag) is feminine: <b>as malas</b>.","topic":"C6","pts":3},{"type":"text","ask":"Write the correct form of ter.","prompt":"ele ___","accept":["tem"],"explain":"<i>Ter</i> is irregular: tenho, tens, tem, temos, <b>têm</b> (plural with a circumflex). ele → <b>tem</b>.","topic":"C6","pts":2},{"type":"mc","ask":"A painting hangs on the wall far from both of you.","prompt":"O quadro de Leonardo da Vinci está ___.","options":["ali","aqui","aí","isto"],"explain":"Far from speaker and listener → <b>ali</b>.","topic":"C6","pts":3},{"type":"multi","nRight":2,"ask":"Select ALL the words with TWO syllables.","prompt":"Sílabas","options":["muito","chamas","quem","sábado","desculpe","bem"],"explain":"<b>mui-to, cha-mas</b>. <i>Quem, bem</i> = 1 syllable; <i>sá-ba-do, des-cul-pe</i> = 3.","topic":"C7","pts":4},{"type":"mc","ask":"In which word is the highlighted e pronounced differently?","prompt":"ond<b>e</b> · d<b>e</b>zoito · pr<b>e</b>to · árab<b>e</b>","options":["pr<b>e</b>to","ond<b>e</b>","d<b>e</b>zoito","árab<b>e</b>"],"explain":"Unstressed e → [ɨ] (onde, dezoito, árabe). In <b>preto</b> the e is stressed: a full [e].","topic":"C7","pts":6},{"type":"mc","ask":"Which word does NOT have a nasal sound?","prompt":"sim · bem · um · sou · bom","options":["sou","sim","bem","bom"],"expla const $=s=>document.querySelector(s), app=$("#app");
let S=load();
function blank(){return{view:"home",book:"home",cur:0,runs:{},best:{}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.runs){s.book=s.book||"livro";if(s.dataver!==DATAVER){s.runs={};s.best={};s.dataver=DATAVER}return s}}catch(e){}const b=blank();b.dataver=DATAVER;return b}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[.!?¡¿,;:"“”]/g,"").replace(/\s+/g," ").trim();
const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const plain=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const level=p=>p<=3?"Easy":p<=6?"Medium":p<=8?"Hard":"Expert";
const fmtT=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(x).padStart(2,"0")};
const earned=a=>a?(a.earned??(a.ok?a.pts:0)):0;

const VARS=()=>BOOKS[S.book];
const rk=(v,b=S.book)=>b+"-"+v;
function newRun(v){return{order:shuffle(VARS()[v].map((_,i)=>i)),opt:{},ans:{},sel:{},i:0,elapsed:0,done:false,mode:S.diff||"easy",hints:HINTS_PER_RUN,hint:{},elim:{},rev:{}}}
const isEasy=r=>(r.mode||"hard")==="easy";
const bk=(i,m)=>rk(i)+"|"+m;
const run=()=>S.runs[rk(S.cur)];
const Qs=()=>VARS()[S.cur];
function curQ(){const r=run();return{k:r.order[r.i],q:Qs()[r.order[r.i]]}}
function score(r){return Object.values(r.ans).reduce((s,a)=>s+earned(a),0)}
const correctText=q=>q.type==="mc"?q.options[0]:q.type==="multi"?q.options.slice(0,q.nRight).join(", "):q.accept[0];

/* ---------- timer ---------- */
let last=Date.now(),tick=0;
setInterval(()=>{
  const now=Date.now(),dt=now-last;last=now;
  const r=run();
  if(S.view==="quiz"&&r&&!r.done&&document.visibilityState==="visible"){r.elapsed+=Math.min(dt,5000);$("#sTime").textContent=fmtT(r.elapsed);if(++tick%5===0)save()}
},1000);
document.addEventListener("visibilitychange",()=>{last=Date.now();save()});

/* ---------- header ---------- */
function drawTop(){
  const r=run(),quiz=S.view!=="home"&&r;
  document.querySelector(".top").hidden=!quiz;
  $("#stats").hidden=!quiz;
  $("#btxt").textContent=quiz?`${S.book==="livro"?"Livro":"Caderno"} · Variante ${S.cur+1} · ${isEasy(r)?"Easy":"Hard"}`:"Nós falaremos PT";
  if(!quiz){$("#strip").innerHTML="";return}
  const qs=Qs(),answered=Object.keys(r.ans).length;
  $("#sTot").textContent=qs.length;
  $("#sNum").textContent=Math.min(r.i+1,qs.length);
  $("#sLeft").textContent=qs.length-answered;
  $("#sScore").textContent=score(r);
  $("#sTime").textContent=fmtT(r.elapsed);
  $("#strip").innerHTML=r.order.map((k,pos)=>{const a=r.ans[k];const c=a?(a.ok?"ok":earned(a)>0?"part":"bad"):(pos===r.i&&!r.done?"cur":"");return `<span class="seg ${c}" style="flex:${qs[k].pts}"></span>`}).join("");
}

function render(){if(S.view!=="home"&&!run())S.view="home";drawTop();if(S.view==="home")return renderHome();const r=run();if(r.done)return renderResult();renderQ()}

function renderLanding(){
  if(stopGame){stopGame();stopGame=null}
  const bestOf=b=>{const xs=Object.keys(S.best).filter(k=>k.startsWith(b+"-")).map(k=>S.best[k]).filter(Boolean);return xs.length?Math.max(...xs.map(x=>x.score)):null};
  const learnedW=VOCAB.filter(learned).length,learnedV=VERBS.reduce((s,V)=>s+vlearned(V.v),0);
  const cards=[["livro","Livro do aluno",`${BOOKS.livro.length} tests: 4 mixed on units 1–6, plus separate tests for Unit 5 and Unit 6.`,bestOf("livro")!=null?`Best: ${bestOf("livro")}/200`:"Not started"],
    ["caderno","Caderno de exercícios",`${BOOKS.caderno.length} workbook-style tests: 3 mixed on units 1–6, possessives & adverbs of place, Unit 5, Unit 6, de/em.`,bestOf("caderno")!=null?`Best: ${bestOf("caderno")}/200`:"Not started"],
    ["palavras","Palavras",`${VOCAB.length} words: cards, drag-and-drop, typing, word cloud and a number trainer.`,`${learnedW} words learned`],
    ["verbos","Verbos",`${VERBS.length} verbs, 24 of them new: tables, sentences, short texts and a mixed test.`,`${learnedV} of ${VERBS.length*5} forms learned`]];
  app.innerHTML=`<section class="hero"><div class="hlogo">${LOGO_BIG}</div><h1 class="sr">Nós falaremos PT</h1></section>
   <div class="lgrid">${cards.map(([id,n,d,s],k)=>`<button class="lcard isu5" data-book="${id}" style="animation-delay:${k*70}ms">${id==="verbos"?`<span class="u5b nb lb">+ 24 verbs</span>`:`<span class="u5b lb">+ Unit 6</span>`}<span class="lic">${ICONS[id]}</span><span class="ln">${n}</span><span class="ls">${s}</span><span class="lgo">Abrir →</span></button>`).join("")}</div>
   <p class="hint center lfoot">European Portuguese (PT-PT) · progress is saved in this browser</p>`;
  app.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>{switchBook(b.dataset.book);scrollTo({top:0})});
}

/* ---------- home ---------- */
function tabsHTML(){return `<div class="tabs" role="tablist">${["home",...Object.keys(BOOKS),"palavras","verbos"].map(b=>`<button role="tab" class="tab ${b===S.book?"on":""}" aria-selected="${b===S.book}" data-book="${b}"><span class="tabn">${b==="home"?"Início":b==="palavras"?"Palavras":b==="verbos"?"Verbos":b==="livro"?"Livro":"Caderno"}${["livro","caderno","palavras"].includes(b)?`<i class="tabu5" title="New: Unit 6">+U6</i>`:b==="verbos"?`<i class="tabu5 nb" title="New verbs">New</i>`:""}</span><span>${b==="home"?"menu":b==="palavras"?VOCAB.length+" words":b==="verbos"?VERBS.length+" verbs":BOOKS[b].length+" variants"}</span></button>`).join("")}</div>`}
function switchBook(b){S.book=b;save();render()}
function renderHome(){
  if(S.book==="home"||!S.book)return renderLanding();
  if(S.book==="palavras")return renderVocab();
  if(S.book==="verbos")return renderVerbs();
  if(stopGame){stopGame();stopGame=null}
  const V=VARS(),order=TOPIC_ORDER[S.book],counts={};V[0].forEach(q=>counts[q.topic]=(counts[q.topic]||0)+1);
  const note=S.book==="livro"
    ?"Variants 1–4 now cover units 1–6. Variant 5 = Unit 5, variant 6 = Unit 6."
    :"Variants 1–3 now cover units 1–6. Variant 4 = possessives and adverbs of place, 5 = Unit 5, 6 = Unit 6.";
  app.innerHTML=`${tabsHTML()}
  <section class="intro slim"><h1>${BOOKNAME[S.book]}</h1>
    <p class="upd"><span class="u5b">Unit 6</span><span><b>New: Unidade 6 · Sou estudante.</b> ${note}</span></p>
    <div class="modeseg"><span class="mlab ${(S.diff||"easy")==="easy"?"on":""}">Easy</span><button class="mtog ${(S.diff||"easy")==="easy"?"":"hard"}" role="switch" aria-checked="${!(S.diff||"easy")==="easy"}" aria-label="Hard mode" data-diff="${(S.diff||"easy")==="easy"?"hard":"easy"}"><i></i></button><span class="mlab ${(S.diff||"easy")==="easy"?"":"on"}">Hard</span></div>
  </section>
  <div class="vgrid">${V.map((v,i)=>{
    const r=S.runs[rk(i)],b=S.best[bk(i,S.diff||"easy")];
    const img=v.filter(q=>q.img).length,mul=v.filter(q=>q.type==="multi").length,txt=v.filter(q=>q.type==="text").length;
    let st="",btn=`<button class="btn sm" data-start="${i}">Start</button>`;
    if(r&&!r.done){st=`<div class="state prog">In progress (${r.mode||"hard"}) · ${Object.keys(r.ans).length}/50 · ${score(r)} pts · ${fmtT(r.elapsed)}</div>`;btn=`<button class="btn sm" data-go="${i}">Continue</button><button class="btn ghost sm" data-start="${i}">Restart</button>`}
    else if(r&&r.done){btn=`<button class="btn ghost sm" data-go="${i}">Results</button><button class="btn sm" data-start="${i}">Retake</button>`}
    if(b)st+=`<div class="state best">Best (${S.diff||"easy"}) · ${b.score}/200 in ${fmtT(b.time)}</div>`;
    const bd=VBADGE[S.book]&&VBADGE[S.book][i];
    return `<article class="vcard ${bd?"isu5":""}">${bd?`<span class="u5b vb">${bd}</span>`:""}<div class="vt"><h2>Variante ${i+1}${VNAMES[S.book]&&VNAMES[S.book][i]?`<small class="vsub">${VNAMES[S.book][i]}</small>`:""}</h2><span class="no">${S.book==="livro"?"L":"C"}${i+1}</span></div>
      <div class="meta">50 questions · 200 pts · ${txt} typed</div>${st}<div class="row">${btn}</div></article>`}).join("")}</div>`;
  app.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>switchBook(b.dataset.book));
  app.querySelectorAll("[data-diff]").forEach(b=>b.onclick=()=>{S.diff=b.dataset.diff;save();render()});
  app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{const v=+b.dataset.start;S.cur=v;S.runs[rk(v)]=newRun(v);S.view="quiz";save();render();scrollTo({top:0})});
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.go;S.view="quiz";save();render();scrollTo({top:0})});
}
/* ---------- question ---------- */
function renderQ(){
  const r=run(),{k,q}=curQ(),a=r.ans[k],n=Qs().length;
  const dots=Array.from({length:10},(_,x)=>`<i class="${x<q.pts?"on":""}"></i>`).join("");
  const prompt=q.prompt.replace("___",`<span class="blank">${a&&q.type==="text"?esc(a.given):"&nbsp;"}</span>`);
  if(q.type!=="text"&&!r.opt[k]) r.opt[k]=q.fixed?q.options.map((_,x)=>x):shuffle(q.options.map((_,x)=>x));
  let body="";
  if(q.type==="multi"){
    const sel=a?a.picks:(r.sel[k]||[]);
    body=`<div class="multi-note">Select all that apply</div><div class="opts" role="group" aria-label="Answer options">`+r.opt[k].map((oi,x)=>{
      const on=sel.includes(oi),good=oi<q.nRight;let cls="multi",tag="";

const wkey=w=>w.pt;

  if(alts.length>1)out.push(alts.map(bare).join(" / "),alts.slice().reverse().join(" / "));return [...new Set(out.map(vnorm))]};
const tagLabel=t=>({"n-m":"noun · masculine","n-f":"noun · feminine","n-mp":"noun · masculine plural","n-fp":"noun · feminine plural","v-ar":"verb · -ar","v-er":"verb · -er","v-ir":"verb · -ir","v-irr":"verb · irregular",adj:"nationality / adjective",color:"colour",ph:"phrase",adv:"word",num:"number",ord:"ordinal number",pos:"possessive / demonstrative",advl:"adverb of place",day:"day of the week",country:"country",city:"city"}[t]||"");
